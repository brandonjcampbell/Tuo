              ))}
            </div>

            {/* Top-level batch query runner — hidden in report mode */}
            {!reportMode && (
            <BatchRunner
              presets={PROMPT_PRESETS}
              customQueries={customQueries}
              totalPairs={results.pairs.length}
              pairsAbove30={pairsAbove30}
              pairsAbove50={pairsAbove50}
              onRun={runBatch}
              onStop={() => { if (abortRef.current) abortRef.current.abort(); }}
              isRunning={batchInterpreting}
              progress={batchProgress}
              onAddQuery={(payload) => setCustomQueries(prev => [...prev, { id: newQueryId(), ...payload }])}
              onUpdateQuery={(id, payload) => setCustomQueries(prev => prev.map(x => x.id === id ? { ...x, ...payload, id } : x))}
              onDeleteQuery={(id) => setCustomQueries(prev => prev.filter(x => x.id !== id))}
              ollamaUrl={ollamaUrl}
              ollamaModel={ollamaModel}
              ollamaTimeout={ollamaTimeout}
              ollamaMaxTokens={ollamaMaxTokens}
            />
            )}

            {/* Drill ladder — hidden for now; flip SHOW_DRILL_UI to re-enable */}
            {false && (
            <div style={{
              display: "flex", alignItems: "center", gap: 8, marginBottom: 16,
              background: "#0c0e16", borderRadius: 8, padding: "8px 14px", border: "1px solid #1e2230",
              flexWrap: "wrap",
            }}>
              <span style={{ ...mono9, color: "#34d399", letterSpacing: 1 }}>{"\u{1F50D}"} DRILL</span>

              {/* Ladder visualization */}
              <div style={{ display: "flex", alignItems: "center", gap: 0 }}>
                {DRILL_LADDER.map((lvl, idx) => {
                  var curLvl = currentDrillLevel();
                  var curIdx = DRILL_LADDER.indexOf(curLvl);
                  var isCurrent = lvl === curLvl;
                  var isVisited = idx < curIdx;
                  var isFuture = idx > curIdx;
                  var isNext = nextLevel === lvl;
                  return (
                    <div key={lvl} style={{ display: "flex", alignItems: "center" }}>
                      {idx > 0 && (
                        <div style={{
                          width: 12, height: 2,
                          background: isVisited ? "#34d39960" : isCurrent || isNext ? "#34d39930" : "#1e2230",
                        }} />
                      )}
                      <div style={{
                        ...mono9, fontSize: 8,
                        padding: isCurrent ? "3px 8px" : "2px 6px",
                        borderRadius: isCurrent ? 4 : 10,
                        background: isCurrent ? "#34d39930" : isVisited ? "#34d39915" : "transparent",
                        border: "1px solid " + (isCurrent ? "#34d399" : isNext ? "#34d39950" : isVisited ? "#34d39930" : "#1e2230"),
                        color: isCurrent ? "#34d399" : isVisited ? "#34d39980" : isNext ? "#34d39960" : "#2a2f3a",
                        fontWeight: isCurrent ? 700 : 400,
                        transition: "all 0.2s",
                      }}>{DRILL_LABELS[lvl]}</div>
                    </div>
                  );
                })}
              </div>

              {nextLevel && (
                <button
                  onClick={drillAll}
                  disabled={drilling}
                  style={{
                    ...mono10, fontWeight: 600, letterSpacing: 1,
                    background: !drilling ? "#34d39920" : "#141822",
                    border: "1px solid " + (!drilling ? "#34d39950" : "#1e2230"),
                    color: !drilling ? "#34d399" : "#3a4050",
                    borderRadius: 5, padding: "5px 14px",
                    cursor: !drilling ? "pointer" : "not-allowed",
                    transition: "all 0.2s",
                  }}
                >
                  {drilling ? "\u27F3 Drilling..." : "\u25BC " + DRILL_LABELS[nextLevel]}
                </button>
              )}
              {atFinest && (
                <span style={{ ...mono9, color: "#34d39950" }}>{"\u2713"} finest level</span>
              )}

              {drillDepth > 0 && (
                <button onClick={drillUp} style={{
                  ...mono10, fontWeight: 600, letterSpacing: 1,
                  background: "#f59e4220", border: "1px solid #f59e4250",
                  color: "#f59e42", borderRadius: 5, padding: "5px 14px", cursor: "pointer",
                }}>{"\u25B2"} {DRILL_LABELS[prevLevel] || "Up"}</button>
              )}

              <span style={{ ...mono9, color: "#2a2f3a", marginLeft: "auto" }}>
                {results ? results.chunksA.length + "\u00D7" + results.chunksB.length : ""}
              </span>
            </div>
            )}

            {/* Plain stats line when drill UI is hidden */}
            <div style={{
              display: "flex", alignItems: "center", justifyContent: "space-between",
              marginBottom: 16, padding: "0 4px",
            }}>
              <span style={{ ...mono9, color: "#3a4050", letterSpacing: 1 }}>
                {results.drillLabel || ""}
              </span>
              <span style={{ ...mono9, color: "#2a2f3a" }}>
                {results.chunksA.length + "\u00D7" + results.chunksB.length} pairs
              </span>
            </div>

            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: "1px solid #1e2230", marginBottom: 20 }}>
              <div style={{ display: "flex" }}>
                {["heatmap", "matches", "documents", "graph", "distribution"].map(t => (
                  <button key={t} onClick={() => setTab(t)} style={{
                    ...mono11, letterSpacing: 1, textTransform: "uppercase",
                    background: "none", border: "none",
                    color: tab === t ? "#f0c040" : "#4a5568",
                    borderBottom: tab === t ? "2px solid #f0c040" : "2px solid transparent",
                    padding: "10px 20px", cursor: "pointer", transition: "all 0.15s",
                  }}>{t}</button>
                ))}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => exportCSV(results, interpretations)} style={{
                  ...mono10, fontWeight: 600, background: "#34d39918", border: "1px solid #34d39940",
                  color: "#34d399", borderRadius: 5, padding: "6px 16px", cursor: "pointer", marginBottom: 4,
                }}>{"\u2913"} CSV</button>
                <button onClick={() => exportHTML(results, interpretations)} style={{
                  ...mono10, fontWeight: 600, background: "#60a5fa18", border: "1px solid #60a5fa40",
                  color: "#60a5fa", borderRadius: 5, padding: "6px 16px", cursor: "pointer", marginBottom: 4,
                }}>{"\u2913"} HTML Report</button>
              </div>
            </div>

            {tab === "heatmap" && (
              <FullscreenPanel label="SIMILARITY HEATMAP">
              <div style={{ background: "#0e1018", borderRadius: 10, padding: 20 }}>
                <div style={{ ...mono10, color: "#4a5568", marginBottom: 12 }}>SIMILARITY MATRIX {"\u00B7"} click any cell for details</div>
                <Heatmap matrix={results.matrix} chunksA={results.chunksA} chunksB={results.chunksB} onCellClick={setSelectedCell} selectedCell={selectedCell} />
                {selectedCell && (
                  <div style={{ marginTop: 16, background: "#141822", borderRadius: 8, padding: 16, border: "1px solid #f0c04020" }}>
                    <div style={{ ...mono11, color: "#f0c040", marginBottom: 12 }}>
                      A{selectedCell[0]+1} {"\u27F7"} B{selectedCell[1]+1} {"\u00B7"} {(results.matrix[selectedCell[0]][selectedCell[1]]*100).toFixed(1)}%
                    </div>
                    <div style={{ display: "flex", gap: 12 }}>
                      <div style={{ flex: "1 1 50%", minWidth: 0, borderLeft: "3px solid #60a5fa20", padding: "8px 12px", overflow: "hidden" }}>
                        <div style={{ ...mono9, color: "#60a5fa", marginBottom: 6 }}>{(results.nameA || "DOC A").toUpperCase()} {"\u00B7"} CHUNK {selectedCell[0]+1} <ChunkDrillBtn doc="A" idx={selectedCell[0]} onDrill={drillOneChunk} drilling={drilling} /></div>
                        <ChunkContent text={results.chunksA[selectedCell[0]]} maxLen={400} fontSize={12} />
                      </div>
                      <div style={{ flex: "1 1 50%", minWidth: 0, borderLeft: "3px solid #f59e4220", padding: "8px 12px", overflow: "hidden" }}>
                        <div style={{ ...mono9, color: "#f59e42", marginBottom: 6 }}>{(results.nameB || "DOC B").toUpperCase()} {"\u00B7"} CHUNK {selectedCell[1]+1} <ChunkDrillBtn doc="B" idx={selectedCell[1]} onDrill={drillOneChunk} drilling={drilling} /></div>
                        <ChunkContent text={results.chunksB[selectedCell[1]]} maxLen={400} fontSize={12} />
                      </div>
                    </div>
                    <InterpretBtn
                      i={selectedCell[0]} j={selectedCell[1]}
                      score={results.matrix[selectedCell[0]][selectedCell[1]]}
                      chunkA={results.chunksA[selectedCell[0]]}
                      chunkB={results.chunksB[selectedCell[1]]}
                      interps={getInterps(interpretations, selectedCell[0]+"-"+selectedCell[1])}
                      currentLabel={labelForPrompt(promptTemplate, customQueries)}
                      customQueries={customQueries}
                      readOnly={reportMode}
                      onInterpret={interpretPair}
                      onRemove={removeInterp}
                    />
                    {false && (
                    <DrillDown
                      chunkA={results.chunksA[selectedCell[0]]}
                      chunkB={results.chunksB[selectedCell[1]]}
                      macroLabelA={"A"+(selectedCell[0]+1)}
                      macroLabelB={"B"+(selectedCell[1]+1)}
                      microSize={microSize}
                    />
                    )}
                  </div>
                )}
              </div>
              </FullscreenPanel>
            )}

            {tab === "matches" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <div style={{ ...mono10, color: "#4a5568", marginBottom: 4 }}>TOP {topMatches.length} MATCHES {"\u00B7"} click to expand</div>
                {topMatches.map((m, idx) => {
                  const k = m.i+"-"+m.j;
                  return (
                    <MatchCard key={k} rank={idx+1} i={m.i} j={m.j} score={m.score}
                      chunkA={results.chunksA[m.i]} chunkB={results.chunksB[m.j]}
                      isExpanded={expandedMatch === idx}
                      onToggle={() => setExpandedMatch(expandedMatch === idx ? -1 : idx)}
                      interps={getInterps(interpretations, k)}
                      currentLabel={labelForPrompt(promptTemplate, customQueries)}
                      customQueries={customQueries}
                      readOnly={reportMode}
                      onInterpret={interpretPair}
                      onRemove={removeInterp}
                      microSize={microSize}
                      onDrillChunk={drillOneChunk}
                      drilling={drilling}
                      nameA={results.nameA} nameB={results.nameB}
                    />
                  );
                })}
              </div>
            )}

            {tab === "documents" && (
              <FullscreenPanel label="DOCUMENT VIEW">
              <DocumentView
                chunksA={results.chunksA}
                chunksB={results.chunksB}
                matrix={results.matrix}
                interpretations={interpretations}
                onDrillChunk={drillOneChunk}
                drilling={drilling}
                onInterpret={interpretPair}
                onRemove={removeInterp}
                currentLabel={labelForPrompt(promptTemplate, customQueries)}
                customQueries={customQueries}
                readOnly={reportMode}
                nameA={results.nameA} nameB={results.nameB}
              />
              </FullscreenPanel>
            )}

            {tab === "graph" && (
              <FullscreenPanel label="CHUNK GRAPH">
              <GraphView
                chunksA={results.chunksA}
                chunksB={results.chunksB}
                matrix={results.matrix}
                interpretations={interpretations}
                microSize={microSize}
                onDrillChunk={drillOneChunk}
                drilling={drilling}
                onInterpret={interpretPair}
                onRemove={removeInterp}
                currentLabel={labelForPrompt(promptTemplate, customQueries)}
                customQueries={customQueries}
                readOnly={reportMode}
                nameA={results.nameA} nameB={results.nameB}
              />
              </FullscreenPanel>
            )}

            {tab === "distribution" && (
              <div style={{ background: "#0e1018", borderRadius: 10, padding: 20 }}>
                <div style={{ ...mono10, color: "#4a5568", marginBottom: 16 }}>SIMILARITY SCORE DISTRIBUTION</div>
                <DistributionChart pairs={results.pairs} />
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
