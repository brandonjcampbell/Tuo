        <div ref={tooltipRef} style={{
          display: "none", position: "absolute",
          background: "#141822f0", border: "1px solid #2a2f3a", borderRadius: 6,
          padding: "8px 12px", maxWidth: 300, zIndex: 30, pointerEvents: "none",
        }} />
      </div>

      {/* Selected pair interpret panel */}
      {selectedPair && onInterpret && (
        <div style={{
          marginTop: 8, background: "#0c0e16", borderRadius: 8, padding: 12,
          border: "1px solid #818cf815",
        }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ ...mono10, color: "#60a5fa", background: "#60a5fa12", padding: "2px 6px", borderRadius: 3 }}>A{selectedPair.aIdx+1}</span>
              <span style={{ color: "#3a4050", fontSize: 10 }}>{"\u27F7"}</span>
              <span style={{ ...mono10, color: "#f59e42", background: "#f59e4212", padding: "2px 6px", borderRadius: 3 }}>B{selectedPair.bIdx+1}</span>
              <span style={{ ...mono10, color: "#f0c040", fontWeight: 700 }}>{(selectedPair.score*100).toFixed(1)}%</span>
            </div>
            <button onClick={() => setSelectedPair(null)} style={{
              ...mono9, background: "transparent", border: "1px solid #1e2230",
              color: "#3a4050", borderRadius: 3, padding: "2px 6px", cursor: "pointer",
            }}>{"\u2715"}</button>
          </div>
          <InterpretBtn
            i={selectedPair.aIdx} j={selectedPair.bIdx} score={selectedPair.score}
            chunkA={chunksA[selectedPair.aIdx]} chunkB={chunksB[selectedPair.bIdx]}
            interps={getInterps(interpretations, selectedPair.aIdx+"-"+selectedPair.bIdx)}
            currentLabel={currentLabel}
            customQueries={customQueries}
            readOnly={readOnly}
            onInterpret={onInterpret} onRemove={onRemove}
          />
        </div>
      )}
    </div>
  );
}

function DistributionChart({ pairs }) {
  const buckets = useMemo(() => {
    const b = Array(20).fill(0);
    pairs.forEach(p => { b[Math.min(19, Math.floor(p.score * 20))]++; });
    return b;
  }, [pairs]);
  const mx = Math.max(...buckets, 1);
  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 2, height: 180, padding: "0 4px" }}>
        {buckets.map((count, i) => {
          const h = Math.max(2, (count / mx) * 160), intensity = i / 19;
          return (
            <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end" }}>
              {count > 0 && <div style={{ ...mono9, fontSize: 8, color: "#4a5568", marginBottom: 2 }}>{count}</div>}
              <div title={(i*5)+"-"+(i*5+5)+"%: "+count} style={{
                width: "100%", height: h, borderRadius: "3px 3px 0 0",
                background: "rgba("+(Math.round(240*intensity+40))+","+(Math.round(160*intensity+60))+","+(Math.round(64+30*(1-intensity)))+","+(0.4+intensity*0.6)+")",
                transition: "height 0.3s ease",
              }} />
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", ...mono9, color: "#3a4050", marginTop: 6, padding: "0 4px" }}>
        <span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// GRAPH VIEW — D3 force-directed graph
// Nodes = chunks, sequential THEN edges, similarity >50% edges
// ═══════════════════════════════════════════════════════════════

function GraphView({ chunksA, chunksB, matrix, interpretations, microSize, onDrillChunk, drilling, onInterpret, onRemove, currentLabel, nameA, nameB, customQueries, readOnly }) {
  const svgRef = useRef(null);
  const containerRef = useRef(null);
  const simRef = useRef(null);
  const [selectedNode, setSelectedNode] = useState(null);
  const graphTooltipRef = useRef(null);
  const [simThreshold, setSimThreshold] = useState(0.5);
  const [layout, setLayout] = useState("sequence");

  // Node viewport controls — which chunk ranges are loaded
  const [rangeA, setRangeA] = useState([0, Math.min(chunksA.length, 30)]);
  const [rangeB, setRangeB] = useState([0, Math.min(chunksB.length, 30)]);

  // Reset ranges when chunks change
  useEffect(() => {
    setRangeA([0, Math.min(chunksA.length, 30)]);
    setRangeB([0, Math.min(chunksB.length, 30)]);
  }, [chunksA.length, chunksB.length]);

  const LAYOUTS = {
    sequence:    { label: "Sequence",    desc: "THEN chains + similarity cross-links" },
    bipartite:   { label: "Bipartite",   desc: "Two columns, similarity only" },
    force:       { label: "Force",       desc: "Pure force-directed, no constraints" },
    radial:      { label: "Radial",      desc: "Docs on opposing arcs" },
    similarity:  { label: "Similarity",  desc: "Pull similar chunks together" },
    grid:        { label: "Grid",        desc: "A = rows, B = columns, links at intersections" },
    concentric:  { label: "Concentric",  desc: "Most-linked nodes at center" },
    hierarchical:{ label: "Hierarchical",desc: "Top-down flow per document" },
  };

  // Visible chunk subsets
  const visA = chunksA.slice(rangeA[0], rangeA[1]);
  const visB = chunksB.slice(rangeB[0], rangeB[1]);
  const offA = rangeA[0]; // offset for mapping back to original indices
  const offB = rangeB[0];

  const graphData = useMemo(() => {
    const nodes = [];
    visA.forEach((c, i) => {
      const origIdx = offA + i;
      nodes.push({ id: "A"+(origIdx+1), doc: "A", idx: i, origIdx, label: "A"+(origIdx+1), text: c.slice(0, 300) });
    });
    visB.forEach((c, j) => {
      const origIdx = offB + j;
      nodes.push({ id: "B"+(origIdx+1), doc: "B", idx: j, origIdx, label: "B"+(origIdx+1), text: c.slice(0, 300) });
    });
    const nodeIds = new Set(nodes.map(n => n.id));

    const links = [];
    // Sequential THEN edges within visible range
    for (let i = 0; i < visA.length - 1; i++) {
      links.push({ source: "A"+(offA+i+1), target: "A"+(offA+i+2), type: "THEN", score: null });
    }
    for (let j = 0; j < visB.length - 1; j++) {
      links.push({ source: "B"+(offB+j+1), target: "B"+(offB+j+2), type: "THEN", score: null });
    }
    // Similarity edges — only between visible nodes
    for (let i = rangeA[0]; i < rangeA[1]; i++) {
      for (let j = rangeB[0]; j < rangeB[1]; j++) {
        if (matrix[i] && matrix[i][j] >= simThreshold) {
          links.push({
            source: "A"+(i+1), target: "B"+(j+1), type: "SIMILAR",
            score: matrix[i][j],
            interp: combinedInterpText(interpretations, i+"-"+j) || null,
          });
        }
      }
    }
    return { nodes, links };
  }, [visA, visB, offA, offB, matrix, interpretations, simThreshold, rangeA, rangeB]);

  useEffect(() => {
    if (!svgRef.current || !containerRef.current) return;
    const container = containerRef.current;
    const W = container.clientWidth;
    const H = 600;

    const svg = d3.select(svgRef.current);
    svg.selectAll("*").remove();
    svg.attr("width", W).attr("height", H);

    const defs = svg.append("defs");
    ["then-arrow", "sim-arrow"].forEach((id, idx) => {
      defs.append("marker")
        .attr("id", id).attr("viewBox", "0 -5 10 10")
        .attr("refX", 22).attr("refY", 0)
        .attr("markerWidth", 6).attr("markerHeight", 6)
        .attr("orient", "auto")
        .append("path").attr("d", "M0,-4L10,0L0,4")
        .attr("fill", idx === 0 ? "#4a5568" : "#f0c04080");
    });

    const g = svg.append("g");

    const zoomBehavior = d3.zoom()
      .scaleExtent([0.1, 6])
      .on("zoom", (e) => { g.attr("transform", e.transform); if (graphTooltipRef.current) graphTooltipRef.current.style.display = "none"; });
    svg.call(zoomBehavior);
    svg.on("click.deselect", () => setSelectedNode(null));

    const nodes = graphData.nodes.map(n => ({ ...n }));
    const totalA = visA.length, totalB = visB.length;
    const maxChain = Math.max(totalA, totalB);
    const N = nodes.length;

    // ═══ LAYOUT: filter links and set initial positions + forces ═══

    // Determine which links to include
    let links;
    const showThen = ["sequence", "hierarchical"].includes(layout);
    if (showThen) {
      links = graphData.links.map(l => ({ ...l }));
    } else {
      links = graphData.links.filter(l => l.type === "SIMILAR").map(l => ({ ...l }));
    }

    // Count similarity links per node for concentric layout
    const simCount = {};
    graphData.links.filter(l => l.type === "SIMILAR").forEach(l => {
      const s = typeof l.source === "string" ? l.source : l.source.id;
      const t = typeof l.target === "string" ? l.target : l.target.id;
      simCount[s] = (simCount[s] || 0) + 1;
      simCount[t] = (simCount[t] || 0) + 1;
    });
    const maxSimCount = Math.max(...Object.values(simCount), 1);

    // Initial positions per layout
    const cx = W / 2, cy = H / 2;
    nodes.forEach(n => {
      const total = n.doc === "A" ? totalA : totalB;
      const frac = (n.idx + 0.5) / total;

      switch (layout) {
        case "sequence":
        case "hierarchical": {
          const vExtent = Math.max(H, maxChain * 55);
          const vTop = (H - vExtent) / 2;
          n.x = (n.doc === "A" ? W * 0.25 : W * 0.75) + (Math.random() - 0.5) * 30;
          n.y = vTop + frac * vExtent;
          break;
        }
        case "bipartite": {
          n.x = n.doc === "A" ? W * 0.2 : W * 0.8;
          n.y = frac * H * 0.9 + H * 0.05;
          break;
        }
        case "force": {
          n.x = cx + (Math.random() - 0.5) * W * 0.6;
          n.y = cy + (Math.random() - 0.5) * H * 0.6;
          break;
        }
        case "radial": {
          const angleRange = Math.PI * 0.7;
          const r = Math.min(W, H) * 0.38;
          if (n.doc === "A") {
            const a = Math.PI + (Math.PI - angleRange) / 2 + frac * angleRange;
            n.x = cx + Math.cos(a) * r;
            n.y = cy + Math.sin(a) * r;
          } else {
            const a = (Math.PI - angleRange) / 2 + (1 - frac) * angleRange;
            n.x = cx + Math.cos(a) * r;
            n.y = cy + Math.sin(a) * r;
          }
          break;
        }
        case "similarity": {
          n.x = cx + (Math.random() - 0.5) * W * 0.4;
          n.y = cy + (Math.random() - 0.5) * H * 0.4;
          break;
        }
        case "grid": {
          const gapX = Math.min(50, (W - 80) / Math.max(totalB, 1));
          const gapY = Math.min(50, (H - 80) / Math.max(totalA, 1));
          if (n.doc === "A") {
            n.x = 40;
            n.y = 40 + n.idx * gapY;
          } else {
            n.x = 40 + (n.idx + 1) * gapX;
            n.y = 40;
          }
          break;
        }
        case "concentric": {
          const sc = simCount[n.id] || 0;
          const ring = 1 - sc / maxSimCount; // 0 = center, 1 = outer
          const r2 = ring * Math.min(W, H) * 0.4 + 20;
          const angle = (n.doc === "A" ? n.idx : totalA + n.idx) / N * Math.PI * 2;
          n.x = cx + Math.cos(angle) * r2;
          n.y = cy + Math.sin(angle) * r2;
          break;
        }
      }
    });

    // Force configurations per layout
    const simulation = d3.forceSimulation(nodes);

    switch (layout) {
      case "sequence": {
        const vExtent = Math.max(H, maxChain * 55);
        const vTop = (H - vExtent) / 2;
        simulation
          .force("link", d3.forceLink(links).id(d => d.id)
            .distance(d => d.type === "THEN" ? 50 : 250)
            .strength(d => d.type === "THEN" ? 2.0 : 0.06))
          .force("charge", d3.forceManyBody().strength(-140).distanceMax(500))
          .force("collision", d3.forceCollide(24))
          .force("x", d3.forceX(d => d.doc === "A" ? W * 0.3 : W * 0.7).strength(0.04))
          .force("y", d3.forceY(d => {
            const total = d.doc === "A" ? totalA : totalB;
            return vTop + (d.idx + 0.5) / total * vExtent;
          }).strength(d => {
            const total = d.doc === "A" ? totalA : totalB;
            return (d.idx === 0 || d.idx === total - 1) ? 0.15 : 0.02;
          }));
        break;
      }
      case "bipartite": {
        simulation
          .force("link", d3.forceLink(links).id(d => d.id).distance(200).strength(0.12))
          .force("charge", d3.forceManyBody().strength(-60))
          .force("collision", d3.forceCollide(20))
          .force("x", d3.forceX(d => d.doc === "A" ? W * 0.2 : W * 0.8).strength(0.6))
          .force("y", d3.forceY(d => {
            const total = d.doc === "A" ? totalA : totalB;
            return (d.idx + 0.5) / total * H * 0.9 + H * 0.05;
          }).strength(0.08));
        break;
      }
      case "force": {
        simulation
          .force("link", d3.forceLink(links).id(d => d.id).distance(100).strength(0.3))
          .force("charge", d3.forceManyBody().strength(-250))
          .force("collision", d3.forceCollide(26))
          .force("center", d3.forceCenter(cx, cy).strength(0.03));
        break;
      }
      case "radial": {
        const r = Math.min(W, H) * 0.38;
        const angleRange = Math.PI * 0.7;
        simulation
          .force("link", d3.forceLink(links).id(d => d.id).distance(180).strength(0.08))
          .force("charge", d3.forceManyBody().strength(-120))
          .force("collision", d3.forceCollide(22))
          .force("radial", d3.forceRadial(r, cx, cy).strength(0.15))
          .force("x", d3.forceX(d => {
            const total = d.doc === "A" ? totalA : totalB;
            const frac = (d.idx + 0.5) / total;
            if (d.doc === "A") {
              const a = Math.PI + (Math.PI - angleRange) / 2 + frac * angleRange;
              return cx + Math.cos(a) * r;
            } else {
              const a = (Math.PI - angleRange) / 2 + (1 - frac) * angleRange;
              return cx + Math.cos(a) * r;
            }
          }).strength(0.06))
          .force("y", d3.forceY(d => {
            const total = d.doc === "A" ? totalA : totalB;
            const frac = (d.idx + 0.5) / total;
            if (d.doc === "A") {
              const a = Math.PI + (Math.PI - angleRange) / 2 + frac * angleRange;
              return cy + Math.sin(a) * r;
            } else {
              const a = (Math.PI - angleRange) / 2 + (1 - frac) * angleRange;
              return cy + Math.sin(a) * r;
            }
          }).strength(0.06));
        break;
      }
      case "similarity": {
        simulation
          .force("link", d3.forceLink(links).id(d => d.id)
            .distance(d => 40 + (1 - (d.score || 0)) * 200)
            .strength(d => 0.1 + (d.score || 0) * 0.8))
          .force("charge", d3.forceManyBody().strength(-200))
          .force("collision", d3.forceCollide(26))
          .force("center", d3.forceCenter(cx, cy).strength(0.02));
        break;
      }
      case "grid": {
        const gapX = Math.min(50, (W - 80) / Math.max(totalB, 1));
        const gapY = Math.min(50, (H - 80) / Math.max(totalA, 1));
        simulation
          .force("link", d3.forceLink(links).id(d => d.id).distance(60).strength(0.05))
          .force("collision", d3.forceCollide(16))
          .force("x", d3.forceX(d => {
            if (d.doc === "A") return 40;
            return 40 + (d.idx + 1) * gapX;
          }).strength(0.8))
          .force("y", d3.forceY(d => {
            if (d.doc === "B") return 40;
            return 40 + (d.idx) * gapY;
          }).strength(0.8));
        break;
      }
      case "concentric": {
        simulation
          .force("link", d3.forceLink(links).id(d => d.id).distance(120).strength(0.1))
          .force("charge", d3.forceManyBody().strength(-80))
          .force("collision", d3.forceCollide(22))
          .force("radial", d3.forceRadial(d => {
            const sc = simCount[d.id] || 0;
            return (1 - sc / maxSimCount) * Math.min(W, H) * 0.4 + 20;
          }, cx, cy).strength(0.3));
        break;
      }
      case "hierarchical": {
        simulation
          .force("link", d3.forceLink(links).id(d => d.id)
            .distance(d => d.type === "THEN" ? 40 : 180)
            .strength(d => d.type === "THEN" ? 1.5 : 0.05))
          .force("charge", d3.forceManyBody().strength(-100))
          .force("collision", d3.forceCollide(22))
          .force("x", d3.forceX(d => d.doc === "A" ? W * 0.3 : W * 0.7).strength(0.15))
          .force("y", d3.forceY(d => {
            const total = d.doc === "A" ? totalA : totalB;
            return (d.idx + 0.5) / total * H * 0.9 + H * 0.05;
          }).strength(0.3));
        break;
      }
    }

    simulation.alphaDecay(0.012).alphaMin(0.001).velocityDecay(0.4);
    simRef.current = simulation;

    // ═══ Rendering (shared across all layouts) ═══

    const linkLines = g.append("g").selectAll("line").data(links).enter().append("line")
      .attr("stroke", d => d.type === "THEN" ? "#4a5568" : simEdgeColor(d.score))
      .attr("stroke-width", d => d.type === "THEN" ? 2 : Math.max(1.5, (d.score || 0) * 5))
      .attr("stroke-dasharray", d => d.type === "THEN" ? "6 3" : "none")
      .attr("marker-end", d => d.type === "THEN" ? "url(#then-arrow)" : "")
      .style("cursor", d => d.type === "SIMILAR" ? "pointer" : "default")
      .style("opacity", d => d.type === "THEN" ? 0.65 : 0.7);

    const edgeLabels = g.append("g").selectAll("text").data(links.filter(l => l.type === "SIMILAR")).enter().append("text")
      .attr("text-anchor", "middle")
      .attr("fill", "#f0c04090")
      .attr("font-family", "JetBrains Mono, monospace")
      .attr("font-size", 9)
      .text(d => (d.score * 100).toFixed(0) + "%");

    const nodeCircles = g.append("g").selectAll("g").data(nodes).enter().append("g")
      .style("cursor", "pointer")
      .call(d3.drag()
        .on("start", (e, d) => {
          if (!e.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on("drag", (e, d) => {
          const t = d3.zoomTransform(svg.node());
          d.fx = (e.sourceEvent.offsetX - t.x) / t.k;
          d.fy = (e.sourceEvent.offsetY - t.y) / t.k;
        })
        .on("end", (e, d) => {
          if (!e.active) simulation.alphaTarget(0);
          d.fx = null; d.fy = null;
        })
      );

    nodeCircles.append("circle")
      .attr("r", 16)
      .attr("fill", d => d.doc === "A" ? "#60a5fa18" : "#f59e4218")
      .attr("stroke", d => d.doc === "A" ? "#60a5fa" : "#f59e42")
      .attr("stroke-width", 1.5);

    nodeCircles.append("text")
      .attr("text-anchor", "middle").attr("dy", 4)
      .attr("fill", d => d.doc === "A" ? "#60a5fa" : "#f59e42")
      .attr("font-family", "JetBrains Mono, monospace")
      .attr("font-size", 10)
      .attr("font-weight", 600)
      .text(d => d.label);

    nodeCircles
      .on("mouseover", (e, d) => {
        const tip = graphTooltipRef.current;
        if (!tip) return;
        const rect = container.getBoundingClientRect();
        tip.style.display = "block";
        tip.style.left = (e.clientX - rect.left + 12) + "px";
        tip.style.top = (e.clientY - rect.top - 10) + "px";
        var col = d.doc === "A" ? "#60a5fa" : "#f59e42";
        var txt = d.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        tip.innerHTML = '<div style="font-family:JetBrains Mono,monospace;font-size:11px;color:' + col + ';margin-bottom:4px;font-weight:600;">' + d.label + '</div>'
          + '<div style="font-family:IBM Plex Serif,serif;font-size:11px;color:#8a8f9c;line-height:1.5;max-height:150px;overflow:auto;white-space:pre-wrap;word-break:break-word;">' + txt + '\u2026</div>';
      })
      .on("mouseout", () => {
        if (graphTooltipRef.current) graphTooltipRef.current.style.display = "none";
      })
      .on("click", (e, d) => {
        e.stopPropagation();
        setSelectedNode(prev => prev && prev.id === d.id ? null : d);
      });

    linkLines.filter(d => d.type === "SIMILAR")
      .on("mouseover", function(e, d) { d3.select(this).attr("stroke-width", Math.max(3, (d.score || 0) * 8)); })
      .on("mouseout", function(e, d) { d3.select(this).attr("stroke-width", Math.max(1.5, (d.score || 0) * 5)); });

    simulation.on("tick", () => {
      linkLines
        .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      edgeLabels
        .attr("x", d => (d.source.x + d.target.x) / 2)
        .attr("y", d => (d.source.y + d.target.y) / 2 - 6);
      nodeCircles.attr("transform", d => "translate("+d.x+","+d.y+")");
    });

    // Fit to view after settle
    setTimeout(() => {
      simulation.alpha(0.4).restart();
      setTimeout(() => {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        nodes.forEach(n => {
          if (n.x < minX) minX = n.x; if (n.y < minY) minY = n.y;
          if (n.x > maxX) maxX = n.x; if (n.y > maxY) maxY = n.y;
        });
        const pad = 40;
        const bw = (maxX - minX) + pad * 2;
        const bh = (maxY - minY) + pad * 2;
        const sc = Math.min(W / bw, H / bh, 1.2);
        const fcx = (minX + maxX) / 2;
        const fcy = (minY + maxY) / 2;
        svg.transition().duration(800).call(
          zoomBehavior.transform,
          d3.zoomIdentity.translate(W/2, H/2).scale(sc).translate(-fcx, -fcy)
        );
      }, 2000);
    }, 100);

    return () => { simulation.stop(); };
  }, [graphData, visA.length, visB.length, layout]);

  function simEdgeColor(score) {
    if (!score) return "#4a556840";
    if (score >= 0.8) return "#f0c040";
    if (score >= 0.65) return "#f59e42cc";
    return "#818cf8aa";
  }

  // Find links connected to selected node
  const selectedLinks = selectedNode ? graphData.links.filter(
    l => (l.source === selectedNode.id || l.target === selectedNode.id) ||
         (l.source.id === selectedNode.id || l.target.id === selectedNode.id)
  ) : [];

  const simLinks = selectedLinks.filter(l => l.type === "SIMILAR");

  return (
    <div style={{ background: "#0e1018", borderRadius: 10, padding: 20 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <span style={{ ...mono10, color: "#4a5568" }}>LAYOUT</span>
          <select value={layout} onChange={e => setLayout(e.target.value)}
            style={{ background: "#141822", border: "1px solid #1e2230", color: "#9ca3af", borderRadius: 4, padding: "3px 8px", ...mono10, cursor: "pointer", outline: "none" }}>
            {Object.entries(LAYOUTS).map(([k, v]) => (
              <option key={k} value={k}>{v.label}</option>
            ))}
          </select>
          <span style={{ ...mono9, color: "#2a2f3a" }}>{LAYOUTS[layout].desc}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <label style={{ ...mono9, color: "#3a4050" }}>THRESHOLD</label>
          <input type="range" min="30" max="90" step="5" value={simThreshold * 100}
            onChange={e => setSimThreshold(Number(e.target.value) / 100)}
            style={{ width: 80, accentColor: "#f0c040" }}
          />
          <span style={{ ...mono9, color: "#f0c040", minWidth: 30 }}>{(simThreshold*100).toFixed(0)}%</span>
        </div>
      </div>

      {/* Node viewport controls */}
      <div style={{
        display: "flex", alignItems: "center", gap: 10, marginBottom: 12, flexWrap: "wrap",
        background: "#0a0c12", borderRadius: 6, padding: "8px 12px", border: "1px solid #1e2230",
      }}>
        <span style={{ ...mono9, color: "#4a5568", letterSpacing: 1 }}>NODES</span>
        <span style={{ ...mono9, color: "#2a2f3a" }}>
          {visA.length + visB.length} of {chunksA.length + chunksB.length}
        </span>

        {/* Doc A range */}
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <span style={{ ...mono9, color: "#60a5fa" }}>A</span>
          <input type="number" min={0} max={rangeA[1]} value={rangeA[0]}
            onChange={e => { const v = Math.max(0, Math.min(rangeA[1], Number(e.target.value))); setRangeA([v, rangeA[1]]); }}
            style={{ width: 38, background: "#141822", border: "1px solid #60a5fa20", color: "#60a5fa", borderRadius: 3, padding: "2px 4px", ...mono9, textAlign: "center", outline: "none" }}
          />
          <input type="range" min={0} max={chunksA.length}
            value={rangeA[0]}
            onChange={e => { const v = Math.min(Number(e.target.value), rangeA[1]); setRangeA([v, rangeA[1]]); }}
            style={{ width: 50, accentColor: "#60a5fa" }}
          />
          <input type="range" min={0} max={chunksA.length}
            value={rangeA[1]}
            onChange={e => { const v = Math.max(Number(e.target.value), rangeA[0]); setRangeA([rangeA[0], v]); }}
            style={{ width: 50, accentColor: "#60a5fa" }}
          />
          <input type="number" min={rangeA[0]} max={chunksA.length} value={rangeA[1]}
            onChange={e => { const v = Math.max(rangeA[0], Math.min(chunksA.length, Number(e.target.value))); setRangeA([rangeA[0], v]); }}
            style={{ width: 38, background: "#141822", border: "1px solid #60a5fa20", color: "#60a5fa", borderRadius: 3, padding: "2px 4px", ...mono9, textAlign: "center", outline: "none" }}
          />
          <span style={{ ...mono9, color: "#60a5fa40" }}>{visA.length}/{chunksA.length}</span>
        </div>

        {/* Doc B range */}
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <span style={{ ...mono9, color: "#f59e42" }}>B</span>
          <input type="number" min={0} max={rangeB[1]} value={rangeB[0]}
            onChange={e => { const v = Math.max(0, Math.min(rangeB[1], Number(e.target.value))); setRangeB([v, rangeB[1]]); }}
            style={{ width: 38, background: "#141822", border: "1px solid #f59e4220", color: "#f59e42", borderRadius: 3, padding: "2px 4px", ...mono9, textAlign: "center", outline: "none" }}
          />
          <input type="range" min={0} max={chunksB.length}
            value={rangeB[0]}
            onChange={e => { const v = Math.min(Number(e.target.value), rangeB[1]); setRangeB([v, rangeB[1]]); }}
            style={{ width: 50, accentColor: "#f59e42" }}
          />
          <input type="range" min={0} max={chunksB.length}
            value={rangeB[1]}
            onChange={e => { const v = Math.max(Number(e.target.value), rangeB[0]); setRangeB([rangeB[0], v]); }}
            style={{ width: 50, accentColor: "#f59e42" }}
          />
          <input type="number" min={rangeB[0]} max={chunksB.length} value={rangeB[1]}
            onChange={e => { const v = Math.max(rangeB[0], Math.min(chunksB.length, Number(e.target.value))); setRangeB([rangeB[0], v]); }}
            style={{ width: 38, background: "#141822", border: "1px solid #f59e4220", color: "#f59e42", borderRadius: 3, padding: "2px 4px", ...mono9, textAlign: "center", outline: "none" }}
          />
          <span style={{ ...mono9, color: "#f59e4240" }}>{visB.length}/{chunksB.length}</span>
        </div>

        {/* Presets */}
        <div style={{ display: "flex", gap: 4, marginLeft: "auto" }}>
          {[
            { label: "All", fn: () => { setRangeA([0, chunksA.length]); setRangeB([0, chunksB.length]); } },
            { label: "20", fn: () => { setRangeA([0, Math.min(20, chunksA.length)]); setRangeB([0, Math.min(20, chunksB.length)]); } },
            { label: "10", fn: () => { setRangeA([0, Math.min(10, chunksA.length)]); setRangeB([0, Math.min(10, chunksB.length)]); } },
          ].map(p => (
            <button key={p.label} onClick={p.fn} style={{
              ...mono9, background: "#141822", border: "1px solid #1e2230",
              color: "#4a5568", borderRadius: 3, padding: "2px 8px",
              cursor: "pointer",
            }}>{p.label}</button>
          ))}
        </div>
      </div>

      {/* Compact legend */}
      <div style={{ display: "flex", gap: 14, marginBottom: 12, flexWrap: "wrap", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <div style={{ width: 10, height: 10, borderRadius: "50%", border: "1.5px solid #60a5fa", background: "#60a5fa18" }} />
          <span style={{ ...mono9, color: "#60a5fa" }}>{nameA || "A"}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <div style={{ width: 10, height: 10, borderRadius: "50%", border: "1.5px solid #f59e42", background: "#f59e4218" }} />
          <span style={{ ...mono9, color: "#f59e42" }}>{nameB || "B"}</span>
        </div>
        {["sequence", "hierarchical"].includes(layout) && (
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <div style={{ width: 18, height: 0, borderTop: "1.5px dashed #4a5568" }} />
            <span style={{ ...mono9, color: "#4a5568" }}>THEN</span>
          </div>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <div style={{ width: 18, height: 0, borderTop: "2px solid #f0c040" }} />
          <span style={{ ...mono9, color: "#f0c040" }}>SIM</span>
        </div>
        <span style={{ ...mono9, color: "#2a2f3a" }}>
          {graphData.nodes.length}n {"\u00B7"} {graphData.links.filter(l => l.type === "SIMILAR").length} links {"\u00B7"} zoom + drag
        </span>
      </div>

      {/* SVG canvas */}
      <div ref={containerRef} style={{ position: "relative", background: "#0a0c12", borderRadius: 8, border: "1px solid #1e2230", overflow: "hidden" }}>
        <svg ref={svgRef} style={{ display: "block", width: "100%", height: 600 }} />

        {/* Tooltip — ref-based, no React re-renders */}
        <div ref={graphTooltipRef} style={{
          display: "none", position: "absolute",
          background: "#141822ee", border: "1px solid #2a2f3a", borderRadius: 6,
          padding: "8px 12px", maxWidth: 280, zIndex: 10, pointerEvents: "none",
        }} />
      </div>

      {/* Selected node detail panel */}
      {selectedNode && (
        <div style={{ marginTop: 14, background: "#141822", borderRadius: 8, padding: 16, border: "1px solid " + (selectedNode.doc === "A" ? "#60a5fa30" : "#f59e4230") }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <span style={{
              ...mono11, fontSize: 14, fontWeight: 700,
              color: selectedNode.doc === "A" ? "#60a5fa" : "#f59e42",
            }}>{selectedNode.label}</span>
            <ChunkDrillBtn doc={selectedNode.doc} idx={selectedNode.origIdx} onDrill={onDrillChunk} drilling={drilling} />
            <span style={{ ...mono9, color: "#3a4050" }}>
              {simLinks.length} similarity link{simLinks.length !== 1 ? "s" : ""} above threshold
            </span>
          </div>
          <div style={{ marginBottom: simLinks.length > 0 ? 14 : 0 }}>
            <ChunkContent
              text={selectedNode.doc === "A" ? chunksA[selectedNode.origIdx] : chunksB[selectedNode.origIdx]}
              maxLen={800} fontSize={12.5} maxHeight={300}
            />
          </div>
          {simLinks.length > 0 && (
            <div>
              <div style={{ ...mono9, color: "#4a5568", letterSpacing: 1, marginBottom: 10 }}>CONNECTED BY SIMILARITY</div>
              {simLinks.map((l, idx) => {
                var srcId = typeof l.source === "string" ? l.source : l.source.id;
                var tgtId = typeof l.target === "string" ? l.target : l.target.id;
                var otherId = srcId === selectedNode.id ? tgtId : srcId;
                var otherDoc = otherId.charAt(0);
                var otherIdx = parseInt(otherId.slice(1), 10) - 1;
                var otherText = otherDoc === "A" ? chunksA[otherIdx] : chunksB[otherIdx];
                var selText = selectedNode.doc === "A" ? chunksA[selectedNode.origIdx] : chunksB[selectedNode.origIdx];
                var selColor = selectedNode.doc === "A" ? "#60a5fa" : "#f59e42";
                var otherColor = otherDoc === "A" ? "#60a5fa" : "#f59e42";
                return (
                  <div key={idx} style={{
                    marginBottom: 10, background: "#0c0e16", borderRadius: 8,
                    border: "1px solid #1e2230", overflow: "hidden",
                  }}>
                    {/* Header bar */}
                    <div style={{
                      display: "flex", alignItems: "center", gap: 10, padding: "8px 12px",
                      borderBottom: "1px solid #1e2230", background: "#0e1018",
                    }}>
                      <span style={{ ...mono11, padding: "2px 8px", borderRadius: 4, color: selColor, background: selColor + "12" }}>
                        {selectedNode.label}
                      </span>
                      <span style={{ color: "#3a4050", fontSize: 12 }}>{"\u27F7"}</span>
                      <span style={{ ...mono11, padding: "2px 8px", borderRadius: 4, color: otherColor, background: otherColor + "12" }}>
                        {otherId}
                      </span>
                      <span style={{ ...mono11, color: "#f0c040", fontWeight: 700 }}>
                        {(l.score * 100).toFixed(1)}%
                      </span>
                      {l.interp && (
                        <span style={{ ...mono9, color: "#818cf8", background: "#818cf812", padding: "2px 6px", borderRadius: 3 }}>
                          {"\u{1F9E0}"} interpreted
                        </span>
                      )}
                    </div>
                    {/* Side-by-side chunks */}
                    <div style={{ display: "flex", gap: 1 }}>
                      <div style={{ flex: "1 1 50%", minWidth: 0, padding: 10, borderRight: "1px solid #1e2230", overflow: "hidden" }}>
                        <div style={{ ...mono9, color: selColor, marginBottom: 4, letterSpacing: 1 }}>{selectedNode.label} <ChunkDrillBtn doc={selectedNode.doc} idx={selectedNode.origIdx} onDrill={onDrillChunk} drilling={drilling} /></div>
                        <ChunkContent text={selText} maxLen={400} fontSize={11} maxHeight={200} />
                      </div>
                      <div style={{ flex: "1 1 50%", minWidth: 0, padding: 10, overflow: "hidden" }}>
                        <div style={{ ...mono9, color: otherColor, marginBottom: 4, letterSpacing: 1 }}>{otherId} <ChunkDrillBtn doc={otherDoc} idx={otherIdx} onDrill={onDrillChunk} drilling={drilling} /></div>
                        <ChunkContent text={otherText} maxLen={400} fontSize={11} maxHeight={200} />
                      </div>
                    </div>
                    {/* Interpretation — triggerable */}
                    {(() => {
                      var aIdx = selectedNode.doc === "A" ? selectedNode.origIdx : otherIdx;
                      var bIdx = selectedNode.doc === "B" ? selectedNode.origIdx : otherIdx;
                      var pk = aIdx + "-" + bIdx;
                      return (
                        <div style={{ padding: "0 12px" }}>
                          <InterpretBtn i={aIdx} j={bIdx} score={l.score}
                            chunkA={chunksA[aIdx]} chunkB={chunksB[bIdx]}
                            interps={getInterps(interpretations, pk)}
                            currentLabel={currentLabel}
                            customQueries={customQueries}
                            readOnly={readOnly}
                            onInterpret={onInterpret} onRemove={onRemove}
                          />
                        </div>
                      );
                    })()}
                    {/* Drill-down hidden for now */}
                    {false && (
                    <div style={{ padding: "0 12px 8px" }}>
                      <DrillDown chunkA={selText} chunkB={otherText}
                        macroLabelA={selectedNode.label} macroLabelB={otherId}
                        microSize={microSize || "256"} />
                    </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════

// ─── Batch Runner panel ───
function BatchRunner({ presets, customQueries, totalPairs, pairsAbove30, pairsAbove50, onRun, onStop, isRunning, progress, onAddQuery, onUpdateQuery, onDeleteQuery, ollamaUrl, ollamaModel, ollamaTimeout, ollamaMaxTokens }) {
  const allQueries = useMemo(() => {
    return [
      ...presets.map(p => ({ label: p.label, template: p.t, isPreset: true })),
      ...(customQueries || []).map(q => ({
        label: q.label, template: q.template, isPreset: false,
        url: q.url, model: q.model, apiKey: q.apiKey,
        timeout: q.timeout, maxTokens: q.maxTokens,
      })),
    ];
  }, [presets, customQueries]);

  const [selected, setSelected] = useState(() => new Set(["Default"]));
  const [scopeType, setScopeType] = useState("topN");
  const [scopeN, setScopeN] = useState(10);
  const [scopeMin, setScopeMin] = useState(30);
  const [skipDup, setSkipDup] = useState(true);
  const [collapsed, setCollapsed] = useState(false);

  // ─── New / edit query form ───
  const [showNewForm, setShowNewForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState({ label: "", template: "", url: "", model: "", apiKey: "", timeout: "", maxTokens: "" });
  const [showOverrides, setShowOverrides] = useState(false);

  function startNew() {
    setEditingId(null);
    setDraft({ label: "", template: "", url: "", model: "", apiKey: "", timeout: "", maxTokens: "" });
    setShowOverrides(false);
    setShowNewForm(true);
  }
  function startEdit(q) {
    setEditingId(q.id);
    setDraft({
      label: q.label || "",
      template: q.template || "",
      url: q.url || "",
      model: q.model || "",
      apiKey: q.apiKey != null ? q.apiKey : "",
      timeout: q.timeout != null ? String(q.timeout) : "",
      maxTokens: q.maxTokens != null ? String(q.maxTokens) : "",
    });
    setShowOverrides(!!(q.url || q.model || q.apiKey || q.timeout != null || q.maxTokens != null));
    setShowNewForm(true);
  }
  function cancelForm() {
    setShowNewForm(false);
    setEditingId(null);
  }
  function saveDraft() {
    if (!draft.label.trim() || !draft.template.trim()) return;
    const payload = { label: draft.label.trim(), template: draft.template };
    if (showOverrides) {
      if (draft.url.trim()) payload.url = draft.url.trim();
      if (draft.model.trim()) payload.model = draft.model.trim();
      if (draft.apiKey !== "") payload.apiKey = draft.apiKey;
      if (draft.timeout !== "" && !isNaN(Number(draft.timeout))) payload.timeout = Number(draft.timeout);
      if (draft.maxTokens !== "" && !isNaN(Number(draft.maxTokens))) payload.maxTokens = Number(draft.maxTokens);
    }
    if (editingId) onUpdateQuery && onUpdateQuery(editingId, payload);
    else onAddQuery && onAddQuery(payload);
    setShowNewForm(false);
    setEditingId(null);
  }

  function toggle(label) {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(label)) next.delete(label); else next.add(label);
      return next;
    });
  }

  function selectAll() { setSelected(new Set(allQueries.map(q => q.label))); }
  function selectNone() { setSelected(new Set()); }
  function selectPresets() { setSelected(new Set(presets.map(p => p.label))); }

  const selectedQueries = allQueries.filter(q => selected.has(q.label));
  const targetCount = scopeType === "topN" ? Math.min(scopeN, totalPairs)
                    : scopeType === "minScore" ? (scopeMin <= 30 ? pairsAbove30 : scopeMin <= 50 ? pairsAbove50 : 0)
                    : totalPairs;
  const totalCalls = selectedQueries.length * targetCount;

  function handleRun() {
    const scope = scopeType === "topN" ? { type: "topN", n: scopeN }
                : scopeType === "minScore" ? { type: "minScore", v: scopeMin / 100 }
                : { type: "all" };
    onRun(selectedQueries, scope, { skipDuplicates: skipDup });
  }

  return (
    <div style={{
      background: "#0c0e16", borderRadius: 8, padding: collapsed ? "8px 14px" : 14,
      marginBottom: 16, border: "1px solid #f59e4225",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: collapsed ? 0 : 10, gap: 8 }}>
        <span style={{ ...mono10, color: "#f59e42", letterSpacing: 1, fontWeight: 600 }}>
          {"\u25B6"} QUERIES {selected.size > 0 && <span style={{ color: "#f59e4280", fontWeight: 400 }}>{"\u00B7"} {selected.size} selected</span>}
        </span>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <button onClick={startNew} title="Create a new saved query"
            style={{
              ...mono10, fontWeight: 700, letterSpacing: 1,
              background: "linear-gradient(135deg, #34d399, #10b981)",
              border: "none", color: "#0a0c12",
              borderRadius: 5, padding: "5px 14px", cursor: "pointer",
              boxShadow: "0 0 0 1px #34d39960",
            }}>+ Query</button>
          <button onClick={() => setCollapsed(!collapsed)} style={{
            ...mono9, background: "transparent", border: "1px solid #1e2230",
            color: "#4a5568", borderRadius: 3, padding: "2px 8px", cursor: "pointer",
          }}>{collapsed ? "expand" : "collapse"}</button>
        </div>
      </div>

      {!collapsed && (
        <>
          {/* Query selector */}
          <div style={{ marginBottom: 10 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
              <span style={{ ...mono9, color: "#4a5568", letterSpacing: 1 }}>SELECT QUERIES TO RUN</span>
              <div style={{ display: "flex", gap: 4 }}>
                <button onClick={selectAll} style={{
                  ...mono9, fontSize: 9, background: "transparent", border: "1px solid #1e2230",
                  color: "#4a5568", borderRadius: 3, padding: "1px 6px", cursor: "pointer",
                }}>all</button>
                <button onClick={selectPresets} style={{
                  ...mono9, fontSize: 9, background: "transparent", border: "1px solid #1e2230",
                  color: "#4a5568", borderRadius: 3, padding: "1px 6px", cursor: "pointer",
                }}>presets only</button>
                <button onClick={selectNone} style={{
                  ...mono9, fontSize: 9, background: "transparent", border: "1px solid #1e2230",
                  color: "#4a5568", borderRadius: 3, padding: "1px 6px", cursor: "pointer",
                }}>none</button>
              </div>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
              {allQueries.length === 0 && (
                <span style={{ ...mono9, color: "#3a4050" }}>No queries available — click <strong style={{ color: "#34d399" }}>+ Query</strong> above to create one</span>
              )}
              {allQueries.map(q => {
                const on = selected.has(q.label);
                const accent = q.isPreset ? "#818cf8" : "#34d399";
                const hasConn = !q.isPreset && !!(q.url || q.model || q.apiKey || q.timeout != null || q.maxTokens != null);
                return (
                  <div key={q.label} style={{
                    display: "flex", alignItems: "center", gap: 0,
                    background: on ? accent + "20" : "#141822",
                    border: "1px solid " + (on ? accent + "60" : "#1e2230"),
                    borderRadius: 3,
                  }}>
                    <button onClick={() => toggle(q.label)} style={{
                      ...mono9, background: "transparent", border: "none",
                      color: on ? accent : "#4a5568",
                      padding: "3px 8px", cursor: "pointer",
                      fontWeight: on ? 600 : 400, borderRadius: q.isPreset ? 3 : "3px 0 0 3px",
                    }}>{on ? "\u2713 " : ""}{q.label}{hasConn && <span title="custom connection" style={{ marginLeft: 4, color: "#f0c040" }}>{"\u26A1"}</span>}</button>
                    {!q.isPreset && (
                      <>
                        <button onClick={(e) => {
                          e.stopPropagation();
                          const full = (customQueries || []).find(x => x.label === q.label);
                          if (full) startEdit(full);
                        }} title="Edit query" style={{
                          ...mono9, fontSize: 8, background: "transparent", border: "none",
                          borderLeft: "1px solid " + (on ? accent + "30" : "#1e2230"),
                          color: "#3a4050", padding: "3px 5px", cursor: "pointer",
                        }}>{"\u270E"}</button>
                        <button onClick={(e) => {
                          e.stopPropagation();
                          const full = (customQueries || []).find(x => x.label === q.label);
                          if (full && confirm("Delete saved query \"" + q.label + "\"?")) {
                            onDeleteQuery && onDeleteQuery(full.id);
                          }
                        }} title="Delete query" style={{
                          ...mono9, fontSize: 8, background: "transparent", border: "none",
                          borderLeft: "1px solid " + (on ? accent + "30" : "#1e2230"),
                          color: "#3a4050", padding: "3px 5px", cursor: "pointer", borderRadius: "0 3px 3px 0",
                        }}>{"\u2715"}</button>
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Inline new/edit form */}
          {showNewForm && (
            <div style={{
              marginBottom: 12, padding: 12,
              background: "#0a0c12", border: "1px solid " + (editingId ? "#f0c04050" : "#34d39950"),
              borderRadius: 6,
            }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                <span style={{ ...mono9, color: editingId ? "#f0c040" : "#34d399", letterSpacing: 1, fontWeight: 600 }}>
                  {editingId ? "\u270E EDIT QUERY" : "+ NEW QUERY"}
                </span>
                <button onClick={cancelForm} style={{
                  ...mono9, background: "transparent", border: "1px solid #1e2230",
                  color: "#4a5568", borderRadius: 3, padding: "2px 8px", cursor: "pointer",
                }}>cancel</button>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
                <span style={{ ...mono9, color: "#4a5568", width: 90 }}>NAME</span>
                <input type="text" value={draft.label}
                  onChange={e => setDraft({ ...draft, label: e.target.value })}
                  placeholder="e.g. Risk assessment"
                  style={{
                    flex: 1, background: "#0a0c12", border: "1px solid #1e2230",
                    color: "#34d399", borderRadius: 3, padding: "4px 8px", ...mono10, outline: "none",
                  }}
                />
              </div>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 6, marginBottom: 8 }}>
                <span style={{ ...mono9, color: "#4a5568", width: 90, paddingTop: 4 }}>TEMPLATE</span>
                <textarea value={draft.template}
                  onChange={e => setDraft({ ...draft, template: e.target.value })}
                  placeholder="What you want to ask. Chunks auto-append if you skip {{CHUNK_A}} / {{CHUNK_B}} placeholders."
                  style={{
                    flex: 1, minHeight: 70, maxHeight: 200, resize: "vertical",
                    background: "#0a0c12", border: "1px solid #1e2230",
                    color: "#9ca3af", borderRadius: 3, padding: "6px 8px",
                    fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
                    lineHeight: 1.5, outline: "none", boxSizing: "border-box",
                  }}
                />
              </div>
              <div style={{ marginBottom: 8 }}>
                <button onClick={() => setShowOverrides(!showOverrides)} style={{
                  ...mono9, background: showOverrides ? "#f0c04020" : "#141822",
                  border: "1px solid " + (showOverrides ? "#f0c04050" : "#1e2230"),
                  color: showOverrides ? "#f0c040" : "#4a5568",
                  borderRadius: 3, padding: "3px 10px", cursor: "pointer",
                }}>{"\u26A1"} {showOverrides ? "hide connection overrides" : "use custom connection..."}</button>
              </div>
              {showOverrides && (
                <div style={{ marginBottom: 8, paddingLeft: 12, borderLeft: "2px solid #f0c04030" }}>
                  <div style={{ ...mono9, color: "#3a4050", marginBottom: 6 }}>Empty fields fall back to global defaults</div>
                  {[
                    { f: "url", l: "URL", t: "text", ph: ollamaUrl },
                    { f: "model", l: "MODEL", t: "text", ph: ollamaModel },
                    { f: "apiKey", l: "API KEY", t: "password", ph: "(none)" },
                    { f: "timeout", l: "TIMEOUT (s)", t: "number", ph: String(ollamaTimeout) },
                    { f: "maxTokens", l: "MAX TOKENS", t: "number", ph: String(ollamaMaxTokens) },
                  ].map(row => (
                    <div key={row.f} style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                      <span style={{ ...mono9, color: "#4a5568", width: 90 }}>{row.l}</span>
                      <input type={row.t} value={draft[row.f]}
                        onChange={e => setDraft({ ...draft, [row.f]: e.target.value })}
                        placeholder={row.ph}
                        style={{
                          flex: 1, background: "#0a0c12", border: "1px solid #1e2230",
                          color: draft[row.f] !== "" ? "#f0c040" : "#3a4050",
                          borderRadius: 3, padding: "3px 6px", ...mono10, outline: "none",
                        }}
                      />
                    </div>
                  ))}
                </div>
              )}
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={saveDraft}
                  disabled={!draft.label.trim() || !draft.template.trim()}
                  style={{
                    ...mono10, fontWeight: 600,
                    background: (draft.label.trim() && draft.template.trim()) ? "#34d39920" : "#141822",
                    border: "1px solid " + ((draft.label.trim() && draft.template.trim()) ? "#34d39950" : "#1e2230"),
                    color: (draft.label.trim() && draft.template.trim()) ? "#34d399" : "#3a4050",
                    borderRadius: 4, padding: "5px 14px",
                    cursor: (draft.label.trim() && draft.template.trim()) ? "pointer" : "not-allowed",
                  }}>{editingId ? "Save changes" : "+ Save query"}</button>
              </div>
            </div>
          )}

          {/* Scope selector */}
          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>
            <span style={{ ...mono9, color: "#4a5568", letterSpacing: 1 }}>SCOPE</span>
            <label style={{ display: "flex", alignItems: "center", gap: 4, ...mono10, color: scopeType === "topN" ? "#f59e42" : "#4a5568", cursor: "pointer" }}>
              <input type="radio" name="scope" checked={scopeType === "topN"} onChange={() => setScopeType("topN")} style={{ accentColor: "#f59e42" }} />
              Top
              <input type="number" min={1} max={totalPairs} value={scopeN}
                onChange={e => setScopeN(Math.max(1, Math.min(totalPairs, Number(e.target.value) || 1)))}
                onClick={() => setScopeType("topN")}
                style={{
                  width: 60, background: "#141822", border: "1px solid #1e2230",
                  color: scopeType === "topN" ? "#f59e42" : "#9ca3af",
                  borderRadius: 3, padding: "2px 6px", ...mono10, textAlign: "right", outline: "none",
                }}
              />
              matches
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 4, ...mono10, color: scopeType === "minScore" ? "#f59e42" : "#4a5568", cursor: "pointer" }}>
              <input type="radio" name="scope" checked={scopeType === "minScore"} onChange={() => setScopeType("minScore")} style={{ accentColor: "#f59e42" }} />
              {"\u2265"}
              <input type="number" min={0} max={100} value={scopeMin}
                onChange={e => setScopeMin(Math.max(0, Math.min(100, Number(e.target.value) || 0)))}
                onClick={() => setScopeType("minScore")}
                style={{
                  width: 50, background: "#141822", border: "1px solid #1e2230",
                  color: scopeType === "minScore" ? "#f59e42" : "#9ca3af",
                  borderRadius: 3, padding: "2px 6px", ...mono10, textAlign: "right", outline: "none",
                }}
              />
              %
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 4, ...mono10, color: scopeType === "all" ? "#f59e42" : "#4a5568", cursor: "pointer" }}>
              <input type="radio" name="scope" checked={scopeType === "all"} onChange={() => setScopeType("all")} style={{ accentColor: "#f59e42" }} />
              All ({totalPairs})
            </label>
          </div>

          {/* Options */}
          <div style={{ marginBottom: 10 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 6, ...mono9, color: "#4a5568", cursor: "pointer" }}>
              <input type="checkbox" checked={skipDup} onChange={e => setSkipDup(e.target.checked)} style={{ accentColor: "#34d399" }} />
              Skip pairs already answered with the same query
            </label>
          </div>

          {/* Run / Stop */}
          {!isRunning ? (
            <button onClick={handleRun} disabled={selectedQueries.length === 0 || targetCount === 0} style={{
              ...mono10, fontWeight: 600, letterSpacing: 1, textTransform: "uppercase",
              background: (selectedQueries.length > 0 && targetCount > 0) ? "linear-gradient(135deg, #f59e42, #f0c040)" : "#1a1e28",
              color: (selectedQueries.length > 0 && targetCount > 0) ? "#0a0c12" : "#3a4050",
              border: "none", borderRadius: 5, padding: "8px 20px", width: "100%",
              cursor: (selectedQueries.length > 0 && targetCount > 0) ? "pointer" : "not-allowed",
              transition: "all 0.2s",
            }}>
              {"\u25B6"} Run {selectedQueries.length} {selectedQueries.length === 1 ? "query" : "queries"} {"\u00D7"} {targetCount} {targetCount === 1 ? "pair" : "pairs"} = {totalCalls} {totalCalls === 1 ? "call" : "calls"}
            </button>
          ) : (
            <div>
              <div style={{
                width: "100%", height: 6, background: "#141822", borderRadius: 3, overflow: "hidden",
                marginBottom: 6,
              }}>
                <div style={{
                  width: progress ? (progress.done / progress.total * 100) + "%" : "0%",
                  height: "100%", background: "linear-gradient(90deg, #f59e42, #f0c040)",
                  transition: "width 0.2s",
                }} />
              </div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <span style={{ ...mono9, color: "#f59e42" }}>
                  {progress ? `${progress.done}/${progress.total} done \u00B7 pair ${progress.pairIdx}/${progress.pairTotal}` : "Starting..."}
                </span>
                <button onClick={onStop} style={{
                  ...mono9, fontWeight: 600,
                  background: "#f8717118", border: "1px solid #f8717140",
                  color: "#f87171", borderRadius: 4, padding: "3px 12px", cursor: "pointer",
                }}>{"\u25A0"} Stop</button>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function App() {
  const [textA, setTextA] = useState("");
  const [textB, setTextB] = useState("");
  const [nameA, setNameA] = useState("");
  const [nameB, setNameB] = useState("");
  const [results, setResults] = useState(null);
  const [processing, setProcessing] = useState(false);
  const [selectedCell, setSelectedCell] = useState(null);
  const [expandedMatch, setExpandedMatch] = useState(0);
  const [tab, setTab] = useState("heatmap");
  const [chunkMode, setChunkMode] = useState("512");
  const [macroSize, setMacroSize] = useState(2048);
  const [microSize, setMicroSize] = useState("256");
  const [resultsStack, setResultsStack] = useState([]); // drill history
  const [drilling, setDrilling] = useState(false);
  const [ollamaUrl, setOllamaUrl] = useState("http://localhost:11434");
  const [ollamaModel, setOllamaModel] = useState("gpt-oss:20b");
  const [ollamaTimeout, setOllamaTimeout] = useState(120); // seconds, 0 = no timeout
  const [ollamaApiKey, setOllamaApiKey] = useState(""); // optional Bearer token
  const [showApiKey, setShowApiKey] = useState(false);
  const [ollamaMaxTokens, setOllamaMaxTokens] = useState(1024); // 0 = unlimited
  const [promptTemplate, setPromptTemplate] = useState(DEFAULT_PROMPT_TEMPLATE);
  const [showPromptEditor, setShowPromptEditor] = useState(false);
  const [customQueries, setCustomQueries] = useState([]); // [{ id, label, template, url?, model?, apiKey?, timeout?, maxTokens? }]
  const [editingQueryId, setEditingQueryId] = useState(null);
  const [interpretations, setInterpretations] = useState({});
  const [batchInterpreting, setBatchInterpreting] = useState(false);
  const abortRef = useRef(null);

  // ─── Report mode: hydrate from injected data if loaded as exported report ───
  const reportMode = typeof window !== 'undefined' && window.__TUO_REPORT_MODE__ === true;
  useEffect(() => {
    if (reportMode && window.__TUO_REPORT_DATA__) {
      const d = window.__TUO_REPORT_DATA__;
      if (d.results) setResults(d.results);
      if (d.interpretations) setInterpretations(d.interpretations);
    }
  }, [reportMode]);

  const canRun = textA.trim().length > 20 && textB.trim().length > 20;

  // Live preview of chunk count + estimated processing time (cheap estimation, no full tokenize)
  const chunkPreview = useMemo(() => {
    if (!canRun) return null;
    const cA = estimateChunkCount(textA, chunkMode, macroSize);
    const cB = estimateChunkCount(textB, chunkMode, macroSize);
    const cells = cA * cB;
    const tokA = estimateTokenCount(textA);
    const tokB = estimateTokenCount(textB);
    // Rough vocab estimate: 5-15% of total unique-ish tokens, capped
    const vocab = Math.min(50000, Math.max(100, Math.ceil((tokA + tokB) * 0.08)));
    // Empirical model (rough): vocab build ~ tokens / 2M sec, vectorize ~ chunks*vocab / 50M sec, matrix ~ cells*vocab / 200M sec
    const buildSec = (tokA + tokB) / 2000000;
    const vecSec = (cA + cB) * vocab / 50000000;
    const matrixSec = cells * vocab / 200000000;
    const totalSec = buildSec + vecSec + matrixSec;
    let label, color;
    if (totalSec < 0.5) { label = "instant"; color = "#34d399"; }
    else if (totalSec < 3) { label = "~" + totalSec.toFixed(1) + "s"; color = "#34d399"; }
    else if (totalSec < 15) { label = "~" + Math.ceil(totalSec) + "s"; color = "#f0c040"; }
    else if (totalSec < 60) { label = "~" + Math.ceil(totalSec) + "s"; color = "#f59e42"; }
    else if (totalSec < 300) { label = "~" + Math.ceil(totalSec / 60) + "m"; color = "#f59e42"; }
    else { label = "~" + Math.ceil(totalSec / 60) + "m \u26A0"; color = "#f87171"; }
    return { cA, cB, cells, tokA, tokB, totalSec, label, color };
  }, [textA, textB, chunkMode, macroSize, canRun]);

  // ─── Project save / load ───
  const projectFileRef = useRef(null);
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const [loadStatus, setLoadStatus] = useState(null); // { kind: 'ok'|'err', msg }

  const handleSaveProject = useCallback(() => {
    const info = saveProject({
      nameA, nameB, textA, textB,
      chunkMode, macroSize, microSize,
      results, interpretations, resultsStack,
      customQueries,
    });
    setLastSavedAt(new Date());
    setLoadStatus({ kind: "ok", msg: "Saved \u00B7 " + (info.bytes / 1024).toFixed(1) + " KB" });
    setTimeout(() => setLoadStatus(null), 3000);
  }, [nameA, nameB, textA, textB, chunkMode, macroSize, microSize, results, interpretations, resultsStack, customQueries]);

  const handleLoadProject = useCallback((file) => {
    if (!file) return;
    loadProjectFromFile(file, {
      setTextA, setTextB, setNameA, setNameB,
      setChunkMode, setMacroSize, setMicroSize,
      setResults, setInterpretations, setResultsStack,
      setSelectedCell, setExpandedMatch,
      setCustomQueries,
    }).then(info => {
      setLoadStatus({ kind: "ok", msg: "Loaded \u00B7 saved " + (info.savedAt ? new Date(info.savedAt).toLocaleString() : "unknown") });
      setTimeout(() => setLoadStatus(null), 4000);
    }).catch(err => {
      setLoadStatus({ kind: "err", msg: err.message });
      setTimeout(() => setLoadStatus(null), 5000);
    });
  }, []);

  const analyze = useCallback(() => {
    setProcessing(true); setResults(null); setSelectedCell(null);
    setExpandedMatch(0); setInterpretations({});
    setResultsStack([]);
    setTimeout(() => {
      try {
        const cA = chunkDocument(textA, chunkMode, macroSize);
        const cB = chunkDocument(textB, chunkMode, macroSize);
        const { matrix, vocab } = computeSimilarityMatrix(cA, cB);
        const pairs = [];
        for (let i = 0; i < matrix.length; i++)
          for (let j = 0; j < matrix[0].length; j++)
            pairs.push({ i, j, score: matrix[i][j] });
        pairs.sort((a, b) => b.score - a.score);
        const scores = pairs.map(p => p.score);
        setResults({
          chunksA: cA, chunksB: cB, matrix, pairs, vocabSize: vocab.length,
          stats: { avg: scores.reduce((a,b) => a+b, 0)/scores.length, max: scores[0], highCount: scores.filter(s => s > 0.3).length },
          drillLevel: chunkMode === "macro" ? String(macroSize) : chunkMode === "row" ? "row" : chunkMode,
          drillLabel: chunkMode === "macro" ? "Macro " + macroSize : chunkMode === "row" ? "Row/Sent" : chunkMode + " tok",
          nameA: nameA || "Document A", nameB: nameB || "Document B",
        });
      } catch (err) { console.error(err); }
      setProcessing(false);
    }, 50);
  }, [textA, textB, chunkMode, macroSize, nameA, nameB]);

  // ─── Drill Ladder: automatic level progression ───
  const DRILL_LADDER = ["4096", "2048", "1024", "512", "256", "128", "row"];
  const DRILL_LABELS = { "4096": "4096 tok", "2048": "2048 tok", "1024": "1024 tok", "512": "512 tok", "256": "256 tok", "128": "128 tok", "row": "Row/Sent" };

  // Figure out what level the current results are at
  function currentDrillLevel() {
    if (!results || !results.drillLevel) {
      // Initial level: find closest match in ladder
      if (chunkMode === "macro") return DRILL_LADDER.indexOf(String(macroSize)) >= 0 ? String(macroSize) : "2048";
      if (chunkMode === "row") return "row";
      return DRILL_LADDER.indexOf(chunkMode) >= 0 ? chunkMode : "512";
    }
    return results.drillLevel;
  }

  function nextDrillLevel() {
    var cur = currentDrillLevel();
    var idx = DRILL_LADDER.indexOf(cur);
    if (idx < 0) idx = DRILL_LADDER.indexOf("512"); // fallback
    return idx < DRILL_LADDER.length - 1 ? DRILL_LADDER[idx + 1] : null;
  }

  function prevDrillLevel() {
    if (resultsStack.length === 0) return null;
    var prev = resultsStack[resultsStack.length - 1];
    return prev.results.drillLevel || "512";
  }

  var nextLevel = nextDrillLevel();
  var prevLevel = prevDrillLevel();

  // ─── Drill one chunk: sub-chunk a single segment, splice into results ───
  const drillOneChunk = useCallback((doc, idx) => {
    if (!results || drilling) return;
    var nxt = nextDrillLevel();
    if (!nxt) return;
    setDrilling(true);
    setTimeout(() => {
      try {
        var chunksA = results.chunksA.slice();
        var chunksB = results.chunksB.slice();

        if (doc === "A") {
          var subs = subChunk(chunksA[idx], nxt);
          if (subs.length <= 1) { setDrilling(false); return; } // nothing to split
          chunksA.splice(idx, 1, ...subs);
        } else {
          var subs = subChunk(chunksB[idx], nxt);
          if (subs.length <= 1) { setDrilling(false); return; }
          chunksB.splice(idx, 1, ...subs);
        }

        // Recompute matrix with the expanded array
        var { matrix: newMat, vocab: newVocab } = computeSimilarityMatrix(chunksA, chunksB);
        var newPairs = [];
        for (var i = 0; i < newMat.length; i++)
          for (var j = 0; j < newMat[0].length; j++)
            newPairs.push({ i: i, j: j, score: newMat[i][j] });
        newPairs.sort(function(a, b) { return b.score - a.score; });
        var scores = newPairs.length > 0 ? newPairs.map(function(p) { return p.score; }) : [0];

        // Push current state
        setResultsStack(function(prev) { return prev.concat([{ results: results, interpretations: interpretations }]); });

        setResults({
          chunksA: chunksA, chunksB: chunksB,
          matrix: newMat, pairs: newPairs, vocabSize: newVocab.length,
          stats: { avg: scores.reduce(function(a,b){return a+b;},0)/scores.length, max: scores[0], highCount: scores.filter(function(s){return s > 0.3;}).length },
          drillLevel: results.drillLevel, // keep same level label since it's partial
          drillLabel: (results.drillLabel || "") + "+",
          nameA: results.nameA, nameB: results.nameB,
        });
        // Remap interpretations: shift keys for indices after the splice point
        var newInterps = {};
        Object.keys(interpretations).forEach(function(k) {
          var parts = k.split("-"); var ai = parseInt(parts[0]); var bj = parseInt(parts[1]);
          if (doc === "A") {
            if (ai < idx) newInterps[k] = interpretations[k];
            else if (ai > idx) { var nk = (ai + subs.length - 1) + "-" + bj; newInterps[nk] = interpretations[k]; }
            // ai === idx: parent was split, its interpretations are invalidated
          } else {
            if (bj < idx) newInterps[k] = interpretations[k];
            else if (bj > idx) { var nk = ai + "-" + (bj + subs.length - 1); newInterps[nk] = interpretations[k]; }
          }
        });
        setInterpretations(newInterps);
        setSelectedCell(null);
        setExpandedMatch(0);
      } catch (err) { console.error("Drill one error:", err); }
      setDrilling(false);
    }, 30);
  }, [results, drilling, interpretations]);

  // ─── Drill All: sub-chunk every chunk at next level ───
  const drillAll = useCallback(() => {
    if (!results || drilling) return;
    var nxt = nextDrillLevel();
    if (!nxt) return; // already at finest
    setDrilling(true);
    setTimeout(() => {
      try {
        const subChunksA = [];
        const chunkMapA = [];
        results.chunksA.forEach((c, pi) => {
          const subs = subChunk(c, nxt);
          subs.forEach(s => { chunkMapA.push(pi); subChunksA.push(s); });
        });
        const subChunksB = [];
        const chunkMapB = [];
        results.chunksB.forEach((c, pi) => {
          const subs = subChunk(c, nxt);
          subs.forEach(s => { chunkMapB.push(pi); subChunksB.push(s); });
        });

        const { matrix: newMat, vocab: newVocab } = computeSimilarityMatrix(subChunksA, subChunksB);
        const newPairs = [];
        for (let i = 0; i < newMat.length; i++)
          for (let j = 0; j < newMat[0].length; j++)
            newPairs.push({ i, j, score: newMat[i][j] });
        newPairs.sort((a, b) => b.score - a.score);
        const scores = newPairs.length > 0 ? newPairs.map(p => p.score) : [0];

        setResultsStack(prev => [...prev, { results, interpretations }]);

        setResults({
          chunksA: subChunksA, chunksB: subChunksB,
          matrix: newMat, pairs: newPairs, vocabSize: newVocab.length,
          stats: { avg: scores.reduce((a,b) => a+b, 0)/scores.length, max: scores[0], highCount: scores.filter(s => s > 0.3).length },
          parentMapA: chunkMapA, parentMapB: chunkMapB,
          drillLevel: nxt,
          drillLabel: DRILL_LABELS[nxt] || nxt,
          nameA: results.nameA, nameB: results.nameB,
        });
        setSelectedCell(null);
        setExpandedMatch(0);
        setInterpretations({});
      } catch (err) { console.error("Drill error:", err); }
      setDrilling(false);
    }, 50);
  }, [results, drilling, interpretations]);

  // ─── Drill Up: pop the stack ───
  const drillUp = useCallback(() => {
    if (resultsStack.length === 0) return;
    const prev = resultsStack[resultsStack.length - 1];
    setResultsStack(s => s.slice(0, -1));
    setResults(prev.results);
    setInterpretations(prev.interpretations);
    setSelectedCell(null);
    setExpandedMatch(0);
  }, [resultsStack]);

  const drillDepth = resultsStack.length;
  const atFinest = !nextLevel;

  const interpretPair = useCallback(async (i, j, score, cA, cB, queryOrTemplate, labelOverride) => {
    // Backward-compat: queryOrTemplate may be undefined (use globals), a string (template only), or a full query object
    const query = (typeof queryOrTemplate === "string")
      ? { template: queryOrTemplate, label: labelOverride }
      : (queryOrTemplate || {});

    // Resolve effective config: query overrides > globals
    const tmpl = query.template || promptTemplate;
    const label = query.label || labelForPrompt(tmpl, customQueries);
    const url = (query.url && query.url.trim()) || ollamaUrl;
    const model = (query.model && query.model.trim()) || ollamaModel;
    const apiKey = (query.apiKey != null && query.apiKey !== "") ? query.apiKey : ollamaApiKey;
    const timeoutMs = (query.timeout != null && query.timeout >= 0 ? query.timeout : ollamaTimeout) * 1000;
    const maxTokens = (query.maxTokens != null && query.maxTokens >= 0) ? query.maxTokens : ollamaMaxTokens;

    const k = i+"-"+j;
    const id = newInterpId();
    const ts = Date.now();
    setInterpretations(p => {
      const list = getInterps(p, k);
      return { ...p, [k]: [...list, { id, label, status: "loading", timestamp: ts }] };
    });
    try {
      const r = await queryOllama(url, model, cA, cB, score, null, tmpl, timeoutMs, apiKey, maxTokens);
      setInterpretations(p => {
        const list = getInterps(p, k);
        return { ...p, [k]: list.map(e => e.id === id ? { ...e, response: r, status: "done" } : e) };
      });
    } catch (err) {
      const isTimeout = err.name === "TimeoutError";
      setInterpretations(p => {
        const list = getInterps(p, k);
        return { ...p, [k]: list.map(e => e.id === id ? { ...e, status: isTimeout ? "timeout" : "error", error: err.message } : e) };
      });
    }
  }, [ollamaUrl, ollamaModel, promptTemplate, ollamaTimeout, ollamaApiKey, ollamaMaxTokens, customQueries]);

  const removeInterp = useCallback((i, j, id) => {
    const k = i+"-"+j;
    setInterpretations(p => {
      const list = getInterps(p, k).filter(e => e.id !== id);
      const cp = { ...p };
      if (list.length === 0) delete cp[k]; else cp[k] = list;
      return cp;
    });
  }, []);

  const batchInterpret = useCallback(async (count, minScore) => {
    if (!results) return;
    setBatchInterpreting(true);
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const targets = minScore != null
      ? results.pairs.filter(m => m.score >= minScore)
      : results.pairs.slice(0, count);
    const label = labelForPrompt(promptTemplate);
    for (const m of targets) {
      if (ctrl.signal.aborted) break;
      const k = m.i+"-"+m.j;
      const id = newInterpId();
      const ts = Date.now();
      setInterpretations(p => {
        const list = getInterps(p, k);
        return { ...p, [k]: [...list, { id, label, status: "loading", timestamp: ts }] };
      });
      try {
        const r = await queryOllama(ollamaUrl, ollamaModel, results.chunksA[m.i], results.chunksB[m.j], m.score, ctrl.signal, promptTemplate, ollamaTimeout * 1000, ollamaApiKey, ollamaMaxTokens);
        setInterpretations(p => {
          const list = getInterps(p, k);
          return { ...p, [k]: list.map(e => e.id === id ? { ...e, response: r, status: "done" } : e) };
        });
      } catch (err) {
        if (err.name === "AbortError" && ctrl.signal.aborted) {
          // Mark this one as cancelled by removing it
          setInterpretations(p => {
            const list = getInterps(p, k).filter(e => e.id !== id);
            const cp = { ...p };
            if (list.length === 0) delete cp[k]; else cp[k] = list;
            return cp;
          });
          break;
        }
        const isTimeout = err.name === "TimeoutError";
        setInterpretations(p => {
          const list = getInterps(p, k);
          return { ...p, [k]: list.map(e => e.id === id ? { ...e, status: isTimeout ? "timeout" : "error", error: err.message } : e) };
        });
      }
    }
    setBatchInterpreting(false);
  }, [results, ollamaUrl, ollamaModel, promptTemplate, ollamaTimeout, ollamaApiKey, ollamaMaxTokens]);

  // ─── Multi-query batch runner ───
  const [batchProgress, setBatchProgress] = useState(null); // { done, total, pairIdx, pairTotal }

  const runBatch = useCallback(async (queries, scope, opts) => {
    if (!results || !queries || queries.length === 0) return;
    setBatchInterpreting(true);
    const ctrl = new AbortController();
    abortRef.current = ctrl;

    let targets;
    if (scope.type === "topN") targets = results.pairs.slice(0, scope.n);
    else if (scope.type === "minScore") targets = results.pairs.filter(p => p.score >= scope.v);
    else if (scope.type === "all") targets = results.pairs;
    else targets = [];

    const skipDuplicates = opts && opts.skipDuplicates;
    const total = targets.length * queries.length;
    let done = 0;
    setBatchProgress({ done: 0, total, pairIdx: 0, pairTotal: targets.length });

    try {
      for (let pi = 0; pi < targets.length; pi++) {
        if (ctrl.signal.aborted) break;
        const m = targets[pi];
        const k = m.i + "-" + m.j;
        setBatchProgress({ done, total, pairIdx: pi + 1, pairTotal: targets.length });

        // Fire all queries for this pair in parallel
        const promises = queries.map(async (q) => {
          if (ctrl.signal.aborted) return;
          // Skip if already answered with same label
          if (skipDuplicates) {
            const existing = getInterps(interpretations, k);
            if (existing.some(e => e.label === q.label && e.status === "done")) {
              done += 1;
              setBatchProgress(p => p ? { ...p, done } : null);
              return;
            }
          }
          const id = newInterpId();
          const ts = Date.now();
          // Resolve per-query connection (overrides > globals)
          const url = (q.url && q.url.trim()) || ollamaUrl;
          const model = (q.model && q.model.trim()) || ollamaModel;
          const apiKey = (q.apiKey != null && q.apiKey !== "") ? q.apiKey : ollamaApiKey;
          const timeoutMs = (q.timeout != null && q.timeout >= 0 ? q.timeout : ollamaTimeout) * 1000;
          const maxTokens = (q.maxTokens != null && q.maxTokens >= 0) ? q.maxTokens : ollamaMaxTokens;
          setInterpretations(p => {
            const list = getInterps(p, k);
            return { ...p, [k]: [...list, { id, label: q.label, status: "loading", timestamp: ts }] };
          });
          try {
            const r = await queryOllama(url, model, results.chunksA[m.i], results.chunksB[m.j], m.score, ctrl.signal, q.template, timeoutMs, apiKey, maxTokens);
            setInterpretations(p => {
              const list = getInterps(p, k);
              return { ...p, [k]: list.map(e => e.id === id ? { ...e, response: r, status: "done" } : e) };
            });
          } catch (err) {
            if (err.name === "AbortError" && ctrl.signal.aborted) {
              // Strip the cancelled placeholder
              setInterpretations(p => {
                const list = getInterps(p, k).filter(e => e.id !== id);
                const cp = { ...p };
                if (list.length === 0) delete cp[k]; else cp[k] = list;
                return cp;
              });
              return;
            }
            const isTimeout = err.name === "TimeoutError";
            setInterpretations(p => {
              const list = getInterps(p, k);
              return { ...p, [k]: list.map(e => e.id === id ? { ...e, status: isTimeout ? "timeout" : "error", error: err.message } : e) };
            });
          } finally {
            done += 1;
            setBatchProgress(p => p ? { ...p, done } : null);
          }
        });
        await Promise.all(promises);
      }
    } finally {
      setBatchInterpreting(false);
      setBatchProgress(null);
    }
  }, [results, interpretations, ollamaUrl, ollamaModel, ollamaTimeout, ollamaApiKey, ollamaMaxTokens]);
