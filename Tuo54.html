// ═══════════════════════════════════════════════════════════════
// LAZY CHUNK LIST — stable component (must be outside DocumentView)
// ═══════════════════════════════════════════════════════════════

function LazyChunkList({ chunks, doc, linksMap, renderFn, onLoadMore }) {
  const BATCH = 15;
  const [loaded, setLoaded] = useState(BATCH);
  const sentinelRef = useRef(null);
  const loadedRef = useRef(loaded);
  loadedRef.current = loaded;

  // Reset only when chunk count actually changes
  const prevCountRef = useRef(chunks.length);
  useEffect(() => {
    if (chunks.length !== prevCountRef.current) {
      prevCountRef.current = chunks.length;
      setLoaded(BATCH);
    }
  }, [chunks.length]);

  // IntersectionObserver on sentinel
  useEffect(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && loadedRef.current < chunks.length) {
        setLoaded(prev => Math.min(prev + BATCH, chunks.length));
      }
    }, { rootMargin: "300px" });
    obs.observe(el);
    return () => obs.disconnect();
  }, [chunks.length, loaded]);

  // Expose forceLoad for scrollTo
  const forceLoadTo = useCallback((idx) => {
    setLoaded(prev => Math.max(prev, idx + 5));
  }, []);

  useEffect(() => {
    if (onLoadMore) onLoadMore(forceLoadTo);
  }, [forceLoadTo, onLoadMore]);

  const visible = chunks.slice(0, loaded);
  const remaining = chunks.length - loaded;

  return (
    <>
      {visible.map((c, i) => renderFn(c, i, doc, linksMap[i]))}
      {remaining > 0 && (
        <div ref={sentinelRef} style={{ padding: "16px 12px", textAlign: "center" }}>
          <div style={{
            ...mono9, color: "#2a2f3a", animation: "pulse 1.5s infinite",
          }}>{remaining} more chunk{remaining !== 1 ? "s" : ""} {"\u2193"}</div>
        </div>
      )}
      {remaining <= 0 && (
        <div style={{ padding: "12px", textAlign: "center" }}>
          <div style={{ ...mono9, color: "#1e2230" }}>{"\u2500".repeat(20)}</div>
        </div>
      )}
    </>
  );
}

// ═══════════════════════════════════════════════════════════════
// DOCUMENT VIEW — side-by-side annotated documents
// ═══════════════════════════════════════════════════════════════

function DocumentView({ chunksA, chunksB, matrix, interpretations, onInterpret, onRemove, currentLabel, nameA, nameB, customQueries, readOnly, search, onSearchChange, pipelinesByLabel }) {
  const leftRef = useRef(null);
  const rightRef = useRef(null);
  const wrapperRef = useRef(null);
  const svgRef = useRef(null);
  const forceLoadARef = useRef(null);
  const forceLoadBRef = useRef(null);
  const [activeLink, setActiveLink] = useState(null);
  const [selectedPair, setSelectedPair] = useState(null); // { doc, idx, aIdx, bIdx, score }
  const tooltipRef = useRef(null);
  const [docThreshold] = useState(0.15);

  // Build link maps: for each chunk, which chunks in the other doc are linked?
  const { linksFromA, linksFromB } = useMemo(() => {
    const fA = {};
    const fB = {};
    for (let i = 0; i < matrix.length; i++) {
      for (let j = 0; j < (matrix[0]?.length || 0); j++) {
        if (matrix[i][j] >= docThreshold) {
          const k = i + "-" + j;
          const interp = combinedInterpText(interpretations, k) || null;
          const interpCount = getInterps(interpretations, k).filter(e => e.status === "done").length;
          if (!fA[i]) fA[i] = [];
          fA[i].push({ j, score: matrix[i][j], interp, interpCount });
          if (!fB[j]) fB[j] = [];
          fB[j].push({ i, score: matrix[i][j], interp, interpCount });
        }
      }
    }
    Object.values(fA).forEach(arr => arr.sort((a, b) => b.score - a.score));
    Object.values(fB).forEach(arr => arr.sort((a, b) => b.score - a.score));
    return { linksFromA: fA, linksFromB: fB };
  }, [matrix, interpretations, docThreshold]);

  // Scroll a single panel to show a chunk (for search hits)
  const scrollToSingle = useCallback((panel, idx) => {
    const forceRef = panel === "A" ? forceLoadARef : forceLoadBRef;
    if (forceRef.current) forceRef.current(idx);
    const attempt = (tries) => {
      const container = panel === "A" ? leftRef.current : rightRef.current;
      if (!container) return;
      const el = container.querySelector("[data-chunk-idx='" + idx + "']");
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.style.transition = "background 0.3s";
        el.style.background = panel === "A" ? "#60a5fa12" : "#f59e4212";
        setTimeout(() => { el.style.background = "transparent"; }, 1500);
        setTimeout(drawLines, 400);
      } else if (tries > 0) {
        setTimeout(() => attempt(tries - 1), 50);
      }
    };
    requestAnimationFrame(() => attempt(10));
  }, [drawLines]);

  // Scroll BOTH panels to align two chunks at the same Y position
  const scrollToAligned = useCallback((aIdx, bIdx) => {
    // Force-load both chunks
    if (forceLoadARef.current) forceLoadARef.current(aIdx);
    if (forceLoadBRef.current) forceLoadBRef.current(bIdx);

    const alignTarget = 80; // px from top of container where chunks should align

    const attempt = (tries) => {
      const lp = leftRef.current;
      const rp = rightRef.current;
      if (!lp || !rp) return;
      const elA = lp.querySelector("[data-chunk-idx='" + aIdx + "']");
      const elB = rp.querySelector("[data-chunk-idx='" + bIdx + "']");
      if (elA && elB) {
        // Calculate scroll offsets so both elements sit at alignTarget px from container top
        const scrollA = elA.offsetTop - alignTarget;
        const scrollB = elB.offsetTop - alignTarget;
        lp.scrollTo({ top: Math.max(0, scrollA), behavior: "smooth" });
        rp.scrollTo({ top: Math.max(0, scrollB), behavior: "smooth" });
        // Highlight
        elA.style.transition = "background 0.3s";
        elA.style.background = "#60a5fa12";
        elB.style.transition = "background 0.3s";
        elB.style.background = "#f59e4212";
        setTimeout(() => { elA.style.background = "transparent"; elB.style.background = "transparent"; }, 1500);
        setTimeout(drawLines, 400);
      } else if (tries > 0) {
        setTimeout(() => attempt(tries - 1), 50);
      }
    };
    requestAnimationFrame(() => attempt(10));
  }, [drawLines]);

  // Auto-scroll each panel to its first hit when the search term changes (debounced).
  useEffect(() => {
    const q = (search || "").trim().toLowerCase();
    if (!q) return;
    const t = setTimeout(() => {
      const firstAHit = chunksA.findIndex(c => (c || "").toLowerCase().includes(q));
      if (firstAHit >= 0) scrollToSingle("A", firstAHit);
      const firstBHit = chunksB.findIndex(c => (c || "").toLowerCase().includes(q));
      if (firstBHit >= 0) scrollToSingle("B", firstBHit);
    }, 250);
    return () => clearTimeout(t);
  }, [search, chunksA, chunksB, scrollToSingle]);

  const handleLinkClick = useCallback((fromDoc, fromIdx, toIdx) => {
    const key = fromDoc === "A" ? ("A" + fromIdx + "-B" + toIdx) : ("B" + fromIdx + "-A" + toIdx);
    setActiveLink(key);
    const aIdx = fromDoc === "A" ? fromIdx : toIdx;
    const bIdx = fromDoc === "A" ? toIdx : fromIdx;
    const sc = matrix[aIdx] ? matrix[aIdx][bIdx] || 0 : 0;
    setSelectedPair({ aIdx, bIdx, score: sc });
    // Scroll BOTH panels so the two chunks align horizontally
    scrollToAligned(aIdx, bIdx);
  }, [scrollToAligned, matrix]);

  const handleHover = useCallback((e, link, fromDoc, fromIdx) => {
    const tip = tooltipRef.current;
    if (!tip) return;
    if (!link) { tip.style.display = "none"; return; }
    // Light up the connecting line on hover
    const toIdx = fromDoc === "A" ? link.j : link.i;
    const key = fromDoc === "A" ? ("A" + fromIdx + "-B" + toIdx) : ("B" + fromIdx + "-A" + toIdx);
    setActiveLink(key);
    const wRect = wrapperRef.current?.getBoundingClientRect();
    if (!wRect) return;
    const rect = e.currentTarget.getBoundingClientRect();
    tip.style.display = "block";
    tip.style.left = (rect.right - wRect.left + 8) + "px";
    tip.style.top = (rect.top - wRect.top) + "px";
    const fromLabel = fromDoc + (fromIdx + 1);
    const toLabel = (fromDoc === "A" ? "B" : "A") + (toIdx + 1);
    const fromColor = fromDoc === "A" ? "#60a5fa" : "#f59e42";
    const toColor = fromDoc === "A" ? "#f59e42" : "#60a5fa";
    tip.innerHTML = '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">'
      + '<span style="font-family:JetBrains Mono,monospace;font-size:10px;color:' + fromColor + '">' + fromLabel + '</span>'
      + '<span style="color:#3a4050;font-size:10px">\u27F7</span>'
      + '<span style="font-family:JetBrains Mono,monospace;font-size:10px;color:' + toColor + '">' + toLabel + '</span>'
      + '<span style="font-family:JetBrains Mono,monospace;font-size:10px;color:#f0c040;font-weight:700">' + (link.score * 100).toFixed(1) + '%</span>'
      + '</div>'
      + (link.interp
        ? '<div style="font-family:IBM Plex Serif,serif;font-size:11.5px;color:#b0b8c8;line-height:1.7;white-space:pre-wrap">' + link.interp.replace(/</g, "&lt;") + '</div>'
        : '<div style="font-family:JetBrains Mono,monospace;font-size:9px;color:#3a4050">No LLM interpretation yet</div>');
  }, []);

  const hideTooltip = useCallback(() => {
    if (tooltipRef.current) tooltipRef.current.style.display = "none";
  }, []);

  function linkBadgeColor(score, targetDoc) {
    // Color of the target document, intensity scaled by score
    const base = targetDoc === "B" ? "#f59e42" : "#60a5fa";
    const alpha = Math.round(15 + score * 40).toString(16).padStart(2, "0");
    const borderAlpha = Math.round(30 + score * 60).toString(16).padStart(2, "0");
    return { bg: base + alpha, border: base + borderAlpha, text: base };
  }

  const searchLower = (search || "").trim().toLowerCase();
  function renderChunkWithLinks(text, idx, doc, links) {
    const hasHit = searchLower && (text || "").toLowerCase().includes(searchLower);
    const dimmed = searchLower && !hasHit;
    return (
      <div key={idx} data-chunk-idx={idx}
        data-search-hit={hasHit ? "1" : "0"}
        style={{
          display: "flex", gap: 0,
          flexDirection: doc === "A" ? "row" : "row-reverse",
          marginBottom: 2, borderBottom: "1px solid #1e223040",
          paddingBottom: 8, paddingTop: 8,
          opacity: dimmed ? 0.25 : 1,
          background: hasHit ? "#f0c04008" : "transparent",
          transition: "opacity 0.15s, background 0.15s",
        }}>
        {/* Main content */}
        <div style={{ flex: 1, minWidth: 0, padding: "0 12px" }}>
          <div style={{
            ...mono9,
            color: hasHit ? "#f0c040" : (doc === "A" ? "#60a5fa50" : "#f59e4250"),
            marginBottom: 4, letterSpacing: 1,
          }}>{doc}{idx + 1}{hasHit && <span style={{ marginLeft: 6, fontSize: 8, background: "#f0c04020", padding: "1px 5px", borderRadius: 2 }}>{"\u{1F50D}"} hit</span>}</div>
          <ChunkContent text={text} maxLen={null} fontSize={12} maxHeight={null} highlight={searchLower} />
        </div>
        {/* Margin links */}
        <div style={{
          width: 52, flexShrink: 0, display: "flex", flexDirection: "column",
          alignItems: doc === "A" ? "flex-end" : "flex-start",
          gap: 3, paddingTop: 16,
          borderLeft: doc === "B" ? "1px solid #1e223040" : "none",
          borderRight: doc === "A" ? "1px solid #1e223040" : "none",
          paddingLeft: doc === "B" ? 6 : 0,
          paddingRight: doc === "A" ? 6 : 0,
        }}>
          {(links || []).slice(0, 5).map((link, li) => {
            const toIdx = doc === "A" ? link.j : link.i;
            const toLabel = (doc === "A" ? "B" : "A") + (toIdx + 1);
            const toDoc = doc === "A" ? "B" : "A";
            const c = linkBadgeColor(link.score, toDoc);
            const isActive = activeLink === (doc + idx + "-" + toLabel);
            return (
              <div
                key={li}
                data-link-from={doc + idx}
                data-link-to={toDoc + toIdx}
                data-link-score={link.score}
                onClick={(e) => { e.stopPropagation(); handleLinkClick(doc, idx, toIdx); }}
                onMouseEnter={(e) => handleHover(e, link, doc, idx)}
                onMouseLeave={hideTooltip}
                style={{
                  ...mono9, fontSize: 8,
                  background: isActive ? c.text + "30" : c.bg,
                  border: "1px solid " + (isActive ? c.text : c.border),
                  color: c.text, borderRadius: 3,
                  padding: "1px 4px", cursor: "pointer",
                  whiteSpace: "nowrap",
                  transition: "all 0.15s",
                }}
                title={(link.score * 100).toFixed(1) + "% " + toLabel}
              >
                {toLabel}
                {link.interp && <span style={{ marginLeft: 2, opacity: 0.6 }}>{"\u{1F9E0}"}{link.interpCount > 1 ? link.interpCount : ""}</span>}
              </div>
            );
          })}
          {(links || []).length > 5 && (
            <div style={{ ...mono9, fontSize: 7, color: "#3a4050" }}>+{links.length - 5}</div>
          )}
        </div>
      </div>
    );
  }

  // ─── Draw connecting lines between matching badges ───
  const drawLines = useCallback(() => {
    const svg = svgRef.current;
    const wrapper = wrapperRef.current;
    if (!svg || !wrapper) return;
    const wRect = wrapper.getBoundingClientRect();

    // Find all badge elements with data-link-from on left (A) side
    const leftBadges = leftRef.current ? leftRef.current.querySelectorAll("[data-link-from^='A']") : [];
    // Find all badge elements with data-link-from on right (B) side
    const rightBadges = rightRef.current ? rightRef.current.querySelectorAll("[data-link-from^='B']") : [];

    // Build position map: key "A3" or "B5" -> { x, y } center of badge
    const leftPos = {};  // keyed by "A{i}" -> badge center
    const rightPos = {}; // keyed by "B{j}" -> badge center

    leftBadges.forEach(el => {
      const r = el.getBoundingClientRect();
      const fromKey = el.getAttribute("data-link-from");
      const toKey = el.getAttribute("data-link-to");
      // This badge sits in A's right margin, pointing to B
      // Store position keyed by the pair
      const pairKey = fromKey + "-" + toKey;
      leftPos[pairKey] = {
        x: r.right - wRect.left,
        y: r.top + r.height / 2 - wRect.top,
        score: parseFloat(el.getAttribute("data-link-score") || "0"),
      };
    });

    rightBadges.forEach(el => {
      const r = el.getBoundingClientRect();
      const fromKey = el.getAttribute("data-link-from");
      const toKey = el.getAttribute("data-link-to");
      // This badge sits in B's left margin, pointing to A
      // The matching pair key from A's perspective: toKey + "-" + fromKey
      const pairKey = toKey + "-" + fromKey;
      rightPos[pairKey] = {
        x: r.left - wRect.left,
        y: r.top + r.height / 2 - wRect.top,
      };
    });

    // Only draw the active link to reduce visual clutter
    let paths = "";
    if (activeLink) {
      Object.keys(leftPos).forEach(pairKey => {
        if (!rightPos[pairKey]) return;
        const isAct = pairKey.replace("-", "") === activeLink.replace("-", "");
        if (!isAct) return;
        const lp = leftPos[pairKey];
        const rp = rightPos[pairKey];
        const dx = (rp.x - lp.x) * 0.4;
        paths += '<path d="M' + lp.x + ' ' + lp.y + ' C' + (lp.x + dx) + ' ' + lp.y + ' ' + (rp.x - dx) + ' ' + rp.y + ' ' + rp.x + ' ' + rp.y + '" fill="none" stroke="#f0c040" stroke-width="2.5" />';
      });
    }

    svg.innerHTML = paths;
  }, [activeLink]);

  // Redraw lines on scroll, resize, threshold change, and lazy-load DOM mutations
  useEffect(() => {
    const redraw = () => { requestAnimationFrame(drawLines); };
    // Debounced version for MutationObserver — avoids thrash from tooltip DOM changes
    let mutTimer = null;
    const debouncedRedraw = () => {
      if (mutTimer) clearTimeout(mutTimer);
      mutTimer = setTimeout(redraw, 80);
    };
    const lp = leftRef.current;
    const rp = rightRef.current;
    if (lp) lp.addEventListener("scroll", redraw, { passive: true });
    if (rp) rp.addEventListener("scroll", redraw, { passive: true });
    window.addEventListener("resize", redraw);

    // Only watch childList on the scroll containers, not subtree (avoids tooltip noise)
    const mutObs = new MutationObserver(debouncedRedraw);
    if (lp) mutObs.observe(lp, { childList: true });
    if (rp) mutObs.observe(rp, { childList: true });

    const t = setTimeout(redraw, 100);
    return () => {
      if (lp) lp.removeEventListener("scroll", redraw);
      if (rp) rp.removeEventListener("scroll", redraw);
      window.removeEventListener("resize", redraw);
      mutObs.disconnect();
      clearTimeout(t);
      if (mutTimer) clearTimeout(mutTimer);
    };
  }, [drawLines, linksFromA, linksFromB]);

  // Redraw when activeLink changes
  useEffect(() => { drawLines(); }, [activeLink, drawLines]);

  const totalLinksA = Object.values(linksFromA).reduce((s, arr) => s + arr.length, 0);
  const totalLinksB = Object.values(linksFromB).reduce((s, arr) => s + arr.length, 0);
  const linkedChunksA = Object.keys(linksFromA).length;
  const linkedChunksB = Object.keys(linksFromB).length;

  return (
    <div style={{ background: "#0e1018", borderRadius: 10 }}>
      {/* Header */}
      <div style={{
        display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "12px 16px", borderBottom: "1px solid #1e2230", gap: 12, flexWrap: "wrap",
      }}>
        <div style={{ ...mono10, color: "#4a5568", flex: "1 1 220px", minWidth: 0 }}>
          DOCUMENT VIEW {"\u00B7"} {linkedChunksA}/{chunksA.length} A linked {"\u00B7"} {linkedChunksB}/{chunksB.length} B linked
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ ...mono9, color: "#3a4050" }}>{"\u{1F50D}"}</span>
          <input
            type="text"
            value={search || ""}
            onChange={e => onSearchChange && onSearchChange(e.target.value)}
            placeholder="Search both docs..."
            style={{
              width: 180, background: "#141822", border: "1px solid #1e2230",
              color: (search && search.length) ? "#f0c040" : "#9ca3af",
              borderRadius: 4, padding: "3px 8px", ...mono10, outline: "none",
            }}
          />
          {search && search.length > 0 && (() => {
            const q = search.toLowerCase();
            let hitsA = 0, hitsB = 0;
            for (let i = 0; i < chunksA.length; i++) if ((chunksA[i] || "").toLowerCase().includes(q)) hitsA++;
            for (let j = 0; j < chunksB.length; j++) if ((chunksB[j] || "").toLowerCase().includes(q)) hitsB++;
            return (
              <span style={{ ...mono9, color: (hitsA + hitsB) > 0 ? "#f0c040" : "#f87171" }}>
                {hitsA}A {"\u00B7"} {hitsB}B
              </span>
            );
          })()}
          {search && (
            <button onClick={() => onSearchChange && onSearchChange("")} style={{
              ...mono9, background: "transparent", border: "1px solid #1e2230",
              color: "#4a5568", borderRadius: 3, padding: "2px 6px", cursor: "pointer",
            }}>{"\u2715"}</button>
          )}
        </div>
      </div>

      {/* Two-panel layout with connecting lines */}
      <div ref={wrapperRef} style={{ display: "flex", height: 600, position: "relative" }}>
        {/* SVG overlay for connecting lines */}
        <svg ref={svgRef} style={{
          position: "absolute", top: 0, left: 0, width: "100%", height: "100%",
          pointerEvents: "none", zIndex: 10,
        }} />

        {/* Doc A */}
        <div style={{ flex: "1 1 50%", minWidth: 0, display: "flex", flexDirection: "column", borderRight: "2px solid #1e2230" }}>
          <div style={{
            padding: "8px 12px", background: "#0c0e16", borderBottom: "1px solid #1e2230",
            display: "flex", alignItems: "center", gap: 8, flexShrink: 0,
          }}>
            <div style={{ width: 10, height: 10, borderRadius: "50%", background: "#60a5fa" }} />
            <span style={{ ...mono10, color: "#60a5fa", fontWeight: 600 }}>{(nameA || "DOCUMENT A").toUpperCase()}</span>
            <span style={{ ...mono9, color: "#3a4050" }}>{chunksA.length} chunks</span>
          </div>
          <div ref={leftRef} style={{
            flex: 1, overflow: "auto", position: "relative",
            scrollbarWidth: "thin", scrollbarColor: "#2a2f3a #0a0c12",
          }}>
            <LazyChunkList
              chunks={chunksA} doc="A" linksMap={linksFromA}
              renderFn={renderChunkWithLinks}
              onLoadMore={fn => { forceLoadARef.current = fn; }}
            />
          </div>
        </div>

        {/* Doc B */}
        <div style={{ flex: "1 1 50%", minWidth: 0, display: "flex", flexDirection: "column" }}>
          <div style={{
            padding: "8px 12px", background: "#0c0e16", borderBottom: "1px solid #1e2230",
            display: "flex", alignItems: "center", gap: 8, flexShrink: 0,
          }}>
            <div style={{ width: 10, height: 10, borderRadius: "50%", background: "#f59e42" }} />
            <span style={{ ...mono10, color: "#f59e42", fontWeight: 600 }}>{(nameB || "DOCUMENT B").toUpperCase()}</span>
            <span style={{ ...mono9, color: "#3a4050" }}>{chunksB.length} chunks</span>
          </div>
          <div ref={rightRef} style={{
            flex: 1, overflow: "auto", position: "relative",
            scrollbarWidth: "thin", scrollbarColor: "#2a2f3a #0a0c12",
          }}>
            <LazyChunkList
              chunks={chunksB} doc="B" linksMap={linksFromB}
              renderFn={renderChunkWithLinks}
              onLoadMore={fn => { forceLoadBRef.current = fn; }}
            />
          </div>
        </div>

        {/* Tooltip — ref-based, no React re-renders */}
        <div ref={tooltipRef} style={{
          display: "none", position: "absolute",
          background: "#141822f0", border: "1px solid #2a2f3a", borderRadius: 6,
          padding: "8px 12px", maxWidth: 300, zIndex: 30, pointerEvents: "none",
        }} />
      </div>

      {/* Selected pair interpret panel */}
      {selectedPair && onInterpret && (
        <div style={{
          marginTop: 8, background: "#0c0e16", borderRadius: 8, padding: 12,
          border: "1px solid #818cf815",
        }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ ...mono10, color: "#60a5fa", background: "#60a5fa12", padding: "2px 6px", borderRadius: 3 }}>A{selectedPair.aIdx+1}</span>
              <span style={{ color: "#3a4050", fontSize: 10 }}>{"\u27F7"}</span>
              <span style={{ ...mono10, color: "#f59e42", background: "#f59e4212", padding: "2px 6px", borderRadius: 3 }}>B{selectedPair.bIdx+1}</span>
              <span style={{ ...mono10, color: "#f0c040", fontWeight: 700 }}>{(selectedPair.score*100).toFixed(1)}%</span>
            </div>
            <button onClick={() => setSelectedPair(null)} style={{
              ...mono9, background: "transparent", border: "1px solid #1e2230",
              color: "#3a4050", borderRadius: 3, padding: "2px 6px", cursor: "pointer",
            }}>{"\u2715"}</button>
          </div>
          <InterpretBtn
            i={selectedPair.aIdx} j={selectedPair.bIdx} score={selectedPair.score}
            chunkA={chunksA[selectedPair.aIdx]} chunkB={chunksB[selectedPair.bIdx]}
            interps={getInterps(interpretations, selectedPair.aIdx+"-"+selectedPair.bIdx)}
            currentLabel={currentLabel}
            customQueries={customQueries}
            readOnly={readOnly}
            pipelinesByLabel={pipelinesByLabel}
            onInterpret={onInterpret} onRemove={onRemove}
          />
        </div>
      )}
    </div>
  );
}

// ─── Group Query Bar: query a group of findings with the LLM ───
// ─── Group Query Bar: query a group of findings with the LLM ───
function GroupQueryBar({ groupKey, title, description, memberSummaries, groupInterps, onQuery, onClearGroupInterps, readOnly, pairData, onInterpretPair, customQueries }) {
  const [showPrompt, setShowPrompt] = useState(false);
  const [customPrompt, setCustomPrompt] = useState("");
  const [menuOpen, setMenuOpen] = useState(false);
  const [pairMenuOpen, setPairMenuOpen] = useState(false);
  const [batchRunning, setBatchRunning] = useState(false);
  const [batchDone, setBatchDone] = useState(0);
  const [maxMembers, setMaxMembers] = useState(30);
  const menuBtnRef = useRef(null);
  const pairBtnRef = useRef(null);
  const menuRef = useRef(null);
  const pairMenuRef = useRef(null);
  const [menuPos, setMenuPos] = useState(null);
  const [pairMenuPos, setPairMenuPos] = useState(null);
  const interps = groupInterps[groupKey] || [];
  const isLoading = interps.some(e => e.status === "loading");
  const doneCount = interps.filter(e => e.status === "done").length;
  const errorCount = interps.filter(e => e.status === "error").length;

  useEffect(() => {
    if (!menuOpen && !pairMenuOpen) return;
    const handler = (e) => {
      if (menuOpen && menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false);
      if (pairMenuOpen && pairMenuRef.current && !pairMenuRef.current.contains(e.target)) setPairMenuOpen(false);
    };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [menuOpen, pairMenuOpen]);

  useEffect(() => {
    if (menuOpen && menuBtnRef.current) {
      const rect = menuBtnRef.current.getBoundingClientRect();
      setMenuPos({ top: rect.bottom + 4, left: Math.max(8, rect.right - 280) });
    }
    if (pairMenuOpen && pairBtnRef.current) {
      const rect = pairBtnRef.current.getBoundingClientRect();
      setPairMenuPos({ top: rect.bottom + 4, left: Math.max(8, rect.right - 280) });
    }
  }, [menuOpen, pairMenuOpen]);

  const runBatchPairs = useCallback(async (queryObj) => {
    if (!pairData || !onInterpretPair || batchRunning) return;
    setBatchRunning(true); setBatchDone(0); setPairMenuOpen(false);
    for (let k = 0; k < pairData.length; k++) {
      const p = pairData[k];
      if (queryObj) await onInterpretPair(p.i, p.j, p.score, p.chunkA, p.chunkB, queryObj);
      else await onInterpretPair(p.i, p.j, p.score, p.chunkA, p.chunkB);
      setBatchDone(k + 1);
    }
    setBatchRunning(false);
  }, [pairData, onInterpretPair, batchRunning]);

  const limitedSummaries = memberSummaries.slice(0, maxMembers);
  const membersBlock = "\n\nMEMBERS (" + limitedSummaries.length + (limitedSummaries.length < memberSummaries.length ? " of " + memberSummaries.length : "") + "):\n" + limitedSummaries.map((m, idx) => "--- " + (idx+1) + " ---\n" + m).join("\n\n");

  function fireGroupQuery(promptIntro, label) {
    onQuery(groupKey, title, label, [promptIntro + membersBlock]);
    setMenuOpen(false);
  }

  const defaultSynthesis = "You are analyzing a group of findings from a document comparison.\n\nGROUP: " + title + "\nDESCRIPTION: " + description + "\n\nProvide a concise synthesis (3-6 sentences):\n1. What pattern connects these findings?\n2. What is the practical significance?\n3. Are there any outliers or surprises?\n\nBe direct and specific.";

  const menuItemStyle = { ...mono10, display: "block", width: "100%", textAlign: "left", background: "transparent", border: "none", padding: "5px 10px", cursor: "pointer", borderRadius: 3 };

  return (
    <div style={{ marginTop: 4 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 4, flexWrap: "wrap" }}>
        {!readOnly && (<>
          <button onClick={() => fireGroupQuery(defaultSynthesis, "Synthesis")}
            disabled={isLoading || memberSummaries.length === 0}
            style={{ ...mono9, fontWeight: 600, background: isLoading ? "#141822" : "#818cf818", border: "1px solid " + (isLoading ? "#1e2230" : "#818cf840"), borderRight: "none", color: isLoading ? "#4a5568" : "#818cf8", borderRadius: "3px 0 0 3px", padding: "3px 10px", cursor: isLoading ? "not-allowed" : "pointer" }}
          >{isLoading ? "\u27F3..." : "\u{1F9E0} Query (" + limitedSummaries.length + ")"}{doneCount > 0 && !isLoading && " \u00B7 " + doneCount}</button>
          <button ref={menuBtnRef} onClick={() => { setMenuOpen(!menuOpen); setPairMenuOpen(false); }} disabled={memberSummaries.length === 0}
            style={{ ...mono9, background: menuOpen ? "#818cf830" : "#818cf818", border: "1px solid " + (menuOpen ? "#818cf850" : "#818cf840"), color: "#818cf8", borderRadius: "0 3px 3px 0", padding: "3px 6px", cursor: "pointer" }}>{"\u25BE"}</button>
        </>)}
        {!readOnly && (
          <button onClick={() => setShowPrompt(!showPrompt)} style={{ ...mono9, background: "transparent", border: "1px solid #1e2230", color: showPrompt ? "#818cf8" : "#3a4050", borderRadius: 3, padding: "2px 6px", cursor: "pointer" }}>{"\u270E"}</button>
        )}
        {!readOnly && pairData && pairData.length > 0 && onInterpretPair && (<>
          <button onClick={() => runBatchPairs()} disabled={batchRunning}
            style={{ ...mono9, fontWeight: 600, background: batchRunning ? "#141822" : "#34d39918", border: "1px solid " + (batchRunning ? "#1e2230" : "#34d39940"), borderRight: "none", color: batchRunning ? "#4a5568" : "#34d399", borderRadius: "3px 0 0 3px", padding: "3px 10px", cursor: batchRunning ? "not-allowed" : "pointer" }}
          >{batchRunning ? "\u27F3 " + batchDone + "/" + pairData.length : "\u26A1 " + pairData.length + " pairs"}</button>
          <button ref={pairBtnRef} onClick={() => { setPairMenuOpen(!pairMenuOpen); setMenuOpen(false); }} disabled={batchRunning}
            style={{ ...mono9, background: pairMenuOpen ? "#34d39930" : "#34d39918", border: "1px solid " + (pairMenuOpen ? "#34d39950" : "#34d39940"), color: "#34d399", borderRadius: "0 3px 3px 0", padding: "3px 6px", cursor: "pointer" }}>{"\u25BE"}</button>
        </>)}
        {!readOnly && errorCount > 0 && onClearGroupInterps && (
          <button onClick={() => onClearGroupInterps(groupKey, "errors")} style={{ ...mono9, background: "#f8717110", border: "1px solid #f8717130", color: "#f87171", borderRadius: 3, padding: "2px 8px", cursor: "pointer" }}>{"\u2715"} {errorCount} error{errorCount === 1 ? "" : "s"}</button>
        )}
        {!readOnly && doneCount > 0 && onClearGroupInterps && (
          <button onClick={() => onClearGroupInterps(groupKey, "all")} style={{ ...mono9, background: "transparent", border: "1px solid #1e2230", color: "#3a4050", borderRadius: 3, padding: "2px 6px", cursor: "pointer" }}>{"\u2715"} clear {doneCount}</button>
        )}
        {memberSummaries.length > 10 && (
          <select value={maxMembers} onChange={e => setMaxMembers(Number(e.target.value))}
            style={{ ...mono9, background: "#141822", border: "1px solid #1e2230", color: "#4a5568", borderRadius: 3, padding: "2px 4px", cursor: "pointer" }}
            title="Max members sent to LLM per group query">
            <option value={10}>10</option><option value={20}>20</option><option value={30}>30</option><option value={50}>50</option><option value={100}>100</option><option value={9999}>all</option>
          </select>
        )}
      </div>
      {menuOpen && menuPos && (
        <div ref={menuRef} onClick={e => e.stopPropagation()} style={{ position: "fixed", top: menuPos.top, left: menuPos.left, zIndex: 9999, background: "#0c0e16", border: "1px solid #818cf830", borderRadius: 6, padding: 4, minWidth: 260, maxWidth: 340, boxShadow: "0 8px 24px rgba(0,0,0,0.6)" }}>
          <div style={{ ...mono9, color: "#3a4050", padding: "4px 8px", letterSpacing: 1 }}>GROUP SYNTHESIS</div>
          <button onClick={() => fireGroupQuery(defaultSynthesis, "Synthesis")} style={{ ...menuItemStyle, color: "#818cf8", fontWeight: 600 }}
            onMouseEnter={e => e.currentTarget.style.background = "#818cf818"} onMouseLeave={e => e.currentTarget.style.background = "transparent"}>{"\u{1F9E0}"} Default synthesis</button>
          {PROMPT_PRESETS.map(p => (
            <button key={p.label} onClick={() => fireGroupQuery("You are analyzing a group of document comparison findings.\nGROUP: " + title + "\n\nApply this analysis lens to the group:\n" + p.t, p.label)}
              style={{ ...menuItemStyle, color: "#9ca3af" }} onMouseEnter={e => e.currentTarget.style.background = "#818cf818"} onMouseLeave={e => e.currentTarget.style.background = "transparent"}>{"\u25B8"} {p.label}</button>
          ))}
          {customQueries && customQueries.length > 0 && (<>
            <div style={{ height: 1, background: "#1e2230", margin: "4px 8px" }} />
            <div style={{ ...mono9, color: "#34d399", padding: "4px 8px", letterSpacing: 1 }}>SAVED QUERIES</div>
            {customQueries.map(q => (
              <button key={q.id} onClick={() => fireGroupQuery("You are analyzing a group of document comparison findings.\nGROUP: " + title + "\n\n" + q.template, q.label)}
                style={{ ...menuItemStyle, color: "#9ca3af" }} onMouseEnter={e => e.currentTarget.style.background = "#34d39915"} onMouseLeave={e => e.currentTarget.style.background = "transparent"}>{"\u25B8"} {q.label}</button>
            ))}
          </>)}
          {showPrompt && customPrompt.trim() && (<>
            <div style={{ height: 1, background: "#1e2230", margin: "4px 8px" }} />
            <button onClick={() => fireGroupQuery(customPrompt, "Custom")} style={{ ...menuItemStyle, color: "#f59e42" }}
              onMouseEnter={e => e.currentTarget.style.background = "#f59e4215"} onMouseLeave={e => e.currentTarget.style.background = "transparent"}>{"\u270E"} Custom prompt</button>
          </>)}
        </div>
      )}
      {pairMenuOpen && pairMenuPos && pairData && (
        <div ref={pairMenuRef} onClick={e => e.stopPropagation()} style={{ position: "fixed", top: pairMenuPos.top, left: pairMenuPos.left, zIndex: 9999, background: "#0c0e16", border: "1px solid #34d39930", borderRadius: 6, padding: 4, minWidth: 260, maxWidth: 340, boxShadow: "0 8px 24px rgba(0,0,0,0.6)" }}>
          <div style={{ ...mono9, color: "#3a4050", padding: "4px 8px", letterSpacing: 1 }}>INTERPRET EACH PAIR WITH</div>
          <button onClick={() => runBatchPairs()} style={{ ...menuItemStyle, color: "#34d399", fontWeight: 600 }}
            onMouseEnter={e => e.currentTarget.style.background = "#34d39915"} onMouseLeave={e => e.currentTarget.style.background = "transparent"}>{"\u26A1"} Default query</button>
          {PROMPT_PRESETS.map(p => (
            <button key={p.label} onClick={() => runBatchPairs(p.t)} style={{ ...menuItemStyle, color: "#9ca3af" }}
              onMouseEnter={e => e.currentTarget.style.background = "#34d39910"} onMouseLeave={e => e.currentTarget.style.background = "transparent"}>{"\u25B8"} {p.label}</button>
          ))}
          {customQueries && customQueries.length > 0 && (<>
            <div style={{ height: 1, background: "#1e2230", margin: "4px 8px" }} />
            {customQueries.map(q => (
              <button key={q.id} onClick={() => runBatchPairs(q)} style={{ ...menuItemStyle, color: "#9ca3af" }}
                onMouseEnter={e => e.currentTarget.style.background = "#34d39910"} onMouseLeave={e => e.currentTarget.style.background = "transparent"}>{"\u25B8"} {q.label}</button>
            ))}
          </>)}
          {showPrompt && customPrompt.trim() && (<>
            <div style={{ height: 1, background: "#1e2230", margin: "4px 8px" }} />
            <button onClick={() => runBatchPairs(customPrompt)} style={{ ...menuItemStyle, color: "#f59e42" }}
              onMouseEnter={e => e.currentTarget.style.background = "#f59e4215"} onMouseLeave={e => e.currentTarget.style.background = "transparent"}>{"\u270E"} Custom prompt</button>
          </>)}
        </div>
      )}
      {showPrompt && (
        <textarea value={customPrompt} onChange={e => setCustomPrompt(e.target.value)}
          placeholder="Custom prompt (appears in both dropdowns when filled)..."
          rows={3} style={{ width: "100%", marginTop: 4, background: "#141822", border: "1px solid #818cf830", color: "#c8ccd4", borderRadius: 4, padding: "6px 8px", ...mono10, resize: "vertical", outline: "none" }}
        />
      )}
      {interps.filter(e => e.status === "done" || e.status === "error").map(e => (
        <div key={e.id} style={{ marginTop: 4, padding: "6px 10px", background: e.status === "error" ? "#f8717108" : "#818cf808", border: "1px solid " + (e.status === "error" ? "#f8717130" : "#818cf820"), borderRadius: 4, ...mono10, color: e.status === "error" ? "#f87171" : "#c8ccd4", lineHeight: 1.6, whiteSpace: "pre-wrap" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 2 }}>
            <span style={{ ...mono9, color: e.status === "error" ? "#f87171" : "#818cf8", fontWeight: 600 }}>
              {e.status === "error" ? "\u26A0 Error" : "\u{1F9E0} " + (e.label || "Analysis")}
            </span>
            {!readOnly && onClearGroupInterps && (
              <button onClick={() => onClearGroupInterps(groupKey, e.id)} style={{ ...mono9, fontSize: 8, background: "transparent", border: "1px solid #1e2230", color: "#3a4050", borderRadius: 3, padding: "1px 5px", cursor: "pointer" }}>{"\u2715"}</button>
            )}
          </div>
          {e.text}
        </div>
      ))}
    </div>
  );
}

// ─── Higher-Order Query Bar: meta-analysis across groups ───
function HigherOrderBar({ groupInterps, onQuery, readOnly }) {
  const groupResults = Object.entries(groupInterps)
    .filter(([k, v]) => k !== "__higher_order__" && v.some(e => e.status === "done"))
    .map(([k, v]) => {
      const done = v.filter(e => e.status === "done");
      return { title: k, text: done.map(e => e.text).join("\n") };
    });
  const higherResults = groupInterps["__higher_order__"] || [];
  const isLoading = higherResults.some(e => e.status === "loading");
  if (groupResults.length < 2 && higherResults.length === 0) return null;
  return (
    <div style={{
      background: "#0c0e16", border: "1px solid #a78bfa30", borderRadius: 8,
      padding: 12, marginBottom: 16,
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <span style={{ ...mono10, color: "#a78bfa", letterSpacing: 1, fontWeight: 600 }}>
          {"\u{1F52E}"} META-ANALYSIS
        </span>
        <span style={{ ...mono9, color: "#3a4050" }}>
          {groupResults.length} group{groupResults.length === 1 ? "" : "s"} with results
        </span>
        {!readOnly && groupResults.length >= 2 && (
          <button
            onClick={() => onQuery(groupResults)}
            disabled={isLoading}
            style={{
              ...mono9, fontWeight: 600,
              background: isLoading ? "#141822" : "#a78bfa18",
              border: "1px solid " + (isLoading ? "#1e2230" : "#a78bfa40"),
              color: isLoading ? "#4a5568" : "#a78bfa",
              borderRadius: 3, padding: "4px 12px", cursor: isLoading ? "not-allowed" : "pointer",
            }}
          >{isLoading ? "\u27F3 synthesizing..." : "\u{1F52E} Synthesize across groups"}</button>
        )}
      </div>
      {higherResults.filter(e => e.status === "done" || e.status === "error").map(e => (
        <div key={e.id} style={{
          marginTop: 8, padding: "10px 12px", background: e.status === "error" ? "#f8717108" : "#a78bfa08",
          border: "1px solid " + (e.status === "error" ? "#f8717130" : "#a78bfa20"),
          borderRadius: 4, ...mono10, color: e.status === "error" ? "#f87171" : "#c8ccd4",
          lineHeight: 1.6, whiteSpace: "pre-wrap",
        }}>
          <div style={{ ...mono9, color: e.status === "error" ? "#f87171" : "#a78bfa", marginBottom: 4, fontWeight: 600 }}>
            {e.status === "error" ? "\u26A0 Error" : "\u{1F52E} Meta-analysis"}
          </div>
          {e.text}
        </div>
      ))}
    </div>
  );
}

function ByIdView({ allIds, idMap, chunksA, chunksB, matrix, interpretations, nameA, nameB, onInterpret, onRemove, customQueries, readOnly, pipelinesByLabel, currentLabel, idAliases, nearMatches, onLink, onUnlink, groupInterps, onQueryGroup, onQueryHigherOrder, onClearGroupInterps }) {
  const [filter, setFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [expandedIds, setExpandedIds] = useState(new Set());
  const [changeThresh, setChangeThresh] = useState(0.85);
  const [linkingId, setLinkingId] = useState(null);
  const [expandedGroups, setExpandedGroups] = useState(new Set());
  const GROUP_PAGE_SIZE = 20;

  const toggleExpand = useCallback(id => {
    setExpandedIds(prev => {
      const n = new Set(prev);
      if (n.has(id)) n.delete(id); else n.add(id);
      return n;
    });
  }, []);

  // Categorize each ID
  const categorized = useMemo(() => {
    return allIds.map(id => {
      const e = idMap.get(id);
      const a = e.aIndices[0]; // primary index per side (multi-mapped IDs use first occurrence)
      const b = e.bIndices[0];
      const inA = e.aIndices.length > 0;
      const inB = e.bIndices.length > 0;
      let kind, score = null;
      if (inA && inB) {
        score = matrix && matrix[a] && matrix[a][b] != null ? matrix[a][b] : null;
        kind = score != null && score < changeThresh ? "changed" : "matched";
      } else if (inA) kind = "only-a";
      else kind = "only-b";
      return { id, e, a, b, inA, inB, score, kind };
    });
  }, [allIds, idMap, matrix, changeThresh]);

  const filtered = useMemo(() => {
    const q = search.toLowerCase().trim();
    return categorized.filter(row => {
      if (filter !== "all") {
        if (filter === "matched" && row.kind !== "matched") return false;
        if (filter === "changed" && row.kind !== "changed") return false;
        if (filter === "only-a" && row.kind !== "only-a") return false;
        if (filter === "only-b" && row.kind !== "only-b") return false;
      }
      if (q) {
        if (row.id.toLowerCase().includes(q)) return true;
        const aText = row.inA ? (chunksA[row.a] || "") : "";
        const bText = row.inB ? (chunksB[row.b] || "") : "";
        return aText.toLowerCase().includes(q) || bText.toLowerCase().includes(q);
      }
      return true;
    });
  }, [categorized, filter, search, chunksA, chunksB]);

  // Counts for filter pill display
  const counts = useMemo(() => {
    const c = { all: categorized.length, matched: 0, changed: 0, "only-a": 0, "only-b": 0 };
    categorized.forEach(r => { c[r.kind]++; });
    return c;
  }, [categorized]);

  const KIND_META = {
    matched: { color: "#34d399", icon: "\u2713", label: "matched" },
    changed: { color: "#f59e42", icon: "\u26A0", label: "changed" },
    "only-a": { color: "#60a5fa", icon: "\u2190", label: "only in " + (nameA || "A") },
    "only-b": { color: "#f59e42", icon: "\u2192", label: "only in " + (nameB || "B") },
  };

  return (
    <div>
      {/* Header strip */}
      <div style={{
        background: "#0c0e16", border: "1px solid #1e2230", borderRadius: 8,
        padding: 12, marginBottom: 16,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <div style={{ ...mono10, color: "#818cf8", letterSpacing: 1, fontWeight: 600 }}>
            {"\u{1F511}"} BY ID
          </div>
          <div style={{ ...mono9, color: "#3a4050", fontStyle: "italic" }}>
            Pairs chunks by extracted ID, not position. Detects added, removed, and changed content.
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
          {[
            { v: "all", l: "all" },
            { v: "matched", l: "matched" },
            { v: "changed", l: "changed" },
            { v: "only-a", l: "only " + (nameA || "A") },
            { v: "only-b", l: "only " + (nameB || "B") },
          ].map(opt => {
            const active = filter === opt.v;
            const meta = KIND_META[opt.v];
            const accent = meta ? meta.color : "#818cf8";
            return (
              <button key={opt.v} onClick={() => setFilter(opt.v)}
                style={{
                  ...mono9, background: active ? accent + "20" : "#141822",
                  border: "1px solid " + (active ? accent + "60" : "#1e2230"),
                  color: active ? accent : "#4a5568",
                  borderRadius: 3, padding: "3px 10px", cursor: "pointer",
                  fontWeight: active ? 600 : 400,
                }}>
                {opt.l} <span style={{ opacity: 0.6 }}>{counts[opt.v]}</span>
              </button>
            );
          })}
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Search ID or content..."
            style={{
              flex: 1, minWidth: 160,
              background: "#141822", border: "1px solid #1e2230",
              color: "#9ca3af", borderRadius: 4, padding: "4px 10px",
              fontFamily: "'JetBrains Mono', monospace", fontSize: 11, outline: "none",
            }}
          />
          <span style={{ ...mono9, color: "#3a4050" }}>change threshold</span>
          <input type="range" min="0" max="1" step="0.05" value={changeThresh}
            onChange={e => setChangeThresh(parseFloat(e.target.value))}
            style={{ width: 80 }}
          />
          <span style={{ ...mono10, color: "#f59e42", fontWeight: 600, minWidth: 40 }}>
            {(changeThresh * 100).toFixed(0)}%
          </span>
        </div>
      </div>

      <HigherOrderBar groupInterps={groupInterps || {}} onQuery={onQueryHigherOrder} readOnly={readOnly} />

      {/* List — grouped by kind with per-group query */}
      {filtered.length === 0 ? (
        <div style={{ ...mono10, color: "#3a4050", padding: 32, textAlign: "center", fontStyle: "italic" }}>
          No IDs match this filter.
        </div>
      ) : (() => {
        // Group filtered rows by kind, preserving order
        const kindOrder = ["matched", "changed", "only-a", "only-b"];
        const groups = kindOrder.map(kind => ({
          kind,
          meta: KIND_META[kind],
          rows: filtered.filter(r => r.kind === kind),
        })).filter(g => g.rows.length > 0);

        return groups.map(group => (
          <div key={group.kind} style={{ marginBottom: 16 }}>
            {/* Section header with query bar */}
            <div style={{
              display: "flex", alignItems: "center", gap: 8, marginBottom: 6, flexWrap: "wrap",
              padding: "4px 0",
            }}>
              <span style={{ ...mono10, color: group.meta.color, fontWeight: 700 }}>{group.meta.icon}</span>
              <span style={{ ...mono10, color: group.meta.color, fontWeight: 600, letterSpacing: 1, textTransform: "uppercase" }}>
                {group.meta.label}
              </span>
              <span style={{ ...mono9, color: "#3a4050" }}>{group.rows.length}</span>
              {onQueryGroup && (
                <GroupQueryBar
                  groupKey={"byid-" + group.kind}
                  title={group.meta.label + " (" + group.rows.length + ")"}
                  description={"Chunks " + group.meta.label + " in the BY ID comparison between " + (nameA || "A") + " and " + (nameB || "B")}
                  memberSummaries={group.rows.map(r => {
                    const aSnip = r.inA ? (chunksA[r.a] || "").slice(0, 400) : "(missing)";
                    const bSnip = r.inB ? (chunksB[r.b] || "").slice(0, 400) : "(missing)";
                    return "ID: " + r.id + (r.score != null ? " (" + (r.score * 100).toFixed(0) + "% sim)" : "") + "\nA: " + aSnip + "\nB: " + bSnip;
                  })}
                  groupInterps={groupInterps || {}}
                  onQuery={onQueryGroup}
                  readOnly={readOnly}
                  pairData={group.rows.filter(r => r.inA && r.inB).map(r => ({ i: r.a, j: r.b, score: r.score || 0, chunkA: chunksA[r.a] || "", chunkB: chunksB[r.b] || "" }))}
                  onInterpretPair={onInterpret}
                  customQueries={customQueries}
                  onClearGroupInterps={onClearGroupInterps}
                />
              )}
            </div>

            {(() => {
              const isGroupExpanded = expandedGroups.has(group.kind);
              const visibleRows = isGroupExpanded ? group.rows : group.rows.slice(0, GROUP_PAGE_SIZE);
              const hasMore = group.rows.length > GROUP_PAGE_SIZE && !isGroupExpanded;
              return (<>
              {visibleRows.map(row => {
              const meta = KIND_META[row.kind];
              const expanded = expandedIds.has(row.id);
              const aText = row.inA ? (chunksA[row.a] || "") : "";
              const bText = row.inB ? (chunksB[row.b] || "") : "";
              const pk = row.inA && row.inB ? row.a + "-" + row.b : null;
              return (
                <div key={row.id} style={{
                  marginBottom: 8, background: "#0c0e16",
                  border: "1px solid " + meta.color + "30", borderRadius: 6,
                  borderLeft: "3px solid " + meta.color, overflow: "hidden",
                }}>
                  <div onClick={() => toggleExpand(row.id)}
                    style={{
                      display: "flex", alignItems: "center", gap: 10, padding: "8px 12px",
                      cursor: "pointer", background: expanded ? meta.color + "08" : "transparent",
                      transition: "background 0.15s",
                    }}>
              <span style={{ ...mono11, color: "#e8ecf4", fontWeight: 600, fontFamily: "'JetBrains Mono', monospace" }}>{row.id}</span>
              <span style={{ ...mono9, color: meta.color, letterSpacing: 1, textTransform: "uppercase" }}>{meta.label}</span>
              {row.score != null && (
                <span style={{ ...mono10, color: row.score >= changeThresh ? "#34d399" : "#f59e42", fontWeight: 700 }}>
                  {(row.score * 100).toFixed(1)}%
                </span>
              )}
              {row.inA && (
                <span style={{ ...mono9, color: "#60a5fa", background: "#60a5fa12", padding: "1px 6px", borderRadius: 3 }}>
                  A{row.a + 1}
                </span>
              )}
              {row.inB && (
                <span style={{ ...mono9, color: "#f59e42", background: "#f59e4212", padding: "1px 6px", borderRadius: 3 }}>
                  B{row.b + 1}
                </span>
              )}
              {pk && <InterpretBadge interps={getInterps(interpretations, pk)} />}
              {/* Alias indicator */}
              {row.e.aliasedFrom && (
                <span style={{ ...mono9, color: "#a78bfa", background: "#a78bfa15", padding: "1px 6px", borderRadius: 3 }}>
                  {"\u{1F517}"} {row.e.aliasedFrom} {"\u2192"} {row.id}
                </span>
              )}
              {/* Unlink button for aliased rows */}
              {row.e.aliasedFrom && onUnlink && (
                <button onClick={e => { e.stopPropagation(); onUnlink(row.e.aliasedFrom); }} style={{
                  ...mono9, background: "#f8717115", border: "1px solid #f8717140",
                  color: "#f87171", borderRadius: 3, padding: "1px 6px", cursor: "pointer",
                }}>{"\u2715"}</button>
              )}
              {/* Near-match suggestion for unmatched rows */}
              {(row.kind === "only-a" || row.kind === "only-b") && nearMatches && (() => {
                const nm = row.kind === "only-a"
                  ? nearMatches.find(m => m.mapKey === row.id || m.aId === row.id)
                  : nearMatches.find(m => m.bId === row.id);
                if (!nm) return null;
                const targetId = row.kind === "only-a" ? nm.bId : nm.aId;
                return (
                  <button onClick={e => {
                    e.stopPropagation();
                    if (onLink) {
                      const aId = row.kind === "only-a" ? (row.e.aliasedFrom || row.id) : targetId;
                      const bId = row.kind === "only-a" ? targetId : row.id;
                      onLink(aId, bId);
                    }
                  }} title={"Link to \"" + targetId + "\" (" + Math.round(nm.sim * 100) + "% similar)"} style={{
                    ...mono9, background: "#34d39915", border: "1px solid #34d39940",
                    color: "#34d399", borderRadius: 3, padding: "1px 8px", cursor: "pointer",
                  }}>{"\u{1F517}"} {targetId} ({Math.round(nm.sim * 100)}%)</button>
                );
              })()}
              {/* Manual link button for unmatched A rows */}
              {row.kind === "only-a" && onLink && (
                <button onClick={e => { e.stopPropagation(); setLinkingId(linkingId === row.id ? null : row.id); }} style={{
                  ...mono9, background: linkingId === row.id ? "#a78bfa20" : "#141822",
                  border: "1px solid " + (linkingId === row.id ? "#a78bfa60" : "#1e2230"),
                  color: linkingId === row.id ? "#a78bfa" : "#4a5568",
                  borderRadius: 3, padding: "1px 6px", cursor: "pointer",
                }}>{linkingId === row.id ? "\u2715 cancel" : "\u{1F517}"}</button>
              )}
              <span style={{ ...mono9, color: "#4a5568", marginLeft: "auto" }}>
                {expanded ? "\u25BC" : "\u25B6"}
              </span>
            </div>
            {/* Manual link picker */}
            {linkingId === row.id && row.kind === "only-a" && (
              <div style={{ padding: "6px 12px", background: "#a78bfa08", borderTop: "1px solid #a78bfa20", display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                <span style={{ ...mono9, color: "#a78bfa" }}>Link "{row.id}" to:</span>
                {allIds.filter(id => { const e = idMap.get(id); return e && e.bIndices.length > 0 && e.aIndices.length === 0; }).map(bId => (
                  <button key={bId} onClick={() => { onLink(row.id, bId); setLinkingId(null); }} style={{
                    ...mono9, background: "#141822", border: "1px solid #f59e4240",
                    color: "#f59e42", borderRadius: 3, padding: "1px 8px", cursor: "pointer",
                  }}>{bId}</button>
                ))}
                {allIds.filter(id => { const e = idMap.get(id); return e && e.bIndices.length > 0 && e.aIndices.length === 0; }).length === 0 && (
                  <span style={{ ...mono9, color: "#3a4050", fontStyle: "italic" }}>No unmatched B-side IDs available</span>
                )}
              </div>
            )}
            {expanded && (
              <div style={{ borderTop: "1px solid #1e2230" }}>
                <div style={{ display: "flex", gap: 1, background: "#1e2230" }}>
                  <div style={{ flex: 1, minWidth: 0, padding: 10, background: "#0c0e16" }}>
                    <div style={{ ...mono9, color: "#60a5fa", marginBottom: 4, letterSpacing: 1 }}>
                      {nameA || "Document A"} {row.inA ? "\u00B7 A" + (row.a + 1) : "\u00B7 (missing)"}
                    </div>
                    {row.inA ? (
                      <ChunkContent text={aText} maxLen={500} fontSize={11} maxHeight={240} />
                    ) : (
                      <div style={{ ...mono10, color: "#3a4050", fontStyle: "italic", padding: 12 }}>
                        Not present in {nameA || "Document A"}
                      </div>
                    )}
                  </div>
                  <div style={{ flex: 1, minWidth: 0, padding: 10, background: "#0c0e16" }}>
                    <div style={{ ...mono9, color: "#f59e42", marginBottom: 4, letterSpacing: 1 }}>
                      {nameB || "Document B"} {row.inB ? "\u00B7 B" + (row.b + 1) : "\u00B7 (missing)"}
                    </div>
                    {row.inB ? (
                      <ChunkContent text={bText} maxLen={500} fontSize={11} maxHeight={240} />
                    ) : (
                      <div style={{ ...mono10, color: "#3a4050", fontStyle: "italic", padding: 12 }}>
                        Not present in {nameB || "Document B"}
                      </div>
                    )}
                  </div>
                </div>
                {pk && (
                  <div style={{ padding: "0 12px 8px" }}>
                    <InterpretBtn i={row.a} j={row.b} score={row.score || 0}
                      chunkA={aText} chunkB={bText}
                      interps={getInterps(interpretations, pk)}
                      currentLabel={currentLabel}
                      customQueries={customQueries}
                      readOnly={readOnly}
                      pipelinesByLabel={pipelinesByLabel}
                      onInterpret={onInterpret}
                      onRemove={onRemove}
                    />
                  </div>
                )}
                {(row.e.aIndices.length > 1 || row.e.bIndices.length > 1) && (
                  <div style={{ ...mono9, color: "#3a4050", padding: "4px 12px 8px", fontStyle: "italic" }}>
                    {row.e.aIndices.length > 1 && "ID maps to " + row.e.aIndices.length + " chunks in A: " + row.e.aIndices.map(x => "A" + (x+1)).join(", ") + ". "}
                    {row.e.bIndices.length > 1 && "ID maps to " + row.e.bIndices.length + " chunks in B: " + row.e.bIndices.map(x => "B" + (x+1)).join(", ") + "."}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
              {hasMore && (
                <button onClick={() => setExpandedGroups(prev => { const n = new Set(prev); n.add(group.kind); return n; })}
                  style={{ ...mono9, color: "#818cf8", background: "#818cf810", border: "1px solid #818cf830", borderRadius: 4, padding: "4px 12px", cursor: "pointer", width: "100%", marginBottom: 4 }}>
                  Show all {group.rows.length} ({group.rows.length - GROUP_PAGE_SIZE} more)
                </button>
              )}
              </>);
            })()}
          </div>
        ));
      })()}
    </div>
  );
}

function InterpretationView({ results, interpretations, onInterpret, onRemove, customQueries, readOnly, pipelinesByLabel, currentLabel, simThreshold, chunkIdsA, chunkIdsB, groupInterps, onQueryGroup, onQueryHigherOrder, onClearGroupInterps }) {
  const [expanded, setExpanded] = useState(new Set());
  const [search, setSearch] = useState("");
  const [scopeFilter, setScopeFilter] = useState("all"); // all | pair | chunkA | chunkB | chunk
  const [maxPerCat, setMaxPerCat] = useState(20);

  const cats = useMemo(() => categorizeChunks(results, { simThreshold: simThreshold || 0.3, chunkIdsA, chunkIdsB, nameA: results?.nameA, nameB: results?.nameB }), [results, simThreshold, chunkIdsA, chunkIdsB]);

  const toggle = useCallback(id => {
    setExpanded(prev => {
      const n = new Set(prev);
      if (n.has(id)) n.delete(id); else n.add(id);
      return n;
    });
  }, []);
  const expandAll = () => setExpanded(new Set(cats.map(c => c.id)));
  const collapseAll = () => setExpanded(new Set());

  const filteredCats = useMemo(() => {
    const q = search.toLowerCase().trim();
    return cats.filter(c => {
      if (scopeFilter === "pair" && c.kind !== "pair") return false;
      if (scopeFilter === "chunkA" && c.kind !== "chunkA") return false;
      if (scopeFilter === "chunkB" && c.kind !== "chunkB") return false;
      if (scopeFilter === "chunk" && c.kind !== "chunk") return false;
      if (q) {
        return (
          c.title.toLowerCase().includes(q) ||
          c.description.toLowerCase().includes(q) ||
          c.id.toLowerCase().includes(q)
        );
      }
      return true;
    });
  }, [cats, search, scopeFilter]);

  const totalMembers = cats.reduce((s, c) => s + (c.members?.length || 0), 0);

  const KIND_LABEL = { pair: "PAIR", chunkA: "CHUNK A", chunkB: "CHUNK B", chunk: "CHUNK" };

  // Member renderer — handles pair vs single-chunk uniformly
  function renderMember(cat, m, mi) {
    const idA = chunkIdsA && cat.kind === "pair" ? chunkIdsA[m.i] : null;
    const idB = chunkIdsB && cat.kind === "pair" ? chunkIdsB[m.j] : null;
    const sideId = cat.kind === "chunkA" || cat.kind === "chunkB" || cat.kind === "chunk"
      ? (cat.kind === "chunkA" ? chunkIdsA?.[m.idx] : chunkIdsB?.[m.idx])
      : null;

    const memberId = cat.id + "-m-" + mi;
    const isOpen = expanded.has(memberId);

    // Build a header label
    let header;
    if (cat.kind === "pair") {
      header = (
        <>
          <span style={{ ...mono10, color: "#60a5fa" }}>A{m.i + 1}{idA && <span style={{ color: "#60a5fa80", fontSize: 9 }}> [{idA}]</span>}</span>
          <span style={{ color: "#3a4050" }}>{"\u27F7"}</span>
          <span style={{ ...mono10, color: "#f59e42" }}>B{m.j + 1}{idB && <span style={{ color: "#f59e4280", fontSize: 9 }}> [{idB}]</span>}</span>
          {m.score != null && <span style={{ ...mono10, color: "#f0c040", fontWeight: 600 }}>{(m.score * 100).toFixed(0)}%</span>}
          {m._label && <span style={{ ...mono9, color: "#a78bfa" }}>{m._label}</span>}
        </>
      );
    } else if (cat.kind === "chunk" && m._label) {
      // Range label (block clusters)
      const sideColor = m.side === "A" ? "#60a5fa" : "#f59e42";
      header = <span style={{ ...mono10, color: sideColor }}>{m._label}</span>;
    } else {
      const sideColor = m.side === "A" ? "#60a5fa" : "#f59e42";
      header = (
        <>
          <span style={{ ...mono10, color: sideColor }}>{m.side}{m.idx + 1}{sideId && <span style={{ color: sideColor + "80", fontSize: 9 }}> [{sideId}]</span>}</span>
          {m.frac != null && <span style={{ ...mono9, color: "#f0c040" }}>{(m.frac * 100).toFixed(0)}% hot</span>}
          {m.bestScore != null && <span style={{ ...mono9, color: "#3a4050" }}>best match {(m.bestScore * 100).toFixed(0)}%</span>}
          {m.id && <span style={{ ...mono9, color: cat.color }}>id={m.id}</span>}
        </>
      );
    }

    // Pair-level interpretation status
    const pk = cat.kind === "pair" ? m.i + "-" + m.j : null;
    const interps = pk ? getInterps(interpretations, pk) : null;

    return (
      <div key={memberId} style={{
        background: "#0a0c12", borderLeft: "2px solid " + cat.color + "40",
        borderRadius: "0 4px 4px 0", marginBottom: 4, overflow: "hidden",
      }}>
        <div onClick={() => toggle(memberId)} style={{
          display: "flex", alignItems: "center", gap: 8, padding: "5px 8px",
          cursor: "pointer", flexWrap: "wrap",
        }}>
          {header}
          {interps && <InterpretBadge interps={interps} />}
          <span style={{ ...mono9, color: "#3a4050", marginLeft: "auto" }}>{isOpen ? "\u25BC" : "\u25B6"}</span>
        </div>
        {isOpen && (
          <div style={{ borderTop: "1px solid #1e2230", padding: 8 }}>
            {cat.kind === "pair" ? (
              <>
                <div style={{ display: "flex", gap: 1 }}>
                  <div style={{ flex: 1, minWidth: 0, padding: 8 }}>
                    <div style={{ ...mono9, color: "#60a5fa", marginBottom: 4 }}>A{m.i + 1}{idA && " [" + idA + "]"}</div>
                    <ChunkContent text={results.chunksA[m.i]} maxLen={400} fontSize={11} maxHeight={200} />
                  </div>
                  <div style={{ width: 1, background: "#1e2230" }} />
                  <div style={{ flex: 1, minWidth: 0, padding: 8 }}>
                    <div style={{ ...mono9, color: "#f59e42", marginBottom: 4 }}>B{m.j + 1}{idB && " [" + idB + "]"}</div>
                    <ChunkContent text={results.chunksB[m.j]} maxLen={400} fontSize={11} maxHeight={200} />
                  </div>
                </div>
                <div style={{ marginTop: 8 }}>
                  <InterpretBtn i={m.i} j={m.j} score={m.score || 0}
                    chunkA={results.chunksA[m.i]} chunkB={results.chunksB[m.j]}
                    interps={interps || []}
                    currentLabel={currentLabel}
                    customQueries={customQueries}
                    readOnly={readOnly}
                    pipelinesByLabel={pipelinesByLabel}
                    onInterpret={onInterpret}
                    onRemove={onRemove}
                  />
                </div>
              </>
            ) : cat.kind === "chunk" && m._range ? (
              // Block cluster — show all chunks in range stacked
              <div>
                {(() => {
                  const chunks = m.side === "A" ? results.chunksA : results.chunksB;
                  const sideColor = m.side === "A" ? "#60a5fa" : "#f59e42";
                  const out = [];
                  for (let k = m._range.start; k <= m._range.end; k++) {
                    out.push(
                      <div key={k} style={{ marginBottom: 8 }}>
                        <div style={{ ...mono9, color: sideColor, marginBottom: 4 }}>{m.side}{k + 1}</div>
                        <ChunkContent text={chunks[k]} maxLen={300} fontSize={11} maxHeight={120} />
                      </div>
                    );
                  }
                  return out;
                })()}
              </div>
            ) : (
              <div>
                <ChunkContent
                  text={(cat.kind === "chunkA" ? results.chunksA : results.chunksB)[m.idx]}
                  maxLen={500} fontSize={11} maxHeight={240}
                />
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      {/* Header strip */}
      <div style={{
        background: "#0c0e16", border: "1px solid #1e2230", borderRadius: 8,
        padding: 12, marginBottom: 16,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>
          <div style={{ ...mono10, color: "#a78bfa", letterSpacing: 1, fontWeight: 600 }}>
            {"\u{1F50D}"} INTERPRETATION
          </div>
          <div style={{ ...mono9, color: "#3a4050", fontStyle: "italic", flex: 1, minWidth: 200 }}>
            Chunks and pairs grouped by detected relationship category. A chunk can appear in multiple categories.
          </div>
          <div style={{ ...mono9, color: "#4a5568" }}>
            <span style={{ color: "#a78bfa", fontWeight: 600 }}>{cats.length}</span> categories {"\u00B7"}{" "}
            <span style={{ color: "#a78bfa", fontWeight: 600 }}>{totalMembers}</span> total members
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
          {[
            { v: "all", l: "all" },
            { v: "pair", l: "pairs" },
            { v: "chunkA", l: "chunks A" },
            { v: "chunkB", l: "chunks B" },
            { v: "chunk", l: "blocks" },
          ].map(opt => {
            const active = scopeFilter === opt.v;
            return (
              <button key={opt.v} onClick={() => setScopeFilter(opt.v)} style={{
                ...mono9, background: active ? "#a78bfa20" : "#141822",
                border: "1px solid " + (active ? "#a78bfa60" : "#1e2230"),
                color: active ? "#a78bfa" : "#4a5568",
                borderRadius: 3, padding: "3px 10px", cursor: "pointer",
                fontWeight: active ? 600 : 400,
              }}>{opt.l}</button>
            );
          })}
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Filter categories..."
            style={{
              flex: 1, minWidth: 140,
              background: "#141822", border: "1px solid #1e2230",
              color: "#9ca3af", borderRadius: 4, padding: "4px 10px",
              fontFamily: "'JetBrains Mono', monospace", fontSize: 11, outline: "none",
            }}
          />
          <button onClick={expandAll} style={{
            ...mono9, background: "transparent", border: "1px solid #1e2230",
            color: "#4a5568", borderRadius: 3, padding: "3px 8px", cursor: "pointer",
          }}>expand all</button>
          <button onClick={collapseAll} style={{
            ...mono9, background: "transparent", border: "1px solid #1e2230",
            color: "#4a5568", borderRadius: 3, padding: "3px 8px", cursor: "pointer",
          }}>collapse all</button>
          <span style={{ ...mono9, color: "#3a4050" }}>show</span>
          <select value={maxPerCat} onChange={e => setMaxPerCat(parseInt(e.target.value, 10))}
            style={{
              background: "#141822", border: "1px solid #1e2230",
              color: "#9ca3af", borderRadius: 3, padding: "3px 8px",
              fontFamily: "'JetBrains Mono', monospace", fontSize: 10,
              outline: "none", cursor: "pointer",
            }}>
            <option value={10}>top 10</option>
            <option value={20}>top 20</option>
            <option value={50}>top 50</option>
            <option value={9999}>all</option>
          </select>
        </div>
      </div>

      <HigherOrderBar groupInterps={groupInterps || {}} onQuery={onQueryHigherOrder} readOnly={readOnly} />

      {filteredCats.length === 0 ? (
        <div style={{ ...mono10, color: "#3a4050", padding: 32, textAlign: "center", fontStyle: "italic" }}>
          No categories match this filter.
        </div>
      ) : filteredCats.map(cat => {
        const isOpen = expanded.has(cat.id);
        const shown = (cat.members || []).slice(0, maxPerCat);
        const more = (cat.members?.length || 0) - shown.length;
        return (
          <div key={cat.id} style={{
            background: "#0c0e16", border: "1px solid " + cat.color + "30",
            borderLeft: "3px solid " + cat.color, borderRadius: 6,
            marginBottom: 10, overflow: "hidden",
          }}>
            <div onClick={() => toggle(cat.id)} style={{
              display: "flex", alignItems: "center", gap: 10, padding: "10px 14px",
              cursor: "pointer", background: isOpen ? cat.color + "08" : "transparent",
            }}>
              <span style={{ ...mono10, color: cat.color, fontWeight: 700, minWidth: 20 }}>{cat.icon}</span>
              <span style={{ ...mono11, color: cat.color, fontWeight: 600 }}>{cat.title}</span>
              <span style={{
                ...mono9, color: cat.color, background: cat.color + "15",
                padding: "1px 7px", borderRadius: 10, fontWeight: 600,
              }}>{cat.members?.length || 0}</span>
              <span style={{
                ...mono9, color: "#3a4050", background: "#141822",
                padding: "1px 6px", borderRadius: 3, letterSpacing: 1,
              }}>{KIND_LABEL[cat.kind] || cat.kind}</span>
              <span style={{ ...mono9, color: "#3a4050", marginLeft: "auto" }}>{isOpen ? "\u25BC" : "\u25B6"}</span>
            </div>
            {isOpen && (
              <div style={{ padding: 12, borderTop: "1px solid #1e2230" }}>
                <div style={{
                  fontFamily: "'IBM Plex Serif', serif", fontSize: 12,
                  color: "#9ca3af", lineHeight: 1.55, marginBottom: 10,
                }}>
                  {cat.description}
                </div>
                {onQueryGroup && (
                  <GroupQueryBar
                    groupKey={"interp-" + cat.id}
                    title={cat.title + " (" + (cat.members?.length || 0) + ")"}
                    description={cat.description}
                    memberSummaries={(cat.members || []).slice(0, 30).map(m => {
                      if (cat.kind === "pair") {
                        const aSnip = (results.chunksA[m.i] || "").slice(0, 300);
                        const bSnip = (results.chunksB[m.j] || "").slice(0, 300);
                        return "A" + (m.i+1) + " \u2194 B" + (m.j+1) + " (" + (m.score*100).toFixed(0) + "%)\nA: " + aSnip + "\nB: " + bSnip;
                      } else if (cat.kind === "chunkA") {
                        return "A" + (m.idx+1) + ": " + (results.chunksA[m.idx] || "").slice(0, 400);
                      } else if (cat.kind === "chunkB") {
                        return "B" + (m.idx+1) + ": " + (results.chunksB[m.idx] || "").slice(0, 400);
                      } else if (cat.kind === "blockA" || cat.kind === "blockB") {
                        return cat.title + " [" + m.start + "-" + m.end + "]: " + (m.label || "");
                      }
                      return JSON.stringify(m).slice(0, 300);
                    })}
                    groupInterps={groupInterps || {}}
                    onQuery={onQueryGroup}
                    readOnly={readOnly}
                    pairData={cat.kind === "pair" ? (cat.members || []).map(m => ({ i: m.i, j: m.j, score: m.score || 0, chunkA: results.chunksA[m.i] || "", chunkB: results.chunksB[m.j] || "" })) : null}
                    onInterpretPair={onInterpret}
                    customQueries={customQueries}
                    onClearGroupInterps={onClearGroupInterps}
                  />
                )}
                {shown.map((m, mi) => renderMember(cat, m, mi))}
                {more > 0 && (
                  <div style={{ ...mono9, color: "#3a4050", fontStyle: "italic", padding: 6, textAlign: "center" }}>
                    {more} more not shown — increase the per-category limit above to see them
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}
