<script type="text/babel">
const { useState, useCallback, useMemo, useRef, useEffect } = React;

// ═══════════════════════════════════════════════════════════════
// NLP UTILITIES
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
// THEMES — brand customization (name, tagline, palette mode)
// ═══════════════════════════════════════════════════════════════

// ─── Theme system ──────────────────────────────────────────────────
// A theme is defined by a *palette*: a mapping from canonical "tuo-dark" hex
// codes to the colors used by this theme. Palettes are applied via injected
// CSS that uses [style*=] attribute selectors to override inline styles.
//
// Why palettes (not CSS variables): the codebase uses literal hex codes in
// React inline styles (e.g. `style={{ color: "#60a5fa" }}`). Refactoring all
// of them to var(--accent) would touch thousands of lines. Palette remapping
// is a non-invasive way to retheme.

// Canonical color tokens (the colors used everywhere in the dark theme)

// Quick estimate of token count without full tokenization.
// English averages ~4.5 chars per token; CSV/structured slightly less.
function estimateTokenCount(text) {
  if (!text) return 0;
  const looksCSV = text.indexOf(",") !== -1 && text.split("\n").length > 3;
  return Math.ceil(text.length / (looksCSV ? 4.0 : 4.5));
}

// Estimate chunk count without actually chunking
function estimateChunkCount(text, mode) {
  if (!text || !text.trim()) return 0;
  // XML tag mode
  if (typeof mode === "string" && mode.startsWith("tag:")) {
    const tagName = mode.slice(4);
    if (!tagName) return 0;
    const re = new RegExp("<" + tagName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\s|>|/>)", "gi");
    const matches = text.match(re);
    return matches ? matches.length : 0;
  }
  // XML section mode — count occurrences of the section tag
  if (typeof mode === "string" && mode.startsWith("section:")) {
    const tagName = mode.slice(8);
    if (!tagName) return 0;
    const re = new RegExp("<" + tagName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\s|>)", "gi");
    const matches = text.match(re);
    // +1 for preamble before first heading (may or may not exist)
    return matches ? matches.length + 1 : 1;
  }
  const tokens = estimateTokenCount(text);
  if (mode === "row") {
    if (text.indexOf(",") !== -1 && text.split("\n").length > 3) {
      return Math.max(1, text.split(/\r?\n/).filter(l => l.trim()).length - 1);
    }
    return Math.max(1, Math.ceil(tokens / 20));
  }
  if (mode === "sentence") return chunkBySentence(text).length;
  if (mode === "paragraph") return chunkByParagraph(text).length;
  if (mode === "page") return chunkByPage(text).length;
  const target = parseInt(mode, 10) || 512;
  return Math.max(1, Math.ceil(tokens / target));
}

function tokenize(text) {
  return text.toLowerCase().replace(/[^a-z0-9\s'-]/g, " ").split(/\s+/).filter(t => t.length > 1);
}

const STOP_WORDS = new Set([
  "the","be","to","of","and","a","in","that","have","i","it","for","not","on",
  "with","he","as","you","do","at","this","but","his","by","from","they","we",
  "say","her","she","or","an","will","my","one","all","would","there","their",
  "what","so","up","out","if","about","who","get","which","go","me","when",
  "make","can","like","time","no","just","him","know","take","people","into",
  "year","your","good","some","could","them","see","other","than","then","now",
  "look","only","come","its","over","think","also","back","after","use","two",
  "how","our","work","first","well","way","even","new","want","because","any",
  "these","give","day","most","us","is","was","are","were","been","has","had",
  "did","does","am","being","more","very","much","such","own","same","should",
]);

function removeStopWords(tokens) { return tokens.filter(t => !STOP_WORDS.has(t)); }

function splitSentences(text) {
  const raw = text.match(/[^.!?\n]+[.!?\n]*/g) || [text];
  return raw.map(s => s.trim()).filter(s => s.length > 0);
}

function chunkBySentence(text) {
  // For HTML/XML content, strip tags first for sentence detection but keep originals
  if (isXML(text)) {
    const plain = text.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
    const sents = splitSentences(plain);
    return sents.length >= 2 ? sents : [text];
  }
  const sents = splitSentences(text);
  return sents.length >= 2 ? sents : [text];
}

function chunkByParagraph(text) {
  // For HTML/XML content (.docx output), split on </p> boundaries
  if (isXML(text)) {
    const parts = text.split(/<\/p>/i)
      .map(p => {
        const t = p.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
        return t;
      })
      .filter(t => t.length > 0);
    return parts.length >= 2 ? parts : [text];
  }
  // Plain text: split on blank lines
  const parts = text.split(/\n\s*\n/)
    .map(p => p.trim())
    .filter(p => p.length > 0);
  return parts.length >= 2 ? parts : [text];
}

function chunkByPage(text) {
  // If form-feeds exist, split on them
  if (text.includes("\f")) {
    const parts = text.split("\f").map(p => p.trim()).filter(p => p.length > 0);
    if (parts.length >= 2) return parts;
  }
  // Estimate: ~3000 chars per page, split at paragraph boundaries near that mark
  const pageSize = 3000;
  const paragraphs = chunkByParagraph(text);
  const pages = [];
  let current = [];
  let currentLen = 0;
  for (const p of paragraphs) {
    if (currentLen > 0 && currentLen + p.length > pageSize) {
      pages.push(current.join("\n\n"));
      current = [p];
      currentLen = p.length;
    } else {
      current.push(p);
      currentLen += p.length;
    }
  }
  if (current.length > 0) pages.push(current.join("\n\n"));
  return pages.length >= 2 ? pages : [text];
}

// ═══════════════════════════════════════════════════════════════
// CSV-AWARE CHUNKING
// ═══════════════════════════════════════════════════════════════

function parseCSVLines(text) {
  // Splits text into logical CSV rows, respecting quoted fields
  // that may contain newlines, commas, and escaped quotes ("")
  const rows = [];
  let current = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && i + 1 < text.length && text[i + 1] === '"') { current += '""'; i++; }
      else { inQuotes = !inQuotes; current += ch; }
    } else if ((ch === "\n" || ch === "\r") && !inQuotes) {
      if (ch === "\r" && i + 1 < text.length && text[i + 1] === "\n") i++;
      if (current.trim().length > 0) rows.push(current);
      current = "";
    } else { current += ch; }
  }
  if (current.trim().length > 0) rows.push(current);
  return rows;
}

function parseCSVCells(row, delim) {
  // Splits a single logical CSV row into cells, respecting quotes
  const cells = [];
  let current = "", inQ = false;
  for (let i = 0; i < row.length; i++) {
    const ch = row[i];
    if (ch === '"') {
      if (inQ && i + 1 < row.length && row[i + 1] === '"') { current += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === delim && !inQ) {
      cells.push(current); current = "";
    } else { current += ch; }
  }
  cells.push(current);
  return cells;
}

function detectDelimiter(headerRow) {
  // Count unquoted commas vs tabs to determine delimiter
  let commas = 0, tabs = 0, inQ = false;
  for (let i = 0; i < headerRow.length; i++) {
    const ch = headerRow[i];
    if (ch === '"') inQ = !inQ;
    else if (!inQ) {
      if (ch === ',') commas++;
      if (ch === '\t') tabs++;
    }
  }
  return tabs > commas ? "\t" : ",";
}

function isCSV(text) {
  // Use quote-aware row parser for detection
  const rows = parseCSVLines(text);
  if (rows.length < 3) return false;
  const delim = detectDelimiter(rows[0]);
  const headerCols = parseCSVCells(rows[0], delim).length;
  if (headerCols < 2) return false;
  let consistent = 0;
  for (let i = 1; i < Math.min(rows.length, 8); i++) {
    const cols = parseCSVCells(rows[i], delim).length;
    if (Math.abs(cols - headerCols) <= 1) consistent++;
  }
  return consistent >= Math.min(rows.length - 1, 4);
}

// ─── XML detection and parsing ───
function isXML(text) {
  if (!text) return false;
  const t = text.trim();
  if (!t) return false;
  // Cheap signal: must start with `<` and contain a closing tag of some kind
  if (t[0] !== "<") return false;
  if (t.indexOf("<" + "/") === -1 && t.indexOf("/>") === -1) return false;
  // Strip XML/HTML declaration and comments before parser test
  const stripped = t
    .replace(/^\s*<\?xml[^?]*\?>\s*/i, "")
    .replace(new RegExp("<" + "!--" + "[\\s\\S]*?" + "--" + ">", "g"), "")
    .replace(/<!DOCTYPE[\s\S]*?>/gi, "")
    .trim();
  if (!stripped || stripped[0] !== "<") return false;
  try {
    const parser = new DOMParser();
    // Try strict XML first
    const doc = parser.parseFromString(t, "application/xml");
    if (!doc.querySelector("parsererror")) return true;
    // Fall back to text/html (tolerates loose markup like HTML fragments)
    const htmlDoc = parser.parseFromString("<root>" + stripped + "<" + "/root>", "text/html");
    return htmlDoc && htmlDoc.body && htmlDoc.body.firstElementChild != null;
  } catch (e) {
    return false;
  }
}

// Parse XML text and return a Document. Falls back to lenient HTML parsing
// for non-strict input (e.g. unclosed tags, bare HTML fragments).
function parseXMLText(text) {
  const parser = new DOMParser();
  let doc = parser.parseFromString(text, "application/xml");
  if (doc.querySelector("parsererror")) {
    // Wrap in <tuo-root> so a bare fragment with multiple top-level tags parses
    const wrapped = "<tuo-root>" + text + "<" + "/tuo-root>";
    doc = parser.parseFromString(wrapped, "text/html");
  }
  return doc;
}

// Find the root element to walk (skipping html/body wrappers if present)
function getXMLRoot(doc) {
  const docEl = doc.documentElement;
  if (!docEl) return null;
  // text/html parsing wraps everything in <html><body>...</body></html>
  if (docEl.nodeName.toLowerCase() === "html") {
    const body = docEl.querySelector("body");
    if (body) {
      // If body has a single tuo-root wrapper we added, drill into it
      const tr = body.querySelector("tuo-root");
      return tr || body;
    }
  }
  return docEl;
}

// Collect all distinct tag names present in an XML doc, ranked by frequency.
// Useful for populating the chunk-by-tag and id-tag pickers.
function collectXMLTagNames(text) {
  if (!text) return [];
  let doc;
  try { doc = parseXMLText(text); } catch (e) { return []; }
  const root = getXMLRoot(doc);
  if (!root) return [];
  const counts = new Map();
  const walk = (el) => {
    if (!el || el.nodeType !== 1) return;
    const name = el.nodeName;
    if (name && name.toLowerCase() !== "tuo-root" && name.toLowerCase() !== "body" && name.toLowerCase() !== "html") {
      counts.set(name, (counts.get(name) || 0) + 1);
    }
    for (let c = el.firstElementChild; c; c = c.nextElementSibling) walk(c);
  };
  walk(root);
  return Array.from(counts.entries())
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => b.count - a.count);
}

// Serialize an element back to its source-form string
function serializeXMLElement(el) {
  if (!el) return "";
  try {
    return new XMLSerializer().serializeToString(el);
  } catch (e) {
    return el.outerHTML || "";
  }
}

// Chunk an XML document by collecting all elements matching the given tag name.
// Returns one chunk per matching element (full outerHTML).
function chunkByXMLTag(text, tagName) {
  if (!text || !tagName) return [text];
  let doc;
  try { doc = parseXMLText(text); } catch (e) { return [text]; }
  const root = getXMLRoot(doc);
  if (!root) return [text];
  const elements = [];
  const walk = (el) => {
    if (!el || el.nodeType !== 1) return;
    if (el.nodeName === tagName || el.nodeName.toLowerCase() === tagName.toLowerCase()) {
      elements.push(el);
      return;
    }
    for (let c = el.firstElementChild; c; c = c.nextElementSibling) walk(c);
  };
  walk(root);
  if (elements.length === 0) return [text];
  return elements.map(el => serializeXMLElement(el));
}

// Section-based chunking: split at each occurrence of a heading/section tag,
// collecting all content between occurrences into one chunk.
// E.g. section:h2 splits a Word doc into sections, each starting with an <h2>.
// The heading is included in the chunk so extractXMLId can read it naturally.
function chunkByXMLSection(text, sectionTag) {
  if (!text || !sectionTag) return [text];
  let doc;
  try { doc = parseXMLText(text); } catch (e) { return [text]; }
  const root = getXMLRoot(doc);
  if (!root) return [text];

  // Walk top-level children; split at each occurrence of sectionTag
  const chunks = [];
  let current = [];
  const tagLower = sectionTag.toLowerCase();

  for (let c = root.firstChild; c; c = c.nextSibling) {
    if (c.nodeType === 1 && c.nodeName.toLowerCase() === tagLower) {
      // Flush accumulated content as a chunk (preamble before first heading)
      if (current.length > 0) {
        const joined = current.join("");
        if (joined.trim()) chunks.push(joined);
      }
      current = [serializeXMLElement(c)];
    } else if (c.nodeType === 1) {
      current.push(serializeXMLElement(c));
    } else if (c.nodeType === 3 && c.textContent.trim()) {
      current.push(c.textContent);
    }
  }
  // Flush last section
  if (current.length > 0) {
    const joined = current.join("");
    if (joined.trim()) chunks.push(joined);
  }

  return chunks.length > 0 ? chunks : [text];
}

// Extract the nearest heading from an XML/HTML chunk.
// Searches for h1-h6 inside the chunk text. Returns the text of the first one found.
// Heading priority: h1 > h2 > h3 > h4 > h5 > h6 (first in document order).
function extractNearestHeading(chunkText) {
  if (!chunkText) return null;
  let doc;
  try { doc = parseXMLText(chunkText); } catch (e) { return null; }
  const root = getXMLRoot(doc);
  if (!root) return null;

  // Walk in document order, find the first h1-h6
  const walk = (el) => {
    if (!el || el.nodeType !== 1) return null;
    const name = el.nodeName.toLowerCase();
    if (/^h[1-6]$/.test(name)) return (el.textContent || "").trim();
    for (let c = el.firstElementChild; c; c = c.nextElementSibling) {
      const found = walk(c);
      if (found) return found;
    }
    return null;
  };
  return walk(root);
}

// Extract an ID from an XML chunk by reading a child tag's text content
// (or an attribute value). idTag may be:
//   - "tagname"           — read the text content of the first matching child
//   - "tagname@attrname"  — read the attribute value from the first matching child
//   - "@attrname"         — read the attribute from the chunk's root element
function extractXMLId(chunkText, idTag) {
  if (!chunkText || !idTag) return null;
  let doc;
  try { doc = parseXMLText(chunkText); } catch (e) { return null; }
  const root = getXMLRoot(doc);
  if (!root) return null;
  // Resolve to the actual chunk's root element (skip wrapper)
  let chunkRoot = root;
  // If we wrapped in tuo-root and it has only one child, use that child
  if (chunkRoot.nodeName.toLowerCase() === "tuo-root" || chunkRoot.nodeName.toLowerCase() === "body") {
    if (chunkRoot.firstElementChild && !chunkRoot.firstElementChild.nextElementSibling) {
      chunkRoot = chunkRoot.firstElementChild;
    }
  }
  // Parse the rule
  const m = idTag.match(/^([^@]*)(?:@(.+))?$/);
  if (!m) return null;
  const tag = (m[1] || "").trim();
  const attr = (m[2] || "").trim();
  if (!tag && attr) {
    // Attribute on the chunk's root element
    const v = chunkRoot.getAttribute(attr);
    return v ? v.trim() : null;
  }
  if (!tag) return null;
  // Search descendants (and the root itself) for the first matching tag
  let target = null;
  const walk = (el) => {
    if (target || !el || el.nodeType !== 1) return;
    if (el.nodeName === tag || el.nodeName.toLowerCase() === tag.toLowerCase()) {
      target = el; return;
    }
    for (let c = el.firstElementChild; c; c = c.nextElementSibling) {
      walk(c);
      if (target) return;
    }
  };
  walk(chunkRoot);
  if (!target) return null;
  if (attr) {
    const v = target.getAttribute(attr);
    return v ? v.trim() : null;
  }
  // Text content of the first matching tag
  const txt = target.textContent || "";
  return txt.trim() || null;
}

function chunkCSV(text, targetTokens) {
  const rows = parseCSVLines(text);
  if (rows.length < 2) return [text];

  const header = rows[0];
  const headerTok = tokenize(header).length;
  const dataRows = rows.slice(1);
  const chunks = [];
  let curRows = [];
  let curTok = headerTok; // header always counted toward budget

  for (const row of dataRows) {
    const rowTok = tokenize(row).length;

    // Would adding this row exceed the budget?
    if (curTok + rowTok > targetTokens && curRows.length > 0) {
      // Flush current batch: header + accumulated rows = valid CSV
      chunks.push(header + "\n" + curRows.join("\n"));
      curRows = [];
      curTok = headerTok;
    }

    // Append the whole row (never split mid-row)
    curRows.push(row);
    curTok += rowTok;
  }

  // Flush remaining rows
  if (curRows.length > 0) {
    chunks.push(header + "\n" + curRows.join("\n"));
  }

  return chunks.length > 0 ? chunks : [text];
}

function chunkText(text, targetTokens, overlap) {
  const sentences = splitSentences(text);
  const chunks = [];
  let current = [], currentLen = 0;
  for (const sentence of sentences) {
    const stk = tokenize(sentence).length;
    if (currentLen + stk > targetTokens && current.length > 0) {
      chunks.push(current.join(" "));
      let oLen = 0, oStart = current.length;
      for (let i = current.length - 1; i >= 0; i--) {
        oLen += tokenize(current[i]).length;
        if (oLen >= overlap) { oStart = i; break; }
      }
      current = current.slice(oStart);
      currentLen = current.reduce((a, s) => a + tokenize(s).length, 0);
    }
    current.push(sentence); currentLen += stk;
  }
  if (current.length > 0) chunks.push(current.join(" "));
  return chunks;
}

function chunkDocument(text, mode = "512") {
  // XML tag mode: "tag:elementname"
  if (typeof mode === "string" && mode.startsWith("tag:")) {
    const tagName = mode.slice(4);
    if (tagName) return chunkByXMLTag(text, tagName);
    return [text];
  }
  // XML section mode: "section:headingtag" — split at each heading, content grouped under it
  if (typeof mode === "string" && mode.startsWith("section:")) {
    const tagName = mode.slice(8);
    if (tagName) return chunkByXMLSection(text, tagName);
    return [text];
  }
  if (mode === "row") {
    if (isCSV(text)) return chunkByRow(text);
    var sents = splitSentences(text);
    return sents.length >= 2 ? sents : [text];
  }
  if (mode === "sentence") return chunkBySentence(text);
  if (mode === "paragraph") return chunkByParagraph(text);
  if (mode === "page") return chunkByPage(text);
  const targetTokens = parseInt(mode, 10) || 512;
  const overlap = Math.floor(targetTokens * 0.12);
  return isCSV(text) ? chunkCSV(text, targetTokens) : chunkText(text, targetTokens, overlap);
}

// ─── Chunk ID extraction ───
// Extract a stable identifier from each chunk to enable cross-doc comparison
// of "the same logical thing" rather than positional alignment.
//
// idRule: { kind: "none" | "regex" | "column", value: string }
//   - "none": no extraction; returns nulls
//   - "regex": apply pattern to each chunk's text; first capture group (or full match) becomes the ID
//   - "column": only meaningful for CSV chunks; pulls a value from the named/indexed column
//     (CSV chunks contain header + data rows; ID is taken from the first data row's column)
function extractChunkIds(chunks, fullText, idRule) {
  if (!idRule || idRule.kind === "none" || !chunks || chunks.length === 0) return null;
  const out = new Array(chunks.length).fill(null);
  if (idRule.kind === "regex") {
    if (!idRule.value) return out;
    let re;
    try { re = new RegExp(idRule.value); }
    catch (e) { return out; }
    for (let i = 0; i < chunks.length; i++) {
      const m = (chunks[i] || "").match(re);
      if (m) out[i] = (m[1] != null ? m[1] : m[0]).trim();
    }
    return out;
  }
  if (idRule.kind === "column") {
    if (!fullText || !isCSV(fullText) || !idRule.value) return out;
    // Determine column index from header
    const allRows = parseCSVLines(fullText);
    if (allRows.length < 1) return out;
    const delim = detectDelimiter(allRows[0]);
    const headerCells = parseCSVCells(allRows[0], delim).map(h => h.replace(/^"|"$/g, ""));
    let colIdx = -1;
    if (/^\d+$/.test(idRule.value)) {
      colIdx = parseInt(idRule.value, 10);
    } else {
      const target = idRule.value.toLowerCase();
      colIdx = headerCells.findIndex(h => h.toLowerCase() === target);
    }
    if (colIdx < 0) return out;
    // For each chunk, parse it as CSV and read the first data row's column value
    for (let i = 0; i < chunks.length; i++) {
      const rows = (chunks[i] || "").split(/\r?\n/).filter(r => r.trim());
      if (rows.length < 2) continue;
      // The first row is a header (chunkCSV repeats it per chunk); data starts at row 1
      const cells = parseCSVCells(rows[1], delim);
      if (cells[colIdx] != null) out[i] = cells[colIdx].replace(/^"|"$/g, "").trim();
    }
    return out;
  }
  if (idRule.kind === "xml-tag") {
    if (!idRule.value) return out;
    for (let i = 0; i < chunks.length; i++) {
      out[i] = extractXMLId(chunks[i] || "", idRule.value);
    }
    return out;
  }
  if (idRule.kind === "heading") {
    // Extract the first h1-h6 heading text from each chunk.
    // Works with section-mode chunks from .docx where each chunk starts with a heading.
    for (let i = 0; i < chunks.length; i++) {
      out[i] = extractNearestHeading(chunks[i] || "");
    }
    return out;
  }
  return out;
}

// One chunk per CSV row (header prepended to each)
function chunkByRow(text) {
  const rows = parseCSVLines(text);
  if (rows.length < 2) return [text];
  const header = rows[0];
  return rows.slice(1).map(r => header + "\n" + r);
}

// One chunk per paragraph (split on blank lines / double newlines)
// Single-line paragraph split for text that uses single newlines as structure
// ═══════════════════════════════════════════════════════════════
// TF-IDF + COSINE SIMILARITY
// ═══════════════════════════════════════════════════════════════

function buildVocabulary(allChunks) {
  const df = {}, N = allChunks.length;
  allChunks.forEach(chunk => {
    new Set(removeStopWords(tokenize(chunk))).forEach(t => { df[t] = (df[t] || 0) + 1; });
  });
  const vocab = Object.keys(df).filter(t => df[t] > 1 && df[t] < N * 0.85);
  const idf = {};
  vocab.forEach(t => { idf[t] = Math.log(N / df[t]) + 1; });
  return { vocab, idf };
}

function tfidfVector(chunk, vocab, idf) {
  const tokens = removeStopWords(tokenize(chunk));
  const tf = {};
  tokens.forEach(t => { tf[t] = (tf[t] || 0) + 1; });
  const maxTf = Math.max(...Object.values(tf), 1);
  const vec = new Float64Array(vocab.length);
  vocab.forEach((t, i) => { if (tf[t]) vec[i] = (0.5 + 0.5 * tf[t] / maxTf) * (idf[t] || 0); });
  return vec;
}

function cosineSimilarity(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
  const d = Math.sqrt(na) * Math.sqrt(nb);
  return d === 0 ? 0 : dot / d;
}

// ═══════════════════════════════════════════════════════════════

const DEFAULT_PROMPT_TEMPLATE = "You are a document analyst. Two text segments from different documents have a {{SCORE}}% lexical similarity score.\n\nSEGMENT A:\n\"\"\"\n{{CHUNK_A}}\n\"\"\"\n\nSEGMENT B:\n\"\"\"\n{{CHUNK_B}}\n\"\"\"\n\nProvide a concise analysis (3-5 sentences) covering:\n1. What specific topics, concepts, or claims these segments share\n2. How they differ in perspective, scope, or detail\n3. The nature of their relationship (e.g., redundant, complementary, contradictory, one elaborates the other)\n\nBe direct and specific. No preamble.";

const PROMPT_PRESETS = [
  { label: "Default", t: DEFAULT_PROMPT_TEMPLATE },
  { label: "Contradictions", t: "You are a fact-checker comparing two text segments ({{SCORE}}% similar).\n\nSEGMENT A:\n\"\"\"\n{{CHUNK_A}}\n\"\"\"\n\nSEGMENT B:\n\"\"\"\n{{CHUNK_B}}\n\"\"\"\n\nIdentify any contradictions, conflicting claims, or inconsistencies between these segments. If none exist, state that they are consistent. Be specific about what contradicts." },
  { label: "Compliance", t: "You are a compliance auditor. Compare these two segments ({{SCORE}}% similar) for regulatory or policy alignment.\n\nSEGMENT A (SOURCE):\n\"\"\"\n{{CHUNK_A}}\n\"\"\"\n\nSEGMENT B (TARGET):\n\"\"\"\n{{CHUNK_B}}\n\"\"\"\n\nDoes Segment B satisfy or comply with the requirements in Segment A? List any gaps, violations, or areas of non-compliance. Be specific." },
  { label: "Plagiarism", t: "You are an academic integrity analyst. These two segments have a {{SCORE}}% lexical similarity.\n\nSEGMENT A:\n\"\"\"\n{{CHUNK_A}}\n\"\"\"\n\nSEGMENT B:\n\"\"\"\n{{CHUNK_B}}\n\"\"\"\n\nAssess whether Segment B appears to be derived from Segment A (or vice versa). Consider: paraphrasing, structural copying, shared unique phrases, and independent convergence. Rate confidence: likely copied, possibly paraphrased, likely independent." },
  { label: "Coverage", t: "You are a document coverage analyst. Segment B should cover the topics in Segment A ({{SCORE}}% overlap).\n\nSEGMENT A (REFERENCE):\n\"\"\"\n{{CHUNK_A}}\n\"\"\"\n\nSEGMENT B (UNDER REVIEW):\n\"\"\"\n{{CHUNK_B}}\n\"\"\"\n\nWhat topics from A are covered in B? What topics from A are missing in B? What does B add that A doesn't have?" },
  { label: "Diff", t: "You are a precise change-tracker. These segments are {{SCORE}}% similar.\n\nBEFORE:\n\"\"\"\n{{CHUNK_A}}\n\"\"\"\n\nAFTER:\n\"\"\"\n{{CHUNK_B}}\n\"\"\"\n\nDescribe the specific changes: what was added, removed, modified, or reworded. Be concise and factual." },
  { label: "Q&A", t: "Given these two related text segments ({{SCORE}}% similar), answer this question about their relationship:\n\nSEGMENT A:\n\"\"\"\n{{CHUNK_A}}\n\"\"\"\n\nSEGMENT B:\n\"\"\"\n{{CHUNK_B}}\n\"\"\"\n\nHow do these segments relate to each other? What would someone need to understand from A to make sense of B, and vice versa?" },
];

function labelForPrompt(template, customQueries) {
  for (var i = 0; i < PROMPT_PRESETS.length; i++) {
    if (PROMPT_PRESETS[i].t === template) return PROMPT_PRESETS[i].label;
  }
  if (customQueries) {
    for (var j = 0; j < customQueries.length; j++) {
      if (customQueries[j].template === template) return customQueries[j].label;
    }
  }
  return "Custom";
}

function newQueryId() {
  return "cq" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
}

// Auto-append chunk placeholders if the user didn't include them.
// Lets users write short queries like "What's the tone shift?" without ceremony.
function ensureChunkPlaceholders(template) {
  const t = template || "";
  const hasA = t.indexOf("{{CHUNK_A}}") !== -1;
  const hasB = t.indexOf("{{CHUNK_B}}") !== -1;
  if (hasA && hasB) return t;
  let out = t.replace(/\s+$/, "");
  if (!hasA && !hasB) {
    out += "\n\nSEGMENT A ({{SCORE}}% similar):\n\"\"\"\n{{CHUNK_A}}\n\"\"\"\n\nSEGMENT B:\n\"\"\"\n{{CHUNK_B}}\n\"\"\"";
  } else if (!hasA) {
    out += "\n\nSEGMENT A:\n\"\"\"\n{{CHUNK_A}}\n\"\"\"";
  } else if (!hasB) {
    out += "\n\nSEGMENT B:\n\"\"\"\n{{CHUNK_B}}\n\"\"\"";
  }
  return out;
}

// POST-PROCESSING PIPELINE — transform LLM response text at display time
// ═══════════════════════════════════════════════════════════════

// LZ-base62 encoding using the official lzbase62 library (polygonplanet/lzbase62)
// which implements LZ77/LZSS compression with base62 character encoding.
// The compressed output uses only [0-9A-Za-z] and is decodable with lzbase62.decode().
function lzBase62Encode(str) {
  if (!str) return "";
  if (typeof window === "undefined" || !window.lzbase62 || typeof window.lzbase62.compress !== "function") {
    return "[lzbase62 library not loaded]";
  }
  try {
    const compressed = window.lzbase62.compress(str);
    const originalBytes = new Blob([str]).size;
    const ratio = originalBytes > 0 ? ((compressed.length / originalBytes) * 100).toFixed(1) : "0";
    return "[lzbase62 \u00B7 " + compressed.length + "/" + originalBytes + " bytes = " + ratio + "%]\n" + compressed;
  } catch (e) {
    return "[lzbase62 error: " + e.message + "]";
  }
}

// Expose a decode helper too, for completeness (users can paste compressed output back into a chunk for round-trip inspection)
function lzBase62Decode(str) {
  if (!str) return "";
  if (typeof window === "undefined" || !window.lzbase62 || typeof window.lzbase62.decompress !== "function") {
    return "[lzbase62 library not loaded]";
  }
  try { return window.lzbase62.decompress(str); }
  catch (e) { return "[lzbase62 decode error: " + e.message + "]"; }
}

// Minimal markdown-to-React renderer (handles common cases)
function renderMarkdown(text) {
  if (!text) return null;
  const lines = text.split(/\r?\n/);
  const blocks = [];
  let i = 0;
  let inCode = false;
  let codeBuf = [];
  let codeLang = "";
  let listBuf = null; // { ordered, items: [] }

  function flushList() {
    if (!listBuf) return;
    const L = listBuf;
    blocks.push(
      L.ordered
        ? <ol key={"l" + blocks.length} style={{ marginLeft: 20, marginTop: 4, marginBottom: 4, paddingLeft: 6 }}>
            {L.items.map((it, ix) => <li key={ix} style={{ marginBottom: 2 }}>{renderInline(it)}</li>)}
          </ol>
        : <ul key={"l" + blocks.length} style={{ marginLeft: 20, marginTop: 4, marginBottom: 4, paddingLeft: 6 }}>
            {L.items.map((it, ix) => <li key={ix} style={{ marginBottom: 2 }}>{renderInline(it)}</li>)}
          </ul>
    );
    listBuf = null;
  }

  while (i < lines.length) {
    const line = lines[i];
    // Code fence
    if (/^```/.test(line)) {
      if (!inCode) {
        flushList();
        inCode = true;
        codeLang = line.replace(/^```/, "").trim();
        codeBuf = [];
      } else {
        blocks.push(
          <pre key={"c" + blocks.length} style={{
            background: "#0a0c12", padding: 10, borderRadius: 4,
            border: "1px solid #1e2230", margin: "6px 0",
            fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
            lineHeight: 1.5, overflowX: "auto", whiteSpace: "pre",
          }}>
            {codeLang && <div style={{ fontSize: 9, color: "#4a5568", marginBottom: 4, letterSpacing: 1, textTransform: "uppercase" }}>{codeLang}</div>}
            <code style={{ color: "#c8ccd4" }}>{codeBuf.join("\n")}</code>
          </pre>
        );
        inCode = false;
        codeBuf = [];
      }
      i++; continue;
    }
    if (inCode) { codeBuf.push(line); i++; continue; }
    // Headers
    const hMatch = line.match(/^(#{1,6})\s+(.+)$/);
    if (hMatch) {
      flushList();
      const level = hMatch[1].length;
      const sizes = [0, 20, 17, 15, 13, 12, 11];
      blocks.push(
        <div key={"h" + blocks.length} style={{
          fontSize: sizes[level], fontWeight: 600, marginTop: 10, marginBottom: 4,
          color: "#e8ecf4", letterSpacing: -0.2,
        }}>{renderInline(hMatch[2])}</div>
      );
      i++; continue;
    }
    // Unordered list
    const ulMatch = line.match(/^[\s]*[-*]\s+(.+)$/);
    if (ulMatch) {
      if (!listBuf || listBuf.ordered) { flushList(); listBuf = { ordered: false, items: [] }; }
      listBuf.items.push(ulMatch[1]);
      i++; continue;
    }
    // Ordered list
    const olMatch = line.match(/^[\s]*\d+[.)]\s+(.+)$/);
    if (olMatch) {
      if (!listBuf || !listBuf.ordered) { flushList(); listBuf = { ordered: true, items: [] }; }
      listBuf.items.push(olMatch[1]);
      i++; continue;
    }
    // Blank line
    if (!line.trim()) { flushList(); i++; continue; }
    // Paragraph
    flushList();
    blocks.push(
      <div key={"p" + blocks.length} style={{ margin: "4px 0", lineHeight: 1.6 }}>
        {renderInline(line)}
      </div>
    );
    i++;
  }
  flushList();
  if (inCode && codeBuf.length) {
    blocks.push(
      <pre key={"c" + blocks.length} style={{ background: "#0a0c12", padding: 10, borderRadius: 4, fontFamily: "'JetBrains Mono', monospace", fontSize: 11, margin: "6px 0" }}>
        <code>{codeBuf.join("\n")}</code>
      </pre>
    );
  }
  return <div>{blocks}</div>;
}

// Inline markdown: bold, italic, code, links
function renderInline(text) {
  if (!text) return null;
  // Order: code > bold > italic > link
  const parts = [];
  let rest = text;
  let key = 0;
  // Tokenize with a single-pass regex that captures one pattern at a time
  const pattern = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\*[^*]+\*)|(_[^_]+_)|(\[[^\]]+\]\([^)]+\))/;
  while (rest.length > 0) {
    const m = rest.match(pattern);
    if (!m) { parts.push(rest); break; }
    if (m.index > 0) parts.push(rest.slice(0, m.index));
    const tok = m[0];
    if (tok.startsWith("`")) {
      parts.push(<code key={"i" + key++} style={{ background: "#1a1e28", padding: "1px 5px", borderRadius: 2, fontFamily: "'JetBrains Mono', monospace", fontSize: "0.92em", color: "#f0c040" }}>{tok.slice(1, -1)}</code>);
    } else if (tok.startsWith("**")) {
      parts.push(<strong key={"i" + key++} style={{ color: "#e8ecf4" }}>{tok.slice(2, -2)}</strong>);
    } else if (tok.startsWith("*") || tok.startsWith("_")) {
      parts.push(<em key={"i" + key++}>{tok.slice(1, -1)}</em>);
    } else if (tok.startsWith("[")) {
      const lm = tok.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
      if (lm) parts.push(<a key={"i" + key++} href={lm[2]} target="_blank" rel="noopener noreferrer" style={{ color: "#60a5fa", textDecoration: "underline" }}>{lm[1]}</a>);
      else parts.push(tok);
    }
    rest = rest.slice(m.index + tok.length);
  }
  return <>{parts}</>;
}

// Basic HTML sanitizer: strips script tags, event handlers, and javascript: URLs
function sanitizeHTML(html) {
  if (!html) return "";
  return html
    .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, "")
    .replace(/<script[^>]*>/gi, "")
    .replace(/\son\w+\s*=\s*"[^"]*"/gi, "")
    .replace(/\son\w+\s*=\s*'[^']*'/gi, "")
    .replace(/\son\w+\s*=\s*[^\s>]+/gi, "")
    .replace(/javascript:/gi, "");
}

// Built-in processors. Each has: id, label, kind ("transform"|"render"), params schema, apply().
const POST_PROCESSORS = {
  prepend: {
    id: "prepend", label: "Prepend text", kind: "transform",
    params: [{ name: "text", label: "Text", type: "textarea", default: "" }],
    apply: (input, p) => (p.text || "") + input,
  },
  append: {
    id: "append", label: "Append text", kind: "transform",
    params: [{ name: "text", label: "Text", type: "textarea", default: "" }],
    apply: (input, p) => input + (p.text || ""),
  },
  wrap: {
    id: "wrap", label: "Wrap with prefix/suffix", kind: "transform",
    params: [
      { name: "prefix", label: "Prefix", type: "text", default: "<<" },
      { name: "suffix", label: "Suffix", type: "text", default: ">>" },
    ],
    apply: (input, p) => (p.prefix || "") + input + (p.suffix || ""),
  },
  regex: {
    id: "regex", label: "Regex replace", kind: "transform",
    params: [
      { name: "pattern", label: "Pattern", type: "text", default: "" },
      { name: "flags", label: "Flags", type: "text", default: "g" },
      { name: "replacement", label: "Replacement", type: "text", default: "" },
    ],
    apply: (input, p) => {
      if (!p.pattern) return input;
      try { return input.replace(new RegExp(p.pattern, p.flags || "g"), p.replacement || ""); }
      catch (e) { return input + "\n[regex error: " + e.message + "]"; }
    },
  },
  uppercase: { id: "uppercase", label: "Uppercase", kind: "transform", params: [], apply: (s) => s.toUpperCase() },
  lowercase: { id: "lowercase", label: "Lowercase", kind: "transform", params: [], apply: (s) => s.toLowerCase() },
  trim: { id: "trim", label: "Trim whitespace", kind: "transform", params: [], apply: (s) => s.trim() },
  extractJson: {
    id: "extractJson", label: "Extract JSON block", kind: "transform", params: [],
    apply: (s) => {
      const m = s.match(/```(?:json)?\s*\n([\s\S]*?)\n```/);
      if (m) return m[1];
      const m2 = s.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
      return m2 ? m2[0] : s;
    },
  },
  lzbase62: {
    id: "lzbase62", label: "LZ-base62 compress", kind: "transform", params: [],
    apply: (s) => lzBase62Encode(s),
  },
  lzbase62decode: {
    id: "lzbase62decode", label: "LZ-base62 decompress", kind: "transform", params: [],
    apply: (s) => {
      // Strip our header line if present
      const body = s.replace(/^\[lzbase62[^\]]*\]\n/, "").trim();
      return lzBase62Decode(body);
    },
  },
  markdown: {
    id: "markdown", label: "Render as Markdown", kind: "render", params: [],
    render: (s) => renderMarkdown(s),
  },
  html: {
    id: "html", label: "Render as HTML (sanitized)", kind: "render", params: [],
    render: (s) => <div dangerouslySetInnerHTML={{ __html: sanitizeHTML(s) }} />,
  },
};

// Apply the pipeline. Returns either a string or a React element (if a render step ran last).
function applyPipeline(text, pipeline) {
  if (!pipeline || pipeline.length === 0) return text;
  let current = text;
  let rendered = null;
  for (const step of pipeline) {
    const def = POST_PROCESSORS[step.id];
    if (!def) continue;
    if (def.kind === "render") {
      // Render step finalizes the output. It applies to the current (possibly transformed) string.
      rendered = def.render(current);
    } else {
      current = def.apply(current, step.params || {});
      rendered = null; // any transform after a render resets back to string mode
    }
  }
  return rendered != null ? rendered : current;
}

// ─── Interpretations are stored as an array per pair ───
// Shape: { [key]: [{ id, label, response, status, timestamp, error }] }
// Legacy single-string values are wrapped automatically.
function getInterps(interpretations, key) {
  var v = interpretations && interpretations[key];
  if (!v) return [];
  if (typeof v === "string") return [{ id: "legacy", label: "Interpretation", response: v, status: "done", timestamp: null }];
  if (Array.isArray(v)) return v;
  return [];
}
function hasDoneInterp(interpretations, key) {
  var list = getInterps(interpretations, key);
  for (var i = 0; i < list.length; i++) if (list[i].status === "done" && list[i].response) return true;
  return false;
}
function combinedInterpText(interpretations, key) {
  return getInterps(interpretations, key)
    .filter(function(e) { return e.status === "done" && e.response; })
    .map(function(e) { return e.response; })
    .join("\n\n---\n\n");
}
function newInterpId() {
  return "q" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
}

// Fuzzy string similarity for ID near-matching (normalized token overlap)
function idSimilarity(a, b) {
  if (!a || !b) return 0;
  const norm = s => s.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const na = norm(a), nb = norm(b);
  if (na === nb) return 1;
  if (na.includes(nb) || nb.includes(na)) return 0.85;
  const ta = new Set(na.split(/\s+/));
  const tb = new Set(nb.split(/\s+/));
  let shared = 0;
  ta.forEach(t => { if (tb.has(t)) shared++; });
  return shared === 0 ? 0 : shared / Math.max(ta.size, tb.size);
}

// Free-form LLM query (not pair-based) — used for group and higher-order queries
async function queryLLMRaw(provider, baseUrl, model, prompt, signal, timeoutMs, apiKey, maxTokens) {
  const timeoutCtrl = new AbortController();
  const timeoutId = timeoutMs > 0 ? setTimeout(() => timeoutCtrl.abort(new Error("Timeout")), timeoutMs) : null;
  let parentListener = null;
  if (signal) {
    parentListener = () => timeoutCtrl.abort(signal.reason);
    signal.addEventListener("abort", parentListener, { once: true });
  }

  let url, headers, body, parseResponse;
  if (provider === "anthropic") {
    url = baseUrl.replace(/\/+$/, "") + "/messages";
    headers = {
      "Content-Type": "application/json",
      "x-api-key": (apiKey || "").trim(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    };
    body = JSON.stringify({
      model, max_tokens: (maxTokens && maxTokens > 0) ? maxTokens : 4096,
      temperature: 0.3, messages: [{ role: "user", content: prompt }],
    });
    parseResponse = (data) => Array.isArray(data.content) ? data.content.map(c => c.text || "").filter(Boolean).join("\n") : "(no response)";
  } else if (provider === "openai") {
    url = baseUrl.replace(/\/+$/, "") + "/chat/completions";
    headers = { "Content-Type": "application/json" };
    if (apiKey && apiKey.trim()) headers["Authorization"] = "Bearer " + apiKey.trim();
    const reqBody = { model, messages: [{ role: "user", content: prompt }], temperature: 0.3 };
    if (maxTokens && maxTokens > 0) reqBody.max_tokens = maxTokens;
    body = JSON.stringify(reqBody);
    parseResponse = (data) => data.choices?.[0]?.message?.content || "(no response)";
  } else {
    url = baseUrl.replace(/\/+$/, "") + "/api/generate";
    headers = { "Content-Type": "application/json" };
    if (apiKey && apiKey.trim()) headers["Authorization"] = "Bearer " + apiKey.trim();
    body = JSON.stringify({
      model, prompt, stream: false,
      options: { temperature: 0.3, num_predict: (maxTokens && maxTokens > 0) ? maxTokens : -1 },
    });
    parseResponse = (data) => data.response || data.message?.content || "(no response)";
  }

  try {
    const resp = await fetch(url, { method: "POST", headers, body: body, signal: timeoutCtrl.signal });
    if (!resp.ok) throw new Error("HTTP " + resp.status + ": " + (await resp.text().catch(() => "")));
    const data = await resp.json();
    return { text: parseResponse(data) };
  } finally {
    if (timeoutId) clearTimeout(timeoutId);
    if (signal && parentListener) signal.removeEventListener("abort", parentListener);
  }
}

async function queryLLM(provider, baseUrl, model, chunkA, chunkB, score, signal, promptTemplate, timeoutMs, apiKey, maxTokens, ctx) {
  const tmpl = ensureChunkPlaceholders(promptTemplate || DEFAULT_PROMPT_TEMPLATE);
  const c = ctx || {};
  const prompt = tmpl
    .replace(/\{\{SCORE\}\}/g, (score * 100).toFixed(1))
    .replace(/\{\{CHUNK_A\}\}/g, chunkA.slice(0, 1200))
    .replace(/\{\{CHUNK_B\}\}/g, chunkB.slice(0, 1200))
    .replace(/\{\{SCORE_RAW\}\}/g, score.toFixed(4))
    .replace(/\{\{NAME_A\}\}/g, c.nameA || "Document A")
    .replace(/\{\{NAME_B\}\}/g, c.nameB || "Document B")
    .replace(/\{\{ID_A\}\}/g, c.idA || "")
    .replace(/\{\{ID_B\}\}/g, c.idB || "")
    .replace(/\{\{LABEL_A\}\}/g, c.idA || ("A" + ((c.indexA != null ? c.indexA + 1 : ""))))
    .replace(/\{\{LABEL_B\}\}/g, c.idB || ("B" + ((c.indexB != null ? c.indexB + 1 : ""))));

  const timeoutCtrl = new AbortController();
  const timeoutId = timeoutMs > 0 ? setTimeout(() => timeoutCtrl.abort(new Error("Timeout after " + timeoutMs + "ms")), timeoutMs) : null;

  let parentListener = null;
  if (signal) {
    if (signal.aborted) timeoutCtrl.abort();
    else { parentListener = () => timeoutCtrl.abort(); signal.addEventListener("abort", parentListener); }
  }

  // Build provider-specific request
  let url, headers, body, parseResponse;

  if (provider === "anthropic") {
    url = baseUrl.replace(/\/+$/, "") + "/messages";
    headers = {
      "Content-Type": "application/json",
      "x-api-key": (apiKey || "").trim(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    };
    body = JSON.stringify({
      model,
      max_tokens: (maxTokens && maxTokens > 0) ? maxTokens : 4096,
      temperature: 0.3,
      messages: [{ role: "user", content: prompt }],
    });
    parseResponse = (data) => {
      if (Array.isArray(data.content)) {
        return data.content.map(c => c.text || "").filter(Boolean).join("\n");
      }
      return "(no response)";
    };
  } else if (provider === "openai") {
    url = baseUrl.replace(/\/+$/, "") + "/chat/completions";
    headers = { "Content-Type": "application/json" };
    if (apiKey && apiKey.trim()) headers["Authorization"] = "Bearer " + apiKey.trim();
    const reqBody = {
      model,
      messages: [{ role: "user", content: prompt }],
      temperature: 0.3,
    };
    if (maxTokens && maxTokens > 0) reqBody.max_tokens = maxTokens;
    body = JSON.stringify(reqBody);
    parseResponse = (data) => {
      return data.choices?.[0]?.message?.content || "(no response)";
    };
  } else {
    // Default: Ollama
    url = baseUrl.replace(/\/+$/, "") + "/api/generate";
    headers = { "Content-Type": "application/json" };
    if (apiKey && apiKey.trim()) headers["Authorization"] = "Bearer " + apiKey.trim();
    const numPredict = (maxTokens && maxTokens > 0) ? maxTokens : -1;
    body = JSON.stringify({
      model, prompt, stream: false,
      options: { temperature: 0.3, num_predict: numPredict },
    });
    parseResponse = (data) => data.response || data.message?.content || "(no response)";
  }

  try {
    const resp = await fetch(url, { method: "POST", headers, body, signal: timeoutCtrl.signal });
    if (!resp.ok) {
      let detail = "";
      try {
        const errData = await resp.json();
        detail = errData.error?.message || errData.error?.type || JSON.stringify(errData).slice(0, 200);
      } catch (e) {
        try { detail = await resp.text(); detail = detail.slice(0, 200); } catch (e2) {}
      }
      throw new Error(PROVIDERS[provider]?.label + " " + resp.status + (detail ? ": " + detail : ""));
    }
    const data = await resp.json();
    return parseResponse(data);
  } catch (err) {
    if (err.name === "AbortError" && timeoutMs > 0 && (!signal || !signal.aborted)) {
      const e = new Error("Request timed out after " + (timeoutMs/1000).toFixed(0) + "s");
      e.name = "TimeoutError";
      throw e;
    }
    throw err;
  } finally {
    if (timeoutId) clearTimeout(timeoutId);
    if (parentListener && signal) signal.removeEventListener("abort", parentListener);
  }
}

// Backwards-compat alias for code that still calls queryOllama
async function queryOllama(baseUrl, model, chunkA, chunkB, score, signal, promptTemplate, timeoutMs, apiKey, maxTokens, ctx) {
  return queryLLM("ollama", baseUrl, model, chunkA, chunkB, score, signal, promptTemplate, timeoutMs, apiKey, maxTokens, ctx);
}

function exportCSV(results, interpretations, customName) {
  const rows = ["Rank,Chunk_A,Chunk_B,Similarity_Pct,Chunk_A_Text,Chunk_B_Text,LLM_Interpretation"];
  results.pairs.slice(0, 50).forEach((m, idx) => {
    rows.push([idx+1, "A"+(m.i+1), "B"+(m.j+1), (m.score*100).toFixed(2),
      escapeCSV(results.chunksA[m.i].slice(0,2000)),
      escapeCSV(results.chunksB[m.j].slice(0,2000)),
      escapeCSV(combinedInterpText(interpretations, m.i+"-"+m.j) || ""),
    ].join(","));
  });
  const blob = new Blob(["\uFEFF" + rows.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const safe = (customName && customName.trim())
    ? customName.trim().replace(/[\/\\:*?"<>|]+/g, "_").replace(/\.(csv|html)$/i, "")
    : "tuo_report_" + new Date().toISOString().slice(0,10);
  a.download = safe + ".csv";
  a.click();
}

// ═══════════════════════════════════════════════════════════════
// HTML REPORT EXPORT (string concat — no template literals that
// could break the outer Babel block)
// ═══════════════════════════════════════════════════════════════

function exportHTML(results, interpretations, customName, pipelinesByLabel, chunkIdsA, chunkIdsB, idAliases, groupInterps) {
  var D = new Date().toISOString().slice(0, 10);

  // Build report payload — strip any in-flight "loading" entries
  var cleanInterps = {};
  Object.keys(interpretations || {}).forEach(function(k) {
    var v = interpretations[k];
    if (Array.isArray(v)) {
      var filtered = v.filter(function(e) { return e.status !== "loading"; });
      if (filtered.length > 0) cleanInterps[k] = filtered;
    } else if (v) {
      cleanInterps[k] = v;
    }
  });

  // Bake chunk IDs into results so BY ID tab works in report mode
  var resultsWithIds = Object.assign({}, results, {
    chunkIdsA: chunkIdsA || null,
    chunkIdsB: chunkIdsB || null,
  });

  var reportData = {
    results: resultsWithIds,
    interpretations: cleanInterps,
    pipelinesByLabel: pipelinesByLabel || {},
    idAliases: idAliases || {},
    groupInterps: groupInterps || {},
    exportedAt: new Date().toISOString(),
  };

  // Safely serialize: escape sequences that could break out of the script tag
  var serialized = JSON.stringify(reportData)
    .replace(/<\/script/gi, '<\\/script')
    .replace(new RegExp("<" + "!--", "g"), '<\\!--')
    .replace(/\u2028/g, '\\u2028')
    .replace(/\u2029/g, '\\u2029');

  // Clone the live document
  var clone = document.documentElement.cloneNode(true);

  // Empty the React root so the app renders fresh in the report
  var rootClone = clone.querySelector('#root');
  if (rootClone) rootClone.innerHTML = '';

  // Remove any existing data injection (in case re-exporting from a report)
  var existing = clone.querySelectorAll('script[data-tuo-report-data]');
  existing.forEach(function(el) { el.parentNode.removeChild(el); });

  // Inject the report data as a global, before any other script runs
  var dataScript = clone.ownerDocument.createElement('script');
  dataScript.setAttribute('data-tuo-report-data', '1');
  dataScript.textContent = 'window.__TUO_REPORT_MODE__ = true;\nwindow.__TUO_REPORT_DATA__ = ' + serialized + ';';

  var head = clone.querySelector('head');
  // Insert as the first child of head so it runs before CDN scripts and the app
  head.insertBefore(dataScript, head.firstChild);

  // Update title to mark as report
  var title = clone.querySelector('title');
  if (title) title.textContent = 'Tuo Report \u2014 ' + D;

  var html = '<!DOCTYPE html>\n' + clone.outerHTML;

  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  var safe = (customName && customName.trim())
    ? customName.trim().replace(/[\/\\:*?"<>|]+/g, '_').replace(/\.(csv|html)$/i, '')
    : 'tuo_report_' + D;
  a.download = safe + '.html';
  a.click();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

// Theme-aware similarity color rendering for canvas (heatmap cells, swatches).
// Defaults to the canonical orange-yellow gradient. When a theme sets
// .heatmap = { lo, mid, hi }, we interpolate between those instead.
// Themes can also set .heatmapTextDark / .heatmapTextLight for cell labels.
function simColor(val) {
  if (val < 0.05) return "rgba(20,24,32,0.95)";
  const r = Math.round(255 * Math.min(1, val * 2.2));
  const g = Math.round(180 * Math.min(1, val * 1.1));
  const b = Math.round(60 + 60 * (1 - val));
  return "rgba("+r+","+g+","+b+","+(0.3+val*0.7)+")";
}
function simTextColor(val) { return val > 0.35 ? "#0a0c10" : "#c8ccd4"; }

// Detect if a chunk is valid CSV (uses shared parseCSVLines/parseCSVCells)
function isChunkCSV(text) {
  const rows = parseCSVLines(text);
  if (rows.length < 2) return false;
  const delim = detectDelimiter(rows[0]);
  const hCount = parseCSVCells(rows[0], delim).length;
  if (hCount < 2) return false;
  let ok = 0;
  for (let i = 1; i < Math.min(rows.length, 6); i++) {
    if (Math.abs(parseCSVCells(rows[i], delim).length - hCount) <= 1) ok++;
  }
  return ok >= Math.min(rows.length - 1, 2);
}

// Renders chunk text: scrollable table if CSV, prose otherwise
function ChunkContent({ text, maxLen = 600, fontSize = 12.5, maxHeight = 260, highlight }) {
  // For CSV, don't slice mid-row — parse first, then limit rows
  if (isChunkCSV(text)) {
    const rows = parseCSVLines(text);
    const delim = detectDelimiter(rows[0]);
    const headerCells = parseCSVCells(rows[0], delim);
    const maxCols = headerCells.length;

    // Limit display rows by approximate token budget
    let displayRows = [];
    let tokCount = tokenize(rows[0]).length;
    const tokBudget = maxLen ? Math.floor(maxLen * 0.8) : Infinity;
    for (let i = 1; i < rows.length; i++) {
      const rTok = tokenize(rows[i]).length;
      if (tokCount + rTok > tokBudget && displayRows.length > 0) break;
      displayRows.push(parseCSVCells(rows[i], delim));
      tokCount += rTok;
    }
    const truncated = displayRows.length < rows.length - 1;

    return (
      <div style={{
        overflow: "auto", maxHeight, borderRadius: 4,
        border: "1px solid #1e2230",
        scrollbarWidth: "thin", scrollbarColor: "#2a2f3a #0e1018",
      }}>
        <table style={{
          width: "100%", borderCollapse: "collapse",
          fontFamily: "'JetBrains Mono', monospace", fontSize: Math.min(fontSize, 11),
          lineHeight: 1.5,
        }}>
          <thead style={{ position: "sticky", top: 0, zIndex: 2 }}>
            <tr>
              {headerCells.map((h, ci) => (
                <th key={ci} style={{
                  textAlign: "left", padding: "5px 8px",
                  background: "#1a1e2a", color: "#60a5fa",
                  borderBottom: "2px solid #2a3040",
                  fontSize: 10, letterSpacing: 0.5, fontWeight: 600,
                  whiteSpace: "nowrap",
                }}>{h.replace(/^"|"$/g, "")}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {displayRows.map((row, ri) => (
              <tr key={ri} style={{ background: ri % 2 === 0 ? "transparent" : "#ffffff04" }}>
                {Array.from({ length: maxCols }, (_, ci) => (
                  <td key={ci} style={{
                    padding: "4px 8px", color: "#9ca3af",
                    borderBottom: "1px solid #1e2230",
                    maxWidth: 220, overflow: "hidden", textOverflow: "ellipsis",
                    whiteSpace: "nowrap",
                  }}>{(row[ci] || "").replace(/^"|"$/g, "")}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
        {truncated && <div style={{
          ...mono9, color: "#3a4050", padding: "4px 8px",
          background: "#0e1018", borderTop: "1px solid #1e2230",
          position: "sticky", bottom: 0, textAlign: "right",
        }}>
          {displayRows.length} of {rows.length - 1} rows shown {"\u2026"}
        </div>}
      </div>
    );
  }

  // Plain text
  const display = maxLen ? text.slice(0, maxLen) : text;
  const truncated = maxLen && text.length > maxLen;
  // Highlight matches if a search term is provided
  let rendered = display;
  if (highlight && highlight.length > 0) {
    const q = highlight.toLowerCase();
    const lower = display.toLowerCase();
    const segments = [];
    let cursor = 0;
    while (cursor < display.length) {
      const hit = lower.indexOf(q, cursor);
      if (hit === -1) {
        segments.push({ text: display.slice(cursor), hl: false });
        break;
      }
      if (hit > cursor) segments.push({ text: display.slice(cursor, hit), hl: false });
      segments.push({ text: display.slice(hit, hit + q.length), hl: true });
      cursor = hit + q.length;
    }
    rendered = segments.map((s, i) =>
      s.hl ? <mark key={i} style={{ background: "#f0c04040", color: "#f0c040", padding: "0 1px", borderRadius: 2 }}>{s.text}</mark>
           : <React.Fragment key={i}>{s.text}</React.Fragment>
    );
  }
  return (
    <div style={{
      fontFamily: "'IBM Plex Serif', Georgia, serif", fontSize, color: "#9ca3af",
      lineHeight: 1.7, maxHeight, overflow: "auto", whiteSpace: "pre-wrap", wordBreak: "break-word",
      scrollbarWidth: "thin", scrollbarColor: "#2a2f3a #0e1018",
    }}>
      {rendered}{truncated ? "\u2026" : ""}
    </div>
  );
}

function FileUpload({ defaultLabel, color, onTextLoad, text, name, onNameChange, chunkMode, onChunkModeChange, estChunks, idRule, onIdRuleChange }) {
  const fileRef = useRef(null);
  const [dragging, setDragging] = useState(false);
  const [editingName, setEditingName] = useState(false);

  const readFile = useCallback(file => {
    const ext = (file.name || "").split(".").pop().toLowerCase();
    const setName = () => {
      if (file.name && onNameChange) {
        onNameChange(file.name);
      }
    };

    // Word documents (.docx) — convert to HTML via mammoth.js
    // Preserves paragraph (<p>) and heading (<h1>-<h6>) structure so the
    // XML chunking path can chunk by <p> and use headings as chunk IDs.
    if (ext === "docx" && typeof mammoth !== "undefined") {
      const reader = new FileReader();
      reader.onload = e => {
        mammoth.convertToHtml({ arrayBuffer: e.target.result })
          .then(result => {
            // Wrap in a root element so XML parsing is reliable
            const html = "<document>\n" + result.value + "\n<" + "/document>";
            onTextLoad(html);
            setName();
          })
          .catch(err => { alert("Failed to read .docx: " + err.message); });
      };
      reader.readAsArrayBuffer(file);
      return;
    }

    // Excel spreadsheets (.xlsx, .xls, .xlsm) — convert to CSV via SheetJS
    if ((ext === "xlsx" || ext === "xls" || ext === "xlsm") && typeof XLSX !== "undefined") {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const wb = XLSX.read(e.target.result, { type: "array" });
          // If multiple sheets, join them with a blank line between
          const parts = wb.SheetNames.map(name => {
            const ws = wb.Sheets[name];
            const csv = XLSX.utils.sheet_to_csv(ws);
            return wb.SheetNames.length > 1
              ? "# Sheet: " + name + "\n" + csv
              : csv;
          });
          onTextLoad(parts.join("\n\n"));
          setName();
        } catch (err) {
          alert("Failed to read spreadsheet: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      return;
    }

    // All other files — read as text
    const reader = new FileReader();
    reader.onload = e => { onTextLoad(e.target.result); setName(); };
    reader.readAsText(file);
  }, [onTextLoad, onNameChange]);
  const handleDrop = useCallback(e => {
    e.preventDefault(); setDragging(false);
    if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  }, [readFile]);

  const csvDetected = text && isCSV(text);
  const csvInfo = csvDetected ? " \u00B7 CSV detected \u00B7 " + (parseCSVLines(text).length - 1) + " rows" : "";
  const xmlTags = useMemo(() => (text && isXML(text)) ? collectXMLTagNames(text) : [], [text]);
  const isXmlDoc = xmlTags.length > 0;
  const xmlInfo = isXmlDoc ? " \u00B7 XML detected \u00B7 " + xmlTags.length + " distinct tag" + (xmlTags.length === 1 ? "" : "s") : "";
  const headingTags = useMemo(() => xmlTags.filter(t => /^h[1-6]$/i.test(t.name)).sort((a, b) => a.name.localeCompare(b.name)), [xmlTags]);
  const displayName = name || defaultLabel;

  // Base chunking modes; XML tag options are appended dynamically below
  const baseChunkOptions = useMemo(() => {
    const structural = [];
    if (csvDetected) structural.push({ v: "row", l: "Row" });
    structural.push({ v: "sentence", l: "Sentence" });
    structural.push({ v: "paragraph", l: "Paragraph" });
    structural.push({ v: "page", l: "Page (~3k chars)" });
    return [
      ...structural,
      { v: "32",   l: "32 tok" },
      { v: "64",   l: "64 tok" },
      { v: "128",  l: "128 tok" },
      { v: "256",  l: "256 tok" },
      { v: "512",  l: "512 tok" },
      { v: "768",  l: "768 tok" },
      { v: "1024", l: "1024 tok" },
    ];
  }, [csvDetected]);
  // Add XML tag-based modes — top tags by count, plus a few defaults
  const chunkOptions = useMemo(() => {
    if (!isXmlDoc) return baseChunkOptions;
    const opts = [];
    headingTags.forEach(t => {
      opts.push({ v: "section:" + t.name, l: "\u00A7 " + t.name + " sections (" + t.count + ")" });
    });
    const tagOpts = xmlTags.slice(0, 12).map(t => ({
      v: "tag:" + t.name,
      l: "<" + t.name + "> (" + t.count + ")",
    }));
    return [...opts, ...tagOpts, ...baseChunkOptions];
  }, [isXmlDoc, xmlTags, headingTags]);

  return (
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
        {editingName ? (
          <input
            autoFocus
            value={name || ""}
            onChange={e => onNameChange && onNameChange(e.target.value)}
            onBlur={() => setEditingName(false)}
            onKeyDown={e => { if (e.key === "Enter" || e.key === "Escape") setEditingName(false); }}
            placeholder={defaultLabel}
            style={{
              ...mono11, letterSpacing: 2, textTransform: "uppercase", color,
              background: "#0e1018", border: "1px solid " + color + "40",
              borderRadius: 4, padding: "2px 6px", outline: "none",
              fontWeight: 600, flex: 1, minWidth: 0,
            }}
          />
        ) : (
          <div onClick={() => setEditingName(true)}
            title="Click to rename"
            style={{
              ...mono11, letterSpacing: 2, textTransform: "uppercase", color,
              fontWeight: 600, cursor: "pointer", flex: 1, minWidth: 0,
              overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
              padding: "2px 6px", border: "1px solid transparent",
            }}
          >{displayName}</div>
        )}
        {!editingName && (
          <button
            onClick={() => setEditingName(true)}
            title="Rename"
            style={{
              ...mono9, fontSize: 9, background: "transparent", border: "1px solid " + color + "30",
              color: color + "80", borderRadius: 3, padding: "1px 5px", cursor: "pointer",
            }}
          >{"\u270E"}</button>
        )}
      </div>
      <div
        onDragOver={e => { e.preventDefault(); setDragging(true); }}
        onDragLeave={() => setDragging(false)}
        onDrop={handleDrop}
        onClick={() => !text && fileRef.current?.click()}
        style={{
          border: "1.5px dashed " + (dragging ? color : "#2a2f3a"),
          borderRadius: 8, padding: text ? 0 : 32,
          background: dragging ? color + "08" : "#0e1018",
          cursor: text ? "default" : "pointer",
          transition: "all 0.2s", minHeight: 120,
        }}
      >
        <input ref={fileRef} type="file" accept=".txt,.md,.html,.csv,.json,.xml,.log,.py,.js,.ts,.tex,.rst,.tsv,.docx,.xlsx,.xls,.xlsm"
          style={{ display: "none" }}
          onChange={e => e.target.files[0] && readFile(e.target.files[0])}
        />
        {text ? (
          <div style={{ position: "relative" }}>
            <textarea value={text} onChange={e => onTextLoad(e.target.value)}
              style={{
                width: "100%", minHeight: 160, maxHeight: 280,
                background: "transparent", color: "#9ca3af",
                border: "none", resize: "vertical", padding: 14,
                fontFamily: "'JetBrains Mono', monospace", fontSize: 12,
                lineHeight: 1.7, outline: "none", boxSizing: "border-box",
              }}
            />
            <button onClick={e => { e.stopPropagation(); onTextLoad(""); }}
              style={{
                position: "absolute", top: 8, right: 8,
                background: "#1a1e28", border: "1px solid " + color + "40",
                color, borderRadius: 4, padding: "2px 8px", cursor: "pointer", ...mono11,
              }}>clear</button>
          </div>
        ) : (
          <div style={{ textAlign: "center", color: "#4a5060" }}>
            <div style={{ fontSize: 28, marginBottom: 8 }}>{"\uD83D\uDCC4"}</div>
            <div style={mono11}>Drop file or click to upload</div>
            <div style={{ ...mono10, marginTop: 4, color: "#3a4050" }}>.txt .md .csv .json .xml .docx .xlsx</div>
          </div>
        )}
      </div>
      {text && (
        <div style={{
          marginTop: 8, padding: "8px 10px",
          background: "#0c0e16", border: "1px solid " + color + "20",
          borderRadius: 6,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ ...mono9, color: color, letterSpacing: 1 }}>CHUNK BY</span>
            {chunkMode != null && onChunkModeChange ? (
              <select value={chunkMode} onChange={e => onChunkModeChange(e.target.value)}
                style={{
                  background: "#141822", border: "1px solid " + color + "40",
                  color: color,
                  borderRadius: 4, padding: "3px 8px", ...mono10, cursor: "pointer", outline: "none",
                }}>
                {chunkOptions.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
              </select>
            ) : null}
            {estChunks != null && (
              <span style={{ ...mono9, color: "#3a4050" }}>
                {"\u00B7"} <span style={{ color: color, fontWeight: 600 }}>{estChunks.toLocaleString()}</span> chunks est.
              </span>
            )}
            <span style={{ ...mono9, color: "#3a4050", marginLeft: "auto" }}>
              {tokenize(text).length.toLocaleString()} tokens {"\u00B7"} {text.length.toLocaleString()} chars{csvInfo}{xmlInfo}
            </span>
          </div>
          {/* Chunk ID extraction rule */}
          {idRule && onIdRuleChange && (() => {
            const csv = csvDetected;
            const xml = isXmlDoc;
            // For CSV mode, build a column dropdown from the header
            let colOptions = [];
            if (csv) {
              try {
                const allRows = parseCSVLines(text);
                if (allRows.length > 0) {
                  const delim = detectDelimiter(allRows[0]);
                  colOptions = parseCSVCells(allRows[0], delim).map((h, idx) => ({
                    v: h.replace(/^"|"$/g, ""), l: h.replace(/^"|"$/g, "") + " (col " + idx + ")",
                  }));
                }
              } catch (e) {}
            }
            // For XML chunked by tag, suggest descendant tag names that exist
            // INSIDE the chunked element. We don't pre-compute that; instead we
            // offer all tags and let the user pick. The most common use case is
            // a child tag like <id> or <key> being the primary key.
            const tagOpts = xml ? xmlTags.slice(0, 30).map(t => ({ v: t.name, l: "<" + t.name + ">" })) : [];
            return (
              <div style={{
                display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap",
                marginTop: 6, paddingTop: 6, borderTop: "1px solid " + color + "15",
              }}>
                <span style={{ ...mono9, color: color, letterSpacing: 1 }} title="Extract a stable identifier per chunk to compare same-ID chunks across docs">
                  CHUNK ID
                </span>
                <select value={idRule.kind || "none"}
                  onChange={e => onIdRuleChange({ kind: e.target.value, value: idRule.value || "" })}
                  style={{
                    background: "#141822", border: "1px solid " + color + "40",
                    color: idRule.kind && idRule.kind !== "none" ? color : "#4a5568",
                    borderRadius: 4, padding: "3px 8px", ...mono10, cursor: "pointer", outline: "none",
                  }}>
                  <option value="none">none</option>
                  <option value="regex">regex pattern</option>
                  {csv && <option value="column">CSV column</option>}
                  {xml && <option value="xml-tag">XML tag</option>}
                  {xml && headingTags.length > 0 && <option value="heading">heading (h1-h6)</option>}
                </select>
                {idRule.kind === "regex" && (
                  <input type="text" value={idRule.value || ""}
                    onChange={e => onIdRuleChange({ kind: "regex", value: e.target.value })}
                    placeholder="e.g. ^Section\\s+(\\d+\\.\\d+)"
                    spellCheck={false}
                    style={{
                      flex: 1, minWidth: 160,
                      background: "#141822", border: "1px solid " + color + "40",
                      color: color, borderRadius: 4, padding: "3px 8px",
                      fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
                      outline: "none",
                    }}
                  />
                )}
                {idRule.kind === "column" && csv && (
                  <select value={idRule.value || ""}
                    onChange={e => onIdRuleChange({ kind: "column", value: e.target.value })}
                    style={{
                      background: "#141822", border: "1px solid " + color + "40",
                      color: color, borderRadius: 4, padding: "3px 8px",
                      ...mono10, cursor: "pointer", outline: "none",
                    }}>
                    <option value="">-- pick column --</option>
                    {colOptions.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
                  </select>
                )}
                {idRule.kind === "xml-tag" && xml && (
                  <>
                    <input type="text" value={idRule.value || ""}
                      onChange={e => onIdRuleChange({ kind: "xml-tag", value: e.target.value })}
                      placeholder="e.g. id  or  user@uuid  or  @id"
                      spellCheck={false}
                      list={"xml-tag-suggest-" + (defaultLabel || "doc").replace(/\s+/g, "-")}
                      style={{
                        flex: 1, minWidth: 140,
                        background: "#141822", border: "1px solid " + color + "40",
                        color: color, borderRadius: 4, padding: "3px 8px",
                        fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
                        outline: "none",
                      }}
                    />
                    <datalist id={"xml-tag-suggest-" + (defaultLabel || "doc").replace(/\s+/g, "-")}>
                      {tagOpts.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
                    </datalist>
                  </>
                )}
                {idRule.kind === "regex" && (
                  <span style={{ ...mono9, color: "#3a4050", fontStyle: "italic" }}>
                    First capture group = ID (or full match if no group)
                  </span>
                )}
                {idRule.kind === "xml-tag" && xml && (
                  <span style={{ ...mono9, color: "#3a4050", fontStyle: "italic" }}>
                    Tag text content. Use <code style={{ color: color }}>tag@attr</code> for attributes, <code style={{ color: color }}>@attr</code> for the chunk's own root attribute.
                  </span>
                )}
                {idRule.kind === "heading" && (
                  <span style={{ ...mono9, color: "#3a4050", fontStyle: "italic" }}>
                    Uses the first h1-h6 heading in each chunk as its ID. Best with <code style={{ color: color }}>{"\u00A7"} section</code> chunking.
                  </span>
                )}
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}
