// ─── Batch Runner panel ───
// ─── Prune panel: destructively trim low-similarity pairs ───
function PrunePanel({ totalPairs, onPrune, pairs }) {
  const [open, setOpen] = useState(false);
  const [minT, setMinT] = useState(10);
  const [maxT, setMaxT] = useState(100);
  const [useMin, setUseMin] = useState(true);
  const [useMax, setUseMax] = useState(false);

  // Count what would survive
  const preview = useMemo(() => {
    if (!pairs) return { keep: 0, prune: 0 };
    const min = useMin ? minT / 100 : 0;
    const max = useMax ? maxT / 100 : 1.01;
    let keep = 0;
    for (let i = 0; i < pairs.length; i++) {
      if (pairs[i].score >= min && pairs[i].score <= max) keep++;
    }
    return { keep, prune: pairs.length - keep };
  }, [pairs, minT, maxT, useMin, useMax]);

  function handlePrune() {
    if (preview.prune === 0) return;
    const pct = (preview.prune / totalPairs * 100).toFixed(1);
    const msg = "Permanently remove " + preview.prune.toLocaleString() + " pairs (" + pct + "%) from the result set?\n\nThis affects all views and clears any interpretations for pruned pairs. Use save/load to roll back.";
    if (!confirm(msg)) return;
    onPrune(useMin ? minT / 100 : null, useMax ? maxT / 100 : null);
    setOpen(false);
  }

  if (!open) {
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16 }}>
        <button onClick={() => setOpen(true)} style={{
          ...mono9, background: "#141822", border: "1px solid #1e2230",
          color: "#4a5568", borderRadius: 4, padding: "4px 10px", cursor: "pointer",
        }} title="Destructively remove pairs from the set by similarity threshold">
          {"\u2702"} Prune pairs{"\u2026"}
        </button>
        <span style={{ ...mono9, color: "#3a4050" }}>
          {totalPairs.toLocaleString()} pairs in set
        </span>
      </div>
    );
  }

  return (
    <div style={{
      background: "#0c0e16", borderRadius: 8, padding: 12, marginBottom: 16,
      border: "1px solid #f8717130",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <span style={{ ...mono10, color: "#f87171", letterSpacing: 1, fontWeight: 600 }}>
          {"\u2702"} PRUNE PAIRS
        </span>
        <button onClick={() => setOpen(false)} style={{
          ...mono9, background: "transparent", border: "1px solid #1e2230",
          color: "#4a5568", borderRadius: 3, padding: "2px 8px", cursor: "pointer",
        }}>cancel</button>
      </div>

      <div style={{ ...mono9, color: "#3a4050", marginBottom: 8, fontStyle: "italic" }}>
        Permanently removes pairs outside the range. Affects all views; clears interpretations for pruned pairs. Save project first if unsure.
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
        <label style={{ display: "flex", alignItems: "center", gap: 6, ...mono10, color: useMin ? "#34d399" : "#4a5568", cursor: "pointer" }}>
          <input type="checkbox" checked={useMin} onChange={e => setUseMin(e.target.checked)} style={{ accentColor: "#34d399" }} />
          Keep pairs with score {"\u2265"}
          <input type="number" min={0} max={100} value={minT}
            onChange={e => { setMinT(Math.max(0, Math.min(100, Number(e.target.value) || 0))); if (!useMin) setUseMin(true); }}
            disabled={!useMin}
            style={{
              width: 60, background: "#141822",
              border: "1px solid " + (useMin ? "#34d39940" : "#1e2230"),
              color: useMin ? "#34d399" : "#3a4050",
              borderRadius: 3, padding: "2px 6px", ...mono10, textAlign: "right", outline: "none",
            }}
          />
          %
        </label>
        <label style={{ display: "flex", alignItems: "center", gap: 6, ...mono10, color: useMax ? "#f87171" : "#4a5568", cursor: "pointer" }}>
          <input type="checkbox" checked={useMax} onChange={e => setUseMax(e.target.checked)} style={{ accentColor: "#f87171" }} />
          Keep pairs with score {"\u2264"}
          <input type="number" min={0} max={100} value={maxT}
            onChange={e => { setMaxT(Math.max(0, Math.min(100, Number(e.target.value) || 100))); if (!useMax) setUseMax(true); }}
            disabled={!useMax}
            style={{
              width: 60, background: "#141822",
              border: "1px solid " + (useMax ? "#f8717140" : "#1e2230"),
              color: useMax ? "#f87171" : "#3a4050",
              borderRadius: 3, padding: "2px 6px", ...mono10, textAlign: "right", outline: "none",
            }}
          />
          %
        </label>
      </div>

      {/* Preview bar */}
      <div style={{ marginBottom: 10 }}>
        <div style={{ display: "flex", ...mono9, marginBottom: 4 }}>
          <span style={{ color: "#34d399" }}>keep {preview.keep.toLocaleString()}</span>
          <span style={{ color: "#3a4050", marginLeft: 8 }}>
            {"\u00B7"} remove {preview.prune.toLocaleString()}
            {totalPairs > 0 && <> ({(preview.prune / totalPairs * 100).toFixed(1)}%)</>}
          </span>
        </div>
        <div style={{
          display: "flex", height: 6, borderRadius: 3, overflow: "hidden",
          background: "#141822",
        }}>
          <div style={{
            width: totalPairs > 0 ? (preview.keep / totalPairs * 100) + "%" : "0%",
            background: "#34d39960", transition: "width 0.15s",
          }} />
          <div style={{
            width: totalPairs > 0 ? (preview.prune / totalPairs * 100) + "%" : "0%",
            background: "#f8717160", transition: "width 0.15s",
          }} />
        </div>
      </div>

      <button onClick={handlePrune}
        disabled={preview.prune === 0 || (!useMin && !useMax)}
        style={{
          ...mono10, fontWeight: 600, letterSpacing: 1, textTransform: "uppercase",
          background: (preview.prune > 0 && (useMin || useMax)) ? "#f8717120" : "#1a1e28",
          border: "1px solid " + ((preview.prune > 0 && (useMin || useMax)) ? "#f8717150" : "#1e2230"),
          color: (preview.prune > 0 && (useMin || useMax)) ? "#f87171" : "#3a4050",
          borderRadius: 4, padding: "6px 16px", width: "100%",
          cursor: (preview.prune > 0 && (useMin || useMax)) ? "pointer" : "not-allowed",
        }}>
        {"\u2702"} Remove {preview.prune.toLocaleString()} pairs
      </button>
    </div>
  );
}

function BatchRunner({ presets, customQueries, totalPairs, pairsAbove30, pairsAbove50, onRun, onStop, isRunning, progress, onAddQuery, onUpdateQuery, onDeleteQuery, ollamaUrl, ollamaModel, ollamaTimeout, ollamaMaxTokens, pipelinesByLabel, onEditPipeline }) {
  const allQueries = useMemo(() => {
    return [
      ...presets.map(p => ({ label: p.label, template: p.t, isPreset: true })),
      ...(customQueries || []).map(q => ({
        label: q.label, template: q.template, isPreset: false,
        provider: q.provider,
        url: q.url, model: q.model, apiKey: q.apiKey,
        timeout: q.timeout, maxTokens: q.maxTokens,
      })),
    ];
  }, [presets, customQueries]);

  const [selected, setSelected] = useState(() => new Set(["Default"]));
  const [scopeType, setScopeType] = useState("topN");
  const [scopeN, setScopeN] = useState(10);
  const [scopeMin, setScopeMin] = useState(30);
  const [scopeMax, setScopeMax] = useState(100); // upper bound — skip near-perfect matches
  const [scopeMaxEnabled, setScopeMaxEnabled] = useState(false);
  const [skipDup, setSkipDup] = useState(true);
  const [collapsed, setCollapsed] = useState(false);

  // ─── New / edit query form ───
  const [showNewForm, setShowNewForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState({ label: "", template: "", url: "", model: "", apiKey: "", timeout: "", maxTokens: "" });
  const [showOverrides, setShowOverrides] = useState(false);

  function startNew() {
    setEditingId(null);
    setDraft({ label: "", template: "", provider: "", url: "", model: "", apiKey: "", timeout: "", maxTokens: "" });
    setShowOverrides(false);
    setShowQueryPipeline(false);
    setShowNewForm(true);
  }
  function startEdit(q) {
    setEditingId(q.id);
    setDraft({
      label: q.label || "",
      template: q.template || "",
      provider: q.provider || "",
      url: q.url || "",
      model: q.model || "",
      apiKey: q.apiKey != null ? q.apiKey : "",
      timeout: q.timeout != null ? String(q.timeout) : "",
      maxTokens: q.maxTokens != null ? String(q.maxTokens) : "",
    });
    setShowOverrides(!!(q.provider || q.url || q.model || q.apiKey || q.timeout != null || q.maxTokens != null));
    setShowNewForm(true);
  }
  function cancelForm() {
    setShowNewForm(false);
    setEditingId(null);
  }
  function saveDraft() {
    if (!draft.label.trim() || !draft.template.trim()) return;
    const payload = { label: draft.label.trim(), template: draft.template };
    if (showOverrides) {
      if (draft.provider) payload.provider = draft.provider;
      if (draft.url.trim()) payload.url = draft.url.trim();
      if (draft.model.trim()) payload.model = draft.model.trim();
      if (draft.apiKey !== "") payload.apiKey = draft.apiKey;
      if (draft.timeout !== "" && !isNaN(Number(draft.timeout))) payload.timeout = Number(draft.timeout);
      if (draft.maxTokens !== "" && !isNaN(Number(draft.maxTokens))) payload.maxTokens = Number(draft.maxTokens);
    }
    if (editingId) onUpdateQuery && onUpdateQuery(editingId, payload);
    else onAddQuery && onAddQuery(payload);
    setShowNewForm(false);
    setEditingId(null);
  }

  function toggle(label) {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(label)) next.delete(label); else next.add(label);
      return next;
    });
  }

  function selectAll() { setSelected(new Set(allQueries.map(q => q.label))); }
  function selectNone() { setSelected(new Set()); }
  function selectPresets() { setSelected(new Set(presets.map(p => p.label))); }

  const selectedQueries = allQueries.filter(q => selected.has(q.label));
  // Target count reflects scope + optional upper-bound filter.
  // Note: for topN we can't know exactly how many pairs fall under the cap without reading them,
  // so show a best-effort estimate.
  const maxFrac = scopeMaxEnabled ? scopeMax / 100 : 1.01;
  const targetCount = scopeType === "topN"
      ? Math.min(scopeN, totalPairs)
      : scopeType === "minScore"
        ? (scopeMin <= 30 ? pairsAbove30 : scopeMin <= 50 ? pairsAbove50 : 0)
        : totalPairs;
  const totalCalls = selectedQueries.length * targetCount;

  function handleRun() {
    const scope = scopeType === "topN" ? { type: "topN", n: scopeN, maxScore: maxFrac }
                : scopeType === "minScore" ? { type: "minScore", v: scopeMin / 100, maxScore: maxFrac }
                : { type: "all", maxScore: maxFrac };
    onRun(selectedQueries, scope, { skipDuplicates: skipDup });
  }

  return (
    <div style={{
      background: "#0c0e16", borderRadius: 8, padding: collapsed ? "8px 14px" : 14,
      marginBottom: 16, border: "1px solid #f59e4225",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: collapsed ? 0 : 10, gap: 8 }}>
        <span style={{ ...mono10, color: "#f59e42", letterSpacing: 1, fontWeight: 600 }}>
          {"\u25B6"} QUERIES {selected.size > 0 && <span style={{ color: "#f59e4280", fontWeight: 400 }}>{"\u00B7"} {selected.size} selected</span>}
        </span>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <button onClick={startNew} title="Create a new saved query"
            style={{
              ...mono10, fontWeight: 700, letterSpacing: 1,
              background: "linear-gradient(135deg, #34d399, #10b981)",
              border: "none", color: "#0a0c12",
              borderRadius: 5, padding: "5px 14px", cursor: "pointer",
              boxShadow: "0 0 0 1px #34d39960",
            }}>+ Query</button>
          <button onClick={() => setCollapsed(!collapsed)} style={{

                const hasConn = !q.isPreset && !!(q.provider || q.url || q.model || q.apiKey || q.timeout != null || q.maxTokens != null);

                    <button onClick={() => toggle(q.label)} style={{

                      {hasPipe && <span title={"custom output pipeline (" + effectivePipe.length + " step" + (effectivePipe.length === 1 ? "" : "s") + ")"} style={{ marginLeft: 4, color: "#f472b6" }}>{"\u2699"}</span>}

                  {[

              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={saveDraft}
                  disabled={!draft.label.trim() || !draft.template.trim()}
                  style={{
                    ...mono10, fontWeight: 600,
                    background: (draft.label.trim() && draft.template.trim()) ? "#34d39920" : "#141822",
                    border: "1px solid " + ((draft.label.trim() && draft.template.trim()) ? "#34d39950" : "#1e2230"),
                    color: (draft.label.trim() && draft.template.trim()) ? "#34d399" : "#3a4050",

          {/* Scope selector */}
          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>
            <span style={{ ...mono9, color: "#4a5568", letterSpacing: 1 }}>SCOPE</span>
            <label style={{ display: "flex", alignItems: "center", gap: 4, ...mono10, color: scopeType === "topN" ? "#f59e42" : "#4a5568", cursor: "pointer" }}>

                onChange={e => setScopeN(Math.max(1, Math.min(totalPairs, Number(e.target.value) || 1)))}

                style={{
                  width: 60, background: "#141822", border: "1px solid #1e2230",
                  color: scopeType === "topN" ? "#f59e42" : "#9ca3af",
                  borderRadius: 3, padding: "2px 6px", ...mono10, textAlign: "right", outline: "none",
                }}
              />
              matches
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 4, ...mono10, color: scopeType === "minScore" ? "#f59e42" : "#4a5568", cursor: "pointer" }}>
              <input type="radio" name="scope" checked={scopeType === "minScore"} onChange={() => setScopeType("minScore")} style={{ accentColor: "#f59e42" }} />
              {"\u2265"}
              <input type="number" min={0} max={100} value={scopeMin}
                onChange={e => setScopeMin(Math.max(0, Math.min(100, Number(e.target.value) || 0)))}
                onClick={() => setScopeType("minScore")}
                style={{
                  width: 50, background: "#141822", border: "1px solid #1e2230",
                  color: scopeType === "minScore" ? "#f59e42" : "#9ca3af",
                  borderRadius: 3, padding: "2px 6px", ...mono10, textAlign: "right", outline: "none",
                }}
              />
              %
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 4, ...mono10, color: scopeType === "all" ? "#f59e42" : "#4a5568", cursor: "pointer" }}>
              <input type="radio" name="scope" checked={scopeType === "all"} onChange={() => setScopeType("all")} style={{ accentColor: "#f59e42" }} />
              All ({totalPairs})
            </label>
          </div>

          {/* Upper bound — skip near-perfect matches */}
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 6, ...mono10, color: scopeMaxEnabled ? "#f87171" : "#4a5568", cursor: "pointer" }}>
              <input type="checkbox" checked={scopeMaxEnabled}
                onChange={e => setScopeMaxEnabled(e.target.checked)}
                style={{ accentColor: "#f87171" }}
              />
              Exclude matches
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 4, ...mono10, color: scopeMaxEnabled ? "#f87171" : "#3a4050" }}>
              {"\u2265"}
              <input type="number" min={1} max={100} value={scopeMax}
                onChange={e => { setScopeMax(Math.max(1, Math.min(100, Number(e.target.value) || 100))); if (!scopeMaxEnabled) setScopeMaxEnabled(true); }}
                disabled={!scopeMaxEnabled}
                style={{
                  width: 50, background: "#141822",
                  border: "1px solid " + (scopeMaxEnabled ? "#f8717140" : "#1e2230"),
                  color: scopeMaxEnabled ? "#f87171" : "#3a4050",
                  borderRadius: 3, padding: "2px 6px", ...mono10, textAlign: "right", outline: "none",
                }}
              />
              %
            </label>
            <span style={{ ...mono9, color: "#3a4050", fontStyle: "italic" }}>
              skip trivially-identical pairs
            </span>
          </div>

          {/* Options */}
          <div style={{ marginBottom: 10 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 6, ...mono9, color: "#4a5568", cursor: "pointer" }}>
              <input type="checkbox" checked={skipDup} onChange={e => setSkipDup(e.target.checked)} style={{ accentColor: "#34d399" }} />
              Skip pairs already answered with the same query
            </label>
          </div>

          {/* Run / Stop */}
          {!isRunning ? (
            <button onClick={handleRun} disabled={selectedQueries.length === 0 || targetCount === 0} style={{
              ...mono10, fontWeight: 600, letterSpacing: 1, textTransform: "uppercase",
              background: (selectedQueries.length > 0 && targetCount > 0) ? "linear-gradient(135deg, #f59e42, #f0c040)" : "#1a1e28",
              color: (selectedQueries.length > 0 && targetCount > 0) ? "#0a0c12" : "#3a4050",
              border: "none", borderRadius: 5, padding: "8px 20px", width: "100%",
              cursor: (selectedQueries.length > 0 && targetCount > 0) ? "pointer" : "not-allowed",
              transition: "all 0.2s",
            }}>
              {"\u25B6"} Run {selectedQueries.length} {selectedQueries.length === 1 ? "query" : "queries"} {"\u00D7"} {targetCount} {targetCount === 1 ? "pair" : "pairs"}{scopeMaxEnabled ? " (then filter \u2265" + scopeMax + "%)" : ""} = {totalCalls} {totalCalls === 1 ? "call max" : "calls max"}
            </button>
          ) : (
            <div>
              <div style={{
                width: "100%", height: 6, background: "#141822", borderRadius: 3, overflow: "hidden",
                marginBottom: 6,
              }}>
                <div style={{
                  width: progress ? (progress.done / progress.total * 100) + "%" : "0%",
                  height: "100%", background: "linear-gradient(90deg, #f59e42, #f0c040)",
                  transition: "width 0.2s",
                }} />
              </div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <span style={{ ...mono9, color: "#f59e42" }}>
                  {progress ? `${progress.done}/${progress.total} done \u00B7 pair ${progress.pairIdx}/${progress.pairTotal}` : "Starting..."}
                </span>
                <button onClick={onStop} style={{
                  ...mono9, fontWeight: 600,
                  background: "#f8717118", border: "1px solid #f8717140",
                  color: "#f87171", borderRadius: 4, padding: "3px 12px", cursor: "pointer",
                }}>{"\u25A0"} Stop</button>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ─── Theme editor: name, tagline, mode, accent ───
// ─── Post-processor pipeline editor ───
function PostProcessorPanel({ pipeline, onChange, sampleText }) {
  const [expanded, setExpanded] = useState(new Set());
  const [sample, setSample] = useState(sampleText || "Example LLM output:\n- **Shared concept**: both chunks discuss X.\n- They differ in *emphasis*.\n\n```json\n{\"a\": 1}\n```");
  const fileRef = useRef(null);
  const availableIds = Object.keys(POST_PROCESSORS);

  function addStep(id) {
    const def = POST_PROCESSORS[id];
    const params = {};
    (def.params || []).forEach(p => { params[p.name] = p.default; });
    onChange([...pipeline, { id, params, uid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }]);
  }
  function removeStep(idx) { onChange(pipeline.filter((_, i) => i !== idx)); }
  function moveStep(idx, dir) {
    const to = idx + dir;
    if (to < 0 || to >= pipeline.length) return;
    const next = pipeline.slice();
    [next[idx], next[to]] = [next[to], next[idx]];
    onChange(next);
  }
  function updateParam(idx, paramName, value) {
    const next = pipeline.map((s, i) => i === idx ? { ...s, params: { ...(s.params || {}), [paramName]: value } } : s);
    onChange(next);
  }
  function toggleExpand(uid) {
    const next = new Set(expanded);
    if (next.has(uid)) next.delete(uid); else next.add(uid);
    setExpanded(next);
  }

  function savePipelineJSON() {
    const payload = {
      format: "tuo-pipeline",
      version: 1,
      savedAt: new Date().toISOString(),
      steps: pipeline.map(s => ({ id: s.id, params: s.params || {} })),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const name = prompt("Pipeline filename (without extension):", "tuo_pipeline_" + new Date().toISOString().slice(0, 10));
    if (!name) { URL.revokeObjectURL(a.href); return; }
    const safe = name.trim().replace(/[\/\\:*?"<>|]+/g, "_").replace(/\.json$/i, "");
    a.download = safe + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    setLoadStatus({ kind: "ok", msg: "Saved \u00B7 " + pipeline.length + " steps" });
    setTimeout(() => setLoadStatus(null), 3000);
  }

  function loadPipelineJSON(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.format !== "tuo-pipeline" || !Array.isArray(data.steps)) {
          throw new Error("Not a valid Tuo pipeline file");
        }
        // Reconstruct with new uids; drop steps whose id is unknown
        const restored = data.steps
          .filter(s => POST_PROCESSORS[s.id])
          .map(s => ({
            id: s.id,
            params: s.params || {},
            uid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          }));
        const unknown = data.steps.length - restored.length;
        onChange(restored);
        setLoadStatus({
          kind: "ok",
          msg: "Loaded \u00B7 " + restored.length + " steps" + (unknown > 0 ? " (" + unknown + " unknown ignored)" : ""),
        });
        setTimeout(() => setLoadStatus(null), 4000);
      } catch (err) {
        setLoadStatus({ kind: "err", msg: err.message });
        setTimeout(() => setLoadStatus(null), 5000);
      }
    };
    reader.onerror = () => {
      setLoadStatus({ kind: "err", msg: "Failed to read file" });
      setTimeout(() => setLoadStatus(null), 5000);
    };
    reader.readAsText(file);
  }

  // Preview
  let previewOut;
  try { previewOut = applyPipeline(sample, pipeline); }
  catch (e) { previewOut = "[pipeline error: " + e.message + "]"; }
  const previewIsElement = typeof previewOut === "object" && previewOut !== null && previewOut.$$typeof;

  return (
    <div style={{
      background: "#0c0e16", borderRadius: 8, padding: 14, marginBottom: 16,
      border: "1px solid #f472b630",
    }}>
      {/* Save / load toolbar */}
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
        <button onClick={savePipelineJSON}
          disabled={pipeline.length === 0}
          title="Save the current pipeline to a JSON file"
          style={{
            ...mono9, fontWeight: 600,
            background: pipeline.length > 0 ? "#34d39918" : "#141822",
            border: "1px solid " + (pipeline.length > 0 ? "#34d39940" : "#1e2230"),
            color: pipeline.length > 0 ? "#34d399" : "#3a4050",
            borderRadius: 4, padding: "4px 10px",
            cursor: pipeline.length > 0 ? "pointer" : "not-allowed",
          }}>{"\u{1F4BE}"} Save JSON</button>
        <button onClick={() => fileRef.current?.click()}
          title="Load a pipeline from a JSON file (replaces current)"
          style={{
            ...mono9, fontWeight: 600,
            background: "#60a5fa18", border: "1px solid #60a5fa40",
            color: "#60a5fa", borderRadius: 4, padding: "4px 10px", cursor: "pointer",
          }}>{"\u{1F4C2}"} Load JSON</button>
        <input ref={fileRef} type="file" accept=".json,application/json"
          style={{ display: "none" }}
          onChange={e => {
            const f = e.target.files[0];
            if (f) loadPipelineJSON(f);
            e.target.value = "";
          }}
        />
      </div>

      <div style={{ ...mono9, color: "#3a4050", marginBottom: 10, fontStyle: "italic" }}>
        Steps run top-to-bottom. Transform steps reshape text; render steps (Markdown, HTML) finalize the output visually. A transform after a render reverts to text mode.
      </div>

      {/* Steps */}
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
        {pipeline.length === 0 && (
          <div style={{ ...mono10, color: "#3a4050", padding: "12px", textAlign: "center", border: "1px dashed #1e2230", borderRadius: 4 }}>
            No steps. LLM output displays as-is. Add a step below.
          </div>
        )}
        {pipeline.map((step, idx) => {
          const def = POST_PROCESSORS[step.id];
          if (!def) return null;
          const isRender = def.kind === "render";
          const uid = step.uid || idx;
          const isExpanded = expanded.has(uid);
          const hasParams = (def.params || []).length > 0;
          return (
            <div key={uid} style={{
              background: "#0a0c12", borderRadius: 4,
              border: "1px solid " + (isRender ? "#a78bfa30" : "#1e2230"),
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 8px" }}>
                <span style={{ ...mono10, color: "#3a4050", minWidth: 18 }}>{idx + 1}.</span>
                <span style={{ ...mono10, color: isRender ? "#a78bfa" : "#f472b6", fontWeight: 600, flex: 1 }}>
                  {def.label}

// ─── Export name prompt modal ───
function ExportNameModal({ kind, defaultName, onConfirm, onCancel }) {
  const [name, setName] = useState(defaultName);
  const inputRef = useRef(null);
  useEffect(() => {
    if (inputRef.current) {
      inputRef.current.focus();
      inputRef.current.select();
    }
    function onKey(e) {
      if (e.key === "Escape") onCancel();
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onCancel]);

  const ext = kind === "csv" ? ".csv" : ".html";
  const accent = kind === "csv" ? "#34d399" : "#60a5fa";
  const title = kind === "csv" ? "Export CSV" : "Export HTML Report";

  function submit() {
    const trimmed = name.trim();
    if (!trimmed) return;
    onConfirm(trimmed);
  }

  return (
    <div style={{
      position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
      background: "rgba(5, 7, 12, 0.75)", backdropFilter: "blur(4px)",
      display: "flex", alignItems: "center", justifyContent: "center",
      zIndex: 1000,
    }} onClick={onCancel}>
      <div onClick={e => e.stopPropagation()} style={{
        background: "#0e1018", border: "1px solid " + accent + "40",
        borderRadius: 10, padding: 20, minWidth: 420, maxWidth: 560,
        boxShadow: "0 20px 60px rgba(0,0,0,0.6)",
      }}>
        <div style={{ ...mono10, color: accent, letterSpacing: 1, fontWeight: 600, marginBottom: 12 }}>
          {"\u2913"} {title.toUpperCase()}
        </div>
        <div style={{ ...mono9, color: "#4a5568", marginBottom: 10 }}>
          Name the file (extension is added automatically):
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 0, marginBottom: 14 }}>
          <input
            ref={inputRef}
            type="text"
            value={name}
            onChange={e => setName(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") submit(); }}
            placeholder="My analysis"
            style={{
              flex: 1, background: "#141822",
              border: "1px solid " + accent + "40",
              borderRight: "none",
              color: "#e8ecf4", borderRadius: "5px 0 0 5px",
              padding: "8px 12px",
              fontFamily: "'JetBrains Mono', monospace", fontSize: 13,
              outline: "none",
            }}
          />
          <span style={{
            ...mono10, background: "#0a0c12",
            border: "1px solid " + accent + "40",
            color: accent, padding: "8px 12px",
            borderRadius: "0 5px 5px 0",
          }}>{ext}</span>
        </div>
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
          <button onClick={onCancel} style={{
            ...mono10, background: "transparent", border: "1px solid #1e2230",
            color: "#4a5568", borderRadius: 4, padding: "6px 16px", cursor: "pointer",
          }}>Cancel</button>
          <button onClick={submit}
            disabled={!name.trim()}
            style={{
              ...mono10, fontWeight: 600,
              background: name.trim() ? accent + "20" : "#141822",
              border: "1px solid " + (name.trim() ? accent + "60" : "#1e2230"),
              color: name.trim() ? accent : "#3a4050",
              borderRadius: 4, padding: "6px 16px",
              cursor: name.trim() ? "pointer" : "not-allowed",
            }}>{"\u2913"} Save {ext}</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [textA, setTextA] = useState("");
  const [textB, setTextB] = useState("");
  const [nameA, setNameA] = useState("");
  const [nameB, setNameB] = useState("");
  const [results, setResults] = useState(null);
  const [processing, setProcessing] = useState(false);
  const [selectedCell, setSelectedCell] = useState(null);
  const [expandedMatch, setExpandedMatch] = useState(0);
  const [matchSearch, setMatchSearch] = useState("");
  const [matchPage, setMatchPage] = useState(0);
  const [matchPageSize, setMatchPageSize] = useState(20);
  const [docSearch, setDocSearch] = useState("");
  const [tab, setTab] = useState("heatmap");
  const [chunkMode, setChunkMode] = useState("512");
  const [chunkModeB, setChunkModeB] = useState("512"); // each doc has its own setting; defaults equal
  const [chunkIdRuleA, setChunkIdRuleA] = useState({ kind: "none", value: "" });
  const [chunkIdRuleB, setChunkIdRuleB] = useState({ kind: "none", value: "" });
  const [llmProvider, setLlmProvider] = useState("ollama"); // "ollama" | "openai" | "anthropic"
  const [ollamaUrl, setOllamaUrl] = useState("http://localhost:11434");
  const [ollamaModel, setOllamaModel] = useState("gpt-oss:20b");
  const [ollamaTimeout, setOllamaTimeout] = useState(120); // seconds, 0 = no timeout
  const [ollamaApiKey, setOllamaApiKey] = useState(""); // optional Bearer token
  const [showApiKey, setShowApiKey] = useState(false);
  const [ollamaMaxTokens, setOllamaMaxTokens] = useState(1024); // 0 = unlimited
  const [promptTemplate, setPromptTemplate] = useState(DEFAULT_PROMPT_TEMPLATE);
  const [showPromptEditor, setShowPromptEditor] = useState(false);
  const [customQueries, setCustomQueries] = useState([]);
  const [editingQueryId, setEditingQueryId] = useState(null);

  // ─── Per-label pipeline overrides ───
  const [pipelinesByLabel, setPipelinesByLabel] = useState(() => {
    try {
      const raw = localStorage.getItem("tuo_pipelines_by_label");
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  });
  useEffect(() => {
    try { localStorage.setItem("tuo_pipelines_by_label", JSON.stringify(pipelinesByLabel)); }
    catch (e) {}
  }, [pipelinesByLabel]);
  const [editingPipelineLabel, setEditingPipelineLabel] = useState(null);
  const [exportPrompt, setExportPrompt] = useState(null);
  const [heatmapMode, setHeatmapMode] = useState("AB");
  const [idAliases, setIdAliases] = useState({}); // { idA: idB } — manual key mappings
  const [groupInterps, setGroupInterps] = useState({}); // { groupKey: [{ id, label, text, status }] }

  // Query a group of findings with the LLM
  const queryGroup = useCallback(async (groupKey, title, description, memberSummaries) => {
    const id = "g" + Date.now() + "_" + Math.random().toString(36).slice(2, 5);
    const label = labelForPrompt(promptTemplate, customQueries);
    setGroupInterps(prev => ({
      ...prev,
      [groupKey]: [...(prev[groupKey] || []), { id, label, status: "loading", timestamp: Date.now() }],
    }));
    const prompt = "You are analyzing a group of findings from a document comparison.\n\n"
      + "GROUP: " + title + "\n"
      + "DESCRIPTION: " + description + "\n\n"
      + "MEMBERS (" + memberSummaries.length + "):\n"
      + memberSummaries.map((m, i) => "--- " + (i + 1) + " ---\n" + m).join("\n\n")
      + "\n\nProvide a concise synthesis (3-6 sentences):\n"
      + "1. What pattern connects these findings?\n"
      + "2. What is the practical significance?\n"
      + "3. Are there any outliers or surprises?\n\nBe direct and specific.";
    try {
      const r = await queryLLMRaw(llmProvider, ollamaUrl, ollamaModel, prompt, null, ollamaTimeout * 1000, ollamaApiKey, ollamaMaxTokens);
      setGroupInterps(prev => ({
        ...prev,
        [groupKey]: (prev[groupKey] || []).map(e => e.id === id ? { ...e, status: "done", text: r.text } : e),
      }));
    } catch (err) {
      setGroupInterps(prev => ({
        ...prev,
        [groupKey]: (prev[groupKey] || []).map(e => e.id === id ? { ...e, status: "error", text: err.message } : e),
      }));
    }
  }, [llmProvider, ollamaUrl, ollamaModel, ollamaTimeout, ollamaApiKey, ollamaMaxTokens, promptTemplate, customQueries]);

  // Higher-order query across multiple group results
  const queryHigherOrder = useCallback(async (groupSummaries) => {
    const groupKey = "__higher_order__";
    const id = "h" + Date.now() + "_" + Math.random().toString(36).slice(2, 5);
    const label = "Meta-analysis";
    setGroupInterps(prev => ({
      ...prev,
      [groupKey]: [...(prev[groupKey] || []), { id, label, status: "loading", timestamp: Date.now() }],
    }));
    const prompt = "You are performing a meta-analysis of a document comparison. Below are the synthesis results from multiple analysis groups.\n\n"
      + groupSummaries.map((g, i) => "=== GROUP " + (i + 1) + ": " + g.title + " ===\n" + g.text).join("\n\n")
      + "\n\nProvide a higher-order synthesis (4-8 sentences):\n"
      + "1. What is the overall relationship between these two documents?\n"
      + "2. What are the most significant differences and similarities?\n"
      + "3. What would someone need to know about the evolution between these documents?\n"
      + "4. Any structural or organizational changes worth noting?\n\nBe direct, concrete, and actionable.";
    try {
      const r = await queryLLMRaw(llmProvider, ollamaUrl, ollamaModel, prompt, null, ollamaTimeout * 1000, ollamaApiKey, ollamaMaxTokens);
      setGroupInterps(prev => ({
        ...prev,
        [groupKey]: (prev[groupKey] || []).map(e => e.id === id ? { ...e, status: "done", text: r.text } : e),
      }));
    } catch (err) {
      setGroupInterps(prev => ({
        ...prev,
        [groupKey]: (prev[groupKey] || []).map(e => e.id === id ? { ...e, status: "error", text: err.message } : e),
      }));
    }
  }, [llmProvider, ollamaUrl, ollamaModel, ollamaTimeout, ollamaApiKey, ollamaMaxTokens]);

  const clearGroupInterps = useCallback((groupKey, mode) => {
    setGroupInterps(prev => {
      if (mode === "all") {
        const n = { ...prev };
        delete n[groupKey];
        return n;
      }
      if (mode === "errors") {
        const n = { ...prev };
        n[groupKey] = (n[groupKey] || []).filter(e => e.status !== "error" && e.status !== "timeout");
        if (n[groupKey].length === 0) delete n[groupKey];
        return n;
      }
      // Remove a single result by ID
      const n = { ...prev };
      n[groupKey] = (n[groupKey] || []).filter(e => e.id !== mode);
      if (n[groupKey].length === 0) delete n[groupKey];
      return n;
    });
  }, []);

  const [interpretations, setInterpretations] = useState({});
  const [batchInterpreting, setBatchInterpreting] = useState(false);
  const abortRef = useRef(null);

  // ─── Report mode: hydrate from injected data if loaded as exported report ───
  const reportMode = typeof window !== 'undefined' && window.__TUO_REPORT_MODE__ === true;
  useEffect(() => {
    if (reportMode && window.__TUO_REPORT_DATA__) {
      const d = window.__TUO_REPORT_DATA__;
      if (d.results) setResults(d.results);
      if (d.interpretations) setInterpretations(d.interpretations);
      if (d.pipelinesByLabel && typeof d.pipelinesByLabel === "object") setPipelinesByLabel(d.pipelinesByLabel);
      if (d.idAliases && typeof d.idAliases === "object") setIdAliases(d.idAliases);
      if (d.groupInterps && typeof d.groupInterps === "object") setGroupInterps(d.groupInterps);
    }
  }, [reportMode]);

  const canRun = textA.trim().length > 20 && textB.trim().length > 20;

  // Live preview of chunk count + estimated processing time (cheap estimation, no full tokenize)
  const chunkPreview = useMemo(() => {
    if (!canRun) return null;
    const modeA = chunkMode;
    const modeB = chunkModeB;
    const cA = estimateChunkCount(textA, modeA);
    const cB = estimateChunkCount(textB, modeB);
    const cells = cA * cB;
    const tokA = estimateTokenCount(textA);
    const tokB = estimateTokenCount(textB);
    // Rough vocab estimate: 5-15% of total unique-ish tokens, capped
    const vocab = Math.min(50000, Math.max(100, Math.ceil((tokA + tokB) * 0.08)));
    // Empirical model (rough): vocab build ~ tokens / 2M sec, vectorize ~ chunks*vocab / 50M sec, matrix ~ cells*vocab / 200M sec
    const buildSec = (tokA + tokB) / 2000000;
    const vecSec = (cA + cB) * vocab / 50000000;
    const matrixSec = cells * vocab / 200000000;
    const totalSec = buildSec + vecSec + matrixSec;
    let label, color;
    if (totalSec < 0.5) { label = "instant"; color = "#34d399"; }
    else if (totalSec < 3) { label = "~" + totalSec.toFixed(1) + "s"; color = "#34d399"; }
    else if (totalSec < 15) { label = "~" + Math.ceil(totalSec) + "s"; color = "#f0c040"; }
    else if (totalSec < 60) { label = "~" + Math.ceil(totalSec) + "s"; color = "#f59e42"; }
    else if (totalSec < 300) { label = "~" + Math.ceil(totalSec / 60) + "m"; color = "#f59e42"; }
    else { label = "~" + Math.ceil(totalSec / 60) + "m \u26A0"; color = "#f87171"; }
    return { cA, cB, cells, tokA, tokB, totalSec, label, color, splitModes: modeA !== modeB };
  }, [textA, textB, chunkMode, chunkModeB, canRun]);

  const analyze = useCallback(() => {
    setProcessing(true); setResults(null); setSelectedCell(null);
    setExpandedMatch(0); setInterpretations({});
    setTimeout(() => {
      try {
        const modeA = chunkMode;
        const modeB = chunkModeB;
        const cA = chunkDocument(textA, modeA);
        const cB = chunkDocument(textB, modeB);
        // Build a single shared vocabulary so the three matrices use the same TF-IDF basis
        const allChunks = [...cA, ...cB];
        const { vocab, idf } = buildVocabulary(allChunks);
        const vA = cA.map(c => tfidfVector(c, vocab, idf));
        const vB = cB.map(c => tfidfVector(c, vocab, idf));
        // Cross matrix (A x B)
        const matrix = vA.map(a => vB.map(b => cosineSimilarity(a, b)));
        // Self matrices (symmetric, diagonal = 1)
        const matrixAA = vA.map((a, i) => vA.map((aa, ii) => i === ii ? 1 : cosineSimilarity(a, aa)));
        const matrixBB = vB.map((b, j) => vB.map((bb, jj) => j === jj ? 1 : cosineSimilarity(b, bb)));
        const pairs = [];
        for (let i = 0; i < matrix.length; i++)
          for (let j = 0; j < matrix[0].length; j++)
            pairs.push({ i, j, score: matrix[i][j] });
        pairs.sort((a, b) => b.score - a.score);
        const scores = pairs.map(p => p.score);
        const labelOf = (m) => {
          if (m === "row") return "Row/Sent";
          if (m === "sentence") return "Sentence";
          if (m === "paragraph") return "Paragraph";
          if (m === "page") return "Page";
          if (typeof m === "string" && m.startsWith("tag:")) return "<" + m.slice(4) + ">";
          if (typeof m === "string" && m.startsWith("section:")) return "\u00A7 " + m.slice(8);
          return m + " tok";
        };
        setResults({
          chunksA: cA, chunksB: cB, matrix, matrixAA, matrixBB, pairs, vocabSize: vocab.length,
          stats: { avg: scores.reduce((a,b) => a+b, 0)/scores.length, max: scores[0], highCount: scores.filter(s => s > 0.3).length },
          drillLabel: modeA === modeB ? labelOf(modeA) : labelOf(modeA) + " / " + labelOf(modeB),
          modeA: modeA, modeB: modeB,
          nameA: nameA || "Document A", nameB: nameB || "Document B",
        });
      } catch (err) { console.error(err); }
      setProcessing(false);
    }, 50);
  }, [textA, textB, chunkMode, chunkModeB, nameA, nameB]);

  // ─── Reactive chunk IDs — recompute instantly when the ID rule changes ───
  // No re-analysis needed: chunks and matrix stay the same, only the ID mapping updates.
  const chunkIdsA = useMemo(() => {
    if (!results || !results.chunksA) return null;
    // In report mode, textA is empty — fall back to baked-in IDs
    if (!textA && results.chunkIdsA) return results.chunkIdsA;
    const ids = extractChunkIds(results.chunksA, textA, chunkIdRuleA);
    // If extraction produced nothing (all null), fall back to baked IDs
    if (ids && !ids.some(x => x) && results.chunkIdsA) return results.chunkIdsA;
    return ids;
  }, [results && results.chunksA, textA, chunkIdRuleA]);
  const chunkIdsB = useMemo(() => {
    if (!results || !results.chunksB) return null;
    if (!textB && results.chunkIdsB) return results.chunkIdsB;
    const ids = extractChunkIds(results.chunksB, textB, chunkIdRuleB);
    if (ids && !ids.some(x => x) && results.chunkIdsB) return results.chunkIdsB;
    return ids;
  }, [results && results.chunksB, textB, chunkIdRuleB]);

  // ─── Auto-optimize chunk IDs — find the rule that maximizes cross-doc matches ───
  const autoOptimizeIds = useCallback(() => {
    if (!results || !results.chunksA || !results.chunksB) return;
    const cA = results.chunksA;
    const cB = results.chunksB;

    // Build candidate rules based on doc content
    const candidates = [];
    // Regex candidates — common structural patterns
    const regexCandidates = [
      { value: "^#{1,6}\\s+(.+)", label: "Markdown heading" },
      { value: "^(\\d+\\.\\d+(?:\\.\\d+)*)", label: "Section number" },
      { value: "^(\\w[\\w\\s]{2,40}):", label: "Label before colon" },
      { value: "^(?:Article|Section|Clause|Part)\\s+(\\S+)", label: "Article/Section ref" },
    ];
    regexCandidates.forEach(r => candidates.push({ kind: "regex", value: r.value, label: r.label }));

    // Heading candidate
    candidates.push({ kind: "heading", value: "", label: "Heading (h1-h6)" });

    // XML tag candidates (if XML detected)
    if (isXML(textA) || isXML(textB)) {
      const tagsA = collectXMLTagNames(textA);
      const tagsB = collectXMLTagNames(textB);
      const allTagNames = new Set([...tagsA.map(t => t.name), ...tagsB.map(t => t.name)]);
      allTagNames.forEach(name => {
        if (/^h[1-6]$/.test(name)) return; // covered by heading
        candidates.push({ kind: "xml-tag", value: name, label: "<" + name + ">" });
        candidates.push({ kind: "xml-tag", value: "@" + name, label: "@" + name + " attr" });
      });
    }

    // CSV column candidates
    if (isCSV(textA)) {
      const rows = parseCSVLines(textA);
      if (rows.length > 0) {
        const delim = detectDelimiter(rows[0]);
        const cols = parseCSVCells(rows[0], delim).map(h => h.replace(/^"|"$/g, ""));
        cols.forEach(c => candidates.push({ kind: "column", value: c, label: "Col: " + c }));
      }
    }

    // Score each candidate: extract IDs from both sides, count intersection
    const scored = [];
    for (const cand of candidates) {
      const rule = { kind: cand.kind, value: cand.value };
      const idsA = extractChunkIds(cA, textA, rule) || [];
      const idsB = extractChunkIds(cB, textB, rule) || [];
      const setA = new Set(idsA.filter(x => x));
      const setB = new Set(idsB.filter(x => x));
      const uniqueA = setA.size;
      const uniqueB = setB.size;
      let intersection = 0;
      setA.forEach(id => { if (setB.has(id)) intersection++; });
      const coverage = Math.min(uniqueA, uniqueB) > 0 ? intersection / Math.min(uniqueA, uniqueB) : 0;
      if (intersection > 0) {
        scored.push({ ...cand, intersection, uniqueA, uniqueB, coverage });
      }
    }

    scored.sort((a, b) => b.intersection - a.intersection || b.coverage - a.coverage);
    if (scored.length === 0) {
      alert("No candidate ID rules produced any cross-document matches.");
      return;
    }

    // Apply the best rule to both sides
    const best = scored[0];
    const rule = { kind: best.kind, value: best.value };
    setChunkIdRuleA(rule);
    setChunkIdRuleB(rule);

    // Show summary
    const top3 = scored.slice(0, 3).map(s =>
      s.label + ": " + s.intersection + " matches (" + Math.round(s.coverage * 100) + "% coverage)"
    ).join("\n");
    alert("Applied: " + best.label + "\n" + best.intersection + " shared IDs, " + Math.round(best.coverage * 100) + "% coverage\n\nTop candidates:\n" + top3);
  }, [results, textA, textB]);




  const interpretPair = useCallback(async (i, j, score, cA, cB, queryOrTemplate, labelOverride) => {

    const apiKey = (query.apiKey != null && query.apiKey !== "") ? query.apiKey : ollamaApiKey;
    const timeoutMs = (query.timeout != null && query.timeout >= 0 ? query.timeout : ollamaTimeout) * 1000;
    const maxTokens = (query.maxTokens != null && query.maxTokens >= 0) ? query.maxTokens : ollamaMaxTokens;

    const k = i+"-"+j;
    const id = newInterpId();
    const ts = Date.now();
    setInterpretations(p => {
      const list = getInterps(p, k);
      return { ...p, [k]: [...list, { id, label, status: "loading", timestamp: ts }] };
    });
    try {
      const ctx = {
        nameA: nameA || (results && results.nameA) || "Document A",
        nameB: nameB || (results && results.nameB) || "Document B",
        indexA: i, indexB: j,
        idA: results && chunkIdsA ? chunkIdsA[i] : "",
        idB: results && chunkIdsB ? chunkIdsB[j] : "",
      };
      const r = await queryLLM(provider, url, model, cA, cB, score, null, tmpl, timeoutMs, apiKey, maxTokens, ctx);
      setInterpretations(p => {
        const list = getInterps(p, k);
        return { ...p, [k]: list.map(e => e.id === id ? { ...e, response: r, status: "done" } : e) };
      });
    } catch (err) {
      const isTimeout = err.name === "TimeoutError";
      setInterpretations(p => {
        const list = getInterps(p, k);
        return { ...p, [k]: list.map(e => e.id === id ? { ...e, status: isTimeout ? "timeout" : "error", error: err.message } : e) };
      });
    }

  const [batchProgress, setBatchProgress] = useState(null); // { done, total, pairIdx, pairTotal }

  const runBatch = useCallback(async (queries, scope, opts) => {
    if (!results || !queries || queries.length === 0) return;
    setBatchInterpreting(true);
    const ctrl = new AbortController();
    abortRef.current = ctrl;

    let targets;

          const apiKey = (q.apiKey != null && q.apiKey !== "") ? q.apiKey : ollamaApiKey;
          const timeoutMs = (q.timeout != null && q.timeout >= 0 ? q.timeout : ollamaTimeout) * 1000;
          const maxTokens = (q.maxTokens != null && q.maxTokens >= 0) ? q.maxTokens : ollamaMaxTokens;
          setInterpretations(p => {
            const list = getInterps(p, k);
            return { ...p, [k]: [...list, { id, label: q.label, status: "loading", timestamp: ts }] };
          });
          try {
            const ctx = {
              nameA: results.nameA || "Document A",
              nameB: results.nameB || "Document B",
              indexA: m.i, indexB: m.j,
              idA: chunkIdsA ? chunkIdsA[m.i] : "",
              idB: chunkIdsB ? chunkIdsB[m.j] : "",
            };
            const r = await queryLLM(provider, url, model, results.chunksA[m.i], results.chunksB[m.j], m.score, ctrl.signal, q.template, timeoutMs, apiKey, maxTokens, ctx);
            setInterpretations(p => {
              const list = getInterps(p, k);
              return { ...p, [k]: list.map(e => e.id === id ? { ...e, response: r, status: "done" } : e) };
            });
          } catch (err) {
            if (err.name === "AbortError" && ctrl.signal.aborted) {
              // Strip the cancelled placeholder
              setInterpretations(p => {
                const list = getInterps(p, k).filter(e => e.id !== id);
                const cp = { ...p };
                if (list.length === 0) delete cp[k]; else cp[k] = list;
                return cp;
              });

            }
            const isTimeout = err.name === "TimeoutError";
            setInterpretations(p => {
              const list = getInterps(p, k);
              return { ...p, [k]: list.map(e => e.id === id ? { ...e, status: isTimeout ? "timeout" : "error", error: err.message } : e) };
            });
          } finally {
            done += 1;
            setBatchProgress(p => p ? { ...p, done } : null);
          }
        });

                      {" \u27F7 "}
                      <span style={{ color: rightColor }}>{heatmapMode === "AA" ? "A" : (heatmapMode === "BB" ? "B" : "B")}{selectedCell[1]+1}</span>
                      {" \u00B7 " + (activeMatrix[selectedCell[0]][selectedCell[1]]*100).toFixed(1) + "%"}
                      {heatmapMode !== "AB" && selectedCell[0] === selectedCell[1] && (
                        <span style={{ color: "#3a4050", marginLeft: 8, fontWeight: 400 }}>{"\u00B7"} self-pair (diagonal)</span>
                      )}
                    </div>
                    <div style={{ display: "flex", gap: 12 }}>
                      <div style={{ flex: "1 1 50%", minWidth: 0, borderLeft: "3px solid " + leftColor + "20", padding: "8px 12px", overflow: "hidden" }}>
                        <div style={{ ...mono9, color: leftColor, marginBottom: 6 }}>{leftName.toUpperCase()} {"\u00B7"} CHUNK {selectedCell[0]+1}</div>
                        <ChunkContent text={leftChunks[selectedCell[0]]} maxLen={400} fontSize={12} />
                      </div>
                      <div style={{ flex: "1 1 50%", minWidth: 0, borderLeft: "3px solid " + rightColor + "20", padding: "8px 12px", overflow: "hidden" }}>
                        <div style={{ ...mono9, color: rightColor, marginBottom: 6 }}>{rightName.toUpperCase()} {"\u00B7"} CHUNK {selectedCell[1]+1}</div>
                        <ChunkContent text={rightChunks[selectedCell[1]]} maxLen={400} fontSize={12} />
                      </div>
                    </div>
                    {heatmapMode === "AB" && (
                      <InterpretBtn
                        i={selectedCell[0]} j={selectedCell[1]}
                        score={results.matrix[selectedCell[0]][selectedCell[1]]}
                        chunkA={results.chunksA[selectedCell[0]]}
                        chunkB={results.chunksB[selectedCell[1]]}
                        interps={getInterps(interpretations, selectedCell[0]+"-"+selectedCell[1])}
                        currentLabel={labelForPrompt(promptTemplate, customQueries)}
                        customQueries={customQueries}
                        readOnly={reportMode}
                        pipelinesByLabel={pipelinesByLabel}
                        onInterpret={interpretPair}
                        onRemove={removeInterp}
                      />
                    )}
                  </div>
                )}
              </div>
              </FullscreenPanel>
              );
            })()}

            {tab === "matches" && (() => {
              const q = matchSearch.trim().toLowerCase();
              const filtered = q
                ? topMatches.filter(m => {
                    const aTxt = (results.chunksA[m.i] || "").toLowerCase();
                    const bTxt = (results.chunksB[m.j] || "").toLowerCase();
                    const aLabel = "a" + (m.i + 1);
                    const bLabel = "b" + (m.j + 1);
                    return aTxt.includes(q) || bTxt.includes(q) || aLabel === q || bLabel === q || aLabel.startsWith(q) || bLabel.startsWith(q);
                  })
                : topMatches;
              const totalPages = Math.max(1, Math.ceil(filtered.length / matchPageSize));
              const curPage = Math.min(matchPage, totalPages - 1);
              const pageStart = curPage * matchPageSize;
              const pageSlice = filtered.slice(pageStart, pageStart + matchPageSize);
              return (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {/* Search + pagination controls */}
                <div style={{
                  display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap",
                  background: "#0e1018", borderRadius: 8, padding: "8px 12px",
                  border: "1px solid #1e2230",
                }}>
                  <span style={{ ...mono9, color: "#3a4050", letterSpacing: 1 }}>{"\u{1F50D}"} SEARCH</span>
                  <input
                    type="text"
                    value={matchSearch}
                    onChange={e => { setMatchSearch(e.target.value); setMatchPage(0); }}
                    placeholder="text within chunks, or A3 / B7"
                    style={{
                      flex: 1, minWidth: 160,
                      background: "#141822", border: "1px solid #1e2230",
                      color: matchSearch ? "#f0c040" : "#9ca3af",
                      borderRadius: 4, padding: "4px 10px", ...mono10, outline: "none",
                    }}
                  />
                  {matchSearch && (
                    <button onClick={() => { setMatchSearch(""); setMatchPage(0); }} style={{
                      ...mono9, background: "transparent", border: "1px solid #1e2230",
                      color: "#4a5568", borderRadius: 3, padding: "3px 8px", cursor: "pointer",
                    }}>{"\u2715"} clear</button>
                  )}
                  <span style={{ ...mono9, color: "#3a4050" }}>{"\u00B7"}</span>
                  <span style={{ ...mono10, color: "#9ca3af" }}>
                    {filtered.length.toLocaleString()} {filtered.length === 1 ? "match" : "matches"}
                    {matchSearch && topMatches.length !== filtered.length && (
                      <span style={{ color: "#3a4050" }}> of {topMatches.length.toLocaleString()}</span>
                    )}
                  </span>
                  <span style={{ ...mono9, color: "#3a4050", marginLeft: "auto" }}>per page</span>
                  <select value={matchPageSize}
                    onChange={e => { setMatchPageSize(Number(e.target.value)); setMatchPage(0); }}
                    style={{
                      background: "#141822", border: "1px solid #1e2230", color: "#9ca3af",
                      borderRadius: 4, padding: "3px 6px", ...mono10, cursor: "pointer", outline: "none",
                    }}>
                    {[10, 20, 50, 100].map(n => <option key={n} value={n}>{n}</option>)}
                  </select>
                </div>

                {/* Pagination nav top */}
                {filtered.length > matchPageSize && (
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                    <button onClick={() => setMatchPage(0)} disabled={curPage === 0} style={{
                      ...mono9, background: curPage === 0 ? "#141822" : "#f0c04018",
                      border: "1px solid " + (curPage === 0 ? "#1e2230" : "#f0c04040"),
                      color: curPage === 0 ? "#3a4050" : "#f0c040",
                      borderRadius: 3, padding: "3px 8px", cursor: curPage === 0 ? "not-allowed" : "pointer",
                    }}>{"\u00AB"} first</button>
                    <button onClick={() => setMatchPage(p => Math.max(0, p - 1))} disabled={curPage === 0} style={{
                      ...mono9, background: curPage === 0 ? "#141822" : "#f0c04018",
                      border: "1px solid " + (curPage === 0 ? "#1e2230" : "#f0c04040"),
                      color: curPage === 0 ? "#3a4050" : "#f0c040",
                      borderRadius: 3, padding: "3px 8px", cursor: curPage === 0 ? "not-allowed" : "pointer",
                    }}>{"\u2039"} prev</button>
                    <span style={{ ...mono10, color: "#9ca3af", padding: "0 6px" }}>
                      page <span style={{ color: "#f0c040", fontWeight: 600 }}>{curPage + 1}</span>
                      <span style={{ color: "#3a4050" }}> / {totalPages}</span>
                      <span style={{ color: "#3a4050" }}>
                        {" \u00B7 #"}{pageStart + 1}-{Math.min(pageStart + matchPageSize, filtered.length)}
                      </span>
                    </span>
                    <button onClick={() => setMatchPage(p => Math.min(totalPages - 1, p + 1))} disabled={curPage >= totalPages - 1} style={{
                      ...mono9, background: curPage >= totalPages - 1 ? "#141822" : "#f0c04018",
                      border: "1px solid " + (curPage >= totalPages - 1 ? "#1e2230" : "#f0c04040"),
                      color: curPage >= totalPages - 1 ? "#3a4050" : "#f0c040",
                      borderRadius: 3, padding: "3px 8px", cursor: curPage >= totalPages - 1 ? "not-allowed" : "pointer",
                    }}>next {"\u203A"}</button>
                    <button onClick={() => setMatchPage(totalPages - 1)} disabled={curPage >= totalPages - 1} style={{
                      ...mono9, background: curPage >= totalPages - 1 ? "#141822" : "#f0c04018",
                      border: "1px solid " + (curPage >= totalPages - 1 ? "#1e2230" : "#f0c04040"),
                      color: curPage >= totalPages - 1 ? "#3a4050" : "#f0c040",
                      borderRadius: 3, padding: "3px 8px", cursor: curPage >= totalPages - 1 ? "not-allowed" : "pointer",
                    }}>last {"\u00BB"}</button>
                  </div>
                )}

                {pageSlice.length === 0 && (
                  <div style={{
                    ...mono10, color: "#3a4050", padding: "32px 12px", textAlign: "center",
                    background: "#0e1018", borderRadius: 8, border: "1px solid #1e2230",
                  }}>
                    {matchSearch ? "No matches found for \"" + matchSearch + "\"" : "No matches"}
                  </div>
                )}

                {pageSlice.map((m, idx) => {
                  const k = m.i+"-"+m.j;
                  const globalRank = topMatches.indexOf(m) + 1;
                  const localIdx = pageStart + idx;
                  return (
                    <MatchCard key={k} rank={globalRank} i={m.i} j={m.j} score={m.score}
                      chunkA={results.chunksA[m.i]} chunkB={results.chunksB[m.j]}
                      isExpanded={expandedMatch === localIdx}
                      onToggle={() => setExpandedMatch(expandedMatch === localIdx ? -1 : localIdx)}
                      interps={getInterps(interpretations, k)}
                      currentLabel={labelForPrompt(promptTemplate, customQueries)}
                      customQueries={customQueries}
                      readOnly={reportMode}
                      pipelinesByLabel={pipelinesByLabel}
                      onInterpret={interpretPair}
                      onRemove={removeInterp}
                      idA={chunkIdsA && chunkIdsA[m.i]}
                      idB={chunkIdsB && chunkIdsB[m.j]}
                      nameA={results.nameA} nameB={results.nameB}
                    />
                  );
                })}
              </div>
              );
            })()}

            {tab === "interpretation" && (
              <InterpretationView
                results={results}
                interpretations={interpretations}
                onInterpret={interpretPair}
                onRemove={removeInterp}
                customQueries={customQueries}
                readOnly={reportMode}
                pipelinesByLabel={pipelinesByLabel}
                currentLabel={labelForPrompt(promptTemplate, customQueries)}
                simThreshold={0.3}
                chunkIdsA={chunkIdsA}
                chunkIdsB={chunkIdsB}
                groupInterps={groupInterps}
                onQueryGroup={queryGroup}
                onQueryHigherOrder={queryHigherOrder}
                onClearGroupInterps={clearGroupInterps}
              />
            )}

            {tab === "by id" && (() => {
              // Build map: id -> { aIndices: [], bIndices: [] }
              // Apply idAliases: if idAliases[idA] = idB, group A chunks under idB
              const idMap = new Map();
              const idsA = chunkIdsA || [];
              const idsB = chunkIdsB || [];
              idsA.forEach((id, i) => {
                if (!id) return;
                const mapped = idAliases[id] || id;
                if (!idMap.has(mapped)) idMap.set(mapped, { aIndices: [], bIndices: [], aliasedFrom: null });
                idMap.get(mapped).aIndices.push(i);
                if (idAliases[id]) idMap.get(mapped).aliasedFrom = id;
              });
              idsB.forEach((id, j) => {
                if (!id) return;
                if (!idMap.has(id)) idMap.set(id, { aIndices: [], bIndices: [], aliasedFrom: null });
                idMap.get(id).bIndices.push(j);
              });
              const allIds = Array.from(idMap.keys()).sort((a, b) => {
                const an = parseFloat(a), bn = parseFloat(b);
                if (!isNaN(an) && !isNaN(bn) && String(an) === a && String(bn) === b) return an - bn;
                return a.localeCompare(b, undefined, { numeric: true });
              });
              // Near-match detection: find unmatched A and B IDs with high string similarity
              const unmatchedA = [];
              const unmatchedB = [];
              allIds.forEach(id => {
                const e = idMap.get(id);
                if (e.aIndices.length > 0 && e.bIndices.length === 0) unmatchedA.push(id);
                if (e.bIndices.length > 0 && e.aIndices.length === 0) unmatchedB.push(id);
              });
              // Also collect raw A-side IDs that were aliased (their original IDs)
              const rawUnmatchedA = unmatchedA.map(id => {
                const e = idMap.get(id);
                return e.aliasedFrom || idsA[e.aIndices[0]] || id;
              });
              const nearMatches = [];
              for (let ai = 0; ai < unmatchedA.length; ai++) {
                const aId = rawUnmatchedA[ai];
                let bestSim = 0, bestBId = null;
                for (const bId of unmatchedB) {
                  const sim = idSimilarity(aId, bId);
                  if (sim > bestSim) { bestSim = sim; bestBId = bId; }
                }
                if (bestSim >= 0.4 && bestBId) {
                  nearMatches.push({ aId: aId, bId: bestBId, sim: bestSim, mapKey: unmatchedA[ai] });
                }
              }
              nearMatches.sort((a, b) => b.sim - a.sim);
              return (
                <div>
                  <ByIdView
                    allIds={allIds}
                    idMap={idMap}
                    chunksA={results.chunksA}
                    chunksB={results.chunksB}
                    matrix={results.matrix}
                    interpretations={interpretations}
                    nameA={results.nameA}
                    nameB={results.nameB}
                    onInterpret={interpretPair}
                    onRemove={removeInterp}
                    customQueries={customQueries}
                    readOnly={reportMode}
                    pipelinesByLabel={pipelinesByLabel}
                    currentLabel={labelForPrompt(promptTemplate, customQueries)}
                    idAliases={idAliases}
                    nearMatches={nearMatches}
                    onLink={(aId, bId) => setIdAliases(prev => ({ ...prev, [aId]: bId }))}
                    onUnlink={(aId) => setIdAliases(prev => { const n = { ...prev }; delete n[aId]; return n; })}
                    groupInterps={groupInterps}
                    onQueryGroup={queryGroup}
                    onQueryHigherOrder={queryHigherOrder}
                    onClearGroupInterps={clearGroupInterps}
                  />
                </div>
              );
            })()}

            {tab === "documents" && (
              <FullscreenPanel label="DOCUMENT VIEW">
              <DocumentView
                chunksA={results.chunksA}
                chunksB={results.chunksB}
                matrix={results.matrix}
                interpretations={interpretations}
                onInterpret={interpretPair}
                onRemove={removeInterp}
                currentLabel={labelForPrompt(promptTemplate, customQueries)}
                customQueries={customQueries}
                readOnly={reportMode}
                pipelinesByLabel={pipelinesByLabel}
                search={docSearch}
                onSearchChange={setDocSearch}
                nameA={results.nameA} nameB={results.nameB}
              />
              </FullscreenPanel>
            )}


          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
