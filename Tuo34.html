                    { f: "maxTokens", l: "MAX TOKENS", t: "number", ph: String(ollamaMaxTokens) },
                  ].map(row => (
                    <div key={row.f} style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                      <span style={{ ...mono9, color: "#4a5568", width: 90 }}>{row.l}</span>
                      <input type={row.t} value={draft[row.f]}
                        onChange={e => setDraft({ ...draft, [row.f]: e.target.value })}
                        placeholder={row.ph}
                        style={{
                          flex: 1, background: "#0a0c12", border: "1px solid #1e2230",
                          color: draft[row.f] !== "" ? "#f0c040" : "#3a4050",
                          borderRadius: 3, padding: "3px 6px", ...mono10, outline: "none",
                        }}
                      />
                    </div>
                  ))}
                </div>
              )}

              {/* Per-query custom output pipeline */}
              <div style={{ marginBottom: 8 }}>
                <button onClick={() => setShowQueryPipeline(!showQueryPipeline)} style={{
                  ...mono9, background: showQueryPipeline ? "#f472b620" : "#141822",
                  border: "1px solid " + (showQueryPipeline ? "#f472b650" : "#1e2230"),
                  color: showQueryPipeline ? "#f472b6" : "#4a5568",
                  borderRadius: 3, padding: "3px 10px", cursor: "pointer",
                }}>{"\u2699"} {showQueryPipeline
                  ? "hide custom output pipeline" + (draft.postProcessors && draft.postProcessors.length > 0 ? " (" + draft.postProcessors.length + " step" + (draft.postProcessors.length === 1 ? "" : "s") + ")" : "")
                  : "set custom output pipeline\u2026"}</button>
              </div>
              {showQueryPipeline && (
                <div style={{ marginBottom: 8, paddingLeft: 12, borderLeft: "2px solid #f472b630" }}>
                  <div style={{ ...mono9, color: "#3a4050", marginBottom: 6 }}>
                    Steps applied only to responses from this query (overrides the global pipeline). Empty = use global.
                  </div>
                  <PostProcessorPanel
                    pipeline={draft.postProcessors || []}
                    onChange={pp => setDraft({ ...draft, postProcessors: pp })}
                  />
                </div>
              )}

              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={saveDraft}
                  disabled={!draft.label.trim() || !draft.template.trim()}
                  style={{
                    ...mono10, fontWeight: 600,
                    background: (draft.label.trim() && draft.template.trim()) ? "#34d39920" : "#141822",
                    border: "1px solid " + ((draft.label.trim() && draft.template.trim()) ? "#34d39950" : "#1e2230"),
                    color: (draft.label.trim() && draft.template.trim()) ? "#34d399" : "#3a4050",
                    borderRadius: 4, padding: "5px 14px",
                    cursor: (draft.label.trim() && draft.template.trim()) ? "pointer" : "not-allowed",
                  }}>{editingId ? "Save changes" : "+ Save query"}</button>
              </div>
            </div>
          )}

          {/* Scope selector */}
          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>
            <span style={{ ...mono9, color: "#4a5568", letterSpacing: 1 }}>SCOPE</span>
            <label style={{ display: "flex", alignItems: "center", gap: 4, ...mono10, color: scopeType === "topN" ? "#f59e42" : "#4a5568", cursor: "pointer" }}>
              <input type="radio" name="scope" checked={scopeType === "topN"} onChange={() => setScopeType("topN")} style={{ accentColor: "#f59e42" }} />
              Top
              <input type="number" min={1} max={totalPairs} value={scopeN}
                onChange={e => setScopeN(Math.max(1, Math.min(totalPairs, Number(e.target.value) || 1)))}
                onClick={() => setScopeType("topN")}
                style={{
                  width: 60, background: "#141822", border: "1px solid #1e2230",
                  color: scopeType === "topN" ? "#f59e42" : "#9ca3af",
                  borderRadius: 3, padding: "2px 6px", ...mono10, textAlign: "right", outline: "none",
                }}
              />
              matches
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 4, ...mono10, color: scopeType === "minScore" ? "#f59e42" : "#4a5568", cursor: "pointer" }}>
              <input type="radio" name="scope" checked={scopeType === "minScore"} onChange={() => setScopeType("minScore")} style={{ accentColor: "#f59e42" }} />
              {"\u2265"}
              <input type="number" min={0} max={100} value={scopeMin}
                onChange={e => setScopeMin(Math.max(0, Math.min(100, Number(e.target.value) || 0)))}
                onClick={() => setScopeType("minScore")}
                style={{
                  width: 50, background: "#141822", border: "1px solid #1e2230",
                  color: scopeType === "minScore" ? "#f59e42" : "#9ca3af",
                  borderRadius: 3, padding: "2px 6px", ...mono10, textAlign: "right", outline: "none",
                }}
              />
              %
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 4, ...mono10, color: scopeType === "all" ? "#f59e42" : "#4a5568", cursor: "pointer" }}>
              <input type="radio" name="scope" checked={scopeType === "all"} onChange={() => setScopeType("all")} style={{ accentColor: "#f59e42" }} />
              All ({totalPairs})
            </label>
          </div>

          {/* Upper bound — skip near-perfect matches */}
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 6, ...mono10, color: scopeMaxEnabled ? "#f87171" : "#4a5568", cursor: "pointer" }}>
              <input type="checkbox" checked={scopeMaxEnabled}
                onChange={e => setScopeMaxEnabled(e.target.checked)}
                style={{ accentColor: "#f87171" }}
              />
              Exclude matches
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 4, ...mono10, color: scopeMaxEnabled ? "#f87171" : "#3a4050" }}>
              {"\u2265"}
              <input type="number" min={1} max={100} value={scopeMax}
                onChange={e => { setScopeMax(Math.max(1, Math.min(100, Number(e.target.value) || 100))); if (!scopeMaxEnabled) setScopeMaxEnabled(true); }}
                disabled={!scopeMaxEnabled}
                style={{
                  width: 50, background: "#141822",
                  border: "1px solid " + (scopeMaxEnabled ? "#f8717140" : "#1e2230"),
                  color: scopeMaxEnabled ? "#f87171" : "#3a4050",
                  borderRadius: 3, padding: "2px 6px", ...mono10, textAlign: "right", outline: "none",
                }}
              />
              %
            </label>
            <span style={{ ...mono9, color: "#3a4050", fontStyle: "italic" }}>
              skip trivially-identical pairs
            </span>
          </div>

          {/* Options */}
          <div style={{ marginBottom: 10 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 6, ...mono9, color: "#4a5568", cursor: "pointer" }}>
              <input type="checkbox" checked={skipDup} onChange={e => setSkipDup(e.target.checked)} style={{ accentColor: "#34d399" }} />
              Skip pairs already answered with the same query
            </label>
          </div>

          {/* Run / Stop */}
          {!isRunning ? (
            <button onClick={handleRun} disabled={selectedQueries.length === 0 || targetCount === 0} style={{
              ...mono10, fontWeight: 600, letterSpacing: 1, textTransform: "uppercase",
              background: (selectedQueries.length > 0 && targetCount > 0) ? "linear-gradient(135deg, #f59e42, #f0c040)" : "#1a1e28",
              color: (selectedQueries.length > 0 && targetCount > 0) ? "#0a0c12" : "#3a4050",
              border: "none", borderRadius: 5, padding: "8px 20px", width: "100%",
              cursor: (selectedQueries.length > 0 && targetCount > 0) ? "pointer" : "not-allowed",
              transition: "all 0.2s",
            }}>
              {"\u25B6"} Run {selectedQueries.length} {selectedQueries.length === 1 ? "query" : "queries"} {"\u00D7"} {targetCount} {targetCount === 1 ? "pair" : "pairs"}{scopeMaxEnabled ? " (then filter \u2265" + scopeMax + "%)" : ""} = {totalCalls} {totalCalls === 1 ? "call max" : "calls max"}
            </button>
          ) : (
            <div>
              <div style={{
                width: "100%", height: 6, background: "#141822", borderRadius: 3, overflow: "hidden",
                marginBottom: 6,
              }}>
                <div style={{
                  width: progress ? (progress.done / progress.total * 100) + "%" : "0%",
                  height: "100%", background: "linear-gradient(90deg, #f59e42, #f0c040)",
                  transition: "width 0.2s",
                }} />
              </div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <span style={{ ...mono9, color: "#f59e42" }}>
                  {progress ? `${progress.done}/${progress.total} done \u00B7 pair ${progress.pairIdx}/${progress.pairTotal}` : "Starting..."}
                </span>
                <button onClick={onStop} style={{
                  ...mono9, fontWeight: 600,
                  background: "#f8717118", border: "1px solid #f8717140",
                  color: "#f87171", borderRadius: 4, padding: "3px 12px", cursor: "pointer",
                }}>{"\u25A0"} Stop</button>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ─── Theme editor: name, tagline, mode, accent ───
function ThemeEditor({ activeTheme, isCustom, onSave, onDelete }) {
  const [draft, setDraft] = useState({
    label: activeTheme.label,
    appName: activeTheme.appName,
    tagline: activeTheme.tagline,
    mode: activeTheme.mode,
    accent: activeTheme.accent,

  // Reset draft when active theme changes
  useEffect(() => {
    setDraft({
      label: activeTheme.label,
      appName: activeTheme.appName,
      tagline: activeTheme.tagline,
      mode: activeTheme.mode,
      accent: activeTheme.accent,

  const dirty =
    draft.label !== activeTheme.label ||
    draft.appName !== activeTheme.appName ||
    draft.tagline !== activeTheme.tagline ||
    draft.mode !== activeTheme.mode ||

        <span style={{ ...mono9, color: "#4a5568" }}>NAME</span>

          onChange={e => setDraft({ ...draft, label: e.target.value })}

            color: "#9ca3af", borderRadius: 3, padding: "3px 6px", ...mono10, outline: "none",
          }}
        />
        <span style={{ ...mono9, color: "#4a5568" }}>APP NAME</span>

          onChange={e => setDraft({ ...draft, appName: e.target.value })}
          placeholder="Tuo"
          style={{
            background: "#0a0c12", border: "1px solid #1e2230",
            color: "#e8ecf4", borderRadius: 3, padding: "3px 6px", ...mono10, outline: "none", fontWeight: 600,
          }}
        />
        <span style={{ ...mono9, color: "#4a5568" }}>TAGLINE</span>
        <input type="text" value={draft.tagline}
          onChange={e => setDraft({ ...draft, tagline: e.target.value })}
          placeholder="VECTOR ANALYSIS"
          style={{
            background: "#0a0c12", border: "1px solid #1e2230",
            color: draft.accent, borderRadius: 3, padding: "3px 6px", ...mono10, outline: "none", letterSpacing: 1,
          }}
        />
        <span style={{ ...mono9, color: "#4a5568" }}>MODE</span>
        <div style={{ display: "flex", gap: 4 }}>
          {["dark", "light"].map(m => (
            <button key={m}
              onClick={() => setDraft({ ...draft, mode: m })}
              style={{
                ...mono10, flex: 1,
                background: draft.mode === m ? "#a78bfa20" : "#141822",
                border: "1px solid " + (draft.mode === m ? "#a78bfa50" : "#1e2230"),
                color: draft.mode === m ? "#a78bfa" : "#4a5568",
                borderRadius: 3, padding: "3px 6px", cursor: "pointer", textTransform: "uppercase",
              }}>{m}</button>
          ))}
        </div>
        <span style={{ ...mono9, color: "#4a5568" }}>ACCENT</span>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <input type="color" value={draft.accent}
            onChange={e => setDraft({ ...draft, accent: e.target.value })}
            style={{ width: 30, height: 24, background: "transparent", border: "1px solid #1e2230", borderRadius: 3, cursor: "pointer", padding: 0 }}
          />
          <input type="text" value={draft.accent}
            onChange={e => setDraft({ ...draft, accent: e.target.value })}
            style={{
              flex: 1, background: "#0a0c12", border: "1px solid #1e2230",

            background: (dirty && draft.label.trim() && draft.appName.trim()) ? "#a78bfa20" : "#141822",
            border: "1px solid " + ((dirty && draft.label.trim() && draft.appName.trim()) ? "#a78bfa50" : "#1e2230"),
            color: (dirty && draft.label.trim() && draft.appName.trim()) ? "#a78bfa" : "#3a4050",

        {isCustom && (

}

// ─── Post-processor pipeline editor ───
function PostProcessorPanel({ pipeline, onChange, sampleText }) {
  const [expanded, setExpanded] = useState(new Set());
  const [sample, setSample] = useState(sampleText || "Example LLM output:\n- **Shared concept**: both chunks discuss X.\n- They differ in *emphasis*.\n\n```json\n{\"a\": 1}\n```");
  const [loadStatus, setLoadStatus] = useState(null);
  const fileRef = useRef(null);
  const availableIds = Object.keys(POST_PROCESSORS);

  function addStep(id) {
    const def = POST_PROCESSORS[id];
    const params = {};
    (def.params || []).forEach(p => { params[p.name] = p.default; });
    onChange([...pipeline, { id, params, uid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }]);
  }
  function removeStep(idx) { onChange(pipeline.filter((_, i) => i !== idx)); }
  function moveStep(idx, dir) {
    const to = idx + dir;
    if (to < 0 || to >= pipeline.length) return;
    const next = pipeline.slice();
    [next[idx], next[to]] = [next[to], next[idx]];
    onChange(next);
  }
  function updateParam(idx, paramName, value) {
    const next = pipeline.map((s, i) => i === idx ? { ...s, params: { ...(s.params || {}), [paramName]: value } } : s);
    onChange(next);
  }
  function toggleExpand(uid) {
    const next = new Set(expanded);
    if (next.has(uid)) next.delete(uid); else next.add(uid);
    setExpanded(next);
  }

  function savePipelineJSON() {
    const payload = {
      format: "tuo-pipeline",
      version: 1,
      savedAt: new Date().toISOString(),
      steps: pipeline.map(s => ({ id: s.id, params: s.params || {} })),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const name = prompt("Pipeline filename (without extension):", "tuo_pipeline_" + new Date().toISOString().slice(0, 10));
    if (!name) { URL.revokeObjectURL(a.href); return; }
    const safe = name.trim().replace(/[\/\\:*?"<>|]+/g, "_").replace(/\.json$/i, "");
    a.download = safe + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    setLoadStatus({ kind: "ok", msg: "Saved \u00B7 " + pipeline.length + " steps" });
    setTimeout(() => setLoadStatus(null), 3000);
  }

  function loadPipelineJSON(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.format !== "tuo-pipeline" || !Array.isArray(data.steps)) {
          throw new Error("Not a valid Tuo pipeline file");
        }
        // Reconstruct with new uids; drop steps whose id is unknown
        const restored = data.steps
          .filter(s => POST_PROCESSORS[s.id])
          .map(s => ({
            id: s.id,
            params: s.params || {},
            uid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          }));
        const unknown = data.steps.length - restored.length;
        onChange(restored);
        setLoadStatus({
          kind: "ok",
          msg: "Loaded \u00B7 " + restored.length + " steps" + (unknown > 0 ? " (" + unknown + " unknown ignored)" : ""),
        });
        setTimeout(() => setLoadStatus(null), 4000);
      } catch (err) {
        setLoadStatus({ kind: "err", msg: err.message });
        setTimeout(() => setLoadStatus(null), 5000);
      }
    };
    reader.onerror = () => {
      setLoadStatus({ kind: "err", msg: "Failed to read file" });
      setTimeout(() => setLoadStatus(null), 5000);
    };
    reader.readAsText(file);
  }

  // Preview
  let previewOut;
  try { previewOut = applyPipeline(sample, pipeline); }
  catch (e) { previewOut = "[pipeline error: " + e.message + "]"; }
  const previewIsElement = typeof previewOut === "object" && previewOut !== null && previewOut.$$typeof;

  return (
    <div style={{
      background: "#0c0e16", borderRadius: 8, padding: 14, marginBottom: 16,
      border: "1px solid #f472b630",
    }}>
      {/* Save / load toolbar */}
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
        <button onClick={savePipelineJSON}
          disabled={pipeline.length === 0}
          title="Save the current pipeline to a JSON file"
          style={{
            ...mono9, fontWeight: 600,
            background: pipeline.length > 0 ? "#34d39918" : "#141822",
            border: "1px solid " + (pipeline.length > 0 ? "#34d39940" : "#1e2230"),
            color: pipeline.length > 0 ? "#34d399" : "#3a4050",
            borderRadius: 4, padding: "4px 10px",
            cursor: pipeline.length > 0 ? "pointer" : "not-allowed",
          }}>{"\u{1F4BE}"} Save JSON</button>
        <button onClick={() => fileRef.current?.click()}
          title="Load a pipeline from a JSON file (replaces current)"
          style={{
            ...mono9, fontWeight: 600,
            background: "#60a5fa18", border: "1px solid #60a5fa40",
            color: "#60a5fa", borderRadius: 4, padding: "4px 10px", cursor: "pointer",
          }}>{"\u{1F4C2}"} Load JSON</button>
        <input ref={fileRef} type="file" accept=".json,application/json"
          style={{ display: "none" }}
          onChange={e => {
            const f = e.target.files[0];
            if (f) loadPipelineJSON(f);
            e.target.value = "";
          }}
        />
        {loadStatus && (
          <span style={{
            ...mono9,
            color: loadStatus.kind === "ok" ? "#34d399" : "#f87171",
          }}>{loadStatus.msg}</span>
        )}
      </div>

      <div style={{ ...mono9, color: "#3a4050", marginBottom: 10, fontStyle: "italic" }}>
        Steps run top-to-bottom. Transform steps reshape text; render steps (Markdown, HTML) finalize the output visually. A transform after a render reverts to text mode.
      </div>

      {/* Steps */}
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
        {pipeline.length === 0 && (
          <div style={{ ...mono10, color: "#3a4050", padding: "12px", textAlign: "center", border: "1px dashed #1e2230", borderRadius: 4 }}>
            No steps. LLM output displays as-is. Add a step below.
          </div>
        )}
        {pipeline.map((step, idx) => {
          const def = POST_PROCESSORS[step.id];
          if (!def) return null;
          const isRender = def.kind === "render";
          const uid = step.uid || idx;
          const isExpanded = expanded.has(uid);
          const hasParams = (def.params || []).length > 0;
          return (
            <div key={uid} style={{
              background: "#0a0c12", borderRadius: 4,
              border: "1px solid " + (isRender ? "#a78bfa30" : "#1e2230"),
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 8px" }}>
                <span style={{ ...mono10, color: "#3a4050", minWidth: 18 }}>{idx + 1}.</span>
                <span style={{ ...mono10, color: isRender ? "#a78bfa" : "#f472b6", fontWeight: 600, flex: 1 }}>
                  {def.label}
                  {isRender && <span style={{ ...mono9, color: "#a78bfa80", marginLeft: 6 }}>[render]</span>}
                </span>
                {hasParams && (
                  <button onClick={() => toggleExpand(uid)} title="Edit parameters" style={{
                    ...mono9, background: "transparent", border: "1px solid #1e2230",
                    color: "#4a5568", borderRadius: 3, padding: "1px 6px", cursor: "pointer",
                  }}>{isExpanded ? "\u25B4" : "\u25BE"} params</button>
                )}
                <button onClick={() => moveStep(idx, -1)} disabled={idx === 0} title="Move up" style={{
                  ...mono9, background: "transparent", border: "1px solid #1e2230",
                  color: idx === 0 ? "#2a2f3a" : "#4a5568",
                  borderRadius: 3, padding: "1px 5px", cursor: idx === 0 ? "not-allowed" : "pointer",
                }}>{"\u2191"}</button>
                <button onClick={() => moveStep(idx, 1)} disabled={idx === pipeline.length - 1} title="Move down" style={{
                  ...mono9, background: "transparent", border: "1px solid #1e2230",
                  color: idx === pipeline.length - 1 ? "#2a2f3a" : "#4a5568",
                  borderRadius: 3, padding: "1px 5px", cursor: idx === pipeline.length - 1 ? "not-allowed" : "pointer",
                }}>{"\u2193"}</button>
                <button onClick={() => removeStep(idx)} title="Remove step" style={{
                  ...mono9, background: "transparent", border: "1px solid #1e2230",
                  color: "#f87171", borderRadius: 3, padding: "1px 5px", cursor: "pointer",
                }}>{"\u2715"}</button>
              </div>
              {isExpanded && hasParams && (
                <div style={{ padding: "4px 8px 8px 32px", borderTop: "1px solid #1e2230" }}>
                  {(def.params || []).map(p => (
                    <div key={p.name} style={{ display: "flex", alignItems: "flex-start", gap: 6, marginTop: 4 }}>
                      <span style={{ ...mono9, color: "#4a5568", minWidth: 90, paddingTop: 4 }}>{p.label}</span>
                      {p.type === "textarea" ? (
                        <textarea value={(step.params || {})[p.name] || ""}
                          onChange={e => updateParam(idx, p.name, e.target.value)}
                          rows={2}
                          style={{
                            flex: 1, resize: "vertical",
                            background: "#141822", border: "1px solid #1e2230",
                            color: "#f472b6", borderRadius: 3, padding: "3px 6px",
                            ...mono10, outline: "none", boxSizing: "border-box",
                            fontFamily: "'JetBrains Mono', monospace",
                          }}
                        />
                      ) : (
                        <input type="text" value={(step.params || {})[p.name] || ""}
                          onChange={e => updateParam(idx, p.name, e.target.value)}
                          style={{
                            flex: 1, background: "#141822", border: "1px solid #1e2230",
                            color: "#f472b6", borderRadius: 3, padding: "3px 6px",
                            ...mono10, outline: "none",
                          }}
                        />
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Add step dropdown */}
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 12 }}>

function ExportNameModal({ kind, defaultName, onConfirm, onCancel }) {

    if (inputRef.current) {
      inputRef.current.focus();
      inputRef.current.select();
    }
    function onKey(e) {
      if (e.key === "Escape") onCancel();
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onCancel]);

  const ext = kind === "csv" ? ".csv" : ".html";
  const accent = kind === "csv" ? "#34d399" : "#60a5fa";
  const title = kind === "csv" ? "Export CSV" : "Export HTML Report";

  function submit() {
    const trimmed = name.trim();
    if (!trimmed) return;
    onConfirm(trimmed);
  }

  return (
    <div style={{
      position: "fixed", top: 0, left: 0, right: 0, bottom: 0,

        <div style={{ ...mono10, color: accent, letterSpacing: 1, fontWeight: 600, marginBottom: 12 }}>
          {"\u2913"} {title.toUpperCase()}
        </div>
        <div style={{ ...mono9, color: "#4a5568", marginBottom: 10 }}>
          Name the file (extension is added automatically):
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 0, marginBottom: 14 }}>
          <input
            ref={inputRef}
            type="text"
            value={name}
            onChange={e => setName(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") submit(); }}
            placeholder="My analysis"
            style={{
              flex: 1, background: "#141822",
              border: "1px solid " + accent + "40",
              borderRight: "none",
              color: "#e8ecf4", borderRadius: "5px 0 0 5px",
              padding: "8px 12px",
              fontFamily: "'JetBrains Mono', monospace", fontSize: 13,
              outline: "none",
            }}
          />
          <span style={{
            ...mono10, background: "#0a0c12",
            border: "1px solid " + accent + "40",
            color: accent, padding: "8px 12px",

          }}>{ext}</span>
        </div>
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
          <button onClick={onCancel} style={{
            ...mono10, background: "transparent", border: "1px solid #1e2230",
            color: "#4a5568", borderRadius: 4, padding: "6px 16px", cursor: "pointer",
          }}>Cancel</button>
          <button onClick={submit}
            disabled={!name.trim()}
            style={{
              ...mono10, fontWeight: 600,
              background: name.trim() ? accent + "20" : "#141822",
              border: "1px solid " + (name.trim() ? accent + "60" : "#1e2230"),
              color: name.trim() ? accent : "#3a4050",
              borderRadius: 4, padding: "6px 16px",
              cursor: name.trim() ? "pointer" : "not-allowed",
            }}>{"\u2913"} Save {ext}</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [textA, setTextA] = useState("");
  const [textB, setTextB] = useState("");
  const [nameA, setNameA] = useState("");
  const [nameB, setNameB] = useState("");
  const [results, setResults] = useState(null);
  const [processing, setProcessing] = useState(false);
  const [selectedCell, setSelectedCell] = useState(null);
  const [expandedMatch, setExpandedMatch] = useState(0);
  const [matchSearch, setMatchSearch] = useState("");
  const [matchPage, setMatchPage] = useState(0);
  const [matchPageSize, setMatchPageSize] = useState(20);
  const [docSearch, setDocSearch] = useState("");
  const [tab, setTab] = useState("heatmap");
  const [chunkMode, setChunkMode] = useState("512");
  const [chunkModeB, setChunkModeB] = useState("512"); // each doc has its own setting; defaults equal
  const [macroSize, setMacroSize] = useState(2048);
  const [microSize, setMicroSize] = useState("256");
  const [resultsStack, setResultsStack] = useState([]); // drill history
  const [drilling, setDrilling] = useState(false);
  const [llmProvider, setLlmProvider] = useState("ollama"); // "ollama" | "openai" | "anthropic"
  const [ollamaUrl, setOllamaUrl] = useState("http://localhost:11434");
  const [ollamaModel, setOllamaModel] = useState("gpt-oss:20b");
  const [ollamaTimeout, setOllamaTimeout] = useState(120); // seconds, 0 = no timeout
  const [ollamaApiKey, setOllamaApiKey] = useState(""); // optional Bearer token
  const [showApiKey, setShowApiKey] = useState(false);
  const [ollamaMaxTokens, setOllamaMaxTokens] = useState(1024); // 0 = unlimited
  const [promptTemplate, setPromptTemplate] = useState(DEFAULT_PROMPT_TEMPLATE);
  const [showPromptEditor, setShowPromptEditor] = useState(false);
  const [customQueries, setCustomQueries] = useState([]); // [{ id, label, template, url?, model?, apiKey?, timeout?, maxTokens? }]
  const [editingQueryId, setEditingQueryId] = useState(null);

  // ─── Theme system ───
  // ─── Post-processing pipeline for LLM outputs ───
  const [postProcessors, setPostProcessors] = useState(() => {
    try {
      const raw = localStorage.getItem("tuo_post_processors");
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  });
  useEffect(() => {
    try { localStorage.setItem("tuo_post_processors", JSON.stringify(postProcessors)); }
    catch (e) {}
  }, [postProcessors]);
  const [showPostProcPanel, setShowPostProcPanel] = useState(false);
  const [exportPrompt, setExportPrompt] = useState(null); // { kind: "csv" | "html" }
  const [heatmapMode, setHeatmapMode] = useState("AB"); // "AB" | "AA" | "BB"

  const [customThemes, setCustomThemes] = useState(() => {
    try {
      const raw = localStorage.getItem("tuo_custom_themes");
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  });
  const [activeThemeId, setActiveThemeId] = useState(() => {
    try { return localStorage.getItem("tuo_active_theme") || "tuo-dark"; }
    catch (e) { return "tuo-dark"; }
  });
  const allThemes = useMemo(() => {
    return [...Object.values(BUILTIN_THEMES), ...customThemes];
  }, [customThemes]);
  const activeTheme = useMemo(() => {
    return allThemes.find(t => t.id === activeThemeId) || BUILTIN_THEMES["tuo-dark"];
  }, [allThemes, activeThemeId]);
  // Apply theme on every change
  useEffect(() => { applyTheme(activeTheme); }, [activeTheme]);
  // Persist
  useEffect(() => {
    try { localStorage.setItem("tuo_custom_themes", JSON.stringify(customThemes)); }
    catch (e) { /* private mode */ }
  }, [customThemes]);
  useEffect(() => {
    try { localStorage.setItem("tuo_active_theme", activeThemeId); }
    catch (e) { /* private mode */ }
  }, [activeThemeId]);
  const [showThemePanel, setShowThemePanel] = useState(false);
  const [interpretations, setInterpretations] = useState({});
  const [batchInterpreting, setBatchInterpreting] = useState(false);
  const abortRef = useRef(null);

  // ─── Report mode: hydrate from injected data if loaded as exported report ───
  const reportMode = typeof window !== 'undefined' && window.__TUO_REPORT_MODE__ === true;
  useEffect(() => {
    if (reportMode && window.__TUO_REPORT_DATA__) {
      const d = window.__TUO_REPORT_DATA__;
      if (d.results) setResults(d.results);
      if (d.interpretations) setInterpretations(d.interpretations);
      // Use the pipeline baked in at export time (overrides any localStorage from the viewer)
      if (Array.isArray(d.postProcessors)) setPostProcessors(d.postProcessors);
    }
  }, [reportMode]);

  const canRun = textA.trim().length > 20 && textB.trim().length > 20;

  // Live preview of chunk count + estimated processing time (cheap estimation, no full tokenize)
  const chunkPreview = useMemo(() => {
    if (!canRun) return null;
    const modeA = chunkMode;
    const modeB = chunkModeB;
    const cA = estimateChunkCount(textA, modeA, macroSize);
    const cB = estimateChunkCount(textB, modeB, macroSize);
    const cells = cA * cB;
    const tokA = estimateTokenCount(textA);
    const tokB = estimateTokenCount(textB);
    // Rough vocab estimate: 5-15% of total unique-ish tokens, capped
    const vocab = Math.min(50000, Math.max(100, Math.ceil((tokA + tokB) * 0.08)));
    // Empirical model (rough): vocab build ~ tokens / 2M sec, vectorize ~ chunks*vocab / 50M sec, matrix ~ cells*vocab / 200M sec
    const buildSec = (tokA + tokB) / 2000000;
    const vecSec = (cA + cB) * vocab / 50000000;
    const matrixSec = cells * vocab / 200000000;
    const totalSec = buildSec + vecSec + matrixSec;
    let label, color;
    if (totalSec < 0.5) { label = "instant"; color = "#34d399"; }
    else if (totalSec < 3) { label = "~" + totalSec.toFixed(1) + "s"; color = "#34d399"; }
    else if (totalSec < 15) { label = "~" + Math.ceil(totalSec) + "s"; color = "#f0c040"; }
    else if (totalSec < 60) { label = "~" + Math.ceil(totalSec) + "s"; color = "#f59e42"; }
    else if (totalSec < 300) { label = "~" + Math.ceil(totalSec / 60) + "m"; color = "#f59e42"; }
    else { label = "~" + Math.ceil(totalSec / 60) + "m \u26A0"; color = "#f87171"; }
    return { cA, cB, cells, tokA, tokB, totalSec, label, color, splitModes: modeA !== modeB };
  }, [textA, textB, chunkMode, chunkModeB, macroSize, canRun]);

  // ─── Project save / load ───
  const projectFileRef = useRef(null);
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const [loadStatus, setLoadStatus] = useState(null); // { kind: 'ok'|'err', msg }

  const handleSaveProject = useCallback(() => {
    const info = saveProject({
      nameA, nameB, textA, textB,
      chunkMode, chunkModeB, macroSize, microSize,
      results, interpretations, resultsStack,
      customQueries, postProcessors,
    });
    setLastSavedAt(new Date());
    setLoadStatus({ kind: "ok", msg: "Saved \u00B7 " + (info.bytes / 1024).toFixed(1) + " KB" });
    setTimeout(() => setLoadStatus(null), 3000);
  }, [nameA, nameB, textA, textB, chunkMode, chunkModeB, macroSize, microSize, results, interpretations, resultsStack, customQueries, postProcessors]);

  const handleLoadProject = useCallback((file) => {
    if (!file) return;
    loadProjectFromFile(file, {
      setTextA, setTextB, setNameA, setNameB,
      setChunkMode, setChunkModeB, setMacroSize, setMicroSize,
      setResults, setInterpretations, setResultsStack,
      setSelectedCell, setExpandedMatch,
      setCustomQueries,
      setPostProcessors,
    }).then(info => {
      setLoadStatus({ kind: "ok", msg: "Loaded \u00B7 saved " + (info.savedAt ? new Date(info.savedAt).toLocaleString() : "unknown") });
      setTimeout(() => setLoadStatus(null), 4000);
    }).catch(err => {
      setLoadStatus({ kind: "err", msg: err.message });
      setTimeout(() => setLoadStatus(null), 5000);
    });
  }, []);

  const analyze = useCallback(() => {
    setProcessing(true); setResults(null); setSelectedCell(null);
    setExpandedMatch(0); setInterpretations({});
    setResultsStack([]);
    setTimeout(() => {
      try {
        const modeA = chunkMode;
        const modeB = chunkModeB;
        const cA = chunkDocument(textA, modeA, macroSize);
        const cB = chunkDocument(textB, modeB, macroSize);
        // Build a single shared vocabulary so the three matrices use the same TF-IDF basis
        const allChunks = [...cA, ...cB];
        const { vocab, idf } = buildVocabulary(allChunks);
        const vA = cA.map(c => tfidfVector(c, vocab, idf));
        const vB = cB.map(c => tfidfVector(c, vocab, idf));
        // Cross matrix (A x B)
        const matrix = vA.map(a => vB.map(b => cosineSimilarity(a, b)));
        // Self matrices (symmetric, diagonal = 1)
        const matrixAA = vA.map((a, i) => vA.map((aa, ii) => i === ii ? 1 : cosineSimilarity(a, aa)));
        const matrixBB = vB.map((b, j) => vB.map((bb, jj) => j === jj ? 1 : cosineSimilarity(b, bb)));
        const pairs = [];
        for (let i = 0; i < matrix.length; i++)
          for (let j = 0; j < matrix[0].length; j++)
            pairs.push({ i, j, score: matrix[i][j] });
        pairs.sort((a, b) => b.score - a.score);
        const scores = pairs.map(p => p.score);
        const labelOf = (m) => m === "macro" ? "Macro " + macroSize : m === "row" ? "Row/Sent" : m + " tok";
        setResults({
          chunksA: cA, chunksB: cB, matrix, matrixAA, matrixBB, pairs, vocabSize: vocab.length,
          stats: { avg: scores.reduce((a,b) => a+b, 0)/scores.length, max: scores[0], highCount: scores.filter(s => s > 0.3).length },
          drillLevel: modeA === "macro" ? String(macroSize) : modeA === "row" ? "row" : modeA,
          drillLabel: modeA === modeB ? labelOf(modeA) : labelOf(modeA) + " / " + labelOf(modeB),
          modeA: modeA, modeB: modeB,
          nameA: nameA || "Document A", nameB: nameB || "Document B",
        });
      } catch (err) { console.error(err); }
      setProcessing(false);
    }, 50);
  }, [textA, textB, chunkMode, chunkModeB, macroSize, nameA, nameB]);

  // ─── Drill Ladder: automatic level progression ───
  const DRILL_LADDER = ["4096", "2048", "1024", "512", "256", "128", "row"];
  const DRILL_LABELS = { "4096": "4096 tok", "2048": "2048 tok", "1024": "1024 tok", "512": "512 tok", "256": "256 tok", "128": "128 tok", "row": "Row/Sent" };

  // Figure out what level the current results are at
  function currentDrillLevel() {
    if (!results || !results.drillLevel) {
      // Initial level: find closest match in ladder
      if (chunkMode === "macro") return DRILL_LADDER.indexOf(String(macroSize)) >= 0 ? String(macroSize) : "2048";
      if (chunkMode === "row") return "row";
      return DRILL_LADDER.indexOf(chunkMode) >= 0 ? chunkMode : "512";
    }
    return results.drillLevel;
  }

  function nextDrillLevel() {
    var cur = currentDrillLevel();
    var idx = DRILL_LADDER.indexOf(cur);
    if (idx < 0) idx = DRILL_LADDER.indexOf("512"); // fallback
    return idx < DRILL_LADDER.length - 1 ? DRILL_LADDER[idx + 1] : null;
  }

  function prevDrillLevel() {
    if (resultsStack.length === 0) return null;
    var prev = resultsStack[resultsStack.length - 1];
    return prev.results.drillLevel || "512";
  }

  var nextLevel = nextDrillLevel();
  var prevLevel = prevDrillLevel();

  // ─── Drill one chunk: sub-chunk a single segment, splice into results ───
  const drillOneChunk = useCallback((doc, idx) => {
    if (!results || drilling) return;
    var nxt = nextDrillLevel();
    if (!nxt) return;
    setDrilling(true);
    setTimeout(() => {
      try {
        var chunksA = results.chunksA.slice();
        var chunksB = results.chunksB.slice();

        if (doc === "A") {
          var subs = subChunk(chunksA[idx], nxt);
          if (subs.length <= 1) { setDrilling(false); return; } // nothing to split
          chunksA.splice(idx, 1, ...subs);
        } else {
          var subs = subChunk(chunksB[idx], nxt);
          if (subs.length <= 1) { setDrilling(false); return; }
          chunksB.splice(idx, 1, ...subs);
        }

        // Recompute matrix with the expanded array
        var { matrix: newMat, vocab: newVocab } = computeSimilarityMatrix(chunksA, chunksB);
        var newPairs = [];
        for (var i = 0; i < newMat.length; i++)
          for (var j = 0; j < newMat[0].length; j++)
            newPairs.push({ i: i, j: j, score: newMat[i][j] });
        newPairs.sort(function(a, b) { return b.score - a.score; });
        var scores = newPairs.length > 0 ? newPairs.map(function(p) { return p.score; }) : [0];

        // Push current state
        setResultsStack(function(prev) { return prev.concat([{ results: results, interpretations: interpretations }]); });

        setResults({
          chunksA: chunksA, chunksB: chunksB,
          matrix: newMat, pairs: newPairs, vocabSize: newVocab.length,
          stats: { avg: scores.reduce(function(a,b){return a+b;},0)/scores.length, max: scores[0], highCount: scores.filter(function(s){return s > 0.3;}).length },
          drillLevel: results.drillLevel, // keep same level label since it's partial
          drillLabel: (results.drillLabel || "") + "+",
          nameA: results.nameA, nameB: results.nameB,
        });
        // Remap interpretations: shift keys for indices after the splice point
        var newInterps = {};
        Object.keys(interpretations).forEach(function(k) {
          var parts = k.split("-"); var ai = parseInt(parts[0]); var bj = parseInt(parts[1]);
          if (doc === "A") {
            if (ai < idx) newInterps[k] = interpretations[k];
            else if (ai > idx) { var nk = (ai + subs.length - 1) + "-" + bj; newInterps[nk] = interpretations[k]; }
            // ai === idx: parent was split, its interpretations are invalidated
          } else {
            if (bj < idx) newInterps[k] = interpretations[k];
            else if (bj > idx) { var nk = ai + "-" + (bj + subs.length - 1); newInterps[nk] = interpretations[k]; }
          }
        });
        setInterpretations(newInterps);
        setSelectedCell(null);
        setExpandedMatch(0);
      } catch (err) { console.error("Drill one error:", err); }
      setDrilling(false);
    }, 30);
  }, [results, drilling, interpretations]);

  // ─── Drill All: sub-chunk every chunk at next level ───
  const drillAll = useCallback(() => {
    if (!results || drilling) return;
    var nxt = nextDrillLevel();
    if (!nxt) return; // already at finest
    setDrilling(true);
    setTimeout(() => {
      try {
        const subChunksA = [];
        const chunkMapA = [];
        results.chunksA.forEach((c, pi) => {
          const subs = subChunk(c, nxt);
          subs.forEach(s => { chunkMapA.push(pi); subChunksA.push(s); });
        });
        const subChunksB = [];
        const chunkMapB = [];
        results.chunksB.forEach((c, pi) => {
          const subs = subChunk(c, nxt);
          subs.forEach(s => { chunkMapB.push(pi); subChunksB.push(s); });
        });

        const { matrix: newMat, vocab: newVocab } = computeSimilarityMatrix(subChunksA, subChunksB);
        const newPairs = [];
        for (let i = 0; i < newMat.length; i++)
          for (let j = 0; j < newMat[0].length; j++)
            newPairs.push({ i, j, score: newMat[i][j] });
        newPairs.sort((a, b) => b.score - a.score);
        const scores = newPairs.length > 0 ? newPairs.map(p => p.score) : [0];

        setResultsStack(prev => [...prev, { results, interpretations }]);

        setResults({
          chunksA: subChunksA, chunksB: subChunksB,
          matrix: newMat, pairs: newPairs, vocabSize: newVocab.length,
          stats: { avg: scores.reduce((a,b) => a+b, 0)/scores.length, max: scores[0], highCount: scores.filter(s => s > 0.3).length },
          parentMapA: chunkMapA, parentMapB: chunkMapB,
          drillLevel: nxt,
          drillLabel: DRILL_LABELS[nxt] || nxt,
          nameA: results.nameA, nameB: results.nameB,
        });
        setSelectedCell(null);
        setExpandedMatch(0);
        setInterpretations({});
      } catch (err) { console.error("Drill error:", err); }
      setDrilling(false);
    }, 50);
  }, [results, drilling, interpretations]);

  // ─── Drill Up: pop the stack ───
  const drillUp = useCallback(() => {
    if (resultsStack.length === 0) return;
    const prev = resultsStack[resultsStack.length - 1];
    setResultsStack(s => s.slice(0, -1));
    setResults(prev.results);
    setInterpretations(prev.interpretations);
    setSelectedCell(null);
    setExpandedMatch(0);
  }, [resultsStack]);

  const drillDepth = resultsStack.length;
  const atFinest = !nextLevel;

  const interpretPair = useCallback(async (i, j, score, cA, cB, queryOrTemplate, labelOverride) => {
    // Backward-compat: queryOrTemplate may be undefined (use globals), a string (template only), or a full query object
    const query = (typeof queryOrTemplate === "string")
      ? { template: queryOrTemplate, label: labelOverride }
      : (queryOrTemplate || {});

    // Resolve effective config: query overrides > globals
    const tmpl = query.template || promptTemplate;
    const label = query.label || labelForPrompt(tmpl, customQueries);
    const provider = query.provider || llmProvider;
    const url = (query.url && query.url.trim()) || ollamaUrl;
    const model = (query.model && query.model.trim()) || ollamaModel;
    const apiKey = (query.apiKey != null && query.apiKey !== "") ? query.apiKey : ollamaApiKey;
    const timeoutMs = (query.timeout != null && query.timeout >= 0 ? query.timeout : ollamaTimeout) * 1000;
    const maxTokens = (query.maxTokens != null && query.maxTokens >= 0) ? query.maxTokens : ollamaMaxTokens;

    const k = i+"-"+j;
    const id = newInterpId();
    const ts = Date.now();
    setInterpretations(p => {
      const list = getInterps(p, k);
      return { ...p, [k]: [...list, { id, label, status: "loading", timestamp: ts }] };
    });
    try {
      const r = await queryLLM(provider, url, model, cA, cB, score, null, tmpl, timeoutMs, apiKey, maxTokens);
      setInterpretations(p => {
        const list = getInterps(p, k);
        return { ...p, [k]: list.map(e => e.id === id ? { ...e, response: r, status: "done" } : e) };
      });
    } catch (err) {
      const isTimeout = err.name === "TimeoutError";
      setInterpretations(p => {
        const list = getInterps(p, k);
        return { ...p, [k]: list.map(e => e.id === id ? { ...e, status: isTimeout ? "timeout" : "error", error: err.message } : e) };
      });
    }
  }, [llmProvider, ollamaUrl, ollamaModel, promptTemplate, ollamaTimeout, ollamaApiKey, ollamaMaxTokens, customQueries]);

  const removeInterp = useCallback((i, j, id) => {
    const k = i+"-"+j;
    setInterpretations(p => {
      const list = getInterps(p, k).filter(e => e.id !== id);
      const cp = { ...p };
      if (list.length === 0) delete cp[k]; else cp[k] = list;
      return cp;
    });
  }, []);

  const batchInterpret = useCallback(async (count, minScore) => {
    if (!results) return;
    setBatchInterpreting(true);
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const targets = minScore != null
      ? results.pairs.filter(m => m.score >= minScore)
      : results.pairs.slice(0, count);
    const label = labelForPrompt(promptTemplate);
    for (const m of targets) {
      if (ctrl.signal.aborted) break;
      const k = m.i+"-"+m.j;
      const id = newInterpId();
      const ts = Date.now();
      setInterpretations(p => {
        const list = getInterps(p, k);
        return { ...p, [k]: [...list, { id, label, status: "loading", timestamp: ts }] };
      });
      try {
        const r = await queryLLM(llmProvider, ollamaUrl, ollamaModel, results.chunksA[m.i], results.chunksB[m.j], m.score, ctrl.signal, promptTemplate, ollamaTimeout * 1000, ollamaApiKey, ollamaMaxTokens);
        setInterpretations(p => {
          const list = getInterps(p, k);
          return { ...p, [k]: list.map(e => e.id === id ? { ...e, response: r, status: "done" } : e) };
        });
      } catch (err) {
        if (err.name === "AbortError" && ctrl.signal.aborted) {
          // Mark this one as cancelled by removing it
          setInterpretations(p => {
            const list = getInterps(p, k).filter(e => e.id !== id);
            const cp = { ...p };
            if (list.length === 0) delete cp[k]; else cp[k] = list;
            return cp;
          });
          break;
        }
        const isTimeout = err.name === "TimeoutError";
        setInterpretations(p => {
          const list = getInterps(p, k);
          return { ...p, [k]: list.map(e => e.id === id ? { ...e, status: isTimeout ? "timeout" : "error", error: err.message } : e) };
        });
      }
    }
    setBatchInterpreting(false);
  }, [results, llmProvider, ollamaUrl, ollamaModel, promptTemplate, ollamaTimeout, ollamaApiKey, ollamaMaxTokens]);

  // ─── Multi-query batch runner ───
  const [batchProgress, setBatchProgress] = useState(null); // { done, total, pairIdx, pairTotal }

  const runBatch = useCallback(async (queries, scope, opts) => {
    if (!results || !queries || queries.length === 0) return;
    setBatchInterpreting(true);
    const ctrl = new AbortController();
    abortRef.current = ctrl;

    let targets;
    if (scope.type === "topN") targets = results.pairs.slice(0, scope.n);
    else if (scope.type === "minScore") targets = results.pairs.filter(p => p.score >= scope.v);
    else if (scope.type === "all") targets = results.pairs;
    else targets = [];

    // Apply optional upper bound (skip near-perfect matches)
    if (scope.maxScore != null && scope.maxScore < 1) {
      targets = targets.filter(p => p.score <= scope.maxScore);
    }

    const skipDuplicates = opts && opts.skipDuplicates;
    const total = targets.length * queries.length;
    let done = 0;
    setBatchProgress({ done: 0, total, pairIdx: 0, pairTotal: targets.length });

    try {
      for (let pi = 0; pi < targets.length; pi++) {
        if (ctrl.signal.aborted) break;
        const m = targets[pi];
        const k = m.i + "-" + m.j;
        setBatchProgress({ done, total, pairIdx: pi + 1, pairTotal: targets.length });

        // Fire all queries for this pair in parallel
        const promises = queries.map(async (q) => {
          if (ctrl.signal.aborted) return;
          // Skip if already answered with same label
          if (skipDuplicates) {
            const existing = getInterps(interpretations, k);
            if (existing.some(e => e.label === q.label && e.status === "done")) {
              done += 1;
              setBatchProgress(p => p ? { ...p, done } : null);
              return;
            }
          }
          const id = newInterpId();
          const ts = Date.now();
          // Resolve per-query connection (overrides > globals)
          const provider = q.provider || llmProvider;
          const url = (q.url && q.url.trim()) || ollamaUrl;
          const model = (q.model && q.model.trim()) || ollamaModel;
          const apiKey = (q.apiKey != null && q.apiKey !== "") ? q.apiKey : ollamaApiKey;
          const timeoutMs = (q.timeout != null && q.timeout >= 0 ? q.timeout : ollamaTimeout) * 1000;
          const maxTokens = (q.maxTokens != null && q.maxTokens >= 0) ? q.maxTokens : ollamaMaxTokens;
          setInterpretations(p => {
            const list = getInterps(p, k);
            return { ...p, [k]: [...list, { id, label: q.label, status: "loading", timestamp: ts }] };
          });
          try {
            const r = await queryLLM(provider, url, model, results.chunksA[m.i], results.chunksB[m.j], m.score, ctrl.signal, q.template, timeoutMs, apiKey, maxTokens);
            setInterpretations(p => {
              const list = getInterps(p, k);
              return { ...p, [k]: list.map(e => e.id === id ? { ...e, response: r, status: "done" } : e) };
            });
          } catch (err) {
            if (err.name === "AbortError" && ctrl.signal.aborted) {
              // Strip the cancelled placeholder
              setInterpretations(p => {
                const list = getInterps(p, k).filter(e => e.id !== id);
                const cp = { ...p };
                if (list.length === 0) delete cp[k]; else cp[k] = list;
                return cp;
              });
              return;
            }
            const isTimeout = err.name === "TimeoutError";
            setInterpretations(p => {
              const list = getInterps(p, k);
              return { ...p, [k]: list.map(e => e.id === id ? { ...e, status: isTimeout ? "timeout" : "error", error: err.message } : e) };
            });
          } finally {
            done += 1;
            setBatchProgress(p => p ? { ...p, done } : null);
          }
        });
        await Promise.all(promises);
      }
    } finally {
      setBatchInterpreting(false);
      setBatchProgress(null);
    }
  }, [results, interpretations, llmProvider, ollamaUrl, ollamaModel, ollamaTimeout, ollamaApiKey, ollamaMaxTokens]);

  const topMatches = results ? results.pairs : [];
  const pairsAbove30 = results ? results.pairs.filter(p => p.score >= 0.3).length : 0;
  const pairsAbove50 = results ? results.pairs.filter(p => p.score >= 0.5).length : 0;
  const interpretedCount = Object.keys(interpretations).filter(k => hasDoneInterp(interpretations, k)).length;

  // ─── Prune: destructively remove low-similarity pairs ───
  const prunePairs = useCallback((minThreshold, maxThreshold) => {
    if (!results) return;
    const minT = minThreshold != null ? minThreshold : 0;
    const maxT = maxThreshold != null ? maxThreshold : 1.01;

    // Filter the pairs list
    const newPairs = results.pairs.filter(p => p.score >= minT && p.score <= maxT);

    // Zero out excluded cells in the matrix (chunks stay; views respect zeros)
    const newMatrix = results.matrix.map(row => row.map(v => (v >= minT && v <= maxT) ? v : 0));

    // Drop interpretations for pruned pairs
    const keepKeys = new Set(newPairs.map(p => p.i + "-" + p.j));
    const newInterps = {};
    Object.keys(interpretations).forEach(k => { if (keepKeys.has(k)) newInterps[k] = interpretations[k]; });

    // Recompute stats from surviving pairs
    const scores = newPairs.length > 0 ? newPairs.map(p => p.score) : [0];
    const newStats = {
      avg: scores.reduce((a, b) => a + b, 0) / scores.length,
      max: scores[0] || 0,
      highCount: scores.filter(s => s > 0.3).length,
    };

    setResults({ ...results, pairs: newPairs, matrix: newMatrix, stats: newStats });
    setInterpretations(newInterps);
    setSelectedCell(null);
    setExpandedMatch(0);
  }, [results, interpretations]);

  const actBtn = (on, accent="#818cf8") => ({
    ...mono10, fontWeight: 600, letterSpacing: 1, textTransform: "uppercase",
    background: on ? accent+"20" : "#141822", border: "1px solid "+(on ? accent+"50" : "#1e2230"),
    color: on ? accent : "#4a5568", borderRadius: 5, padding: "7px 16px",
    cursor: on ? "pointer" : "not-allowed", transition: "all 0.2s",
  });

  return (
    <div style={{ minHeight: "100vh", background: "#0a0c12", color: "#c8ccd4", padding: "24px 20px", fontFamily: "'IBM Plex Sans', system-ui, sans-serif" }}>

          onConfirm={name => {

        />

      <div style={{ maxWidth: 960, margin: "0 auto" }}>

          </div>
          <h1 style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 28, fontWeight: 300, color: "#e8ecf4", margin: 0, letterSpacing: -0.5 }}>{activeTheme.appName || "Tuo"}</h1>
          <p style={{ ...mono10, color: "#3a4050", marginTop: 6 }}>
            {reportMode
              ? <>Static report {"\u00B7"} {window.__TUO_REPORT_DATA__ && window.__TUO_REPORT_DATA__.exportedAt ? "exported " + new Date(window.__TUO_REPORT_DATA__.exportedAt).toLocaleString() : ""}</>
              : <>TF-IDF embeddings {"\u00B7"} cosine similarity {"\u00B7"} Ollama LLM interpretation {"\u00B7"} CSV + HTML export</>
            }
          </p>
        </div>

        {/* Project save/load bar */}
        {!reportMode && (
          <div style={{
            display: "flex", alignItems: "center", gap: 8, marginBottom: 16,
            background: "#0c0e16", borderRadius: 8, padding: "6px 12px",
            border: "1px solid #1e2230", flexWrap: "wrap",
          }}>
            <span style={{ ...mono9, color: "#4a5568", letterSpacing: 1 }}>{"\u{1F5C2}"} PROJECT</span>
            <button onClick={handleSaveProject}
              disabled={!results && !textA && !textB}
              title="Save current chunks, matrix, interpretations, and drill state to a .tuo.json file"
              style={{
                ...mono9, fontWeight: 600,
                background: (results || textA || textB) ? "#34d39918" : "#141822",
                border: "1px solid " + ((results || textA || textB) ? "#34d39940" : "#1e2230"),
                color: (results || textA || textB) ? "#34d399" : "#3a4050",
                borderRadius: 4, padding: "4px 12px",
                cursor: (results || textA || textB) ? "pointer" : "not-allowed",
              }}>{"\u{1F4BE}"} Save</button>

            <input ref={projectFileRef} type="file" accept=".json,.tuo.json,application/json"

            <button onClick={() => setShowThemePanel(!showThemePanel)}

            <button onClick={() => setShowPostProcPanel(!showPostProcPanel)}

                color: postProcessors.length > 0 ? "#f472b6" : "#4a5568",
                borderRadius: 4, padding: "4px 12px", cursor: "pointer",
              }}>{"\u2699"} Post-process{postProcessors.length > 0 && <span style={{ marginLeft: 4, background: "#f472b640", padding: "0 6px", borderRadius: 8 }}>{postProcessors.length}</span>}</button>
            {lastSavedAt && (

            {loadStatus && (

                Save preserves chunks, matrix, interpretations, drill stack

        {/* Theme picker / editor panel */}

        {!reportMode && showPostProcPanel && (

              <span style={{ ...mono10, color: "#f472b6", letterSpacing: 1, fontWeight: 600 }}>
                {"\u2699"} LLM OUTPUT POST-PROCESSING {postProcessors.length > 0 && <span style={{ color: "#f472b680", fontWeight: 400 }}>{"\u00B7"} {postProcessors.length} step{postProcessors.length === 1 ? "" : "s"}</span>}
              </span>
              <button onClick={() => setShowPostProcPanel(false)} style={{

            </div>
            <PostProcessorPanel pipeline={postProcessors} onChange={setPostProcessors} />
          </div>
        )}

        {!reportMode && showThemePanel && (
          <div style={{
            background: "#0c0e16", borderRadius: 8, padding: 14, marginBottom: 16,
            border: "1px solid #a78bfa30",
          }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
              <span style={{ ...mono10, color: "#a78bfa", letterSpacing: 1, fontWeight: 600 }}>{"\u{1F3A8}"} THEMES</span>
              <button onClick={() => setShowThemePanel(false)} style={{
                ...mono9, background: "transparent", border: "1px solid #1e2230",

            {/* Theme tiles */}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
              {allThemes.map(t => {

                return (
                  <div key={t.id}
                    onClick={() => setActiveThemeId(t.id)}
                    style={{

        {!reportMode && (

        {!reportMode && (

          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>

            <select value={llmProvider}

                if (!ollamaModel || ollamaModel === prevDef?.defaultModel) setOllamaModel(nextDef.defaultModel);

          </div>
          <button onClick={() => setShowPromptEditor(!showPromptEditor)} style={{
            ...mono9, background: showPromptEditor ? "#818cf820" : "#141822",
            border: "1px solid " + (showPromptEditor ? "#818cf850" : "#1e2230"),
            color: showPromptEditor ? "#818cf8" : "#4a5568",
            borderRadius: 4, padding: "4px 10px", cursor: "pointer", marginLeft: "auto",

            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
              <div style={{ ...mono9, color: "#818cf8", letterSpacing: 1 }}>LLM PROMPT TEMPLATE</div>
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={() => setPromptTemplate(DEFAULT_PROMPT_TEMPLATE)} style={{
                  ...mono9, background: "#141822", border: "1px solid #1e2230",

            {/* Preset investigation modes */}
            <div style={{ display: "flex", gap: 4, marginBottom: 8, flexWrap: "wrap" }}>

                <button key={p.label} onClick={() => setPromptTemplate(p.t)} style={{
                  ...mono9,
                  background: promptTemplate === p.t ? "#818cf820" : "#141822",
                  border: "1px solid " + (promptTemplate === p.t ? "#818cf850" : "#1e2230"),
                  color: promptTemplate === p.t ? "#818cf8" : "#4a5568",
                  borderRadius: 3, padding: "3px 8px", cursor: "pointer",
                }}>{p.label}</button>
              ))}
            </div>

            {/* Saved custom queries */}
            <div style={{

            }}>

                <span style={{ ...mono9, color: "#34d399", letterSpacing: 1 }}>
                  {"\u2605"} SAVED QUERIES {customQueries.length > 0 && <span style={{ color: "#34d39960" }}>({customQueries.length})</span>}
                </span>
                <button
                  onClick={() => {

                  title="Save the current prompt template as a reusable query"
                  style={{
                    ...mono9, fontWeight: 600,
                    background: promptTemplate.trim() ? "#34d39918" : "#141822",
                    border: "1px solid " + (promptTemplate.trim() ? "#34d39940" : "#1e2230"),
                    color: promptTemplate.trim() ? "#34d399" : "#3a4050",
                    borderRadius: 3, padding: "3px 8px",
                    cursor: promptTemplate.trim() ? "pointer" : "not-allowed",
                  }}>+ Save current as new query</button>
              </div>
              {customQueries.length === 0 ? (
                <div style={{ ...mono9, color: "#3a4050" }}>
                  No saved queries yet. Edit the prompt below, then click "+ Save current" to make it reusable.

                <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                  {customQueries.map(q => {

                    return (
                      <div key={q.id} style={{

                      }}>
                        <button
                          onClick={() => setPromptTemplate(q.template)}

                          style={{

                const clearField = (field) => {
                  setCustomQueries(prev => prev.map(x => {
                    if (x.id !== q.id) return x;
                    const c = { ...x };
                    delete c[field];
                    return c;
                  }));
                };
                const ConnRow = ({ field, label, type, placeholder, gridStyle }) => {

                  return (
                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                      <input type="checkbox" checked={overridden}
                        onChange={e => { if (e.target.checked) updateField(field, type === "number" ? 0 : ""); else clearField(field); }}

                      />
                      <span style={{ ...mono9, color: overridden ? "#f0c040" : "#4a5568", width: 90 }}>{label}</span>
                      <input
                        type={type === "password" ? (q._showKey ? "text" : "password") : type}
                        value={q[field] != null ? q[field] : ""}

                        disabled={!overridden}
                        placeholder={placeholder}
                        style={{
                          flex: 1, background: "#0a0c12",
                          border: "1px solid " + (overridden ? "#f0c04030" : "#1e2230"),
                          color: overridden ? "#f0c040" : "#3a4050",
                          borderRadius: 3, padding: "3px 6px", ...mono10, outline: "none",
                          ...(gridStyle || {}),

                      />
                    </div>
                  );

                return (
                  <div style={{
                    marginTop: 8, padding: 10,
                    background: "#0a0c12", border: "1px solid #f0c04030", borderRadius: 5,
                  }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                      <span style={{ ...mono9, color: "#f0c040", letterSpacing: 1, fontWeight: 600 }}>
                        {"\u270E"} EDITING: {q.label}
                      </span>
                      <button onClick={() => setEditingQueryId(null)} style={{
                        ...mono9, background: "transparent", border: "1px solid #1e2230",
                        color: "#4a5568", borderRadius: 3, padding: "2px 8px", cursor: "pointer",
                      }}>close</button>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
                      <span style={{ ...mono9, color: "#4a5568", width: 90 }}>NAME</span>
                      <input type="text" value={q.label}
                        onChange={e => updateField("label", e.target.value)}
                        style={{
                          flex: 1, background: "#0a0c12", border: "1px solid #1e2230",
                          color: "#34d399", borderRadius: 3, padding: "3px 6px", ...mono10, outline: "none",
                        }}
                      />
                    </div>
                    <div style={{ display: "flex", alignItems: "flex-start", gap: 6, marginBottom: 8 }}>
                      <span style={{ ...mono9, color: "#4a5568", width: 90, paddingTop: 4 }}>TEMPLATE</span>
                      <textarea
                        value={q.template}
                        onChange={e => updateField("template", e.target.value)}
                        placeholder="What you want to ask. Chunks auto-append if you skip the placeholders."
                        style={{
                          flex: 1, minHeight: 70, maxHeight: 180, resize: "vertical",
                          background: "#0a0c12", border: "1px solid #1e2230",
                          color: "#9ca3af", borderRadius: 3, padding: "4px 6px",
                          fontFamily: "'JetBrains Mono', monospace", fontSize: 10,
                          outline: "none", boxSizing: "border-box",
                        }}
                      />
                    </div>
                    <div style={{ ...mono9, color: "#4a5568", letterSpacing: 1, marginBottom: 4, marginTop: 6 }}>
                      CONNECTION OVERRIDES <span style={{ color: "#3a4050" }}>{"\u00B7"} unchecked = use global</span>
                    </div>
                    <ConnRow field="url" label="URL" type="text" placeholder={ollamaUrl} />
                    <ConnRow field="model" label="MODEL" type="text" placeholder={ollamaModel} />
                    <ConnRow field="apiKey" label="API KEY" type="password" placeholder="(none)" />
                    <ConnRow field="timeout" label="TIMEOUT (s)" type="number" placeholder={String(ollamaTimeout)} />
                    <ConnRow field="maxTokens" label="MAX TOKENS" type="number" placeholder={String(ollamaMaxTokens)} />
                  </div>
                );
              })()}
            </div>
            <textarea
              value={promptTemplate}
              onChange={e => setPromptTemplate(e.target.value)}
              style={{
                width: "100%", minHeight: 140, maxHeight: 400, resize: "vertical",
                background: "#0a0c12", color: "#9ca3af", border: "1px solid #1e2230",
                borderRadius: 6, padding: 12,
                fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
                lineHeight: 1.6, outline: "none", boxSizing: "border-box",
              }}
            />
            <div style={{ ...mono9, color: "#2a2f3a", marginTop: 6, lineHeight: 1.8 }}>
              Placeholders: <span style={{ color: "#818cf8" }}>{"{{CHUNK_A}}"}</span> <span style={{ color: "#818cf8" }}>{"{{CHUNK_B}}"}</span> <span style={{ color: "#818cf8" }}>{"{{SCORE}}"}</span> (percent) <span style={{ color: "#818cf8" }}>{"{{SCORE_RAW}}"}</span> (0-1)
            </div>
          </div>
        )}

        {results && (
          <div>
            <div style={{ display: "flex", gap: 1, marginBottom: 24, borderRadius: 8, overflow: "hidden" }}>
              {[
                { l: (results.nameA || "DOC A").toUpperCase(), v: results.chunksA.length, c: "#60a5fa" },
                { l: (results.nameB || "DOC B").toUpperCase(), v: results.chunksB.length, c: "#f59e42" },
                { l: "VOCAB", v: results.vocabSize.toLocaleString(), c: "#818cf8" },
                { l: "AVG SIM", v: (results.stats.avg*100).toFixed(1)+"%", c: "#34d399" },
                { l: "MAX SIM", v: (results.stats.max*100).toFixed(1)+"%", c: "#f0c040" },

              ].map(s => (
                <div key={s.l} style={{ flex: 1, background: "#0e1018", padding: "14px 12px", textAlign: "center" }}>

                  <div style={{ ...mono11, fontSize: 18, color: s.c, fontWeight: 700 }}>{s.v}</div>

              <PrunePanel

            {!reportMode && (
            <BatchRunner
              presets={PROMPT_PRESETS}
              customQueries={customQueries}
              totalPairs={results.pairs.length}
              pairsAbove30={pairsAbove30}
              pairsAbove50={pairsAbove50}
              onRun={runBatch}
              onStop={() => { if (abortRef.current) abortRef.current.abort(); }}
              isRunning={batchInterpreting}
              progress={batchProgress}
              onAddQuery={(payload) => setCustomQueries(prev => [...prev, { id: newQueryId(), ...payload }])}
              onUpdateQuery={(id, payload) => setCustomQueries(prev => prev.map(x => x.id === id ? { ...x, ...payload, id } : x))}
              onDeleteQuery={(id) => setCustomQueries(prev => prev.filter(x => x.id !== id))}
              ollamaUrl={ollamaUrl}
              ollamaModel={ollamaModel}
              ollamaTimeout={ollamaTimeout}
              ollamaMaxTokens={ollamaMaxTokens}
            />

            {/* Drill ladder — hidden for now; flip SHOW_DRILL_UI to re-enable */}

            <div style={{

                {DRILL_LADDER.map((lvl, idx) => {
                  var curLvl = currentDrillLevel();
                  var curIdx = DRILL_LADDER.indexOf(curLvl);
                  var isCurrent = lvl === curLvl;
                  var isVisited = idx < curIdx;
                  var isFuture = idx > curIdx;
                  var isNext = nextLevel === lvl;
                  return (
                    <div key={lvl} style={{ display: "flex", alignItems: "center" }}>

                        <div style={{
                          width: 12, height: 2,

                      <div style={{
                        ...mono9, fontSize: 8,
                        padding: isCurrent ? "3px 8px" : "2px 6px",
                        borderRadius: isCurrent ? 4 : 10,

                        border: "1px solid " + (isCurrent ? "#34d399" : isNext ? "#34d39950" : isVisited ? "#34d39930" : "#1e2230"),
                        color: isCurrent ? "#34d399" : isVisited ? "#34d39980" : isNext ? "#34d39960" : "#2a2f3a",
                        fontWeight: isCurrent ? 700 : 400,
                        transition: "all 0.2s",
                      }}>{DRILL_LABELS[lvl]}</div>
                    </div>
                  );
                })}
              </div>

              {nextLevel && (
                <button

                  disabled={drilling}
                  style={{
                    ...mono10, fontWeight: 600, letterSpacing: 1,

                    color: !drilling ? "#34d399" : "#3a4050",
                    borderRadius: 5, padding: "5px 14px",
                    cursor: !drilling ? "pointer" : "not-allowed",
                    transition: "all 0.2s",

                >
                  {drilling ? "\u27F3 Drilling..." : "\u25BC " + DRILL_LABELS[nextLevel]}
                </button>

              {atFinest && (
                <span style={{ ...mono9, color: "#34d39950" }}>{"\u2713"} finest level</span>
              )}

              {drillDepth > 0 && (
                <button onClick={drillUp} style={{
                  ...mono10, fontWeight: 600, letterSpacing: 1,
                  background: "#f59e4220", border: "1px solid #f59e4250",
                  color: "#f59e42", borderRadius: 5, padding: "5px 14px", cursor: "pointer",
                }}>{"\u25B2"} {DRILL_LABELS[prevLevel] || "Up"}</button>
              )}

              <span style={{ ...mono9, color: "#2a2f3a", marginLeft: "auto" }}>
                {results ? results.chunksA.length + "\u00D7" + results.chunksB.length : ""}
              </span>
            </div>
            )}

            {/* Plain stats line when drill UI is hidden */}
            <div style={{
              display: "flex", alignItems: "center", justifyContent: "space-between",
              marginBottom: 16, padding: "0 4px",

              <span style={{ ...mono9, color: "#3a4050", letterSpacing: 1 }}>
                {results.drillLabel || ""}
              </span>
              <span style={{ ...mono9, color: "#2a2f3a" }}>
                {results.chunksA.length + "\u00D7" + results.chunksB.length} pairs

            </div>

            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: "1px solid #1e2230", marginBottom: 20 }}>

                  <button key={t} onClick={() => setTab(t)} style={{
