                  }}>{t}</button>
                ))}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => setExportPrompt({ kind: "csv" })} style={{
                  ...mono10, fontWeight: 600, background: "#34d39918", border: "1px solid #34d39940",
                  color: "#34d399", borderRadius: 5, padding: "6px 16px", cursor: "pointer", marginBottom: 4,
                }}>{"\u2913"} CSV</button>
                <button onClick={() => setExportPrompt({ kind: "html" })} style={{
                  ...mono10, fontWeight: 600, background: "#60a5fa18", border: "1px solid #60a5fa40",
                  color: "#60a5fa", borderRadius: 5, padding: "6px 16px", cursor: "pointer", marginBottom: 4,
                }}>{"\u2913"} HTML Report</button>
              </div>
            </div>

            {tab === "heatmap" && (() => {
              // Pick the active matrix and its labels based on toggle
              let activeMatrix, leftChunks, rightChunks, leftName, rightName, leftColor, rightColor, modeLabel;
              if (heatmapMode === "AA") {
                activeMatrix = results.matrixAA || results.matrix;
                leftChunks = rightChunks = results.chunksA;
                leftName = rightName = results.nameA || "DOC A";
                leftColor = rightColor = "#60a5fa";
                modeLabel = (results.nameA || "A") + " \u00D7 " + (results.nameA || "A");
              } else if (heatmapMode === "BB") {
                activeMatrix = results.matrixBB || results.matrix;
                leftChunks = rightChunks = results.chunksB;
                leftName = rightName = results.nameB || "DOC B";
                leftColor = rightColor = "#f59e42";
                modeLabel = (results.nameB || "B") + " \u00D7 " + (results.nameB || "B");
              } else {
                activeMatrix = results.matrix;
                leftChunks = results.chunksA; rightChunks = results.chunksB;
                leftName = results.nameA || "DOC A"; rightName = results.nameB || "DOC B";
                leftColor = "#60a5fa"; rightColor = "#f59e42";
                modeLabel = (results.nameA || "A") + " \u00D7 " + (results.nameB || "B");
              }
              const hasSelfMatrices = !!(results.matrixAA && results.matrixBB);
              return (
              <FullscreenPanel label="SIMILARITY HEATMAP">
              <div style={{ background: "#0e1018", borderRadius: 10, padding: 20 }}>
                {/* Mode toggle */}
                <div style={{
                  display: "flex", alignItems: "center", gap: 6, marginBottom: 14, flexWrap: "wrap",
                }}>
                  <span style={{ ...mono9, color: "#3a4050", letterSpacing: 1, marginRight: 4 }}>COMPARE</span>
                  {[
                    { id: "AB", label: (results.nameA || "A") + " \u00D7 " + (results.nameB || "B"), color: "#f0c040", title: "Cross-document similarity (default)" },
                    { id: "AA", label: (results.nameA || "A") + " self", color: "#60a5fa", title: "How chunks of A relate to themselves \u2014 reveals internal structure, repetition, and natural clusters" },
                    { id: "BB", label: (results.nameB || "B") + " self", color: "#f59e42", title: "How chunks of B relate to themselves \u2014 reveals internal structure, repetition, and natural clusters" },
                  ].map(opt => {
                    const on = heatmapMode === opt.id;
                    const dis = (opt.id === "AA" || opt.id === "BB") && !hasSelfMatrices;
                    return (
                      <button key={opt.id}
                        onClick={() => { if (!dis) { setHeatmapMode(opt.id); setSelectedCell(null); } }}
                        disabled={dis}
                        title={dis ? "Re-run analysis to compute self-similarity matrices" : opt.title}
                        style={{
                          ...mono10, fontWeight: 600,
                          background: on ? opt.color + "20" : "#141822",
                          border: "1px solid " + (on ? opt.color + "60" : "#1e2230"),
                          color: dis ? "#2a2f3a" : (on ? opt.color : "#4a5568"),
                          borderRadius: 4, padding: "5px 12px",
                          cursor: dis ? "not-allowed" : "pointer",
                        }}>{on && "\u2713 "}{opt.label}</button>
                    );
                  })}
                  <span style={{ ...mono9, color: "#3a4050", marginLeft: "auto", fontStyle: "italic" }}>
                    {heatmapMode === "AB"
                      ? "comparing across documents"
                      : "self-comparison \u00B7 diagonal = 1.0 by definition"}
                  </span>
                </div>
                <div style={{ ...mono10, color: "#4a5568", marginBottom: 12 }}>
                  SIMILARITY MATRIX {"\u00B7"} {modeLabel} {"\u00B7"} {activeMatrix.length}{"\u00D7"}{(activeMatrix[0] || []).length} {"\u00B7"} click any cell for details
                </div>
                <HeatmapInterpreter matrix={activeMatrix} mode={heatmapMode} onChunkClick={setSelectedCell} />
                <Heatmap matrix={activeMatrix} chunksA={leftChunks} chunksB={rightChunks} onCellClick={setSelectedCell} selectedCell={selectedCell} interpretations={interpretations} mode={heatmapMode} />
                {selectedCell && activeMatrix[selectedCell[0]] && activeMatrix[selectedCell[0]][selectedCell[1]] != null && (
                  <div style={{ marginTop: 16, background: "#141822", borderRadius: 8, padding: 16, border: "1px solid #f0c04020" }}>
                    <div style={{ ...mono11, color: "#f0c040", marginBottom: 12 }}>
                      <span style={{ color: leftColor }}>{heatmapMode === "BB" ? "B" : "A"}{selectedCell[0]+1}</span>
                      {" \u27F7 "}
                      <span style={{ color: rightColor }}>{heatmapMode === "AA" ? "A" : (heatmapMode === "BB" ? "B" : "B")}{selectedCell[1]+1}</span>
                      {" \u00B7 " + (activeMatrix[selectedCell[0]][selectedCell[1]]*100).toFixed(1) + "%"}
                      {heatmapMode !== "AB" && selectedCell[0] === selectedCell[1] && (
                        <span style={{ color: "#3a4050", marginLeft: 8, fontWeight: 400 }}>{"\u00B7"} self-pair (diagonal)</span>
                      )}
                    </div>
                    <div style={{ display: "flex", gap: 12 }}>
                      <div style={{ flex: "1 1 50%", minWidth: 0, borderLeft: "3px solid " + leftColor + "20", padding: "8px 12px", overflow: "hidden" }}>
                        <div style={{ ...mono9, color: leftColor, marginBottom: 6 }}>{leftName.toUpperCase()} {"\u00B7"} CHUNK {selectedCell[0]+1}</div>
                        <ChunkContent text={leftChunks[selectedCell[0]]} maxLen={400} fontSize={12} />
                      </div>
                      <div style={{ flex: "1 1 50%", minWidth: 0, borderLeft: "3px solid " + rightColor + "20", padding: "8px 12px", overflow: "hidden" }}>
                        <div style={{ ...mono9, color: rightColor, marginBottom: 6 }}>{rightName.toUpperCase()} {"\u00B7"} CHUNK {selectedCell[1]+1}</div>
                        <ChunkContent text={rightChunks[selectedCell[1]]} maxLen={400} fontSize={12} />
                      </div>
                    </div>
                    {heatmapMode === "AB" && (
                      <InterpretBtn
                        i={selectedCell[0]} j={selectedCell[1]}
                        score={results.matrix[selectedCell[0]][selectedCell[1]]}
                        chunkA={results.chunksA[selectedCell[0]]}
                        chunkB={results.chunksB[selectedCell[1]]}
                        interps={getInterps(interpretations, selectedCell[0]+"-"+selectedCell[1])}
                        currentLabel={labelForPrompt(promptTemplate, customQueries)}
                        customQueries={customQueries}
                        readOnly={reportMode}
                        postProcessors={postProcessors}
                        onInterpret={interpretPair}
                        onRemove={removeInterp}
                      />
                    )}
                    {false && (
                    <DrillDown
                      chunkA={results.chunksA[selectedCell[0]]}
                      chunkB={results.chunksB[selectedCell[1]]}
                      macroLabelA={"A"+(selectedCell[0]+1)}
                      macroLabelB={"B"+(selectedCell[1]+1)}
                      microSize={microSize}
                    />
                    )}
                  </div>
                )}
              </div>
              </FullscreenPanel>
              );
            })()}

            {tab === "matches" && (() => {
              const q = matchSearch.trim().toLowerCase();
              const filtered = q
                ? topMatches.filter(m => {
                    const aTxt = (results.chunksA[m.i] || "").toLowerCase();
                    const bTxt = (results.chunksB[m.j] || "").toLowerCase();
                    const aLabel = "a" + (m.i + 1);
                    const bLabel = "b" + (m.j + 1);
                    return aTxt.includes(q) || bTxt.includes(q) || aLabel === q || bLabel === q || aLabel.startsWith(q) || bLabel.startsWith(q);
                  })
                : topMatches;
              const totalPages = Math.max(1, Math.ceil(filtered.length / matchPageSize));
              const curPage = Math.min(matchPage, totalPages - 1);
              const pageStart = curPage * matchPageSize;
              const pageSlice = filtered.slice(pageStart, pageStart + matchPageSize);
              return (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {/* Search + pagination controls */}
                <div style={{
                  display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap",
                  background: "#0e1018", borderRadius: 8, padding: "8px 12px",
                  border: "1px solid #1e2230",
                }}>
                  <span style={{ ...mono9, color: "#3a4050", letterSpacing: 1 }}>{"\u{1F50D}"} SEARCH</span>
                  <input
                    type="text"
                    value={matchSearch}
                    onChange={e => { setMatchSearch(e.target.value); setMatchPage(0); }}
                    placeholder="text within chunks, or A3 / B7"
                    style={{
                      flex: 1, minWidth: 160,
                      background: "#141822", border: "1px solid #1e2230",
                      color: matchSearch ? "#f0c040" : "#9ca3af",
                      borderRadius: 4, padding: "4px 10px", ...mono10, outline: "none",
                    }}
                  />
                  {matchSearch && (
                    <button onClick={() => { setMatchSearch(""); setMatchPage(0); }} style={{
                      ...mono9, background: "transparent", border: "1px solid #1e2230",
                      color: "#4a5568", borderRadius: 3, padding: "3px 8px", cursor: "pointer",
                    }}>{"\u2715"} clear</button>
                  )}
                  <span style={{ ...mono9, color: "#3a4050" }}>{"\u00B7"}</span>
                  <span style={{ ...mono10, color: "#9ca3af" }}>
                    {filtered.length.toLocaleString()} {filtered.length === 1 ? "match" : "matches"}
                    {matchSearch && topMatches.length !== filtered.length && (
                      <span style={{ color: "#3a4050" }}> of {topMatches.length.toLocaleString()}</span>
                    )}
                  </span>
                  <span style={{ ...mono9, color: "#3a4050", marginLeft: "auto" }}>per page</span>
                  <select value={matchPageSize}
                    onChange={e => { setMatchPageSize(Number(e.target.value)); setMatchPage(0); }}
                    style={{
                      background: "#141822", border: "1px solid #1e2230", color: "#9ca3af",
                      borderRadius: 4, padding: "3px 6px", ...mono10, cursor: "pointer", outline: "none",
                    }}>
                    {[10, 20, 50, 100].map(n => <option key={n} value={n}>{n}</option>)}
                  </select>
                </div>

                {/* Pagination nav top */}
                {filtered.length > matchPageSize && (
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                    <button onClick={() => setMatchPage(0)} disabled={curPage === 0} style={{
                      ...mono9, background: curPage === 0 ? "#141822" : "#f0c04018",
                      border: "1px solid " + (curPage === 0 ? "#1e2230" : "#f0c04040"),
                      color: curPage === 0 ? "#3a4050" : "#f0c040",
                      borderRadius: 3, padding: "3px 8px", cursor: curPage === 0 ? "not-allowed" : "pointer",
                    }}>{"\u00AB"} first</button>
                    <button onClick={() => setMatchPage(p => Math.max(0, p - 1))} disabled={curPage === 0} style={{
                      ...mono9, background: curPage === 0 ? "#141822" : "#f0c04018",
                      border: "1px solid " + (curPage === 0 ? "#1e2230" : "#f0c04040"),
                      color: curPage === 0 ? "#3a4050" : "#f0c040",
                      borderRadius: 3, padding: "3px 8px", cursor: curPage === 0 ? "not-allowed" : "pointer",
                    }}>{"\u2039"} prev</button>
                    <span style={{ ...mono10, color: "#9ca3af", padding: "0 6px" }}>
                      page <span style={{ color: "#f0c040", fontWeight: 600 }}>{curPage + 1}</span>
                      <span style={{ color: "#3a4050" }}> / {totalPages}</span>
                      <span style={{ color: "#3a4050" }}>
                        {" \u00B7 #"}{pageStart + 1}-{Math.min(pageStart + matchPageSize, filtered.length)}
                      </span>
                    </span>
                    <button onClick={() => setMatchPage(p => Math.min(totalPages - 1, p + 1))} disabled={curPage >= totalPages - 1} style={{
                      ...mono9, background: curPage >= totalPages - 1 ? "#141822" : "#f0c04018",
                      border: "1px solid " + (curPage >= totalPages - 1 ? "#1e2230" : "#f0c04040"),
                      color: curPage >= totalPages - 1 ? "#3a4050" : "#f0c040",
                      borderRadius: 3, padding: "3px 8px", cursor: curPage >= totalPages - 1 ? "not-allowed" : "pointer",
                    }}>next {"\u203A"}</button>
                    <button onClick={() => setMatchPage(totalPages - 1)} disabled={curPage >= totalPages - 1} style={{
                      ...mono9, background: curPage >= totalPages - 1 ? "#141822" : "#f0c04018",
                      border: "1px solid " + (curPage >= totalPages - 1 ? "#1e2230" : "#f0c04040"),
                      color: curPage >= totalPages - 1 ? "#3a4050" : "#f0c040",
                      borderRadius: 3, padding: "3px 8px", cursor: curPage >= totalPages - 1 ? "not-allowed" : "pointer",
                    }}>last {"\u00BB"}</button>
                  </div>
                )}

                {pageSlice.length === 0 && (
                  <div style={{
                    ...mono10, color: "#3a4050", padding: "32px 12px", textAlign: "center",
                    background: "#0e1018", borderRadius: 8, border: "1px solid #1e2230",
                  }}>
                    {matchSearch ? "No matches found for \"" + matchSearch + "\"" : "No matches"}
                  </div>
                )}

                {pageSlice.map((m, idx) => {
                  const k = m.i+"-"+m.j;
                  const globalRank = topMatches.indexOf(m) + 1;
                  const localIdx = pageStart + idx;
                  return (
                    <MatchCard key={k} rank={globalRank} i={m.i} j={m.j} score={m.score}
                      chunkA={results.chunksA[m.i]} chunkB={results.chunksB[m.j]}
                      isExpanded={expandedMatch === localIdx}
                      onToggle={() => setExpandedMatch(expandedMatch === localIdx ? -1 : localIdx)}
                      interps={getInterps(interpretations, k)}
                      currentLabel={labelForPrompt(promptTemplate, customQueries)}
                      customQueries={customQueries}
                      readOnly={reportMode}
                      postProcessors={postProcessors}
                      onInterpret={interpretPair}
                      onRemove={removeInterp}
                      microSize={microSize}
                      onDrillChunk={drillOneChunk}
                      drilling={drilling}
                      nameA={results.nameA} nameB={results.nameB}
                    />
                  );
                })}
              </div>
              );
            })()}

            {tab === "documents" && (
              <FullscreenPanel label="DOCUMENT VIEW">
              <DocumentView
                chunksA={results.chunksA}
                chunksB={results.chunksB}
                matrix={results.matrix}
                interpretations={interpretations}
                onDrillChunk={drillOneChunk}
                drilling={drilling}
                onInterpret={interpretPair}
                onRemove={removeInterp}
                currentLabel={labelForPrompt(promptTemplate, customQueries)}
                customQueries={customQueries}
                readOnly={reportMode}
                postProcessors={postProcessors}
                search={docSearch}
                onSearchChange={setDocSearch}
                nameA={results.nameA} nameB={results.nameB}
              />
              </FullscreenPanel>
            )}

            {tab === "graph" && (
              <FullscreenPanel label="CHUNK GRAPH">
              <GraphView
                chunksA={results.chunksA}
                chunksB={results.chunksB}
                matrix={results.matrix}
                interpretations={interpretations}
                microSize={microSize}
                onDrillChunk={drillOneChunk}
                drilling={drilling}
                onInterpret={interpretPair}
                onRemove={removeInterp}
                currentLabel={labelForPrompt(promptTemplate, customQueries)}
                customQueries={customQueries}
                readOnly={reportMode}
                postProcessors={postProcessors}
                nameA={results.nameA} nameB={results.nameB}
              />
              </FullscreenPanel>
            )}

            {tab === "distribution" && (
              <div style={{ background: "#0e1018", borderRadius: 10, padding: 20 }}>
                <div style={{ ...mono10, color: "#4a5568", marginBottom: 16 }}>SIMILARITY SCORE DISTRIBUTION</div>
                <DistributionChart pairs={results.pairs} />
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
