// ═══════════════════════════════════════════════════════════════
// HEATMAP INTERPRETER — analyzes the matrix to surface patterns
// ═══════════════════════════════════════════════════════════════
//
// What heatmap patterns mean:
//
//   Bright diagonal (TL → BR)
//     Documents are aligned and very similar; chunk N of A matches chunk N of B.
//     The brighter and longer, the closer the alignment.
//
//   Diagonal breaks (gaps in the diagonal)
//     Insertions or deletions: content was added on one side or removed on the other,
//     causing chunks to fall out of step at that point.
//
//   Diagonal shifts (line offsets after a break)
//     Reorganization or large additions/deletions. The diagonal jumps to a new offset
//     and continues, indicating the docs realign at a different chunk index.
//
//   Off-diagonal hot lines (parallel to main diagonal)
//     Repeated structure or templated sections appearing at multiple offsets.
//
//   Off-diagonal hotspots (isolated bright cells off the main line)
//     Content moved: a section in A appears at a different position in B.
//
//   Bright vertical or horizontal stripes
//     A single chunk on one side matches many chunks on the other — boilerplate,
//     template fragments, or a chunk so generic it lights up everywhere (filler text,
//     common headers/footers, repeated phrases).
//
//   Bright square clusters along the diagonal
//     Coherent thematic sections — consecutive chunks share vocabulary internally
//     (especially visible in self-similarity views).
//
//   Diffuse fuzziness around the diagonal
//     Within-chunk mutations, paraphrasing, or rewording — the docs still align
//     positionally but each chunk shifted in vocabulary.
//
//   Cold matrix (mostly dark, no diagonal)
//     Documents are unrelated or have been completely rewritten with different
//     vocabulary.
//
//   Checkerboard / scattered noise
//     No structural alignment; possibly different topics with shared general vocabulary
//     (think: two news articles in the same domain but covering unrelated events).
//
// Self-similarity heatmaps (A×A or B×B):
//   The diagonal is always 1.0. Off-diagonal patterns reveal:
//     - Block clusters → coherent sections (chapters, themes)
//     - Repeated stripes → boilerplate or recurring phrases
//     - Sparse off-diagonal → high vocabulary diversity per chunk
//     - Periodic off-diagonal lines → recurring template or refrain

function analyzeHeatmap(matrix, mode) {
  if (!matrix || matrix.length === 0 || (matrix[0] || []).length === 0) {
    return { findings: [], summary: "No data to analyze." };
  }
  const rows = matrix.length;
  const cols = matrix[0].length;
  const isSelf = mode === "AA" || mode === "BB";
  const docName = mode === "AA" ? "A" : (mode === "BB" ? "B" : null);

  // ─── Pass 1: gather basic stats ───
  let total = 0, count = 0, max = 0;
  let aboveHigh = 0, aboveMid = 0, aboveLow = 0;
  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < cols; j++) {
      // For self matrices, exclude the diagonal from stats — it's trivially 1.0
      if (isSelf && i === j) continue;
      const v = matrix[i][j];
      total += v; count++;
      if (v > max) max = v;
      if (v >= 0.7) aboveHigh++;
      if (v >= 0.4) aboveMid++;
      if (v >= 0.2) aboveLow++;
    }
  }
  const avg = count > 0 ? total / count : 0;
  const density = count > 0 ? aboveMid / count : 0;

  // ─── Pass 2: diagonal strength (TL→BR) ───
  // For non-square matrices, walk the main diagonal up to min(rows, cols)
  const diagLen = Math.min(rows, cols);
  let diagSum = 0, diagBright = 0, diagBreaks = 0;
  let consecutiveBreak = 0, longestBreakRun = 0, longestBreakStart = -1, currentBreakStart = -1;
  const breakRanges = []; // [{ start, end, length }] for runs of dim/missing diagonal cells
  const brightDiagPairs = []; // brightest aligned pairs along the diagonal
  const fuzzyPairs = []; // pairs where neighbors outshine the diagonal cell
  const diagThreshold = 0.3;
  for (let k = 0; k < diagLen; k++) {
    const v = matrix[k][k];
    diagSum += v;
    if (v >= diagThreshold) {
      diagBright++;
      brightDiagPairs.push({ i: k, j: k, score: v });
      // close any open break range
      if (currentBreakStart >= 0) {
        const run = k - currentBreakStart;
        breakRanges.push({ start: currentBreakStart, end: k - 1, length: run });
        currentBreakStart = -1;
      }
      consecutiveBreak = 0;
    } else {
      diagBreaks++;
      if (currentBreakStart < 0) currentBreakStart = k;
      consecutiveBreak++;
      if (consecutiveBreak > longestBreakRun) {
        longestBreakRun = consecutiveBreak;
        longestBreakStart = currentBreakStart;
      }
    }
  }
  // Close trailing break
  if (currentBreakStart >= 0) {
    breakRanges.push({ start: currentBreakStart, end: diagLen - 1, length: diagLen - currentBreakStart });
  }
  // Sort brightest first, top 5 for reporting
  brightDiagPairs.sort((a, b) => b.score - a.score);
  // Sort break ranges by length desc
  breakRanges.sort((a, b) => b.length - a.length);
  const diagAvg = diagLen > 0 ? diagSum / diagLen : 0;
  const diagBrightFrac = diagLen > 0 ? diagBright / diagLen : 0;

  // ─── Pass 3: detect bright stripes (rows or columns mostly hot) ───
  const stripeThreshold = 0.4;
  const stripeMinFrac = 0.4; // a stripe is "bright" if ≥40% of its cells are above the threshold
  const brightRows = [];
  for (let i = 0; i < rows; i++) {
    let hot = 0, denom = 0;
    for (let j = 0; j < cols; j++) {
      if (isSelf && i === j) continue;
      denom++;
      if (matrix[i][j] >= stripeThreshold) hot++;
    }
    if (denom > 0 && (hot / denom) >= stripeMinFrac) brightRows.push({ idx: i, frac: hot / denom });
  }
  const brightCols = [];
  for (let j = 0; j < cols; j++) {
    let hot = 0, denom = 0;
    for (let i = 0; i < rows; i++) {
      if (isSelf && i === j) continue;
      denom++;
      if (matrix[i][j] >= stripeThreshold) hot++;
    }
    if (denom > 0 && (hot / denom) >= stripeMinFrac) brightCols.push({ idx: j, frac: hot / denom });
  }

  // ─── Pass 4: off-diagonal hotspots (isolated bright cells far from diagonal) ───
  // Sample-based: scan all cells, but only keep top-N off-diagonal ones
  const offDiagHotspots = [];
  const hotspotThreshold = 0.6;
  const farFromDiag = Math.max(2, Math.floor(diagLen * 0.05));
  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < cols; j++) {
      if (Math.abs(i - j) >= farFromDiag && matrix[i][j] >= hotspotThreshold) {
        offDiagHotspots.push({ i, j, score: matrix[i][j] });
      }
    }
  }
  offDiagHotspots.sort((a, b) => b.score - a.score);

  // ─── Pass 5: diagonal-fuzziness (band around diagonal) ───
  // Average score in a small band around the diagonal vs the diagonal itself.
  // High band/diag ratio = fuzziness (chunks shifted in vocabulary but stayed in position).
  const bandWidth = 2;
  let bandSum = 0, bandCount = 0;
  for (let k = 0; k < diagLen; k++) {
    let bandMaxOff = 0, bandMaxScore = 0;
    for (let off = -bandWidth; off <= bandWidth; off++) {
      if (off === 0) continue;
      const i = k, j = k + off;
      if (j >= 0 && j < cols && i < rows) {
        bandSum += matrix[i][j]; bandCount++;
        if (matrix[i][j] > bandMaxScore) { bandMaxScore = matrix[i][j]; bandMaxOff = off; }
      }
    }
    // Track positions where a neighbor outshines the diagonal cell — true fuzziness signal
    if (bandMaxScore >= 0.4 && matrix[k][k] >= 0.2 && bandMaxScore > matrix[k][k] * 1.2) {
      fuzzyPairs.push({ i: k, j: k + bandMaxOff, score: bandMaxScore });
    }
  }
  fuzzyPairs.sort((a, b) => b.score - a.score);
  const bandAvg = bandCount > 0 ? bandSum / bandCount : 0;
  const fuzziness = diagAvg > 0.05 ? bandAvg / diagAvg : 0; // 0–1+ ratio

  // ─── Pass 6: shifted diagonals — find dominant offset ───
  // For each offset k from -N to +N, sum the matrix along that diagonal. The brightest
  // off-zero offset hints at how much the docs are shifted relative to each other.
  const offsets = {};
  const offsetMax = Math.min(rows, cols, 30);
  for (let off = -offsetMax; off <= offsetMax; off++) {
    let s = 0, n = 0;
    for (let k = 0; k < diagLen; k++) {
      const i = k, j = k + off;
      if (j >= 0 && j < cols && i < rows) { s += matrix[i][j]; n++; }
    }
    offsets[off] = n > 0 ? s / n : 0;
  }
  // Brightest non-zero offset
  let topShiftOffset = 0, topShiftScore = 0;
  for (const offStr of Object.keys(offsets)) {
    const off = parseInt(offStr, 10);
    if (off === 0) continue;
    if (offsets[off] > topShiftScore) { topShiftScore = offsets[off]; topShiftOffset = off; }
  }
  const shiftIsSignificant = topShiftScore > 0.3 && topShiftScore > diagAvg * 0.7 && Math.abs(topShiftOffset) > 1;

  // ─── Pass 7 (self-mode only): contiguous block clusters along diagonal ───
  // Find runs of adjacent chunks that share substantial vocabulary with each other,
  // indicating coherent thematic sections.
  const blockClusters = [];
  if (isSelf) {
    let runStart = -1;
    const blockThresh = 0.35;
    for (let k = 0; k < diagLen - 1; k++) {
      const sim = matrix[k][k + 1]; // adjacency similarity
      if (sim >= blockThresh) {
        if (runStart < 0) runStart = k;
      } else {
        if (runStart >= 0 && k - runStart >= 2) { // at least 3 contiguous chunks
          blockClusters.push({ start: runStart, end: k, length: k - runStart + 1 });
        }
        runStart = -1;
      }
    }
    if (runStart >= 0 && diagLen - runStart >= 3) {
      blockClusters.push({ start: runStart, end: diagLen - 1, length: diagLen - runStart });
    }
    blockClusters.sort((a, b) => b.length - a.length);
  }

  // ─── Synthesize findings ───
  const findings = [];

  // Headline: diagonal interpretation
  if (!isSelf) {
    if (diagBrightFrac >= 0.7 && diagAvg >= 0.5) {
      findings.push({
        kind: "primary", icon: "\u2713", color: "#34d399",
        title: "Strong diagonal alignment",
        detail: "About " + Math.round(diagBrightFrac * 100) + "% of paired chunks (A" + "ₙ ↔ B" + "ₙ) score above " + Math.round(diagThreshold * 100) + "%. The documents are well-aligned and largely overlap in content and order. Differences are likely local rather than structural.",
        chunks: brightDiagPairs.slice(0, 6),
        chunksLabel: "Brightest aligned pairs:",
      });
    } else if (diagBrightFrac >= 0.4) {
      findings.push({
        kind: "primary", icon: "\u25D0", color: "#f0c040",
        title: "Partial diagonal alignment",
        detail: "Roughly " + Math.round(diagBrightFrac * 100) + "% of paired chunks align. The documents share substantial structure but diverge in places \u2014 expect both shared sections and unique content.",
        chunks: brightDiagPairs.slice(0, 6),
        chunksLabel: "Sample of aligned pairs:",
      });
    } else if (diagAvg < 0.15 && density < 0.05) {
      findings.push({
        kind: "primary", icon: "\u00D7", color: "#f87171",
        title: "Weak or absent diagonal",
        detail: "Diagonal average " + (diagAvg * 100).toFixed(1) + "%, overall density " + (density * 100).toFixed(1) + "%. The documents are largely unrelated or have been completely rewritten with different vocabulary.",
      });
    } else {
      findings.push({
        kind: "primary", icon: "\u25CB", color: "#9ca3af",
        title: "Loose diagonal",
        detail: "Diagonal average " + (diagAvg * 100).toFixed(1) + "% \u2014 only weak chunk-to-chunk alignment. Either the chunking didn't capture aligned units, or the documents share themes but not structure.",
      });
    }
  } else {
    // Self matrix: characterize internal structure
    if (density < 0.02) {
      findings.push({
        kind: "primary", icon: "\u25CB", color: "#9ca3af",
        title: "Diverse content",
        detail: docName + "'s chunks share little vocabulary with each other (off-diagonal density " + (density * 100).toFixed(1) + "%). Each chunk introduces relatively unique terms \u2014 high topical breadth.",
      });
    } else if (density > 0.15) {
      findings.push({
        kind: "primary", icon: "\u25A0", color: "#f0c040",
        title: "Repetitive or templated content",
        detail: docName + "'s chunks share substantial vocabulary across the whole document (off-diagonal density " + (density * 100).toFixed(1) + "%). Could indicate boilerplate, template repetition, or a single dominant topic.",
      });
    } else {
      findings.push({
        kind: "primary", icon: "\u25D0", color: "#60a5fa",
        title: "Moderate internal cohesion",
        detail: docName + " has typical internal structure \u2014 some thematic clustering but not heavily repetitive (off-diagonal density " + (density * 100).toFixed(1) + "%).",
      });
    }
  }

  // Diagonal breaks
  if (!isSelf && diagBrightFrac >= 0.3 && longestBreakRun >= 3) {
    // Express break ranges as chunk pairs (the misaligned diagonal cells)
    const breakChunks = breakRanges.slice(0, 5).flatMap(br => {
      // Pick representative endpoints of each break range
      const samples = [];
      samples.push({ i: br.start, j: br.start, score: matrix[br.start] ? (matrix[br.start][br.start] || 0) : 0, _label: "A" + (br.start + 1) + "\u2194B" + (br.start + 1) + " \u2026 A" + (br.end + 1) + "\u2194B" + (br.end + 1) + " (" + br.length + " chunks)" });
      return samples;
    });
    findings.push({
      kind: "info", icon: "\u2192\u2502\u2192", color: "#f59e42",
      title: "Diagonal breaks detected",
      detail: "Found " + breakRanges.length + " break range" + (breakRanges.length === 1 ? "" : "s") + " in the diagonal (longest: " + longestBreakRun + " consecutive chunks). Suggests insertion or deletion at those points \u2014 content present in one document was added or removed in the other, throwing later chunks out of alignment.",
      chunks: breakChunks,
      chunksLabel: "Break ranges (click to inspect):",
    });
  }

  // Diagonal shift
  if (!isSelf && shiftIsSignificant) {
    const dir = topShiftOffset > 0 ? "B" : "A";
    // Sample a few cells along the shifted diagonal as evidence
    const shiftPairs = [];
    for (let k = 0; k < diagLen; k++) {
      const i = k, j = k + topShiftOffset;
      if (j >= 0 && j < cols && i < rows && matrix[i][j] >= 0.4) {
        shiftPairs.push({ i, j, score: matrix[i][j] });
      }
    }
    shiftPairs.sort((a, b) => b.score - a.score);
    findings.push({
      kind: "info", icon: "\u2197", color: "#a78bfa",
      title: "Shifted alignment",
      detail: "Bright off-diagonal at offset " + (topShiftOffset > 0 ? "+" : "") + topShiftOffset + " (avg " + (topShiftScore * 100).toFixed(1) + "%). " + dir + " appears to be offset by ~" + Math.abs(topShiftOffset) + " chunks relative to the other \u2014 likely from added/removed content earlier in " + dir + ", causing the rest of the alignment to slide.",
      chunks: shiftPairs.slice(0, 6),
      chunksLabel: "Brightest pairs along the shifted line:",
    });
  }

  // Fuzziness / paraphrasing
  if (!isSelf && diagAvg >= 0.25 && fuzziness >= 0.6) {
    findings.push({
      kind: "info", icon: "\u223F", color: "#60a5fa",
      title: "Paraphrasing or in-place mutations",
      detail: "The band around the diagonal is " + (fuzziness * 100).toFixed(0) + "% as bright as the diagonal itself. Chunks that align positionally also share vocabulary with their neighbors \u2014 typical of paraphrasing, sentence-level rewording, or fuzzy chunking boundaries.",
      chunks: fuzzyPairs.slice(0, 6),
      chunksLabel: fuzzyPairs.length > 0 ? "Pairs where neighbors outshine the diagonal:" : null,
    });
  }

  // Bright stripes (boilerplate / generic chunks)
  if (brightRows.length > 0) {
    const lbl = isSelf ? docName : "A";
    const list = brightRows.slice(0, 5).map(r => lbl + (r.idx + 1)).join(", ");
    // Map to chunk-pair format with "i" as the row's chunk and "j" pointing to its top-match column
    const stripChunks = brightRows.slice(0, 6).map(r => {
      // Find the brightest cell in this row to give the click somewhere meaningful to land
      let bestJ = 0, bestScore = 0;
      for (let j = 0; j < cols; j++) {
        if (isSelf && j === r.idx) continue;
        if (matrix[r.idx][j] > bestScore) { bestScore = matrix[r.idx][j]; bestJ = j; }
      }
      return { i: r.idx, j: bestJ, score: bestScore, _label: lbl + (r.idx + 1) + " (" + (r.frac * 100).toFixed(0) + "% hot)" };
    });
    findings.push({
      kind: "info", icon: "\u2261", color: "#f0c040",
      title: brightRows.length === 1 ? "Bright row \u2014 generic chunk in " + lbl : brightRows.length + " bright rows \u2014 generic chunks in " + lbl,
      detail: "Chunk(s) " + list + (brightRows.length > 5 ? ", \u2026" : "") + " match a large fraction of the other side. Could be boilerplate (headers, disclaimers, signatures), template fragments, or unusually generic phrasing that shares vocabulary with many sections.",
      chunks: stripChunks,
      chunksLabel: "Generic chunks in " + lbl + ":",
    });
  }
  if (brightCols.length > 0) {
    const lbl = isSelf ? docName : "B";
    const list = brightCols.slice(0, 5).map(c => lbl + (c.idx + 1)).join(", ");
    const stripChunks = brightCols.slice(0, 6).map(c => {
      let bestI = 0, bestScore = 0;
      for (let i = 0; i < rows; i++) {
        if (isSelf && i === c.idx) continue;
        if (matrix[i][c.idx] > bestScore) { bestScore = matrix[i][c.idx]; bestI = i; }
      }
      return { i: bestI, j: c.idx, score: bestScore, _label: lbl + (c.idx + 1) + " (" + (c.frac * 100).toFixed(0) + "% hot)" };
    });
    findings.push({
      kind: "info", icon: "\u2225", color: "#f0c040",
      title: brightCols.length === 1 ? "Bright column \u2014 generic chunk in " + lbl : brightCols.length + " bright columns \u2014 generic chunks in " + lbl,
      detail: "Chunk(s) " + list + (brightCols.length > 5 ? ", \u2026" : "") + " match a large fraction of the other side. Same diagnosis as bright rows: boilerplate or generic content.",
      chunks: stripChunks,
      chunksLabel: "Generic chunks in " + lbl + ":",
    });
  }

  // Off-diagonal hotspots (moved content)
  if (offDiagHotspots.length > 0 && !isSelf) {
    findings.push({
      kind: "info", icon: "\u21CC", color: "#a78bfa",
      title: offDiagHotspots.length === 1 ? "Off-diagonal hotspot \u2014 possible moved content" : "Off-diagonal hotspots (" + offDiagHotspots.length + ") \u2014 possible moved content",
      detail: "Bright cells far from the main diagonal. A section appearing at one position in one doc and a different position in the other \u2014 reorganization, restructuring, or repeated material.",
      chunks: offDiagHotspots.slice(0, 6),
      chunksLabel: "Brightest off-diagonal pairs:",
    });
  } else if (offDiagHotspots.length > 0 && isSelf) {
    findings.push({
      kind: "info", icon: "\u21CC", color: "#a78bfa",
      title: "Recurring sections in " + docName,
      detail: "Distant chunks share substantial vocabulary \u2014 indicates repeated themes, callbacks, or duplicated material within " + docName + ".",
      chunks: offDiagHotspots.slice(0, 6),
      chunksLabel: "Recurring chunk pairs:",
    });
  }

  // Block clusters (self mode only) — coherent thematic sections
  if (isSelf && blockClusters.length > 0) {
    const blockChunks = blockClusters.slice(0, 5).map(b => ({
      i: b.start, j: b.end,
      score: matrix[b.start][b.end] || matrix[b.start][b.start + 1] || 0,
      _label: docName + (b.start + 1) + "\u2013" + docName + (b.end + 1) + " (" + b.length + " chunks)",
    }));
    findings.push({
      kind: "info", icon: "\u25A0", color: "#34d399",
      title: blockClusters.length === 1 ? "Coherent thematic section in " + docName : blockClusters.length + " coherent thematic sections in " + docName,
      detail: "Contiguous chunks sharing vocabulary form " + blockClusters.length + " block cluster" + (blockClusters.length === 1 ? "" : "s") + " along the diagonal. These are coherent sections \u2014 chapters, topical regions, or sustained discussions on the same subject.",
      chunks: blockChunks,
      chunksLabel: "Cluster ranges (size = chunks in block):",
    });
  }

  // Sanity: chunking too fine?
  if (rows + cols > 200 && avg < 0.05 && diagAvg < 0.15) {
    findings.push({
      kind: "warn", icon: "\u26A0", color: "#f59e42",
      title: "Chunking may be too fine",
      detail: "With " + rows + "\u00D7" + cols + " chunks and very low overall similarity, the matrix is mostly noise. Consider re-running with a larger chunk size to see structural patterns.",
    });
  }

  // Build a one-line summary
  let summary;
  if (isSelf) {
    summary = docName + "\u00D7" + docName + " self-similarity: avg " + (avg * 100).toFixed(1) + "% off-diagonal density, " + (density * 100).toFixed(1) + "% above 40%.";
  } else {
    summary = "Diagonal " + (diagAvg * 100).toFixed(1) + "% avg \u00B7 " + Math.round(diagBrightFrac * 100) + "% above " + Math.round(diagThreshold * 100) + "% \u00B7 overall density " + (density * 100).toFixed(1) + "%.";
  }

  return { findings, summary, stats: { avg, max, diagAvg, diagBrightFrac, density, fuzziness, brightRows: brightRows.length, brightCols: brightCols.length, hotspots: offDiagHotspots.length } };
}

function HeatmapInterpreter({ matrix, mode, onChunkClick }) {
  const [collapsed, setCollapsed] = useState(false);
  const analysis = useMemo(() => analyzeHeatmap(matrix, mode), [matrix, mode]);

  // Pick chunk-label prefixes appropriate for the mode
  const lblA = mode === "BB" ? "B" : "A";
  const lblB = mode === "AA" ? "A" : (mode === "BB" ? "B" : "B");

  return (
    <div style={{
      background: "#0c0e16", borderRadius: 8, padding: 12, marginBottom: 12,
      border: "1px solid #818cf830",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
          <span style={{ ...mono10, color: "#818cf8", letterSpacing: 1, fontWeight: 600 }}>
            {"\u{1F50E}"} INTERPRETATION
          </span>
          <span style={{ ...mono9, color: "#3a4050", fontStyle: "italic", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {analysis.summary}
          </span>
        </div>
        <button onClick={() => setCollapsed(!collapsed)} style={{
          ...mono9, background: "transparent", border: "1px solid #1e2230",
          color: "#4a5568", borderRadius: 3, padding: "2px 8px", cursor: "pointer",
          flexShrink: 0,
        }}>{collapsed ? "expand" : "collapse"}</button>
      </div>
      {!collapsed && (
        <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
          {analysis.findings.length === 0 && (
            <div style={{ ...mono10, color: "#3a4050", fontStyle: "italic" }}>No notable patterns detected.</div>
          )}
          {analysis.findings.map((f, idx) => (
            <div key={idx} style={{
              display: "flex", gap: 10,
              padding: "8px 10px",
              background: "#0a0c12",
              borderLeft: "3px solid " + f.color,
              borderRadius: "0 4px 4px 0",
            }}>
              <div style={{ ...mono10, color: f.color, fontWeight: 700, minWidth: 24, paddingTop: 1 }}>{f.icon}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ ...mono10, color: f.color, fontWeight: 600, marginBottom: 3 }}>{f.title}</div>
                <div style={{ fontFamily: "'IBM Plex Serif', serif", fontSize: 12, color: "#9ca3af", lineHeight: 1.55 }}>
                  {f.detail}
                </div>
                {/* Chunk references — clickable badges that select the cell on the heatmap */}
                {Array.isArray(f.chunks) && f.chunks.length > 0 && (
                  <div style={{ marginTop: 6 }}>
                    {f.chunksLabel && (
                      <div style={{ ...mono9, color: "#3a4050", marginBottom: 4, letterSpacing: 0.5 }}>
                        {f.chunksLabel}
                      </div>
                    )}
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                      {f.chunks.map((c, ci) => {
                        const text = c._label
                          ? c._label
                          : lblA + (c.i + 1) + "\u2194" + lblB + (c.j + 1) + (c.score != null ? " " + (c.score * 100).toFixed(0) + "%" : "");
                        const clickable = !!onChunkClick;
                        return (
                          <button
                            key={ci}
                            onClick={() => clickable && onChunkClick([c.i, c.j])}
                            disabled={!clickable}
                            title={clickable ? "Show this pair in the detail panel" : ""}
                            style={{
                              ...mono9, fontSize: 10,
                              background: f.color + "15",
                              border: "1px solid " + f.color + "40",
                              color: f.color,
                              borderRadius: 3, padding: "2px 7px",
                              cursor: clickable ? "pointer" : "default",
                              fontFamily: "'JetBrains Mono', monospace",
                            }}>{text}</button>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            </div>
          ))}
          {/* Pattern key — what to look for in general */}
          <details style={{ marginTop: 4 }}>
            <summary style={{ ...mono9, color: "#4a5568", cursor: "pointer", padding: "4px 0" }}>
              {"\u25BE"} How to read a similarity heatmap
            </summary>
            <div style={{
              fontFamily: "'IBM Plex Serif', serif", fontSize: 11.5, color: "#9ca3af",
              lineHeight: 1.7, padding: "8px 12px", marginTop: 4,
              background: "#0a0c12", borderRadius: 4, border: "1px solid #1e223060",
            }}>
              <div style={{ display: "grid", gridTemplateColumns: "max-content 1fr", gap: "6px 16px" }}>
                <span style={{ color: "#34d399", fontFamily: "'JetBrains Mono', monospace", fontSize: 10 }}>{"\u2198 bright diagonal"}</span>
                <span>Documents are aligned chunk-by-chunk and share content. The brighter and longer, the closer the alignment.</span>
                <span style={{ color: "#f59e42", fontFamily: "'JetBrains Mono', monospace", fontSize: 10 }}>{"\u2192\u2502\u2192 diagonal breaks"}</span>
                <span>Insertions or deletions on one side knock subsequent chunks out of alignment.</span>
                <span style={{ color: "#a78bfa", fontFamily: "'JetBrains Mono', monospace", fontSize: 10 }}>{"\u2197 shifted line"}</span>
                <span>The diagonal jumps to a parallel offset \u2014 large block added or removed earlier; alignment resumes at a new index.</span>
                <span style={{ color: "#60a5fa", fontFamily: "'JetBrains Mono', monospace", fontSize: 10 }}>{"\u223F fuzzy diagonal"}</span>
                <span>Brightness bleeds into the band around the diagonal \u2014 paraphrasing, in-place rewording, or chunk boundaries cutting across logical units.</span>
                <span style={{ color: "#a78bfa", fontFamily: "'JetBrains Mono', monospace", fontSize: 10 }}>{"\u21CC off-diagonal hotspot"}</span>
                <span>An isolated bright cell far from the main line: content moved \u2014 a section appears at a different position in the other doc.</span>
                <span style={{ color: "#a78bfa", fontFamily: "'JetBrains Mono', monospace", fontSize: 10 }}>{"\u2571\u2571 parallel off-diagonal lines"}</span>
                <span>Repeated structure or templated sections recurring at consistent intervals.</span>
                <span style={{ color: "#f0c040", fontFamily: "'JetBrains Mono', monospace", fontSize: 10 }}>{"\u2261 bright row / \u2225 bright column"}</span>
                <span>One chunk matches many on the other side: boilerplate, generic phrasing, header/footer/disclaimer fragments, or overly broad chunking.</span>
                <span style={{ color: "#f0c040", fontFamily: "'JetBrains Mono', monospace", fontSize: 10 }}>{"\u25A0 diagonal block clusters"}</span>
                <span>Coherent thematic sections \u2014 consecutive chunks share vocabulary internally. Especially clear in self-similarity views.</span>
                <span style={{ color: "#f87171", fontFamily: "'JetBrains Mono', monospace", fontSize: 10 }}>{"\u00D7 cold matrix"}</span>
                <span>Mostly dark with no diagonal: documents are unrelated, completely rewritten, or use entirely different vocabulary.</span>
                <span style={{ color: "#9ca3af", fontFamily: "'JetBrains Mono', monospace", fontSize: 10 }}>{"\u00B7\u00B7\u00B7 scattered noise"}</span>
                <span>No structural alignment, low intensity speckle: docs share general domain vocabulary but cover different subjects.</span>
              </div>
              <div style={{ marginTop: 10, paddingTop: 8, borderTop: "1px solid #1e223060", color: "#4a5568", fontSize: 10.5, fontStyle: "italic" }}>
                Self-similarity (A\u00D7A or B\u00D7B): the diagonal is always 1.0. Look at the off-diagonal pattern to characterize the document's internal structure \u2014 block clusters reveal coherent sections, stripes reveal repeated boilerplate, sparse off-diagonal reveals topical diversity.
              </div>
            </div>
          </details>
        </div>
      )}
    </div>
  );
}

// ─── Scalable Heatmap (canvas + D3 zoom) ────────────────────

function Heatmap({ matrix, chunksA, chunksB, onCellClick, selectedCell, interpretations, mode }) {
  const canvasRef = useRef(null);
  const containerRef = useRef(null);
  const transformRef = useRef(d3.zoomIdentity);
  const [hoverInfo, setHoverInfo] = useState(null);
  const [cellSize, setCellSize] = useState(20);

  const rows = matrix.length;
  const cols = matrix[0]?.length || 0;
  if (!rows || !cols) return null;

  // Label gutter
  const gutterLeft = 32;
  const gutterTop = 32;

  // Auto cell size based on container
  useEffect(() => {
    if (!containerRef.current) return;
    const w = containerRef.current.clientWidth - gutterLeft - 20;
    const h = 500;
    const auto = Math.max(6, Math.min(40, Math.floor(Math.min(w / cols, h / rows))));
    setCellSize(auto);
  }, [rows, cols]);

  const totalW = gutterLeft + cols * cellSize + 20;
  const totalH = gutterTop + rows * cellSize + 20;

  // Draw
  const draw = useCallback((transform) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const cw = canvas.clientWidth;
    const ch = canvas.clientHeight;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);

    ctx.save();
    ctx.translate(transform.x, transform.y);
    ctx.scale(transform.k, transform.k);

    // Cells
    for (let i = 0; i < rows; i++) {
      for (let j = 0; j < cols; j++) {
        const v = matrix[i][j];
        const x = gutterLeft + j * cellSize;
        const y = gutterTop + i * cellSize;
        ctx.fillStyle = simColor(v);
        ctx.fillRect(x, y, cellSize - 1, cellSize - 1);

        // Selected highlight
        if (selectedCell && selectedCell[0] === i && selectedCell[1] === j) {
          ctx.strokeStyle = "#f0c040";
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, cellSize - 1, cellSize - 1);
        }

        // Value text if cells are big enough
        if (cellSize * transform.k >= 22) {
          ctx.fillStyle = simTextColor(v);
          ctx.font = "9px JetBrains Mono, monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText((v * 100).toFixed(0), x + cellSize / 2, y + cellSize / 2);
        }
      }
    }

    // Overlay: interpretation flags (AB mode only — interpretations are A↔B keyed)
    // Drawn after all cells so they sit on top, including over selected highlights.
    if (interpretations && (!mode || mode === "AB")) {
      const flagCol = "#34d399";
      const dotR = Math.max(2, Math.min(4, Math.floor(cellSize * 0.18)));
      const offset = Math.max(2, Math.floor(cellSize * 0.18));
      for (let i = 0; i < rows; i++) {
        for (let j = 0; j < cols; j++) {
          if (!hasDoneInterp(interpretations, i + "-" + j)) continue;
          const x = gutterLeft + j * cellSize;
          const y = gutterTop + i * cellSize;
          // Small filled circle in the top-right corner
          ctx.beginPath();
          ctx.fillStyle = flagCol;
          ctx.arc(x + cellSize - 1 - offset, y + offset, dotR, 0, Math.PI * 2);
          ctx.fill();
          // Subtle outline so it's visible on bright cells
          ctx.lineWidth = 1;
          ctx.strokeStyle = "#0a0c12";
          ctx.stroke();
        }
      }
    }

    // Row labels (A)
    ctx.fillStyle = "#4a5568";
    ctx.font = "9px JetBrains Mono, monospace";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    const labelStep = cellSize * transform.k < 12 ? Math.ceil(12 / (cellSize * transform.k)) : 1;
    for (let i = 0; i < rows; i += labelStep) {
      ctx.fillText("A" + (i + 1), gutterLeft - 4, gutterTop + i * cellSize + cellSize / 2);
    }

    // Col labels (B)
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    for (let j = 0; j < cols; j += labelStep) {
      ctx.save();
      ctx.translate(gutterLeft + j * cellSize + cellSize / 2, gutterTop - 4);
      ctx.rotate(-Math.PI / 4);
      ctx.fillText("B" + (j + 1), 0, 0);
      ctx.restore();
    }

    ctx.restore();
  }, [matrix, rows, cols, cellSize, selectedCell, gutterLeft, gutterTop, interpretations, mode]);

  // Setup D3 zoom
  useEffect(() => {
    if (!canvasRef.current) return;
    const canvas = d3.select(canvasRef.current);
    const zoomBehavior = d3.zoom()
      .scaleExtent([0.2, 8])
      .on("zoom", (e) => {
        transformRef.current = e.transform;
        draw(e.transform);
        setHoverInfo(null);
      });
    canvas.call(zoomBehavior);

    // Fit to view
    const cw = canvasRef.current.clientWidth;
    const ch = canvasRef.current.clientHeight;
    const scale = Math.min(cw / totalW, ch / totalH, 2) * 0.9;
    const initTransform = d3.zoomIdentity
      .translate((cw - totalW * scale) / 2, (ch - totalH * scale) / 2)
      .scale(scale);
    canvas.call(zoomBehavior.transform, initTransform);

    return () => { canvas.on(".zoom", null); };
  }, [draw, totalW, totalH]);

  // Click handler
  const handleClick = useCallback((e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const t = transformRef.current;
    const mx = (e.clientX - rect.left - t.x) / t.k;
    const my = (e.clientY - rect.top - t.y) / t.k;
    const j = Math.floor((mx - gutterLeft) / cellSize);
    const i = Math.floor((my - gutterTop) / cellSize);
    if (i >= 0 && i < rows && j >= 0 && j < cols) {
      onCellClick([i, j]);
    }
  }, [rows, cols, cellSize, onCellClick, gutterLeft, gutterTop]);

  // Hover handler
  const handleMove = useCallback((e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const t = transformRef.current;
    const mx = (e.clientX - rect.left - t.x) / t.k;
    const my = (e.clientY - rect.top - t.y) / t.k;
    const j = Math.floor((mx - gutterLeft) / cellSize);
    const i = Math.floor((my - gutterTop) / cellSize);
    if (i >= 0 && i < rows && j >= 0 && j < cols) {
      setHoverInfo({
        x: e.clientX - rect.left + 12,
        y: e.clientY - rect.top - 8,
        i, j, score: matrix[i][j],
      });
    } else {
      setHoverInfo(null);
    }
  }, [rows, cols, cellSize, matrix, gutterLeft, gutterTop]);

  // Color legend gradient
  const legendStops = Array.from({ length: 20 }, (_, i) => {
    const v = i / 19;
    return simColor(v);
  });

  return (
    <div>
      {/* Compact legend */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
        <span style={{ ...mono9, color: "#3a4050" }}>{rows}{"\u00D7"}{cols} {"\u00B7"} scroll to zoom {"\u00B7"} drag to pan</span>
        <div style={{ display: "flex", alignItems: "center", gap: 4, marginLeft: "auto" }}>
          <span style={{ ...mono9, color: "#3a4050" }}>0%</span>
          <div style={{
            width: 120, height: 10, borderRadius: 3,
            background: "linear-gradient(to right, " + legendStops.join(", ") + ")",
            border: "1px solid #1e2230",
          }} />
          <span style={{ ...mono9, color: "#3a4050" }}>100%</span>
        </div>
      </div>

      {/* Canvas */}
      <div ref={containerRef} style={{ position: "relative" }}>
        <canvas
          ref={canvasRef}
          onClick={handleClick}
          onMouseMove={handleMove}
          onMouseLeave={() => setHoverInfo(null)}
          style={{
            width: "100%", height: 480, display: "block",
            background: "#0a0c12", borderRadius: 6,
            border: "1px solid #1e2230", cursor: "crosshair",
          }}
        />
        {hoverInfo && (
          <div style={{
            position: "absolute", left: hoverInfo.x, top: hoverInfo.y,
            background: "#141822ee", border: "1px solid #2a2f3a", borderRadius: 4,
            padding: "4px 8px", pointerEvents: "none", zIndex: 5,
            ...mono10, color: "#c8ccd4", whiteSpace: "nowrap",
          }}>
            A{hoverInfo.i + 1} {"\u2194"} B{hoverInfo.j + 1}: <span style={{ color: "#f0c040", fontWeight: 700 }}>{(hoverInfo.score * 100).toFixed(1)}%</span>
            {(() => {
              if (!interpretations || (mode && mode !== "AB")) return null;
              const list = getInterps(interpretations, hoverInfo.i + "-" + hoverInfo.j);
              const done = list.filter(e => e.status === "done").length;
              if (done === 0) return null;
              return <span style={{ marginLeft: 8, color: "#34d399" }}>{"\u{1F9E0}"} {done}</span>;
            })()}
          </div>
        )}
      </div>
    </div>
  );
}

function InterpretBadge({ interps }) {
  const list = Array.isArray(interps) ? interps : [];
  if (list.length === 0) return null;
  const anyLoading = list.some(e => e.status === "loading");
  const doneCount = list.filter(e => e.status === "done").length;
  if (anyLoading) return <span style={{ ...mono9, color: "#818cf8", animation: "pulse 1.2s infinite" }}>{"\u27F3"} interpreting{doneCount > 0 ? " (" + doneCount + ")" : "..."}</span>;
  if (doneCount > 0) return <span style={{ ...mono9, color: "#34d399", background: "#34d39912", padding: "2px 6px", borderRadius: 3 }}>{"\u2713"} {doneCount === 1 ? "interpreted" : doneCount + " responses"}</span>;
  const anyError = list.some(e => e.status === "error" || e.status === "timeout");
  if (anyError) return <span style={{ ...mono9, color: "#f87171", background: "#f8717112", padding: "2px 6px", borderRadius: 3 }}>{"\u2717"} failed</span>;
  return null;
}

// Reusable interpret trigger — supports multiple parallel queries per pair
function InterpretBtn({ i, j, score, chunkA, chunkB, interps, onInterpret, onRemove, currentLabel, customQueries, readOnly, postProcessors }) {
  const list = Array.isArray(interps) ? interps : [];
  const [menuOpen, setMenuOpen] = useState(false);
  const [customOpen, setCustomOpen] = useState(false);
  const [customText, setCustomText] = useState("");
  const menuRef = useRef(null);

  // Close menu on outside click
  useEffect(() => {
    if (!menuOpen) return;
    const handler = (e) => {
      if (menuRef.current && !menuRef.current.contains(e.target)) {
        setMenuOpen(false);
        setCustomOpen(false);
      }
    };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [menuOpen]);

  function fmtTime(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function fireQuery(template, label, queryObj) {
    // queryObj (if provided) carries connection overrides too
    if (queryObj) onInterpret(i, j, score, chunkA, chunkB, queryObj);
    else onInterpret(i, j, score, chunkA, chunkB, template, label);
  }

  function fireAskAll() {
    // Fire all presets + saved custom queries in parallel — each as its own independent fetch
    PROMPT_PRESETS.forEach(p => fireQuery(p.t, p.label));
    (customQueries || []).forEach(q => fireQuery(q.template, q.label, q));
  }

  function fireCustom() {
    if (!customText.trim()) return;
    fireQuery(customText, "Custom");
    setCustomText("");
    setCustomOpen(false);
    setMenuOpen(false);
  }

  return (
    <div style={{
      marginTop: 8, background: "#0c0e16", borderRadius: 6,
      padding: "8px 12px", border: "1px solid #818cf815",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: list.length > 0 ? 8 : 0, gap: 8 }}>
        <span style={{ ...mono9, color: "#818cf8", letterSpacing: 1 }}>
          {"\u{1F9E0}"} LLM {list.length > 0 && <span style={{ color: "#818cf860" }}>({list.length})</span>}
        </span>
        {/* Split button: main + dropdown arrow — hidden in read-only (report) mode */}
        {!readOnly && (
        <div ref={menuRef} style={{ position: "relative", display: "flex" }}>
          <button onClick={e => { e.stopPropagation(); fireQuery(); }} style={{
            ...mono9, background: "#818cf818", border: "1px solid #818cf830",
            borderRight: "none",
            color: "#818cf8", borderRadius: "4px 0 0 4px", padding: "3px 10px", cursor: "pointer",
          }}>+ query {currentLabel || "Default"}</button>
          <button onClick={e => { e.stopPropagation(); setMenuOpen(!menuOpen); setCustomOpen(false); }}
            title="Choose a different query type"
            style={{
              ...mono9, background: menuOpen ? "#818cf830" : "#818cf818",
              border: "1px solid #818cf830",
              color: "#818cf8", borderRadius: "0 4px 4px 0", padding: "3px 7px", cursor: "pointer",
            }}>{"\u25BE"}</button>
          {menuOpen && (
            <div onClick={e => e.stopPropagation()} style={{
              position: "absolute", top: "calc(100% + 4px)", right: 0, zIndex: 50,
              background: "#0c0e16", border: "1px solid #818cf830", borderRadius: 6,
              padding: 4, minWidth: 220, boxShadow: "0 8px 24px rgba(0,0,0,0.6)",
            }}>
              <div style={{ ...mono9, color: "#3a4050", padding: "4px 8px", letterSpacing: 1 }}>FIRE QUERY</div>
              {PROMPT_PRESETS.map(p => (
                <button key={p.label}
                  onClick={() => { fireQuery(p.t, p.label); setMenuOpen(false); }}
                  style={{
                    display: "block", width: "100%", textAlign: "left",
                    ...mono10, background: "transparent", border: "none",
                    color: "#9ca3af", padding: "5px 10px", cursor: "pointer", borderRadius: 3,
                  }}
                  onMouseEnter={e => e.currentTarget.style.background = "#818cf818"}
                  onMouseLeave={e => e.currentTarget.style.background = "transparent"}
                >+ {p.label}</button>
              ))}
              {(customQueries && customQueries.length > 0) && (
                <>
                  <div style={{ height: 1, background: "#1e2230", margin: "4px 8px" }} />
                  <div style={{ ...mono9, color: "#34d399", padding: "4px 8px", letterSpacing: 1 }}>SAVED QUERIES</div>
                  {customQueries.map(q => (
                    <button key={q.id}
                      onClick={() => { fireQuery(q.template, q.label, q); setMenuOpen(false); }}
                      title={(q.provider || q.url || q.model || q.apiKey ? "[custom connection] " : "") + q.template.slice(0, 200) + (q.template.length > 200 ? "..." : "")}
                      style={{
                        display: "block", width: "100%", textAlign: "left",
                        ...mono10, background: "transparent", border: "none",
                        color: "#9ca3af", padding: "5px 10px", cursor: "pointer", borderRadius: 3,
                      }}
                      onMouseEnter={e => e.currentTarget.style.background = "#34d39915"}
                      onMouseLeave={e => e.currentTarget.style.background = "transparent"}
                    >+ {q.label}{(q.provider || q.url || q.model || q.apiKey != null) && <span style={{ marginLeft: 4, color: "#34d39960", fontSize: 8 }}>{"\u26A1"}</span>}{Array.isArray(q.postProcessors) && q.postProcessors.length > 0 && <span title="custom output pipeline" style={{ marginLeft: 4, color: "#f472b660", fontSize: 8 }}>{"\u2699"}</span>}</button>
                  ))}
                </>
              )}
              <div style={{ height: 1, background: "#1e2230", margin: "4px 8px" }} />
              <button
                onClick={() => setCustomOpen(!customOpen)}
                style={{
                  display: "block", width: "100%", textAlign: "left",
                  ...mono10, background: customOpen ? "#818cf818" : "transparent", border: "none",
                  color: "#9ca3af", padding: "5px 10px", cursor: "pointer", borderRadius: 3,
                }}
                onMouseEnter={e => e.currentTarget.style.background = "#818cf818"}
                onMouseLeave={e => e.currentTarget.style.background = customOpen ? "#818cf818" : "transparent"}
              >{"\u270E"} Custom prompt...</button>
              {customOpen && (
                <div style={{ padding: "6px 8px" }}>
                  <textarea
                    value={customText}
                    onChange={e => setCustomText(e.target.value)}
                    placeholder="Your one-off question. Use {{CHUNK_A}}, {{CHUNK_B}}, {{SCORE}} placeholders."
                    style={{
                      width: "100%", minHeight: 80, boxSizing: "border-box",
                      background: "#0a0c12", border: "1px solid #1e2230",
                      color: "#9ca3af", borderRadius: 4, padding: 6,
                      fontFamily: "'JetBrains Mono', monospace", fontSize: 10,
                      outline: "none", resize: "vertical",
                    }}
                  />
                  <button onClick={fireCustom}
                    disabled={!customText.trim()}
                    style={{
                      ...mono9, marginTop: 4, width: "100%",
                      background: customText.trim() ? "#818cf830" : "#141822",
                      border: "1px solid " + (customText.trim() ? "#818cf850" : "#1e2230"),
                      color: customText.trim() ? "#818cf8" : "#3a4050",
                      borderRadius: 3, padding: "4px 8px",
                      cursor: customText.trim() ? "pointer" : "not-allowed",
                    }}>{"\u25B6"} Fire custom</button>
                </div>
              )}
              <div style={{ height: 1, background: "#1e2230", margin: "4px 8px" }} />
              <button
                onClick={() => { fireAskAll(); setMenuOpen(false); }}
                style={{
                  display: "block", width: "100%", textAlign: "left",
                  ...mono10, background: "transparent", border: "none",
                  color: "#34d399", padding: "5px 10px", cursor: "pointer", borderRadius: 3, fontWeight: 600,
                }}
                onMouseEnter={e => e.currentTarget.style.background = "#34d39915"}
                onMouseLeave={e => e.currentTarget.style.background = "transparent"}
              >{"\u{1F3AF}"} Ask all {PROMPT_PRESETS.length + (customQueries ? customQueries.length : 0)} in parallel</button>
            </div>
          )}
        </div>
        )}
      </div>

      {list.length === 0 && (
        <div style={{ ...mono9, color: "#3a4050" }}>
          {readOnly ? "No interpretations recorded for this pair." : "No queries yet. Click \"+ query\" to ask, or " + "\u25BE" + " for more options."}
        </div>
      )}

      {list.map((e, idx) => (
        <div key={e.id} style={{
          marginTop: idx === 0 ? 0 : 8,
          paddingTop: idx === 0 ? 0 : 8,
          borderTop: idx === 0 ? "none" : "1px solid #1e223060",
        }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4, gap: 6 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
              <span style={{
                ...mono9, fontSize: 8, padding: "2px 6px", borderRadius: 3,
                background: "#818cf818", color: "#818cf8", fontWeight: 600,
              }}>{e.label || "?"}</span>
              {e.timestamp && (
                <span style={{ ...mono9, fontSize: 8, color: "#3a4050" }}>{fmtTime(e.timestamp)}</span>
              )}
              {e.status === "loading" && (
                <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
                  <span style={{ display: "inline-block", width: 8, height: 8, border: "2px solid #818cf840", borderTopColor: "#818cf8", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
                  <span style={{ ...mono9, color: "#818cf8" }}>querying</span>
                </span>
              )}
              {e.status === "error" && <span style={{ ...mono9, color: "#f87171" }}>{"\u2717"} failed</span>}
              {e.status === "timeout" && <span style={{ ...mono9, color: "#f59e42" }}>{"\u23F1"} timed out</span>}
            </div>
            {!readOnly && onRemove && e.id !== "legacy" && (
              <button onClick={ev => { ev.stopPropagation(); onRemove(i, j, e.id); }} title="Remove this response" style={{
                ...mono9, fontSize: 9, background: "transparent", border: "1px solid #1e2230",
                color: "#3a4050", borderRadius: 3, padding: "1px 5px", cursor: "pointer",
              }}>{"\u2715"}</button>
            )}
          </div>
          {e.status === "done" && e.response && (() => {
            // Per-query pipeline resolution: if the response's label matches a custom query
            // that defines its own postProcessors, use that. Otherwise fall back to global.
            let activePipeline = postProcessors || [];
            if (customQueries && e.label) {
              const matched = customQueries.find(q => q.label === e.label);
              if (matched && Array.isArray(matched.postProcessors) && matched.postProcessors.length > 0) {
                activePipeline = matched.postProcessors;
              }
            }
            const processed = applyPipeline(e.response, activePipeline);
            const isElement = typeof processed === "object" && processed !== null && processed.$$typeof;
            return (
              <div style={{ fontFamily: "'IBM Plex Serif', serif", fontSize: 12, color: "#b0b8c8", lineHeight: 1.7, whiteSpace: isElement ? "normal" : "pre-wrap" }}>
                {processed}
              </div>
            );
          })()}
          {e.status === "error" && e.error && (
            <div style={{ ...mono9, color: "#f8717180", marginTop: 2 }}>{e.error}</div>
          )}
        </div>
      ))}
    </div>
  );
}

function DrillDown({ chunkA, chunkB, macroLabelA, macroLabelB, microSize }) {
  const [subData, setSubData] = useState(null);
  const [computing, setComputing] = useState(false);
  const [expandedSub, setExpandedSub] = useState(0);

  const compute = useCallback(() => {
    setComputing(true);
    setTimeout(() => {
      const sA = subChunk(chunkA, microSize);
      const sB = subChunk(chunkB, microSize);
      const { matrix, vocab } = computeSimilarityMatrix(sA, sB);
      const pairs = [];
      for (let i = 0; i < matrix.length; i++)
        for (let j = 0; j < matrix[0].length; j++)
          pairs.push({ i, j, score: matrix[i][j] });
      pairs.sort((a, b) => b.score - a.score);
      setSubData({ subA: sA, subB: sB, matrix, pairs, vocabSize: vocab.length });
      setComputing(false);
    }, 30);
  }, [chunkA, chunkB, microSize]);

  if (!subData && !computing) {
    return (
      <div style={{
        marginTop: 10, background: "#0c0e16", borderRadius: 6,
        padding: 12, border: "1px solid #34d39920", textAlign: "center",
      }}>
        <button onClick={e => { e.stopPropagation(); compute(); }} style={{
          ...mono10, fontWeight: 600, letterSpacing: 1,
          background: "#34d39920", border: "1px solid #34d39940",
          color: "#34d399", borderRadius: 5, padding: "8px 20px",
          cursor: "pointer",
        }}>{"\u{1F50D}"} Drill Down {"\u2014"} {microSize === "row" ? "row / sentence" : microSize + " tokens"}</button>
        <div style={{ ...mono9, color: "#2a2f3a", marginTop: 6 }}>
          Sub-chunks this pair for fine-grained comparison
        </div>
      </div>
    );
  }

  if (computing) {
    return (
      <div style={{
        marginTop: 10, background: "#0c0e16", borderRadius: 6,
        padding: 16, border: "1px solid #34d39920",
        display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
      }}>
        <div style={{ width: 14, height: 14, border: "2px solid #34d39940", borderTopColor: "#34d399", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
        <span style={{ ...mono10, color: "#34d399" }}>Sub-chunking and computing similarity...</span>
      </div>
    );
  }

  const topSubs = subData.pairs.slice(0, 10);
  const avgSub = topSubs.length > 0 ? topSubs.reduce((a, p) => a + p.score, 0) / topSubs.length : 0;

  // Mini heatmap
  const mRows = subData.matrix.length;
  const mCols = subData.matrix[0]?.length || 0;
  const mCell = Math.max(10, Math.min(28, Math.floor(400 / Math.max(mRows, mCols))));

  return (
    <div style={{
      marginTop: 10, background: "#0c0e16", borderRadius: 6,
      border: "1px solid #34d39920", overflow: "hidden",
    }} onClick={e => e.stopPropagation()}>
      {/* Header */}
      <div style={{
        padding: "10px 14px", background: "#0e1018", borderBottom: "1px solid #1e2230",
        display: "flex", alignItems: "center", justifyContent: "space-between",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ ...mono10, color: "#34d399", fontWeight: 600 }}>{"\u{1F50D}"} DRILL-DOWN</span>
          <span style={{ ...mono9, color: "#3a4050" }}>
            {subData.subA.length} {"\u00D7"} {subData.subB.length} sub-chunks
            {" \u00B7 "} vocab {subData.vocabSize}
            {" \u00B7 "} avg top-10: {(avgSub*100).toFixed(1)}%
          </span>
        </div>
        <button onClick={() => setSubData(null)} style={{
          ...mono9, background: "#1e223040", border: "1px solid #2a2f3a",
          color: "#4a5568", borderRadius: 3, padding: "2px 8px", cursor: "pointer",
        }}>{"\u2715"} close</button>
      </div>

      {/* Mini heatmap */}
      <div style={{ padding: "10px 14px", overflowX: "auto" }}>
        <div style={{ ...mono9, color: "#3a4050", marginBottom: 6 }}>
          SUB-CHUNK SIMILARITY {" \u00B7 "} {macroLabelA} subs (rows) vs {macroLabelB} subs (cols)
        </div>
        <div style={{ display: "inline-block" }}>
          {subData.matrix.map((row, ri) => (
            <div key={ri} style={{ display: "flex" }}>
              {row.map((val, ci) => (
                <div key={ci} title={"a"+(ri+1)+" \u2194 b"+(ci+1)+": "+(val*100).toFixed(1)+"%"} style={{
                  width: mCell, height: mCell, background: simColor(val),
                  border: "1px solid #0c0e16", borderRadius: 1,

      {/* Top sub-matches */}
      <div style={{ padding: "10px 14px", borderTop: "1px solid #1e2230" }}>

                <span style={{ ...mono10, color: "#60a5fa", background: "#60a5fa12", padding: "1px 6px", borderRadius: 3 }}>a{s.i+1}</span>
                <span style={{ color: "#2a2f3a", fontSize: 10 }}>{"\u27F7"}</span>

                </div>
                <span style={{ ...mono10, color: "#34d399", fontWeight: 700, minWidth: 42, textAlign: "right" }}>
                  {(s.score*100).toFixed(1)}%
                </span>
              </div>
              {isOpen && (
                <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
                  <div style={{ flex: "1 1 50%", minWidth: 0, background: "#141822", borderRadius: 4, padding: 8, borderLeft: "2px solid #60a5fa20", overflow: "hidden" }}>
                    <div style={{ ...mono9, color: "#60a5fa", marginBottom: 4 }}>a{s.i+1}</div>
                    <ChunkContent text={subData.subA[s.i]} maxLen={400} fontSize={11} maxHeight={180} />
                  </div>
                  <div style={{ flex: "1 1 50%", minWidth: 0, background: "#141822", borderRadius: 4, padding: 8, borderLeft: "2px solid #f59e4220", overflow: "hidden" }}>
                    <div style={{ ...mono9, color: "#f59e42", marginBottom: 4 }}>b{s.j+1}</div>
                    <ChunkContent text={subData.subB[s.j]} maxLen={400} fontSize={11} maxHeight={180} />
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// LAZY CHUNK LIST — stable component (must be outside DocumentView)
// ═══════════════════════════════════════════════════════════════

function LazyChunkList({ chunks, doc, linksMap, renderFn, onLoadMore }) {
  const BATCH = 15;
  const [loaded, setLoaded] = useState(BATCH);
  const sentinelRef = useRef(null);
  const loadedRef = useRef(loaded);
  loadedRef.current = loaded;

  // Reset only when chunk count actually changes
  const prevCountRef = useRef(chunks.length);
  useEffect(() => {
    if (chunks.length !== prevCountRef.current) {
      prevCountRef.current = chunks.length;
      setLoaded(BATCH);
    }
  }, [chunks.length]);

  // IntersectionObserver on sentinel
  useEffect(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && loadedRef.current < chunks.length) {
        setLoaded(prev => Math.min(prev + BATCH, chunks.length));
      }
    }, { rootMargin: "300px" });
    obs.observe(el);
    return () => obs.disconnect();
  }, [chunks.length, loaded]);

  // Expose forceLoad for scrollTo
  const forceLoadTo = useCallback((idx) => {
    setLoaded(prev => Math.max(prev, idx + 5));
  }, []);

  useEffect(() => {
    if (onLoadMore) onLoadMore(forceLoadTo);
  }, [forceLoadTo, onLoadMore]);

  const visible = chunks.slice(0, loaded);
  const remaining = chunks.length - loaded;

  return (
    <>
      {visible.map((c, i) => renderFn(c, i, doc, linksMap[i]))}
      {remaining > 0 && (
        <div ref={sentinelRef} style={{ padding: "16px 12px", textAlign: "center" }}>
          <div style={{
            ...mono9, color: "#2a2f3a", animation: "pulse 1.5s infinite",
          }}>{remaining} more chunk{remaining !== 1 ? "s" : ""} {"\u2193"}</div>
        </div>
      )}
      {remaining <= 0 && (
        <div style={{ padding: "12px", textAlign: "center" }}>
          <div style={{ ...mono9, color: "#1e2230" }}>{"\u2500".repeat(20)}</div>
        </div>
      )}
    </>
  );
}
